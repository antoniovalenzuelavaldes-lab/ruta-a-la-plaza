<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Ruta a la plaza</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Concepto: biblioteca de noche junto a la Alhambra. Fondo verde pino, acento granada. Navegación inferior en móvil, pestañas arriba en escritorio. */
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --surface2:#E8EFE9; --ink:#14231E; --muted:#566962; --line:#D5DFD8;
  --accent:#A3202D; --accent-ink:#FFFFFF; --pine:#1D5A49; --gold:#9A6A12; --good:#1B7A4D; --bad:#B3261E;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Figtree','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1916; --surface:#162621; --surface2:#1D312B; --ink:#E8F0EC; --muted:#92A7A0; --line:#2B4039;
  --accent:#E8737D; --accent-ink:#1A0A0C; --pine:#62C7A6; --gold:#E3B455; --good:#59C58F; --bad:#F08A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#162621; --surface2:#1D312B; --ink:#E8F0EC; --muted:#92A7A0; --line:#2B4039;
  --accent:#E8737D; --accent-ink:#1A0A0C; --pine:#62C7A6; --gold:#E3B455; --good:#59C58F; --bad:#F08A82; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--pine)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:22px;height:22px;border-radius:50% 50% 50% 8px;background:var(--accent);display:inline-block;transform:rotate(-20deg)}
.chip{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav-b{display:none}
@media (max-width:719px){
  .tabs{display:none}
  .nav-b{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav-b button{border:0;background:none;padding:8px 2px;font-size:.78rem;font-weight:600;color:var(--muted);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .nav-b button svg{width:22px;height:22px}
  .nav-b button[aria-current="page"]{color:var(--accent);background:var(--surface2)}
}
main{padding-top:22px;display:grid;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.flat{background:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:719px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;padding:6px 0 2px}
@media (max-width:719px){.hero{grid-template-columns:1fr}}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.9rem;font-weight:800}
.ring small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:500;text-align:center;margin-top:-6px}
.today{border-left:6px solid var(--accent)}
.today h2{margin:4px 0 6px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pine);border-radius:99px}
.bar.acc>i{background:var(--accent)}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--gold) 18%,transparent);border-color:var(--gold);color:var(--gold)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:var(--bad);color:var(--bad)}
.check{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--pine);margin-top:2px}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.check .t{font-weight:600}
.check .d{font-size:.9rem;color:var(--muted)}
.tema{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tema:hover{border-color:var(--pine)}
.tema .n{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--accent)}
.tema .tt{font-weight:600;line-height:1.3}
.tema .sub{font-size:.82rem;color:var(--muted)}
.tema.off{opacity:.62}
.list{display:grid;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.md p{margin:.5em 0}
.md ul{padding-left:1.15em;margin:.4em 0;display:grid;gap:6px}
.md strong{color:var(--ink);background:color-mix(in srgb,var(--gold) 20%,transparent);padding:0 2px;border-radius:3px}
details.sec{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
details.sec>summary{cursor:pointer;padding:14px 16px;font-family:var(--f-display);font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.sec>summary::after{content:"+";font-family:var(--f-mono);color:var(--accent)}
details.sec[open]>summary::after{content:"−"}
details.sec .md{padding:0 16px 14px}
.keybox{background:var(--surface2);border-radius:12px;padding:14px 16px}
.keybox ul{margin:.4em 0 0;padding-left:1.1em}
.warnbox{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:12px;padding:12px 14px;font-size:.92rem}
.q-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.q{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.3;margin:10px 0 14px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.opt:hover:not([disabled]){border-color:var(--pine)}
.opt .l{font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.fb{padding:12px 14px;border-radius:12px;margin:6px 0 12px;background:var(--surface2)}
.fb.ok{border-left:5px solid var(--good)} .fb.ko{border-left:5px solid var(--bad)}
.player{display:grid;gap:12px}
.cues{display:grid;gap:8px;max-height:46vh;overflow:auto;padding-right:4px}
.cue{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.95rem}
.cue.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.cue b{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:block;margin-bottom:2px}
.week{display:grid;gap:6px}
.day{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.day.hoy{border:2px solid var(--accent)}
.day.pas{opacity:.55}
.day .dt{font-family:var(--f-mono);font-size:.82rem;font-weight:600}
@media (max-width:719px){.day{grid-template-columns:62px 1fr}.day .pill{grid-column:2}}
.phase{padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem;line-height:1}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);display:block}
.dots i.on{background:var(--pine);border-color:var(--pine)}
.dots i.now{outline:2px solid var(--accent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 16px}
.kv dt{font-weight:700} .kv dd{margin:0}
@media (max-width:719px){.kv{grid-template-columns:1fr}.kv dt{margin-top:8px}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:20;max-width:92vw}
select,input[type=date],input[type=range]{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
input[type=range]{padding:0}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .5s}}
.badge{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);font-weight:600;font-size:.88rem}
.quote{font-family:var(--f-display);font-size:1.15rem;font-weight:500;line-height:1.35}
</style>

<script>
const DATOS={"temario":[{"id":"g1","bloque":"General","num":1,"titulo":"La Constitución Española","alcance":"Título Preliminar; Título I; Título IV","dias":7},{"id":"g2","bloque":"General","num":2,"titulo":"Ley Orgánica del Sistema Universitario (LOSU)","alcance":"Títulos Preliminar, I, II, III, IV y IX capítulo I","dias":6},{"id":"g3","bloque":"General","num":3,"titulo":"Proyecto de Estatutos de la Universidad de Granada","alcance":"Claustro de 25 de mayo de 2026","dias":8},{"id":"g4","bloque":"General","num":4,"titulo":"Empleo público: EBEP y Ley de la Función Pública de Andalucía","alcance":"TREBEP Títulos I y II; Ley 5/2023 Títulos I (caps. I y 3), IX, XI y XII","dias":10},{"id":"g5","bloque":"General","num":5,"titulo":"Prevención de Riesgos Laborales","alcance":"Ley 31/1995","dias":4},{"id":"g6","bloque":"General","num":6,"titulo":"Igualdad: Ley Orgánica 3/2007 y Ley 4/2023 (LGTBI)","alcance":"Títulos señalados de ambas leyes","dias":6},{"id":"e1","bloque":"Específico","num":1,"titulo":"Las bibliotecas universitarias y la Biblioteca de la UGR","alcance":"Misión, visión, valores, estrategia, historia, marco normativo y estructura","dias":5},{"id":"e2","bloque":"Específico","num":2,"titulo":"Organización espacial y equipamiento de las bibliotecas universitarias","alcance":"Bibliotecas de depósito, Bibliomakers, espacios Lab/CRAI","dias":3},{"id":"e3","bloque":"Específico","num":3,"titulo":"Gestión de la colección bibliográfica","alcance":"Selección, adquisición, tratamiento técnico, preservación, colecciones especiales","dias":6},{"id":"e4","bloque":"Específico","num":4,"titulo":"Biblioteca electrónica","alcance":"Recursos de información, accesibilidad y difusión","dias":4},{"id":"e5","bloque":"Específico","num":5,"titulo":"La descripción bibliográfica","alcance":"Normalización, ISBD, RDA, MARC, metadatos","dias":5},{"id":"e6","bloque":"Específico","num":6,"titulo":"Sistemas integrados de gestión bibliotecaria y catálogo","alcance":"SIGB y catálogo de la Biblioteca de la UGR (Granatensis)","dias":5},{"id":"e7","bloque":"Específico","num":7,"titulo":"Cooperación bibliotecaria","alcance":"Redes y consorcios: REBIUN y CBUA","dias":3},{"id":"e8","bloque":"Específico","num":8,"titulo":"Servicios y atención al usuario","alcance":"Tipología de usuarios, formación y servicios de la Biblioteca de la UGR","dias":4},{"id":"e9","bloque":"Específico","num":9,"titulo":"El servicio de préstamo","alcance":"Domicilio, intercampus, consorciado e interbibliotecario","dias":4},{"id":"e10","bloque":"Específico","num":10,"titulo":"La digitalización en bibliotecas","alcance":"Técnicas y procedimientos; digitalización en la UGR","dias":3},{"id":"e11","bloque":"Específico","num":11,"titulo":"Ciencia Abierta y repositorios institucionales","alcance":"Digibug y Portal de investigación","dias":4},{"id":"e12","bloque":"Específico","num":12,"titulo":"Calidad en la Biblioteca","alcance":"SUGI, procedimientos, cartas de servicios, EFQM","dias":5},{"id":"e13","bloque":"Específico","num":13,"titulo":"Códigos éticos","alcance":"Código ético de la Biblioteca y de la UGR","dias":2},{"id":"e14","bloque":"Específico","num":14,"titulo":"El Archivo de la Universidad de Granada","alcance":"Historia, normativa, estructura, fondos y colecciones","dias":4},{"id":"e15","bloque":"Específico","num":15,"titulo":"El documento de archivo y el ciclo documental","alcance":"Transferencias, instalación en depósitos, consulta, préstamo administrativo y reproducción","dias":5}],"temas":{"g1":{"id":"g1","bloque":"General","num":1,"titulo":"La Constitución Española","alcance":"Título Preliminar; Título I (derechos y deberes fundamentales); Título IV (Gobierno y Administración).","fuentes":["BOE-A-1978-31229 (Constitución Española, texto consolidado)"],"peso":"alto","apuntes":[{"h":"Título Preliminar (arts. 1 a 9)","t":"- **Art. 1.1**: España es un Estado **social y democrático de Derecho**. Valores superiores: **libertad, justicia, igualdad y pluralismo político**.\n- **Art. 1.2**: la soberanía nacional reside en el **pueblo español**, del que emanan los poderes del Estado.\n- **Art. 1.3**: la forma política del Estado es la **Monarquía parlamentaria**.\n- **Art. 2**: unidad indisoluble de la Nación española; reconoce y garantiza el derecho a la autonomía de las **nacionalidades y regiones** y la solidaridad entre ellas.\n- **Art. 3**: el **castellano** es la lengua española oficial del Estado; las demás lenguas españolas serán también oficiales en sus Comunidades Autónomas.\n- **Art. 4**: bandera de España (rojo, amarillo y rojo; la franja amarilla de doble anchura). **Art. 5**: la capital del Estado es **Madrid**.\n- **Art. 6**: partidos políticos. **Art. 7**: sindicatos y asociaciones empresariales. **Art. 8**: Fuerzas Armadas (garantizan la soberanía e independencia de España y defienden su integridad territorial y el ordenamiento constitucional).\n- **Art. 9**: los ciudadanos y los poderes públicos están **sujetos a la Constitución y al resto del ordenamiento**. Garantiza: **legalidad, jerarquía normativa, publicidad de las normas, irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad** de los poderes públicos."},{"h":"Título I: estructura","t":"El Título I se llama «De los derechos y deberes fundamentales» (arts. 10 a 55) y tiene cinco capítulos:\n- **Cap. I** (arts. 11-13): españoles y extranjeros.\n- **Cap. II** (arts. 14-38): derechos y libertades. **Sección 1.ª** (arts. 15-29): derechos fundamentales y libertades públicas. **Sección 2.ª** (arts. 30-38): derechos y deberes de los ciudadanos.\n- **Cap. III** (arts. 39-52): principios rectores de la política social y económica.\n- **Cap. IV** (arts. 53-54): garantías de las libertades y derechos fundamentales.\n- **Cap. V** (art. 55): suspensión de los derechos y libertades.\n\n**Art. 10**: la dignidad de la persona, los derechos inviolables que le son inherentes y el libre desarrollo de la personalidad son fundamento del orden político y de la paz social. Las normas sobre derechos fundamentales se interpretan de conformidad con la **Declaración Universal de Derechos Humanos** y los tratados internacionales ratificados por España."},{"h":"Capítulo I: españoles y extranjeros","t":"- **Art. 11**: la nacionalidad se adquiere, conserva y pierde según la ley. **Ningún español de origen podrá ser privado de su nacionalidad.**\n- **Art. 12**: los españoles son mayores de edad a los **dieciocho años**.\n- **Art. 13**: los extranjeros gozan de las libertades públicas del Título I en los términos de los tratados y la ley. Solo los españoles son titulares de los derechos del **art. 23** (participación política), salvo reciprocidad para el sufragio en elecciones **municipales**. Se excluyen de la extradición los delitos políticos (no se consideran tales los actos de terrorismo)."},{"h":"Derechos fundamentales y libertades públicas (Sección 1.ª)","t":"- **Art. 14**: igualdad ante la ley; no discriminación por nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.\n- **Art. 15**: derecho a la vida y a la integridad física y moral; abolición de la pena de muerte salvo lo que dispongan las leyes penales militares para tiempos de guerra.\n- **Art. 16**: libertad ideológica, religiosa y de culto. Nadie puede ser obligado a declarar sobre su ideología, religión o creencias.\n- **Art. 17**: libertad y seguridad. La detención preventiva no puede durar más del tiempo estrictamente necesario y, en todo caso, **setenta y dos horas**, plazo en el que el detenido debe ser puesto en libertad o a disposición de la autoridad judicial. Derecho de **habeas corpus**.\n- **Art. 18**: honor, intimidad y propia imagen; inviolabilidad del domicilio; secreto de las comunicaciones; limitación del uso de la informática.\n- **Art. 19**: libertad de residencia y circulación. **Art. 20**: libertad de expresión, información, cátedra y producción artística; no puede restringirse mediante censura previa. **Art. 21**: reunión pacífica y sin armas. **Art. 22**: asociación. **Art. 23**: participación en asuntos públicos y acceso a funciones y cargos públicos **en condiciones de igualdad, con los requisitos que señalen las leyes**.\n- **Art. 24**: tutela judicial efectiva, juez ordinario predeterminado por la ley, defensa, presunción de inocencia. **Art. 25**: legalidad penal. **Art. 27**: derecho a la **educación** y libertad de enseñanza; se reconoce la **autonomía de las Universidades** en los términos que la ley establezca. **Art. 28**: sindicación y huelga. **Art. 29**: derecho de petición individual y colectiva, por escrito."},{"h":"Derechos y deberes de los ciudadanos (Sección 2.ª)","t":"- **Art. 30**: derecho y deber de defender a España; objeción de conciencia.\n- **Art. 31**: deber de contribuir al sostenimiento de los gastos públicos.\n- **Art. 32**: matrimonio en plena igualdad jurídica. **Art. 33**: propiedad privada y herencia. **Art. 34**: fundaciones. **Art. 35**: deber de trabajar y derecho al trabajo. **Art. 36**: colegios profesionales. **Art. 37**: negociación colectiva. **Art. 38**: libertad de empresa."},{"h":"Principios rectores y garantías (Capítulos III, IV y V)","t":"- **Capítulo III (arts. 39-52)**: protección de la familia, seguridad social, salud, cultura (**art. 44**), medio ambiente, vivienda, juventud, personas con discapacidad, tercera edad, consumidores. Solo se alegan ante la jurisdicción ordinaria **de acuerdo con las leyes que los desarrollen** (art. 53.3).\n- **Art. 53.1**: los derechos del Capítulo II **vinculan a todos los poderes públicos**; solo por **ley**, que respete su **contenido esencial**, puede regularse su ejercicio.\n- **Art. 53.2**: tutela ante los tribunales ordinarios por un procedimiento basado en los principios de **preferencia y sumariedad** y, en su caso, recurso de **amparo** ante el Tribunal Constitucional (para el art. 14, la Sección 1.ª y la objeción de conciencia del art. 30).\n- **Art. 54**: el **Defensor del Pueblo** es el alto comisionado de las Cortes Generales, designado por estas para la defensa de los derechos del Título I; regulado por ley orgánica.\n- **Art. 55**: los derechos de los arts. 17, 18.2 y 18.3, 19, 20.1.a) y d) y 20.5, 21, 28.2 y 37.2 pueden suspenderse con la declaración de los estados de excepción o de sitio."},{"h":"Título IV: el Gobierno y la Administración (arts. 97 a 107)","t":"- **Art. 97**: el Gobierno dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado; ejerce la función ejecutiva y la **potestad reglamentaria**.\n- **Art. 98**: el Gobierno se compone del **Presidente, Vicepresidentes (en su caso), Ministros** y demás miembros que establezca la ley. El Presidente dirige la acción del Gobierno.\n- **Art. 99**: investidura. El Rey propone un candidato a través del Presidente del Congreso; si el Congreso otorga su confianza por **mayoría absoluta**, el Rey le nombra Presidente; si no, nueva votación a las **48 horas** y basta la **mayoría simple**.\n- **Art. 100**: los demás miembros del Gobierno son nombrados y separados por el **Rey, a propuesta del Presidente**.\n- **Art. 101**: el Gobierno cesa tras elecciones generales, pérdida de confianza parlamentaria, o dimisión o fallecimiento del Presidente; el cesante continúa en funciones.\n- **Art. 102**: la responsabilidad criminal del Presidente y los miembros del Gobierno es exigible ante la **Sala de lo Penal del Tribunal Supremo**.\n- **Art. 103**: la Administración Pública sirve con **objetividad** los intereses generales y actúa de acuerdo con los principios de **eficacia, jerarquía, descentralización, desconcentración y coordinación**, con sometimiento pleno a la **ley y al Derecho**. El acceso a la función pública se regula conforme a los principios de **mérito y capacidad**. La ley regulará el estatuto de los funcionarios, su derecho a sindicación, las incompatibilidades y las garantías de imparcialidad.\n- **Art. 104**: las Fuerzas y Cuerpos de seguridad, bajo la dependencia del Gobierno, protegen el libre ejercicio de los derechos y libertades y garantizan la seguridad ciudadana.\n- **Art. 105**: la ley regulará la **audiencia** de los ciudadanos en la elaboración de disposiciones administrativas, el **acceso a archivos y registros administrativos** (salvo seguridad y defensa del Estado, averiguación de delitos e intimidad) y el procedimiento administrativo.\n- **Art. 106**: los Tribunales controlan la potestad reglamentaria y la legalidad de la actuación administrativa; los particulares tienen derecho a ser **indemnizados** por las lesiones causadas por el funcionamiento de los servicios públicos, salvo fuerza mayor.\n- **Art. 107**: el **Consejo de Estado** es el supremo órgano consultivo del Gobierno."}],"clave":["Art. 1.1: libertad, justicia, igualdad y pluralismo político.","Art. 9.3: legalidad, jerarquía normativa, publicidad, irretroactividad, seguridad jurídica, responsabilidad, interdicción de la arbitrariedad.","Art. 17.2: detención preventiva máxima de 72 horas.","Art. 99: mayoría absoluta; a las 48 horas, mayoría simple.","Art. 103.1: eficacia, jerarquía, descentralización, desconcentración, coordinación.","Art. 103.3: acceso a la función pública por mérito y capacidad."],"podcast":[{"v":"A","t":"Hola, bienvenida a una nueva lección. Hoy empezamos con la base de todo: la Constitución Española."},{"v":"B","t":"Y empezamos por lo más preguntado. El artículo uno dice que España es un Estado social y democrático de Derecho. Sus valores superiores son cuatro: libertad, justicia, igualdad y pluralismo político."},{"v":"A","t":"Un truco para acordarte: L, J, I, P. Libertad, justicia, igualdad, pluralismo. Y la forma política del Estado es la Monarquía parlamentaria. La soberanía reside en el pueblo español."},{"v":"B","t":"Pasamos al artículo nueve, que siempre cae. Es la lista de garantías: legalidad, jerarquía normativa, publicidad de las normas, irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad de los poderes públicos."},{"v":"A","t":"Siete principios. Cuenta con los dedos: legalidad, jerarquía, publicidad, irretroactividad, seguridad, responsabilidad, interdicción. Si en el examen te ofrecen uno que no está en la lista, ese es el falso."},{"v":"B","t":"Ahora el Título Primero. Va del artículo diez al cincuenta y cinco. Los derechos fundamentales y libertades públicas están en la sección primera del capítulo segundo, artículos quince al veintinueve. Los derechos y deberes de los ciudadanos, del treinta al treinta y ocho."},{"v":"A","t":"Tres datos que se repiten. Primero, la detención preventiva no puede durar más de setenta y dos horas. Segundo, los españoles son mayores de edad a los dieciocho años. Tercero, ningún español de origen puede ser privado de su nacionalidad."},{"v":"B","t":"Para tu oposición hay otro especialmente útil. El artículo veintisiete reconoce la autonomía de las Universidades en los términos que la ley establezca. Y el artículo veintitrés reconoce el acceso a funciones y cargos públicos en condiciones de igualdad."},{"v":"A","t":"Sobre las garantías: el artículo cincuenta y tres dice que los derechos del capítulo segundo vinculan a todos los poderes públicos. Solo una ley, respetando su contenido esencial, puede regular su ejercicio. El amparo ante el Tribunal Constitucional protege el artículo catorce, la sección primera y la objeción de conciencia."},{"v":"B","t":"Y el Defensor del Pueblo, artículo cincuenta y cuatro: alto comisionado de las Cortes Generales para defender los derechos del Título Primero."},{"v":"A","t":"Vamos con el Título Cuarto, el Gobierno y la Administración. El Gobierno se compone del Presidente, los Vicepresidentes en su caso, los Ministros y los demás miembros que establezca la ley. En la investidura, el candidato necesita mayoría absoluta; si no la logra, se vota de nuevo a las cuarenta y ocho horas y basta mayoría simple."},{"v":"B","t":"El artículo ciento tres es el más importante para ti. La Administración Pública sirve con objetividad los intereses generales y actúa de acuerdo con los principios de eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho."},{"v":"A","t":"Cinco principios: eficacia, jerarquía, descentralización, desconcentración y coordinación. Y el acceso a la función pública es por mérito y capacidad."},{"v":"B","t":"Para terminar, el ciento cinco, que conecta con tu trabajo en archivos: la ley regulará el acceso de los ciudadanos a los archivos y registros administrativos, salvo seguridad y defensa del Estado, averiguación de delitos e intimidad de las personas. Y el ciento seis: los tribunales controlan la actuación administrativa y los particulares tienen derecho a ser indemnizados por el funcionamiento de los servicios públicos."},{"v":"A","t":"Eso es todo por hoy. Haz ahora el test de este tema y repasa los fallos. Hasta la próxima."}],"preguntas":[{"q":"Según el artículo 1.1 de la Constitución, ¿cuál de los siguientes NO es un valor superior del ordenamiento jurídico?","o":["La libertad","La justicia","La solidaridad","El pluralismo político"],"c":2,"e":"Los cuatro valores superiores son libertad, justicia, igualdad y pluralismo político. La solidaridad se cita en el art. 2, pero no como valor superior.","r":"CE art. 1"},{"q":"La forma política del Estado español es:","o":["La República parlamentaria","La Monarquía parlamentaria","La Monarquía constitucional federal","La República presidencialista"],"c":1,"e":"Art. 1.3 CE.","r":"CE art. 1"},{"q":"¿Qué lengua es la oficial del Estado según el artículo 3 de la Constitución?","o":["El castellano, que todos los españoles tienen el deber de conocer y el derecho a usar","El castellano y las lenguas cooficiales en todo el territorio","El castellano únicamente en las Administraciones del Estado","Ninguna, la Constitución no establece lengua oficial"],"c":0,"e":"Art. 3.1: el castellano es la lengua española oficial del Estado; todos tienen el deber de conocerla y el derecho a usarla. Las demás lenguas son oficiales en sus Comunidades Autónomas (art. 3.2).","r":"CE art. 3"},{"q":"¿Cuál es la capital del Estado según la Constitución?","o":["Madrid","Toledo","Barcelona","No la define"],"c":0,"e":"Art. 5 CE.","r":"CE art. 5"},{"q":"Según el artículo 9.3 de la Constitución, ¿cuál de los siguientes principios garantiza?","o":["La irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales","La retroactividad de todas las leyes","La discrecionalidad de los poderes públicos","La inmunidad de los poderes públicos"],"c":0,"e":"Art. 9.3 CE. Junto a la legalidad, jerarquía normativa, publicidad, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad.","r":"CE art. 9"},{"q":"El artículo 10.2 de la Constitución establece que las normas sobre derechos fundamentales se interpretarán de conformidad con:","o":["La Declaración Universal de Derechos Humanos y los tratados internacionales ratificados por España","La jurisprudencia del Tribunal Supremo","Los Estatutos de Autonomía","El Código Civil"],"c":0,"e":"Art. 10.2 CE.","r":"CE art. 10"},{"q":"¿A qué edad son mayores de edad los españoles según la Constitución?","o":["A los dieciséis años","A los dieciocho años","A los veintiún años","A los diecinueve años"],"c":1,"e":"Art. 12 CE.","r":"CE art. 12"},{"q":"Según el artículo 11.2 de la Constitución:","o":["Ningún español de origen podrá ser privado de su nacionalidad","Un español puede ser privado de su nacionalidad por sentencia firme","La nacionalidad se pierde al residir diez años en el extranjero","La nacionalidad solo se adquiere por nacimiento"],"c":0,"e":"Art. 11.2 CE.","r":"CE art. 11"},{"q":"¿Cuál es la duración máxima de la detención preventiva según el artículo 17 de la Constitución?","o":["Veinticuatro horas","Cuarenta y ocho horas","Setenta y dos horas","Cinco días"],"c":2,"e":"Art. 17.2: el tiempo estrictamente necesario y, en todo caso, setenta y dos horas.","r":"CE art. 17"},{"q":"El artículo 14 de la Constitución proclama:","o":["La igualdad de los españoles ante la ley, sin que pueda prevalecer discriminación alguna","El derecho a la vida y a la integridad física","La libertad ideológica","El derecho de reunión"],"c":0,"e":"Art. 14 CE.","r":"CE art. 14"},{"q":"¿Qué artículo de la Constitución reconoce la autonomía de las Universidades?","o":["El artículo 20","El artículo 27","El artículo 44","El artículo 103"],"c":1,"e":"Art. 27.10 CE: «Se reconoce la autonomía de las Universidades, en los términos que la ley establezca».","r":"CE art. 27"},{"q":"Según el artículo 29 de la Constitución, el derecho de petición se ejerce:","o":["Individual y colectivamente, por escrito","Solo individualmente y por cualquier medio","Solo colectivamente","Verbalmente ante el Defensor del Pueblo"],"c":0,"e":"Art. 29.1 CE.","r":"CE art. 29"},{"q":"El artículo 23.2 de la Constitución reconoce el derecho de los ciudadanos a acceder en condiciones de igualdad a las funciones y cargos públicos:","o":["Con los requisitos que señalen las leyes","Sin ningún requisito","Solo mediante elección","Solo si se tiene la nacionalidad de origen"],"c":0,"e":"Art. 23.2 CE.","r":"CE art. 23"},{"q":"¿Dónde se encuentran regulados los principios rectores de la política social y económica?","o":["Capítulo II del Título I","Capítulo III del Título I","Capítulo IV del Título I","Título Preliminar"],"c":1,"e":"Capítulo tercero del Título I, arts. 39 a 52.","r":"CE art. 53"},{"q":"Según el artículo 53.1 de la Constitución, el ejercicio de los derechos y libertades del Capítulo segundo solo puede regularse:","o":["Por ley, que en todo caso deberá respetar su contenido esencial","Por reglamento del Gobierno","Por decreto-ley en todo caso","Por los Estatutos de Autonomía"],"c":0,"e":"Art. 53.1 CE.","r":"CE art. 53"},{"q":"El recurso de amparo ante el Tribunal Constitucional protege, según el artículo 53.2:","o":["El artículo 14, la Sección primera del Capítulo segundo y la objeción de conciencia del artículo 30","Todos los derechos del Título I","Solo los principios rectores","Solo los derechos de la Sección segunda"],"c":0,"e":"Art. 53.2 CE.","r":"CE art. 53"},{"q":"El Defensor del Pueblo es, según el artículo 54 de la Constitución:","o":["El alto comisionado de las Cortes Generales","Un órgano dependiente del Gobierno","Un órgano del Poder Judicial","Un comisionado del Consejo de Estado"],"c":0,"e":"Art. 54 CE, regulado por ley orgánica.","r":"CE art. 54"},{"q":"¿Quién nombra y separa a los Ministros según el artículo 100 de la Constitución?","o":["El Presidente del Gobierno","El Rey, a propuesta del Presidente del Gobierno","El Congreso de los Diputados","El Presidente del Congreso"],"c":1,"e":"Art. 100 CE.","r":"CE art. 100"},{"q":"En la investidura, si el candidato no obtiene la mayoría absoluta, ¿cuándo se vota de nuevo y qué mayoría se exige?","o":["A las 48 horas, mayoría simple","A las 24 horas, mayoría absoluta","A los 7 días, mayoría simple","A las 72 horas, mayoría de tres quintos"],"c":0,"e":"Art. 99.3 CE: nueva votación 48 horas después; basta mayoría simple.","r":"CE art. 99"},{"q":"La responsabilidad criminal del Presidente y los miembros del Gobierno es exigible ante:","o":["El Tribunal Constitucional","La Sala de lo Penal del Tribunal Supremo","La Audiencia Nacional","El Congreso de los Diputados"],"c":1,"e":"Art. 102.1 CE.","r":"CE art. 102"},{"q":"¿Cuál de los siguientes NO es un principio de actuación de la Administración Pública según el artículo 103.1?","o":["Eficacia","Jerarquía","Competitividad","Desconcentración"],"c":2,"e":"Los principios son eficacia, jerarquía, descentralización, desconcentración y coordinación.","r":"CE art. 103"},{"q":"El acceso a la función pública se regula, según el artículo 103.3, de acuerdo con los principios de:","o":["Mérito y capacidad","Antigüedad y experiencia","Libre designación y confianza","Igualdad y publicidad"],"c":0,"e":"Art. 103.3 CE.","r":"CE art. 103"},{"q":"Según el artículo 105 de la Constitución, el acceso de los ciudadanos a los archivos y registros administrativos tiene como excepciones:","o":["La seguridad y defensa del Estado, la averiguación de los delitos y la intimidad de las personas","Solo la seguridad nacional","Los documentos con más de 50 años","Ninguna"],"c":0,"e":"Art. 105.b CE.","r":"CE art. 105"},{"q":"Según el artículo 106.2 de la Constitución, los particulares tienen derecho a ser indemnizados por las lesiones que sufran como consecuencia del funcionamiento de los servicios públicos:","o":["Salvo en los casos de fuerza mayor","Siempre, sin excepciones","Solo si hay dolo del funcionario","Solo si lo decide el Consejo de Estado"],"c":0,"e":"Art. 106.2 CE.","r":"CE art. 106"},{"q":"El supremo órgano consultivo del Gobierno es:","o":["El Consejo de Estado","El Consejo General del Poder Judicial","El Tribunal de Cuentas","El Defensor del Pueblo"],"c":0,"e":"Art. 107 CE.","r":"CE art. 107"}],"mp3":true},"g2":{"id":"g2","bloque":"General","num":2,"titulo":"Ley Orgánica del Sistema Universitario (LOSU)","alcance":"Ley Orgánica 2/2023, de 22 de marzo: Título Preliminar; Títulos I a IV; Título IX, capítulo I (arts. 1 a 13 y 38 a 43).","fuentes":["BOE-A-2023-7500 (Ley Orgánica 2/2023, texto consolidado)"],"peso":"alto","apuntes":[{"h":"Objeto y concepto (art. 1)","t":"- Regula el **sistema universitario** y los mecanismos de **coordinación, cooperación y colaboración** entre las Administraciones con competencias universitarias.\n- **Sistema universitario**: el conjunto de universidades, públicas y privadas, y de los centros y estructuras que les sirven para el desarrollo de sus funciones.\n- **Universidades**: instituciones públicas o privadas que desarrollan las funciones centrales de **docencia, investigación y transferencia e intercambio del conocimiento** y ofertan títulos oficiales de **Grado, Máster Universitario y Doctorado** en la mayoría de ramas de conocimiento."},{"h":"Título I: funciones y autonomía (arts. 2 y 3)","t":"- **Art. 2.1**: el sistema universitario presta y garantiza el **servicio público de la educación superior universitaria** mediante la docencia, la investigación y la transferencia del conocimiento.\n- **Art. 2.2**: funciones de las universidades (educación y formación; preparación profesional; generación y transferencia del conocimiento; innovación; bienestar social y progreso económico; espacios de pensamiento crítico; formación de la ciudadanía en valores democráticos; fomento del voluntariado y del tercer sector).\n- **Art. 2.3**: referentes: derechos humanos, memoria democrática, equidad e igualdad, sostenibilidad, lucha contra el cambio climático y los Objetivos de Desarrollo Sostenible.\n- **Art. 3.1**: las universidades tienen **personalidad jurídica** y actúan con **autonomía** en virtud del derecho fundamental del **art. 27.10 de la Constitución**.\n- **Art. 3.2**: la autonomía comprende, entre otras cosas, elaborar sus **Estatutos**, determinar su organización y estructuras, elegir y remover a sus órganos de gobierno, la autonomía económica y financiera, aprobar planes de estudio, expedir títulos, seleccionar y promover a su personal (PDI y PTGAS), establecer sus **relaciones de puestos de trabajo**, admitir al estudiantado y definir sistemas internos de garantía de calidad.\n- **Art. 3.3**: la autonomía garantiza la **libertad de cátedra** (docencia, investigación y estudio).\n- **Art. 3.5**: las universidades deben **rendir cuentas** a la sociedad, gestionar con transparencia y ofrecer un servicio público de calidad."},{"h":"Título II: creación y calidad (arts. 4 y 5)","t":"- **Art. 4.1**: las universidades públicas se crean (y las privadas se reconocen) **por ley de la Asamblea Legislativa de la Comunidad Autónoma**, previo informe preceptivo de la **Conferencia General de Política Universitaria**; o por ley de las **Cortes Generales** si son de especiales características.\n- **Art. 4.2**: el Gobierno, por **real decreto**, fija las condiciones básicas; la **Comunidad Autónoma** autoriza el inicio de actividades y supervisa su cumplimiento.\n- **Art. 4.3**: requisito de creación: planes de **igualdad de género**, medidas contra la brecha salarial, **accesibilidad** y ajustes razonables y medidas contra la violencia, discriminación o acoso (Ley 3/2022 de convivencia universitaria).\n- **Art. 5**: buen gobierno y calidad conforme a los estándares del **Espacio Europeo de Educación Superior**. La calidad es responsabilidad compartida de universidades, agencias de evaluación y Administraciones. Acreditación y evaluación: **ANECA** y agencias autonómicas inscritas en **EQAR**."},{"h":"Título III: organización de enseñanzas (arts. 6 a 10)","t":"- **Art. 6**: la **docencia** es función fundamental; es un derecho y un deber del PDI; preferentemente **presencial**, puede ser virtual o híbrida. Participación efectiva del estudiantado en planes de estudio. Docencia oficial (Grado, Máster, Doctorado) y títulos propios.\n- **Art. 7**: títulos **oficiales** (validez en todo el Estado) y **propios**. Los oficiales se inscriben en el **Registro de Universidades, Centros y Títulos**, con efectos **constitutivos**. Se prevén microcredenciales.\n- **Art. 8**: los títulos oficiales los expide, **en nombre del Rey**, el **Rector o Rectora**. Para impartir una enseñanza oficial: informe de la Comunidad Autónoma, informe de la agencia de calidad, verificación del **Consejo de Universidades** y autorización de la Comunidad Autónoma.\n- **Art. 9**: tres ciclos: **Grado** (formación básica y generalista), **Máster Universitario** (formación avanzada y especializada) y **Doctorado** (competencias de investigación).\n- **Art. 10**: el Gobierno regula convalidaciones, **homologación** y **equivalencia** de títulos extranjeros y reconocimiento de la experiencia laboral."},{"h":"Título IV: investigación (arts. 11 a 13)","t":"- **Art. 11**: la **investigación** es función fundamental; derecho y deber del PDI.\n- **Art. 12**: el conocimiento científico es un **bien común**; **Ciencia Abierta**: acceso abierto a publicaciones, datos, códigos y metodologías. El PDI debe depositar la versión final aceptada y sus datos en **repositorios institucionales o temáticos de acceso abierto**, simultáneamente a la publicación. (Conecta con **Digibug**.)\n- **Art. 13**: las Administraciones fomentan la investigación y el desarrollo tecnológico universitarios."},{"h":"Título IX, capítulo I: universidades públicas (arts. 38 a 43)","t":"- **Art. 38.1**: las universidades públicas se rigen por la **LOSU**, la **ley de su creación** y sus **Estatutos**, elaborados por ellas y **aprobados, previo control de legalidad, por la Comunidad Autónoma**. Plazo de la Comunidad para el informe de legalidad: **cuatro meses** (art. 38.2). Los Estatutos se publican en el diario oficial de la Comunidad y en el **BOE**.\n- **Art. 38.4**: las resoluciones del **Rector o Rectora** y los acuerdos del **Consejo Social, Consejo de Gobierno y Claustro** **ponen fin a la vía administrativa**.\n- **Art. 39**: rendición de cuentas y transparencia; las universidades deben tener un **portal de transparencia**.\n- **Art. 40**: estructura posible según los Estatutos: **campus, facultades, escuelas, departamentos, institutos universitarios de investigación, escuelas de doctorado** y otros centros.\n- **Art. 41**: facultades y escuelas se crean, modifican y suprimen por **acuerdo de la Comunidad Autónoma**, a iniciativa de la universidad (propuesta y aprobación de su Consejo de Gobierno). Departamentos, institutos, escuelas de doctorado y otros centros: **la propia universidad**.\n- **Art. 42**: la **adscripción** de centros docentes requiere convenio con la universidad y aprobación de la Comunidad Autónoma; un centro solo puede adscribirse a **una única universidad** (salvo excepción).\n- **Art. 43**: toda universidad contará con **unidades de igualdad y de diversidad**, **defensoría universitaria**, **inspección de servicios**, servicios de salud y acompañamiento psicológico y pedagógico y orientación profesional."}],"clave":["Art. 3.1: autonomía universitaria = derecho fundamental del art. 27.10 CE.","Art. 4.1: universidades públicas se crean por ley de la Asamblea de la Comunidad Autónoma.","Art. 8.1: el Rector expide los títulos en nombre del Rey.","Art. 9.1: tres ciclos: Grado, Máster y Doctorado.","Art. 38.2: cuatro meses para el informe de legalidad de los Estatutos.","Art. 38.4: Rector, Consejo Social, Consejo de Gobierno y Claustro agotan la vía administrativa."],"podcast":[{"v":"A","t":"Hola de nuevo. Segunda lección del bloque general: la Ley Orgánica del Sistema Universitario, la LOSU, que es la Ley Orgánica 2 de 2023, de 22 de marzo."},{"v":"B","t":"Es la ley que manda sobre tu futuro lugar de trabajo. Del programa entran el Título Preliminar, los Títulos Uno, Dos, Tres y Cuatro, y el capítulo Uno del Título Nueve. En números: artículos uno al trece, y treinta y ocho al cuarenta y tres."},{"v":"A","t":"Empecemos por el concepto. El sistema universitario es el conjunto de universidades públicas y privadas, y de los centros y estructuras que les sirven para desarrollar sus funciones. Una universidad desarrolla tres funciones centrales: docencia, investigación y transferencia e intercambio del conocimiento."},{"v":"B","t":"El artículo tres es clave. Las universidades tienen personalidad jurídica y actúan con autonomía, en virtud del derecho fundamental del artículo veintisiete punto diez de la Constitución. Y esa autonomía garantiza la libertad de cátedra del profesorado."},{"v":"A","t":"Dentro de la autonomía están elaborar sus propios Estatutos, elegir a sus órganos de gobierno, tener autonomía económica y financiera, y seleccionar a su personal, tanto el docente como el de administración y servicios. Y establecer sus relaciones de puestos de trabajo."},{"v":"B","t":"Sobre creación de universidades: las públicas se crean por ley de la Asamblea Legislativa de la Comunidad Autónoma, con informe previo de la Conferencia General de Política Universitaria. Si son de especiales características, por ley de las Cortes Generales."},{"v":"A","t":"En calidad suenan dos siglas: ANECA y EQAR. La ANECA y las agencias autonómicas inscritas en el registro europeo EQAR evalúan y acreditan."},{"v":"B","t":"Pasamos a enseñanzas. Los títulos oficiales los expide el Rector o la Rectora en nombre del Rey. Tres ciclos: Grado, Máster y Doctorado. Los títulos oficiales se inscriben en el Registro de Universidades, Centros y Títulos."},{"v":"A","t":"Investigación: el artículo doce habla de Ciencia Abierta. El conocimiento científico es un bien común, y el personal investigador debe depositar la versión final aceptada y sus datos en repositorios institucionales o temáticos de acceso abierto. En la Universidad de Granada ese repositorio es Digibug, que verás en el temario específico."},{"v":"B","t":"Ahora el Título Nueve. Las universidades públicas se rigen por la LOSU, por la ley de su creación y por sus Estatutos. Los Estatutos los elabora la propia universidad y los aprueba la Comunidad Autónoma, previo control de legalidad. Esa Comunidad tiene cuatro meses para el informe de legalidad."},{"v":"A","t":"Un dato muy típico de test: ponen fin a la vía administrativa las resoluciones del Rector o Rectora y los acuerdos del Consejo Social, del Consejo de Gobierno y del Claustro."},{"v":"B","t":"Sobre estructura: campus, facultades, escuelas, departamentos, institutos universitarios de investigación y escuelas de doctorado. Facultades y escuelas se crean por acuerdo de la Comunidad Autónoma a iniciativa de la universidad. Departamentos e institutos los crea la propia universidad."},{"v":"A","t":"Y el artículo cuarenta y tres: toda universidad tendrá unidades de igualdad y de diversidad, defensoría universitaria, inspección de servicios, servicios de salud y acompañamiento psicológico y pedagógico y orientación profesional."},{"v":"B","t":"Repasa el test de esta lección y nos vemos en la siguiente."}],"preguntas":[{"q":"Según el artículo 1 de la LOSU, ¿cuáles son las funciones centrales de las universidades?","o":["Docencia, investigación y transferencia e intercambio del conocimiento","Docencia, gestión y extensión universitaria","Investigación, publicación y cooperación internacional","Docencia, tutoría y evaluación"],"c":0,"e":"Art. 1.2 LOSU.","r":"LOSU art. 1"},{"q":"El sistema universitario presta y garantiza, según el artículo 2.1 de la LOSU:","o":["El servicio público de la educación superior universitaria","La educación obligatoria y gratuita","La investigación pública exclusivamente","La formación profesional de grado superior"],"c":0,"e":"Art. 2.1 LOSU.","r":"LOSU art. 2"},{"q":"La autonomía de las universidades se reconoce, según el artículo 3.1 de la LOSU, en virtud del derecho fundamental recogido en:","o":["El artículo 27.10 de la Constitución","El artículo 20 de la Constitución","El artículo 44 de la Constitución","El artículo 103 de la Constitución"],"c":0,"e":"Art. 3.1 LOSU.","r":"LOSU art. 3"},{"q":"Según el artículo 3.3 de la LOSU, la autonomía universitaria garantiza:","o":["La libertad de cátedra del profesorado","La inamovilidad del personal","La exención de todo control financiero","La gratuidad de la matrícula"],"c":0,"e":"Art. 3.3 LOSU: libertad en la docencia, la investigación y el estudio.","r":"LOSU art. 3"},{"q":"¿Cuál de las siguientes competencias NO forma parte de la autonomía universitaria según el artículo 3.2 de la LOSU?","o":["La elaboración de sus Estatutos","El establecimiento de sus relaciones de puestos de trabajo o plantillas","La aprobación del presupuesto general del Estado","La expedición de los títulos correspondientes a las enseñanzas oficiales"],"c":2,"e":"El presupuesto general del Estado lo aprueban las Cortes Generales; no es competencia universitaria.","r":"LOSU art. 3"},{"q":"Según el artículo 3.5 de la LOSU, en el ejercicio de su autonomía las universidades deberán:","o":["Rendir cuentas a la sociedad del uso de sus medios y recursos","Obtener autorización previa del Gobierno para cada gasto","Someterse a la dirección del Consejo de Universidades","Delegar su gestión financiera en la Comunidad Autónoma"],"c":0,"e":"Art. 3.5 LOSU.","r":"LOSU art. 3"},{"q":"¿Cómo se crean las universidades públicas según el artículo 4.1.a) de la LOSU?","o":["Por ley de la Asamblea Legislativa de la Comunidad Autónoma, previo informe preceptivo de la Conferencia General de Política Universitaria","Por real decreto del Consejo de Ministros","Por resolución del Rector de la universidad matriz","Por orden del Ministerio de Universidades"],"c":0,"e":"Art. 4.1.a) LOSU.","r":"LOSU art. 4"},{"q":"Según el artículo 4.2 de la LOSU, ¿a quién corresponde autorizar el inicio de actividades de una universidad?","o":["A los órganos competentes de la Comunidad Autónoma en la que radique la universidad","Al Consejo de Ministros","A la ANECA","A la Conferencia General de Política Universitaria"],"c":0,"e":"Art. 4.2 LOSU.","r":"LOSU art. 4"},{"q":"¿Qué agencia es competente, junto a las autonómicas inscritas en EQAR, para la acreditación y evaluación del profesorado universitario según el artículo 5.4?","o":["ANECA","CRUE","REBIUN","CNMC"],"c":0,"e":"Art. 5.4 LOSU: ANECA.","r":"LOSU art. 5"},{"q":"Según el artículo 6.1 de la LOSU, la docencia universitaria, preferentemente presencial:","o":["Podrá impartirse también de manera virtual o híbrida","Debe ser siempre presencial","Solo puede ser virtual en las universidades privadas","No puede ser híbrida"],"c":0,"e":"Art. 6.1 LOSU.","r":"LOSU art. 6"},{"q":"Los títulos universitarios oficiales deben inscribirse, según el artículo 7.3 de la LOSU, en:","o":["El Registro de Universidades, Centros y Títulos","El Registro Civil","El Registro Mercantil","El Registro General de la Propiedad Intelectual"],"c":0,"e":"Art. 7.3 LOSU. La inscripción tiene efectos constitutivos.","r":"LOSU art. 7"},{"q":"¿Quién expide los títulos universitarios oficiales según el artículo 8.1 de la LOSU?","o":["El Rector o Rectora de la universidad, en nombre del Rey","El Ministro de Universidades","El Consejo de Universidades","El Decano de la facultad"],"c":0,"e":"Art. 8.1 LOSU.","r":"LOSU art. 8"},{"q":"Las enseñanzas universitarias oficiales se estructuran en tres ciclos:","o":["Grado, Máster Universitario y Doctorado","Diplomatura, Licenciatura y Doctorado","Grado, Posgrado y Especialización","Bachiller, Grado y Máster"],"c":0,"e":"Art. 9.1 LOSU.","r":"LOSU art. 9"},{"q":"Según el artículo 9.3 de la LOSU, los estudios de Máster Universitario tienen como objetivo:","o":["La formación avanzada, especializada, multidisciplinar o interdisciplinar, orientada a la especialización académica o profesional o a la iniciación en tareas de investigación","Una formación básica y generalista en una disciplina","La adquisición de competencias de investigación en un ámbito del conocimiento","La formación permanente a lo largo de la vida"],"c":0,"e":"Art. 9.3 LOSU. La formación básica y generalista corresponde al Grado (art. 9.2) y la investigación al Doctorado (art. 9.4).","r":"LOSU art. 9"},{"q":"El artículo 12 de la LOSU establece que el personal docente e investigador deberá depositar una copia de la versión final aceptada para publicación y los datos asociados en:","o":["Repositorios institucionales o temáticos de acceso abierto","Bases de datos comerciales de las editoriales","El Registro de Universidades, Centros y Títulos","El archivo histórico universitario"],"c":0,"e":"Art. 12.2 LOSU (Ciencia Abierta).","r":"LOSU art. 12"},{"q":"Según el artículo 12.1 de la LOSU, el conocimiento científico tendrá la consideración de:","o":["Un bien común","Un bien patrimonial de la universidad","Un secreto industrial","Un servicio comercial"],"c":0,"e":"Art. 12.1 LOSU.","r":"LOSU art. 12"},{"q":"Las universidades públicas se rigen, según el artículo 38.1 de la LOSU, por:","o":["La LOSU, la ley de su creación y sus Estatutos, entre otras normas","Exclusivamente por sus Estatutos","Únicamente por la normativa autonómica","Por la Ley de Contratos del Sector Público exclusivamente"],"c":0,"e":"Art. 38.1 LOSU.","r":"LOSU art. 38"},{"q":"¿De cuánto tiempo dispone la Comunidad Autónoma para elaborar el informe de legalidad de los Estatutos (art. 38.2 LOSU)?","o":["Un mes","Dos meses","Cuatro meses","Seis meses"],"c":2,"e":"Art. 38.2 LOSU.","r":"LOSU art. 38"},{"q":"Según el artículo 38.4 de la LOSU, ponen fin a la vía administrativa:","o":["Las resoluciones del Rector o Rectora y los acuerdos del Consejo Social, del Consejo de Gobierno y del Claustro Universitario","Solo las resoluciones del Rector","Las resoluciones de los Decanos","Los acuerdos de los departamentos"],"c":0,"e":"Art. 38.4 LOSU.","r":"LOSU art. 38"},{"q":"El artículo 39.3 de la LOSU obliga a las universidades a contar con:","o":["Un portal de transparencia","Una radiotelevisión propia","Una escuela de doctorado en cada campus","Un servicio jurídico externo"],"c":0,"e":"Art. 39.3 LOSU.","r":"LOSU art. 39"},{"q":"Según el artículo 41 de la LOSU, la creación, modificación y supresión de facultades y escuelas será acordada por:","o":["La Comunidad Autónoma, a iniciativa de la universidad mediante propuesta y aprobación de su Consejo de Gobierno","El Rector por sí solo","El Consejo Social","El Ministerio de Universidades"],"c":0,"e":"Art. 41.1 LOSU. Los departamentos, institutos y escuelas de doctorado los crea la propia universidad (art. 41.2).","r":"LOSU art. 41"},{"q":"Según el artículo 42.3 de la LOSU, un centro adscrito solo podrá adscribirse:","o":["A una única universidad, salvo dispensa excepcional","A tantas universidades como convenios firme","A dos universidades como máximo","Solo a universidades privadas"],"c":0,"e":"Art. 42.3 LOSU.","r":"LOSU art. 42"},{"q":"¿Cuál de los siguientes servicios o unidades debe tener toda universidad según el artículo 43.1 de la LOSU?","o":["Defensoría universitaria","Un observatorio astronómico","Una editorial propia","Un hospital universitario"],"c":0,"e":"Art. 43.1 LOSU: unidades de igualdad y de diversidad, defensoría universitaria, inspección de servicios, servicios de salud y orientación profesional.","r":"LOSU art. 43"}],"mp3":true},"g3":{"id":"g3","bloque":"General","num":3,"titulo":"Proyecto de Estatutos de la Universidad de Granada","alcance":"Proyecto de Estatutos aprobado por el Claustro Universitario el 25 de mayo de 2026 (BOUGR n.º 326, de 27 de mayo de 2026). La convocatoria exige este documento, no los Estatutos de 2011.","fuentes":["Proyecto de Estatutos de la Universidad de Granada, Claustro Universitario, sesión extraordinaria de 25 de mayo de 2026 (secretariageneral.ugr.es, reforma de los Estatutos)"],"peso":"alto","aviso":"Es un proyecto. Si antes del examen se publica una versión definitiva con cambios, la convocatoria indica que vale el documento aprobado por el Claustro el 25 de mayo de 2026. Compara siempre con la copia de fuentes/leyes.","apuntes":[{"h":"Título preliminar (arts. 1 a 6)","t":"- **Art. 1**: la Universidad de Granada es una **institución de derecho público, con personalidad jurídica y patrimonio propio**, que presta el servicio público de la educación superior mediante la docencia, la investigación, el estudio, el intercambio y la transferencia de conocimiento y la extensión universitaria.\n- **Art. 2**: los Estatutos son la **norma institucional básica** de la Universidad. Se aplican a todos los centros y estructuras radicados en la provincia de Granada y en las Ciudades Autónomas de **Ceuta y Melilla**.\n- **Art. 4**: se fundamenta en la **libertad académica**: libertades de cátedra, de investigación y de estudio. Actúa con los principios de **legalidad, eficacia, eficiencia, coordinación, calidad y participación**.\n- **Art. 5**: el escudo y sello es el de su fundador, el **Emperador Carlos V**, con la leyenda **VNIVERSITAS GRANATENSIS 1531**. La ciudad de Granada es la sede. La **Secretaría General** vela por el buen uso de la identidad institucional.\n- **Art. 6**: el desarrollo normativo de los Estatutos corresponde al **Consejo de Gobierno**, salvo lo que sea competencia del **Claustro**. El Claustro aprueba, entre otros: Reglamento de Régimen Interno del Claustro, Reglamento General de centros y estructuras, Reglamento Electoral, Reglamento de la Defensoría Universitaria y Reglamento de honores y distinciones."},{"h":"Estructura de la Universidad (art. 7)","t":"La Universidad está integrada por **campus, facultades, escuelas, departamentos, estructuras de investigación y de intercambio y transferencia de conocimiento e innovación**, y otros centros o estructuras. Deben fomentar la cooperación, la multidisciplinariedad y una **gestión administrativa integrada**.\n\nLas unidades básicas incluyen las **unidades de igualdad y de diversidad**, la **Defensoría Universitaria**, la **Inspección de Servicios** y los servicios de salud y acompañamiento psicológico y pedagógico (arts. 37 a 48)."},{"h":"Órganos de gobierno (art. 52)","t":"- **Órganos generales colegiados**: **Claustro Universitario** (participación y representación), **Consejo de Gobierno** (gobierno) y **Consejo Social** (participación y representación de la sociedad).\n- **Órganos generales unipersonales**: **Rector o Rectora**, **Vicerrectores**, **Secretario o Secretaria General** y **Gerente**.\n- En facultades y escuelas: Junta de Facultad o Escuela, Decano o Decana / Director o Directora, Vicedecanos, Secretario. En departamentos: Consejo de Departamento y Director. También el **Consejo de Estudiantes**."},{"h":"Claustro Universitario (arts. 61 a 65)","t":"- **Art. 61**: es el **máximo órgano de representación y participación** de la comunidad universitaria.\n- **Art. 62**: formado por **trescientos claustrales**. Miembros natos: el **Rector** (que lo preside), el **Secretario General** y el **Gerente**. Reparto electo: **153** profesorado de cuerpos docentes y permanente laboral; **24** personal docente no permanente, investigador en formación y asociados; **1** profesorado emérito; **75** estudiantado; **44** personal técnico, de gestión y de administración y servicios (PTGAS).\n- **Art. 63**: elección por sectores mediante sufragio universal, libre, igual, directo y secreto.\n- **Art. 64**: funciones: elaborar, aprobar o modificar los **Estatutos**; debatir propuestas de política universitaria; aprobar sus reglamentos; **controlar al Rector** y exigir responsabilidad política (moción de censura); elegir a sus representantes en el Consejo de Gobierno; elegir y cesar a la persona titular de la **Defensoría Universitaria**."},{"h":"Consejo de Gobierno (arts. 66 a 71)","t":"- **Art. 66**: es el **máximo órgano de gobierno** de la Universidad. Establece las líneas estratégicas y programáticas.\n- **Art. 67**: compuesto por el **Rector** (presidente), el **Secretario General** y el **Gerente** como natos, y **cincuenta miembros**: **47 de la comunidad universitaria y 3 externos**.\n- **Art. 69**: funciones: promover y aprobar el **Plan Estratégico**; aprobar los Planes Propios; ejercer la **potestad reglamentaria** y de desarrollo de los Estatutos (salvo materias del Claustro); elegir a los representantes del PDI y del PTGAS en el **Consejo Social**."},{"h":"Consejo Social (arts. 72 y 73)","t":"- **Art. 72**: es el órgano de **participación y representación de la sociedad**: un espacio de colaboración y rendición de cuentas con instituciones, organizaciones sociales y tejido productivo.\n- **Art. 73**: formarán parte, en representación de la comunidad universitaria, el **Rector, el Secretario General y el Gerente**, un representante del PDI y uno del PTGAS (elegidos por el Consejo de Gobierno) y un representante del **estudiantado** (elegido por el Consejo de Estudiantes), con voz y voto."},{"h":"Rector o Rectora (arts. 75 a 80)","t":"- **Art. 75**: es el **máximo órgano académico**; ejerce la dirección, gobierno y gestión y ostenta la representación de la Universidad. Tiene todas las competencias no atribuidas expresamente a otros órganos.\n- **Art. 76**: elegido por **elección directa por sufragio universal ponderado**. Pueden ser candidatos: PDI **permanente doctor a tiempo completo**, con al menos **tres sexenios** de investigación y **tres quinquenios** de docencia, y **cuatro años** de experiencia de gestión en cargos unipersonales. Ponderación del voto: **51 %** cuerpos docentes y permanente laboral; **7 %** resto del PDI; **25 %** estudiantado; **17 %** PTGAS.\n- **Art. 77**: lo nombra el órgano competente de la **Junta de Andalucía**. Mandato de **seis años improrrogables y no renovables**.\n- **Art. 78**: **moción de censura**: a iniciativa de **un tercio** de los claustrales (con al menos el 30 % del profesorado de cuerpos docentes y permanente laboral); votación secreta y **dos tercios** de los miembros del Claustro para aprobarla.\n- **Art. 80**: el **Equipo de Gobierno** lo forman los Vicerrectores, el Secretario General, el Gerente y quienes determine el Rector."},{"h":"Secretario General y Gerente (arts. 82 a 85)","t":"- **Secretario o Secretaria General** (art. 82): auxilia al Rector en la organización de la actividad universitaria y es **fedatario** de los acuerdos de los órganos de gobierno de los que forme parte.\n- **Gerente** (art. 84): responsable de la gestión de los **servicios administrativos y económicos y de los recursos humanos**. Por delegación del Rector puede asumir la jefatura del PTGAS. Es propuesto y nombrado por el Rector **de acuerdo con el Consejo Social**.\n- **Art. 85**: el Gerente dirige la gestión de los servicios económicos, administrativos y de recursos humanos y coordina la administración del resto de servicios."},{"h":"Régimen jurídico de los órganos (arts. 129 a 135)","t":"- **Art. 130**: las **resoluciones del Rector** y los acuerdos del **Claustro, el Consejo de Gobierno y el Consejo Social** **agotan la vía administrativa** y pueden impugnarse directamente ante el orden contencioso-administrativo. Las de los demás órganos son recurribles **en alzada ante el Rector**.\n- **Art. 132**: la **sede electrónica** permite realizar trámites y presentar documentación en el registro electrónico.\n- **Art. 135**: los acuerdos que requieran publicidad se publican en el **Boletín Oficial de la Universidad de Granada (BOUGR)**, que se edita en formato electrónico."},{"h":"Comunidad universitaria y PTGAS (arts. 142, 146, 196)","t":"- **Art. 142**: la comunidad universitaria la forman el **personal docente e investigador, el estudiantado y el PTGAS**.\n- **Art. 146**: la Universidad contará con un **Portal de Transparencia**.\n- **Art. 196**: el PTGAS es el sector al que corresponde la **gestión técnica, económica y administrativa** de las áreas y servicios y las funciones de apoyo, asistencia, estudio y asesoramiento. Está constituido por **personal funcionario de las escalas de la propia Universidad** y por personal laboral contratado, además de funcionarios de otros cuerpos."},{"h":"Servicios de apoyo: Biblioteca y Archivo (arts. 245 y 246)","t":"- **Art. 245. Biblioteca Universitaria**: servicio de **gestión de recursos de información** para el aprendizaje, la docencia, la investigación, la formación continua y las políticas de **ciencia abierta**. Conserva y gestiona los recursos bibliográficos y documentales **con independencia del soporte, de la asignación presupuestaria y del procedimiento de adquisición**. Su finalidad principal es facilitar el **acceso, la difusión y el uso** de los recursos de información.\n- **Art. 246. Archivo Universitario**: sistema de archivos formado por los **Archivos de Gestión**, el **Archivo Intermedio** y el **Archivo Histórico**, más el **archivo electrónico único**. **Depende orgánicamente de la Secretaría General.** Su función principal es la reunión, conservación, organización y difusión del patrimonio documental."}],"clave":["Claustro: 300 claustrales (153 + 24 + 1 + 75 + 44 electos, más 3 natos).","Consejo de Gobierno: 50 miembros (47 comunidad universitaria y 3 externos) además de los natos.","Rector: mandato de seis años, no renovable; nombrado por la Junta de Andalucía.","Ponderación del voto: 51 % / 7 % / 25 % / 17 %.","Moción de censura: un tercio para proponerla y dos tercios para aprobarla.","El Archivo Universitario depende orgánicamente de la Secretaría General."],"podcast":[{"v":"A","t":"Bienvenida a la lección sobre el Proyecto de Estatutos de la Universidad de Granada, el documento aprobado por el Claustro el veinticinco de mayo de dos mil veintiséis."},{"v":"B","t":"Importante: la convocatoria dice que el tema se refiere a ese documento, no a los Estatutos antiguos de dos mil once. Por eso las cifras que vamos a ver pueden ser distintas a las que encuentres en apuntes viejos."},{"v":"A","t":"Empezamos. La Universidad de Granada es una institución de derecho público, con personalidad jurídica y patrimonio propio. Los Estatutos son su norma institucional básica y se aplican a la provincia de Granada y a las Ciudades Autónomas de Ceuta y Melilla."},{"v":"B","t":"El escudo es el del Emperador Carlos Quinto, con la leyenda Vnivérsitas Granatensis mil quinientos treinta y uno. Y la Secretaría General vela por el uso de la identidad institucional."},{"v":"A","t":"Órganos de gobierno. Tres colegiados generales: el Claustro, máximo órgano de representación y participación; el Consejo de Gobierno, máximo órgano de gobierno; y el Consejo Social, de participación de la sociedad. Y cuatro unipersonales: Rector, Vicerrectores, Secretario General y Gerente."},{"v":"B","t":"El Claustro tiene trescientos claustrales. Natos: Rector, que lo preside, Secretario General y Gerente. Electos: ciento cincuenta y tres de cuerpos docentes y permanente laboral, veinticuatro de personal docente no permanente, investigador en formación y asociados, uno de emérito, setenta y cinco estudiantes y cuarenta y cuatro del personal técnico, de gestión y de administración y servicios."},{"v":"A","t":"Funciones del Claustro: elaborar, aprobar o modificar los Estatutos, controlar al Rector y exigir su responsabilidad política, y elegir y cesar a la persona titular de la Defensoría Universitaria."},{"v":"B","t":"El Consejo de Gobierno: Rector, Secretario General y Gerente como natos, y cincuenta miembros, de los cuales cuarenta y siete son de la comunidad universitaria y tres externos. Aprueba el Plan Estratégico y ejerce la potestad reglamentaria de desarrollo de los Estatutos."},{"v":"A","t":"Rector. Es el máximo órgano académico. Se elige por sufragio universal ponderado: cincuenta y uno por ciento cuerpos docentes y permanente laboral, siete por ciento resto del profesorado, veinticinco por ciento estudiantes y diecisiete por ciento personal de administración y servicios. Mandato de seis años, improrrogable y no renovable."},{"v":"B","t":"Moción de censura: la propone un tercio del Claustro y se aprueba con dos tercios en votación secreta."},{"v":"A","t":"El Gerente es responsable de la gestión de los servicios administrativos y económicos y de los recursos humanos. Se nombra por el Rector de acuerdo con el Consejo Social. El Secretario General es el fedatario de los acuerdos."},{"v":"B","t":"Para tu especialidad, atención al Título Cinco. La Biblioteca Universitaria es un servicio de gestión de recursos de información, conserva los recursos con independencia del soporte, del presupuesto y de la forma de adquisición. Y el Archivo Universitario se compone de los archivos de gestión, el intermedio y el histórico, y depende orgánicamente de la Secretaría General."},{"v":"A","t":"Y recuerda: las resoluciones del Rector y los acuerdos de Claustro, Consejo de Gobierno y Consejo Social agotan la vía administrativa. Hasta aquí esta lección."}],"preguntas":[{"q":"Según el artículo 1 del Proyecto de Estatutos, la Universidad de Granada es:","o":["Una institución de derecho público, con personalidad jurídica y patrimonio propio","Una fundación pública sin patrimonio propio","Un organismo autónomo de la Junta de Andalucía","Una sociedad mercantil estatal"],"c":0,"e":"Art. 1.1 del Proyecto de Estatutos.","r":"ESTATUTOS art. 1"},{"q":"Los Estatutos se aplican, según su artículo 2, a los centros y estructuras radicados en:","o":["La provincia de Granada y las Ciudades Autónomas de Ceuta y Melilla","Solo la ciudad de Granada","Granada, Jaén y Almería","Toda Andalucía"],"c":0,"e":"Art. 2.2 del Proyecto de Estatutos.","r":"ESTATUTOS art. 2"},{"q":"¿Qué leyenda circunda el escudo y sello de la Universidad según el artículo 5?","o":["VNIVERSITAS GRANATENSIS 1531","UNIVERSITAS GRANATENSIS 1492","VNIVERSITAS CAROLI QVINTI 1526","ALMA MATER GRANATENSIS 1531"],"c":0,"e":"Art. 5.1: el escudo es el de su fundador, el Emperador Carlos V.","r":"ESTATUTOS art. 5"},{"q":"¿Quién vela por el buen uso de la identidad institucional de la Universidad (art. 5.2)?","o":["La persona titular de la Secretaría General","El Gerente","El Rector exclusivamente","El Vicerrector de Comunicación"],"c":0,"e":"Art. 5.2 del Proyecto de Estatutos.","r":"ESTATUTOS art. 5"},{"q":"El desarrollo normativo de los Estatutos corresponde, según el artículo 6.1:","o":["Al Consejo de Gobierno, excepto en las normas de competencia del Claustro","Al Consejo Social","Al Rector exclusivamente","A la Junta de Andalucía"],"c":0,"e":"Art. 6.1 del Proyecto de Estatutos.","r":"ESTATUTOS art. 6"},{"q":"¿Cuál de los siguientes órganos generales colegiados es de participación y representación de la sociedad (art. 52)?","o":["El Consejo Social","El Claustro Universitario","El Consejo de Gobierno","El Consejo de Estudiantes"],"c":0,"e":"Art. 52.1.a del Proyecto de Estatutos.","r":"ESTATUTOS art. 52"},{"q":"El Claustro Universitario es, según el artículo 61:","o":["El máximo órgano de representación y participación de la comunidad universitaria","El máximo órgano de gobierno de la Universidad","El órgano de representación de la sociedad","El órgano de gestión económica"],"c":0,"e":"Art. 61. El máximo órgano de gobierno es el Consejo de Gobierno (art. 66).","r":"ESTATUTOS art. 61"},{"q":"¿Cuántos claustrales componen el Claustro Universitario (art. 62.1)?","o":["Doscientos","Doscientos cincuenta","Trescientos","Trescientos cincuenta"],"c":2,"e":"Art. 62.1 del Proyecto de Estatutos.","r":"ESTATUTOS art. 62"},{"q":"¿Quién preside el Claustro Universitario?","o":["El Rector o Rectora","El Secretario General","El Presidente del Consejo Social","El Gerente"],"c":0,"e":"Art. 62.2: miembros natos son el Rector (que lo preside), el Secretario General y el Gerente.","r":"ESTATUTOS art. 62"},{"q":"¿Cuántos miembros del estudiantado forman parte del Claustro como miembros electos (art. 62.3)?","o":["Setenta y cinco","Cuarenta y cuatro","Ciento cincuenta y tres","Veinticuatro"],"c":0,"e":"Art. 62.3.d. Los 44 son del PTGAS.","r":"ESTATUTOS art. 62"},{"q":"¿Cuál de las siguientes funciones corresponde al Claustro Universitario (art. 64)?","o":["Elaborar, aprobar o modificar los Estatutos de la Universidad","Aprobar los Planes Propios","Nombrar al Gerente","Aprobar el Plan Estratégico"],"c":0,"e":"Art. 64.a. El Plan Estratégico y los Planes Propios los aprueba el Consejo de Gobierno (art. 69).","r":"ESTATUTOS art. 64"},{"q":"Según el artículo 66, el máximo órgano de gobierno de la Universidad es:","o":["El Consejo de Gobierno","El Claustro Universitario","El Rector o Rectora","El Consejo Social"],"c":0,"e":"Art. 66.1 del Proyecto de Estatutos.","r":"ESTATUTOS art. 66"},{"q":"El Consejo de Gobierno está compuesto, además de por los miembros natos, por cincuenta miembros, de los cuales:","o":["Cuarenta y siete son de la comunidad universitaria y tres externos a la Universidad","Cuarenta son de la comunidad universitaria y diez externos","Todos pertenecen a la comunidad universitaria","Treinta y cinco son de la comunidad universitaria y quince externos"],"c":0,"e":"Art. 67.1 del Proyecto de Estatutos.","r":"ESTATUTOS art. 67"},{"q":"El Consejo Social es, según el artículo 72:","o":["El órgano de participación y representación de la sociedad","El máximo órgano académico","El órgano de gestión económica","El órgano de representación del estudiantado"],"c":0,"e":"Art. 72 del Proyecto de Estatutos.","r":"ESTATUTOS art. 72"},{"q":"Según el artículo 75, el Rector o Rectora es:","o":["El máximo órgano académico de la Universidad","El máximo órgano de representación de la sociedad","Un órgano delegado de la Junta de Andalucía","El órgano de gestión de los recursos humanos"],"c":0,"e":"Art. 75 del Proyecto de Estatutos.","r":"ESTATUTOS art. 75"},{"q":"¿Cuál es la duración del mandato del Rector o Rectora según el artículo 77?","o":["Cuatro años, renovables una vez","Cinco años, renovables","Seis años improrrogables y no renovables","Ocho años no renovables"],"c":2,"e":"Art. 77.2 del Proyecto de Estatutos.","r":"ESTATUTOS art. 77"},{"q":"¿Quién nombra al Rector o Rectora según el artículo 77.1?","o":["El órgano competente de la Junta de Andalucía","El Consejo de Ministros","El Claustro Universitario","El Consejo Social"],"c":0,"e":"Art. 77.1 del Proyecto de Estatutos.","r":"ESTATUTOS art. 77"},{"q":"En la elección del Rector, ¿qué porcentaje de ponderación tiene el voto del estudiantado (art. 76.3)?","o":["Un diecisiete por ciento","Un siete por ciento","Un veinticinco por ciento","Un cincuenta y uno por ciento"],"c":2,"e":"Art. 76.3.c. Cuerpos docentes y PP. laboral 51 %, resto del PDI 7 %, PTGAS 17 %.","r":"ESTATUTOS art. 76"},{"q":"Para aprobar una moción de censura al Rector, según el artículo 78, se necesita el voto favorable de:","o":["Dos tercios de los miembros del Claustro Universitario","La mayoría simple del Claustro","La mayoría absoluta del Consejo de Gobierno","Tres quintos del Claustro"],"c":0,"e":"Art. 78.3: votación secreta. Se propone a iniciativa de un tercio de sus componentes.","r":"ESTATUTOS art. 78"},{"q":"Según el artículo 84, el o la Gerente es el responsable de:","o":["La gestión de los servicios administrativos y económicos y de los recursos humanos de la Universidad","La docencia y la investigación","La fe pública de los acuerdos de los órganos de gobierno","La representación legal de la Universidad"],"c":0,"e":"Art. 84.1 del Proyecto de Estatutos.","r":"ESTATUTOS art. 84"},{"q":"Según el artículo 82, ¿quién es el fedatario de los acuerdos de los órganos de gobierno de los que forme parte?","o":["El Secretario o Secretaria General","El Gerente","El Rector","El Vicerrector de Ordenación Académica"],"c":0,"e":"Art. 82.1 del Proyecto de Estatutos.","r":"ESTATUTOS art. 82"},{"q":"Según el artículo 130, ¿qué actos agotan la vía administrativa?","o":["Las resoluciones del Rector y los acuerdos del Claustro, del Consejo de Gobierno y del Consejo Social","Solo las resoluciones del Rector","Los acuerdos de las Juntas de Facultad","Las resoluciones de los Decanos"],"c":0,"e":"Art. 130.1. Las de los demás órganos son recurribles en alzada ante el Rector (art. 130.2).","r":"ESTATUTOS art. 130"},{"q":"La comunidad universitaria está formada, según el artículo 142, por:","o":["El personal docente e investigador, el estudiantado y el personal técnico, de gestión y de administración y servicios","El profesorado y el estudiantado","El personal funcionario y el laboral","Los órganos de gobierno y los centros"],"c":0,"e":"Art. 142 del Proyecto de Estatutos.","r":"ESTATUTOS art. 142"},{"q":"Según el artículo 245, la Biblioteca Universitaria conservará y gestionará los recursos bibliográficos y documentales de la Universidad:","o":["Con independencia del soporte material, de la asignación presupuestaria y del procedimiento de adquisición","Solo los adquiridos con cargo a su presupuesto","Solo los de soporte impreso","Solo los adquiridos por compra"],"c":0,"e":"Art. 245.2 del Proyecto de Estatutos.","r":"ESTATUTOS art. 245"},{"q":"¿De qué órgano depende orgánicamente el Archivo Universitario según el artículo 246.2?","o":["De la Secretaría General","De la Gerencia","De la Biblioteca Universitaria","Del Vicerrectorado de Investigación"],"c":0,"e":"Art. 246.2 del Proyecto de Estatutos.","r":"ESTATUTOS art. 246"},{"q":"El sistema de archivos que forma el Archivo Universitario está integrado por:","o":["Los Archivos de Gestión, el Archivo Intermedio y el Archivo Histórico","El Archivo Central y el Archivo Provincial","Solo el Archivo Histórico","Los archivos de cada Facultad exclusivamente"],"c":0,"e":"Art. 246.1 del Proyecto de Estatutos, más el archivo electrónico único.","r":"ESTATUTOS art. 246"}],"mp3":true},"g4":{"id":"g4","bloque":"General","num":4,"titulo":"Empleo público: EBEP y Ley de la Función Pública de Andalucía","alcance":"Texto Refundido del EBEP (RDL 5/2015): Títulos I y II. Ley 5/2023 de Función Pública de Andalucía: Título I (cap. I y cap. III), Título IX, Título XI y Título XII.","fuentes":["BOE-A-2015-11719 (Texto Refundido de la Ley del Estatuto Básico del Empleado Público, consolidado)","BOE-A-2023-16066 (Ley 5/2023, de 7 de junio, de la Función Pública de Andalucía, consolidada)"],"peso":"alto","aviso":"La Ley 5/2023 ha sido modificada en 2026 (Decreto-ley 3/2026). La convocatoria exige las versiones vigentes a 6 de octubre de 2026. El texto de apoyo es la versión consolidada del BOE descargada el 27/10/2026: revisa cualquier cambio posterior antes del examen.","apuntes":[{"h":"EBEP, Título I: objeto y ámbito (arts. 1 a 7)","t":"- **Art. 1.1**: el Estatuto establece las **bases del régimen estatutario de los funcionarios públicos**; y las normas aplicables al **personal laboral** (art. 1.2).\n- **Art. 1.3**: fundamentos de actuación, entre ellos: servicio a los ciudadanos y a los intereses generales; **igualdad, mérito y capacidad** en el acceso y la promoción; sometimiento pleno a la ley y al Derecho; igualdad de trato entre m
