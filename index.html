ciada a la Sectorial CRUE I+D+i. Antes fue una red independiente hasta mil novecientos noventa y ocho y después Comisión Sectorial de CRUE hasta dos mil diecinueve. Nació en mil novecientos ochenta y ocho por iniciativa de un grupo de directores de bibliotecas."},{"v":"A","t":"La forman las bibliotecas de setenta y seis universidades de la CRUE, cuarenta y nueve públicas y veintisiete privadas, más el CSIC. Su misión: fortalecer la cooperación, coordinación y colaboración, ser foro de confianza y interlocutora ante CRUE, consorcios y ministerios."},{"v":"B","t":"Sus órganos: el Pleno y la Comisión Permanente como colegiados, y el Coordinador y el Secretario Ejecutivo como unipersonales. Y puede crear grupos de trabajo."},{"v":"A","t":"El V Plan Estratégico es dos mil veinticuatro a dos mil veintisiete. Se aprobó en la Asamblea de la Universitat Autònoma de Barcelona y entró en vigor en enero de dos mil veinticuatro. Tiene cuatro líneas: uno, la biblioteca en el contexto de la transformación digital; dos, la biblioteca como agente estratégico para el impulso de la ciencia abierta; tres, equipos y capacitación profesional; y cuatro, gobernanza, colaboración e internacionalización."},{"v":"B","t":"El catálogo colectivo de REBIUN agrupa los catálogos de noventa y cinco bibliotecas. Nació en mil novecientos noventa y dos en CD-ROM con cinco bibliotecas. Se actualiza seis veces al año, cada dos meses aproximadamente. Y sus subcatálogos son Todo, Revistas y Fondo antiguo, anterior a mil novecientos."},{"v":"A","t":"Pasamos al CBUA, el Consorcio de Bibliotecas Universitarias de Andalucía. Lo forman diez universidades: Almería, Cádiz, Córdoba, Granada, Huelva, Internacional de Andalucía, Jaén, Málaga, Pablo de Olavide y Sevilla. Su objetivo fundamental: mejorar la calidad de los servicios bibliotecarios mediante la cooperación interbibliotecaria."},{"v":"B","t":"Es voluntario e indefinido y una entidad de derecho público. La sede alterna en la universidad cuyo Rector ejerce la Presidencia. Hay miembros de pleno derecho, asociados y colaboradores o benefactores."},{"v":"A","t":"Órganos: el Consejo de Gobierno y la Comisión Técnica, colegiados; y el Presidente, el Secretario y la Dirección Técnica. El Presidente lo elige la AUPA entre los rectores, por cuatro años, y es el órgano de contratación."},{"v":"B","t":"El Consejo de Gobierno es el órgano superior: el Presidente, el Rector de cada otra universidad y el Secretario. La Comisión Técnica es el órgano permanente de administración, propuesta y asesoramiento: el Presidente, los Directores de Biblioteca y el Director Técnico. Y el Director Técnico lo nombra el Consejo a propuesta de la Comisión, de entre los directores de biblioteca."},{"v":"A","t":"Se necesita el voto favorable de dos tercios para nombrar al Director Técnico, admitir nuevos miembros, modificar los Estatutos y aprobar reglamentos. El Consejo se reúne al menos una vez al año y la Comisión al menos una vez al trimestre. El presupuesto es público, único, anual y equilibrado, y rinde cuentas a la Cámara de Cuentas de Andalucía."},{"v":"B","t":"Haz el test y repasa las cifras. Hasta la próxima."}],"preguntas":[{"q":"¿Qué significa REBIUN?","o":["Red de Bibliotecas Universitarias y Científicas Españolas","Red Española de Bibliotecas Universitarias Nacionales","Registro de Bibliotecas Universitarias y de Investigación Nacional","Red de Bibliotecas Informatizadas Universitarias"],"c":0,"e":"Sitio oficial de REBIUN.","r":"REBIUN_WEB art. doc"},{"q":"REBIUN es una red asociada a la Sectorial CRUE I+D+i desde el año:","o":["2020","1988","1998","2024"],"c":0,"e":"Antes fue red independiente (1990-1998) y Comisión Sectorial de CRUE (1998-2019).","r":"REBIUN_WEB art. doc"},{"q":"Antes de ser una red asociada a la Sectorial CRUE I+D+i, REBIUN fue, entre 1998 y 2019:","o":["Una Comisión Sectorial de CRUE","Un consorcio autonómico","Una fundación pública","Un servicio del CSIC"],"c":0,"e":"Entre 1990 y 1998 fue una red independiente.","r":"REBIUN_WEB art. doc"},{"q":"REBIUN está formada por las bibliotecas de las universidades miembros de la CRUE (49 públicas y 27 privadas) y:","o":["El CSIC","El Ministerio de Universidades","La Biblioteca Nacional de España","ANECA"],"c":0,"e":"Consejo Superior de Investigaciones Científicas.","r":"REBIUN_WEB art. doc"},{"q":"¿A iniciativa de quién se creó REBIUN en 1988?","o":["De un grupo de directoras y directores de bibliotecas","Del Ministerio de Educación","De la CRUE","Del Consejo de Universidades"],"c":0,"e":"Sitio oficial de REBIUN.","r":"REBIUN_WEB art. doc"},{"q":"¿Cuáles son los órganos colegiados de REBIUN?","o":["El Pleno y la Comisión Permanente","El Consejo de Gobierno y la Comisión Técnica","La Asamblea y el Consejo Social","El Claustro y la Comisión Delegada"],"c":0,"e":"Los unipersonales son el Coordinador/a y el Secretario/a Ejecutivo/a.","r":"REBIUN_WEB art. doc"},{"q":"El V Plan Estratégico de REBIUN comprende los años:","o":["2024-2027","2020-2023","2024-2031","2016-2019"],"c":0,"e":"En vigor desde enero de 2024. No confundir con la Estrategia 2024-2031 de la Biblioteca de la UGR.","r":"REBIUN_WEB art. doc"},{"q":"¿Cuántas líneas estratégicas aprobó REBIUN en el V Plan Estratégico 2024-2027?","o":["4","3","5","8"],"c":0,"e":"Además hay 8 grupos de trabajo.","r":"REBIUN_WEB art. doc"},{"q":"La Línea 1 del V Plan Estratégico de REBIUN se titula:","o":["La biblioteca en el contexto de la transformación digital","Equipos y capacitación profesional","Gobernanza, colaboración e internacionalización","La biblioteca como agente estratégico para el impulso de la ciencia abierta"],"c":0,"e":"Línea 2: ciencia abierta; Línea 3: equipos y capacitación profesional; Línea 4: gobernanza, colaboración e internacionalización.","r":"REBIUN_WEB art. doc"},{"q":"¿Qué línea del V Plan Estratégico de REBIUN se titula «La biblioteca como agente estratégico para el impulso de la ciencia abierta»?","o":["La Línea 2","La Línea 1","La Línea 3","La Línea 4"],"c":0,"e":"Línea 2 del V Plan.","r":"REBIUN_WEB art. doc"},{"q":"La Línea 4 del V Plan Estratégico de REBIUN (gobernanza, colaboración e internacionalización) la conforma:","o":["La Comisión Permanente de la red","El Pleno de la red","El grupo de Catálogo Colectivo","El Observatorio de Inteligencia Artificial"],"c":0,"e":"Memoria de actividades REBIUN 2025.","r":"REBIUN_MEMORIA art. doc"},{"q":"¿Cuál de los siguientes es un ámbito de la Línea 1 del V Plan Estratégico de REBIUN?","o":["Transformación de espacios","Impulso de la internacionalización","Políticas de ciencia abierta","Mejora de la gobernanza"],"c":0,"e":"Ámbitos de la Línea 1: aprendizaje y docencia; investigación; transferencia y proyección social; transformación de espacios.","r":"REBIUN_WEB art. doc"},{"q":"¿Cuántos grupos de trabajo funcionan en REBIUN con el V Plan Estratégico?","o":["8","4","6","12"],"c":0,"e":"Cada uno con sus subgrupos.","r":"REBIUN_WEB art. doc"},{"q":"El catálogo colectivo de REBIUN agrupa actualmente los catálogos de:","o":["95 bibliotecas","76 bibliotecas","50 bibliotecas","120 bibliotecas"],"c":0,"e":"76 universitarias, públicas y privadas, miembros de CRUE, el CSIC y una veintena más de instituciones asociadas.","r":"REBIUN_WEB art. doc"},{"q":"El proyecto del catálogo colectivo de REBIUN nació en 1992 con una edición en CD-ROM que agrupaba los fondos de:","o":["5 bibliotecas universitarias","20 bibliotecas universitarias","76 bibliotecas","2 bibliotecas"],"c":0,"e":"Grupo de trabajo de Catálogo Colectivo de REBIUN.","r":"REBIUN_WEB art. doc"},{"q":"¿Con qué periodicidad se actualiza el catálogo colectivo de REBIUN, según su manual de procedimiento?","o":["Seis veces al año (cada dos meses aproximadamente)","Semanal","Quincenal","Una vez al año"],"c":0,"e":"Manual de procedimiento del catálogo colectivo de REBIUN (2016): bimestral.","r":"REBIUN_MANUAL_CC art. doc"},{"q":"¿Qué subcatálogos ofrece la página de inicio del catálogo colectivo de REBIUN?","o":["Todo, Revistas y Fondo antiguo","Libros, Tesis y Mapas","Monografías, Artículos y Vídeos","Impresos, Electrónicos y Audiovisuales"],"c":0,"e":"El subcatálogo de fondo antiguo recoge más de un millón de registros de obras anteriores a 1900.","r":"REBIUN_MANUAL_CC art. doc"},{"q":"El subcatálogo de fondo antiguo del catálogo colectivo de REBIUN contiene registros de obras anteriores a:","o":["1900","1800","1958","1950"],"c":0,"e":"Manual de procedimiento del catálogo colectivo de REBIUN.","r":"REBIUN_MANUAL_CC art. doc"},{"q":"¿Cuántas universidades constituyen el Consorcio de Bibliotecas Universitarias de Andalucía (CBUA)?","o":["Diez","Ocho","Doce","Nueve"],"c":0,"e":"Art. 1.1 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"El objetivo fundamental del CBUA es:","o":["Mejorar la calidad de los servicios bibliotecarios a través de la cooperación interbibliotecaria","Centralizar la gestión de las bibliotecas universitarias andaluzas","Sustituir a REBIUN en Andalucía","Gestionar los presupuestos de las universidades"],"c":0,"e":"Art. 1.1 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"Según el artículo 2 de los Estatutos del CBUA, el Consorcio:","o":["Tiene carácter voluntario e indefinido y es una entidad de derecho público","Es una sociedad mercantil","Tiene carácter temporal por 10 años","Es una fundación privada"],"c":0,"e":"Art. 2 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"La sede y domicilio del CBUA queda establecida, según el artículo 4:","o":["Con alternación, en la universidad cuyo Rector ejerza la Presidencia","Siempre en la Universidad de Granada","En la Universidad de Sevilla, de forma permanente","En la sede de AUPA"],"c":0,"e":"Art. 4 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"¿Qué tipos de miembros contempla el CBUA?","o":["De pleno derecho, asociados y colaboradores o benefactores","Fundadores, ordinarios y honorarios","Públicos y privados","Titulares y suplentes"],"c":0,"e":"Art. 5.1 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"¿Cuáles son los órganos colegiados del CBUA?","o":["El Consejo de Gobierno y la Comisión Técnica","El Pleno y la Comisión Permanente","El Claustro y el Consejo Social","La Asamblea y la Junta Técnica"],"c":0,"e":"Unipersonales: Presidente, Secretario y Dirección Técnica (art. 6).","r":"CBUA_ESTATUTOS art. doc"},{"q":"¿Quién elige al Presidente del CBUA?","o":["La Asociación de Universidades Públicas de Andalucía (AUPA), de entre los Rectores de las universidades de pleno derecho","El Consejo de Gobierno del CBUA","La Junta de Andalucía","La Comisión Técnica"],"c":0,"e":"Art. 7.1 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"La duración del cargo de Presidente del CBUA es de:","o":["Cuatro años","Dos años","Seis años","Tres años"],"c":0,"e":"Cesa si pierde la condición de miembro del equipo de gobierno de su universidad (art. 7.2).","r":"CBUA_ESTATUTOS art. doc"},{"q":"Según el artículo 11 de los Estatutos del CBUA, el órgano superior del Consorcio es:","o":["El Consejo de Gobierno","La Comisión Técnica","El Presidente","La Dirección Técnica"],"c":0,"e":"Art. 11.1 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"La Comisión Técnica del CBUA es, según el artículo 14:","o":["El órgano permanente de administración, propuesta y asesoramiento","El órgano superior del Consorcio","El órgano unipersonal de ejecución","Un órgano consultivo externo"],"c":0,"e":"Art. 14.1: la integran el Presidente, los Directores de Biblioteca de cada universidad y el Director Técnico (secretario).","r":"CBUA_ESTATUTOS art. doc"},{"q":"¿Cómo es nombrado el Director Técnico del CBUA?","o":["Por el Consejo de Gobierno, a propuesta de la Comisión Técnica, de entre los Directores de Bibliotecas que la integran","Por el Presidente, sin intervención de otros órganos","Por la AUPA","Por sorteo entre los Rectores"],"c":0,"e":"Art. 17.2 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"Para el nombramiento del Director Técnico del CBUA, la admisión de nuevos miembros o la modificación de los Estatutos se exige el voto favorable de:","o":["Las dos terceras partes del número legal de miembros del Consejo de Gobierno","La mayoría simple","La unanimidad","La mayoría absoluta de los presentes"],"c":0,"e":"Art. 13.3 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"El Consejo de Gobierno del CBUA se reunirá en sesión ordinaria, según el artículo 19, al menos:","o":["Una vez al año","Una vez al trimestre","Una vez al mes","Dos veces al año"],"c":0,"e":"La Comisión Técnica, al menos una vez al trimestre (art. 20).","r":"CBUA_ESTATUTOS art. doc"},{"q":"La Comisión Técnica del CBUA se reunirá en sesión ordinaria al menos:","o":["Una vez al trimestre","Una vez al año","Una vez al mes","Una vez al semestre"],"c":0,"e":"Art. 20.1 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"El presupuesto del CBUA será, según el artículo 24:","o":["Público, único, anual y equilibrado","Plurianual y reservado","Anual y deficitario","Público y ampliable libremente"],"c":0,"e":"Art. 24.1 de los Estatutos del CBUA.","r":"CBUA_ESTATUTOS art. doc"},{"q":"El CBUA está obligado a rendir cuentas de su actividad, según el artículo 22, a:","o":["La Cámara de Cuentas de Andalucía","El Defensor del Pueblo Andaluz","El Consejo de Gobierno de la Junta","La CRUE"],"c":0,"e":"Sin perjuicio de las competencias del Tribunal de Cuentas.","r":"CBUA_ESTATUTOS art. doc"}],"mp3":true},"e9":{"id":"e9","bloque":"Específico","num":9,"titulo":"El servicio de préstamo","alcance":"Servicios al usuario: el servicio de préstamo en la Biblioteca Universitaria de Granada. Préstamo a domicilio, intercampus, consorciado (CBUA) e interbibliotecario.","fuentes":["Guía de Préstamo de la Biblioteca Universitaria de Granada (bibliotecaugr.libguides.com/prestamo), consultada el 28/10/2026: normativa de préstamo a domicilio, tipos de préstamo, renovaciones, reservas, sanción solidaria, préstamo CBUA e interbibliotecario","Reglamento de la Biblioteca Universitaria (arts. 19, 24 y 25)"],"peso":"alto","notas":["En el examen de abril de 2025 se preguntó la duración del préstamo CBUA y sus renovaciones. La normativa vigente dice: 15 días y hasta 3 renovaciones. Aprende todas las cifras del CBUA: 15 días, 3 días hábiles de recogida, 3 ejemplares, 3 renovaciones, 1 día de gracia.","Estos datos salen de la web oficial de la Biblioteca (Guía de Préstamo, actualizada en septiembre de 2026). Las cifras y plazos pueden cambiar: la Dirección puede modificarlos si la Comisión de Biblioteca los ratifica. Comprueba la web antes del examen.","No confundas los cuatro préstamos: el préstamo a domicilio (normal) es de la Biblioteca; el intercampus es entre campus de la UGR; el CBUA es entre universidades andaluzas; el interbibliotecario es con cualquier biblioteca externa.","Los sancionados por retraso: 2 días de suspensión por cada día y obra de retraso en préstamos por días; 1 día por cada hora en préstamos por horas. El préstamo CBUA añade 1 día de gracia.","Cuidado con los números parecidos: el plazo de recogida de una reserva es 2 días; el del préstamo CBUA, 3 días hábiles; el del intercampus, 48 horas."],"apuntes":[{"h":"Qué es el préstamo y quién puede usarlo","t":"- **Definición** (Normativa de préstamo a domicilio): servicio por el que la Biblioteca Universitaria pone a disposición de sus usuarios, **por un tiempo limitado y fuera del ámbito de la Biblioteca**, su material bibliográfico y documental. También permite obtener material que **no forme parte de sus colecciones** (préstamo interbibliotecario) y suministra documentos a instituciones externas. **El préstamo es personal e intransferible.**\n- **Horario**: de lunes a viernes, de **8,30 a 20,30 horas**.\n- **Personas usuarias**: la **comunidad universitaria** (profesorado, personal investigador, becarios, estudiantado y PTGAS); personal de **centros adscritos**; personal de otras universidades en **estancia oficial**; personal de organismos con **convenios** en materia de bibliotecas; **personal no universitario** autorizado por la Dirección; y **usuarios externos** (instituciones que piden préstamo interbibliotecario).\n- **Registro**: para usar el préstamo, salvo el interbibliotecario, hay que estar **registrado como usuario/a** de la Biblioteca. Se formaliza con el **carné de usuario/a**, el carné de la UGR u otro documento justificativo (Reglamento, art. 19.d: el uso del préstamo es personal e intransferible).\n- **Reglamento, art. 24**: el préstamo a domicilio consiste en el préstamo de documentos definidos como prestables y, en su caso, su **renovación y reserva**. **Art. 25**: el préstamo interbibliotecario proporciona los documentos no disponibles en los propios fondos y suministra a otras bibliotecas los que soliciten."},{"h":"Material excluido y sanciones","t":"**Se excluyen del préstamo** (excepciones a que «todo el material es objeto de préstamo»): **publicaciones periódicas**; **manuscritos, incunables y obras publicadas con anterioridad a 1901**; libros, documentos y mapas modernos **agotados y de difícil reposición**; materiales muy consultados de los que solo hay **un ejemplar**; **atlas cartográficos, dibujos, estampas y grabados**; y lo que la Biblioteca decida preservar.\n\n**Incumplimientos**:\n- **Pérdida o deterioro**: obliga a **reponer** el material o, si no es posible, a **abonar el coste de su sustitución o reparación**.\n- **Retrasos**: **2 días de suspensión del derecho al préstamo por cada día y obra de retraso** (préstamos por días) y **1 día por cada hora** (préstamos por horas). El retraso reiterado puede conllevar suspensión temporal o definitiva.\n- **Compromiso de la Biblioteca**: guardar la **confidencialidad** de los datos de las personas usuarias y de los documentos que tienen o han tenido en préstamo.\n- **Disposición final**: la Dirección puede modificar tipos de usuarios, número de obras y plazos, que **deben ser ratificados por la Comisión de Biblioteca para ser permanentes**. Existe además un **Manual Operativo**."},{"h":"Tabla de usuarios y de plazos","t":"- **Número de monografías por tipo de usuario**: estudiantado de **grado y de posgrado**: 20; **PDI e investigador**: 50; **PTGAS**: 20; egresados y jubilados (Senior UGR): 10; visitante (PDI no UGR): 50; usuarios no UGR: 5. **Máximo de reservas**: grado, 5; posgrado, PDI, PTGAS y jubilados, 10; egresados, 3; visitante, 5; no UGR, 1.\n- **Plazos de préstamo** (y máximo con renovaciones): préstamo por **horas** (3/6 horas o hasta el final de la jornada), no renovable; **24 horas**, no renovable; **2 días**, hasta **14 días**; **4 días**, con 1 renovación, **8 días**; **semanal** (1 semana), hasta **49 días**; **15 días**, hasta **105 días**; **1 mes**, hasta **7 meses**.\n- **Bloqueo por retraso**: 1 día por hora de retraso (préstamo por horas); **2 días por día** de retraso en los demás. El préstamo de 24 horas se considera préstamo por días a efectos de bloqueo.\n- **Reservable**: los préstamos de 4 días, semanales, de 15 días y de 1 mes. **No reservables**: los préstamos por horas, de 24 horas y de 2 días.\n- **Ampliación**: concluido el período (incluidas renovaciones), puede volverse a prestar si la persona no está sancionada y el ejemplar no tiene reserva. No se aplica al préstamo de infraestructura, CBUA ni interbibliotecario."},{"h":"Tipos de préstamo","t":"- **Préstamo normal**: ejemplares prestables; duración y número según el tipo de usuario y de material. En vacaciones (Navidad, Semana Santa, Corpus y verano) pueden fijarse duraciones especiales por cada punto de servicio.\n- **Préstamo semipermanente**: para **Departamentos, Grupos y Proyectos de Investigación**; **hasta 50 ejemplares**, por **un curso académico**, renovable anualmente; lo solicita la Dirección del Departamento o responsable del grupo con autorización de la Jefatura de Servicio. Deben poder prestarse a otros usuarios en un máximo de **4 días**.\n- **Préstamos de corta duración**: **por días** (24 horas, 2, 4 días y semanal) para documentos de alta circulación, generalmente manuales de la bibliografía básica; **por horas** (3, 6 horas o hasta el cierre).\n- **Préstamo intercampus**: entre bibliotecas de **distintos campus de la UGR**, para comunidad universitaria, PDI visitante y Senior UGR; **no se admiten solicitudes del mismo campus** salvo movilidad excepcional; los **manuales quedan excluidos**; solo material cuyo **periodo de préstamo supere los 7 días**; **48 horas** para la recogida y, si no se retira, **15 días de bloqueo**; excluidos los dispositivos electrónicos.\n- Otros: préstamo del material de la **Tecnoteca** (ETSIIT), de **dispositivos electrónicos**, de **verano** y **lectura de verano**."},{"h":"Renovaciones y reservas","t":"- **Renovación automática**: se realiza **automáticamente siempre que la persona no esté penalizada o el documento no esté reservado**; el sistema avisa por **correo electrónico**. Los préstamos por horas y de 1 día **no se renuevan**. Los de **2 días** se renuevan hasta un máximo de **14 días** desde el préstamo inicial; algunos de **4 días** admiten **una renovación**. En el resto, hasta **6 veces el periodo inicial** (un préstamo semanal se renueva otras 6 semanas: **7 semanas en total**).\n- La Biblioteca puede **restringir o suspender** renovaciones en periodos de exámenes o de mucha circulación. Se puede renovar en la biblioteca, por teléfono, por correo o a través de **Granatensis**.\n- **Reservas**: permiten que el sistema asigne un ejemplar de una obra cuyos ejemplares están **todos prestados**, o están en bibliotecas de otro campus. El número máximo de reservas depende del tipo de usuario. La Biblioteca avisa por correo de la disponibilidad; el **plazo para retirar el material reservado es de 2 días**."},{"h":"Sanción solidaria","t":"- Iniciativa de **UGR-Solidaria**, puesta en marcha en **octubre de 2016**, en colaboración con la **Fundación Hermanos Obreros de María** y su obra social, el **Colegio Hogar Ciudad de los Niños**.\n- Permite **anular la sanción por retraso entregando material escolar** nuevo, en proporción al número de días de retraso y a la cantidad de ejemplares. **No puede aplicarse más de dos veces a la misma persona en el curso académico.**\n- **En ningún caso se acepta dinero en efectivo.**\n- En el **Campus de Ceuta** recoge el material la Asociación Intercultura y en el de **Melilla**, el Centro Casa Hogar Divina Infantita."},{"h":"Préstamo CBUA (consorciado)","t":"- **Qué es**: servicio para pedir **ejemplares de otras bibliotecas del Consorcio de Bibliotecas Universitarias de Andalucía (CBUA)** a través de su **Catálogo Colectivo (CatCBUA)** y de **Granatensis**. Participan Almería, Córdoba, Granada, Huelva, Universidad Internacional de Andalucía, Jaén, Málaga, Pablo de Olavide, Sevilla y Cádiz (en Cádiz el préstamo CBUA se hace **a través del préstamo interbibliotecario**).\n- **Requisitos**: ser **miembro de la comunidad universitaria andaluza** (en la UGR: alumnado matriculado en el año en curso y PTGAS y PDI con relación contractual o funcionarial). **No se puede pedir si hay un ejemplar disponible en la propia universidad**, salvo que todos estén prestados o no sean prestables.\n- **Excluidos**: manuales, bibliografía básica, obras de referencia, revistas y préstamos de corta duración.\n- **Cifras**: duración **15 días**; **3 días hábiles** para la recogida; máximo **3 ejemplares**; hasta **3 renovaciones** (por 15 días, si nadie lo ha pedido).\n- **Sanciones**: por demora, **2 días naturales** de privación del préstamo local y CBUA por cada día de demora en cada documento (**1 día de gracia**); por no recoger el documento, **1 mes** de privación. **Gratuito**: lo asume el CBUA.\n- **Cómo se pide**: identificarse en Granatensis, buscar en la pestaña «Catálogo Colectivo CBUA», elegir «Disponible en otras Bibliotecas CBUA» y «Préstamo CBUA». El mensaje solo garantiza el envío; la confirmación la da la biblioteca poseedora.\n- **Visitante CBUA**: cualquier miembro de la comunidad universitaria andaluza desplazado a otra universidad andaluza puede pedir documentos disponibles **sin reserva previa**, presencialmente, con su tarjeta universitaria."},{"h":"Préstamo interbibliotecario","t":"- Servicio por el que las personas usuarias de la UGR obtienen **documentos (artículos y préstamo de libros) que no forman parte de las colecciones** de la Biblioteca de la UGR. Lo gestiona el **Servicio de Adquisiciones y Préstamo Interbibliotecario**.\n- **Solo** se pueden pedir materiales (originales o copias) **que no se encuentren en la Biblioteca Universitaria de Granada**. Son para **uso privado, docente o de investigación**.\n- **La duración la fija la biblioteca suministradora.** Las prórrogas se piden con antelación. La persona usuaria responde del material y debe reponerlo si lo pierde o deteriora."}],"clave":["Préstamo personal e intransferible; horario de lunes a viernes de 8,30 a 20,30.","Excluidos: publicaciones periódicas, obras anteriores a 1901, agotados, un solo ejemplar muy consultado, atlas y estampas.","Retraso: 2 días de suspensión por día y obra (préstamo por días); 1 día por hora (préstamo por horas).","Reservas: 2 días para recoger. Intercampus: 48 horas y 15 días de bloqueo.","CBUA: 15 días, 3 renovaciones, 3 ejemplares, 3 días hábiles de recogida, 1 día de gracia, 1 mes si no se recoge.","Préstamo semipermanente: hasta 50 ejemplares por un curso académico.","Sanción solidaria: octubre de 2016; máximo dos veces por curso; nunca dinero en efectivo."],"podcast":[{"v":"A","t":"Hola. Tema nueve del bloque específico: el servicio de préstamo de la Biblioteca. Es un tema muy numérico, así que atención a las cifras."},{"v":"B","t":"Empecemos por lo básico. El préstamo a domicilio pone el material a disposición de los usuarios por un tiempo limitado y fuera de la Biblioteca. Es personal e intransferible. El horario es de lunes a viernes, de ocho y media a ocho y media de la tarde. Y hay que estar registrado como usuario."},{"v":"A","t":"No todo se presta. Quedan excluidas las publicaciones periódicas, los manuscritos, incunables y obras anteriores a mil novecientos uno, los libros agotados y de difícil reposición, los muy consultados de los que solo hay un ejemplar, y los atlas, dibujos, estampas y grabados."},{"v":"B","t":"Sanciones. Por cada día y obra de retraso, dos días de suspensión del préstamo. Si el préstamo es por horas, un día por cada hora de retraso. Perder o deteriorar un material obliga a reponerlo o a pagar su sustitución."},{"v":"A","t":"Plazos. Hay préstamos por horas, de veinticuatro horas, de dos días, de cuatro días, semanales, de quince días y de un mes. Con renovaciones, el de dos días llega a catorce, el semanal a cuarenta y nueve y el de quince días a ciento cinco. El de un mes, a siete meses."},{"v":"B","t":"Las renovaciones son automáticas si la persona no está penalizada y nadie ha reservado el documento. Y el plazo para recoger un documento reservado es de dos días."},{"v":"A","t":"El préstamo semipermanente es para departamentos y grupos de investigación. Hasta cincuenta ejemplares, por un curso académico, renovable."},{"v":"B","t":"El préstamo intercampus es entre campus de la UGR. No se admite del mismo campus, excluye manuales, solo para material con préstamo superior a siete días, cuarenta y ocho horas para recoger, y quince días de bloqueo si no se recoge."},{"v":"A","t":"La sanción solidaria nació en octubre de dos mil dieciséis con la Fundación Hermanos Obreros de María. Se puede cambiar la sanción por material escolar, como mucho dos veces por curso, y nunca se acepta dinero."},{"v":"B","t":"Ahora el préstamo CBUA, el consorciado entre bibliotecas universitarias andaluzas. Se pide por el catálogo colectivo y por Granatensis. Duración, quince días. Tres días hábiles para recoger. Máximo tres ejemplares. Hasta tres renovaciones."},{"v":"A","t":"No se puede pedir si hay un ejemplar disponible en tu propia universidad. Quedan excluidos manuales, bibliografía básica, obras de referencia, revistas y préstamos de corta duración. Por demora, dos días naturales de bloqueo por día, con un día de gracia. Por no recoger, un mes. Y es gratuito: lo asume el CBUA."},{"v":"B","t":"Y el interbibliotecario. Solo se piden materiales que no estén en la Biblioteca de la UGR, para uso privado, docente o de investigación, y la duración la fija la biblioteca que lo presta."},{"v":"A","t":"Haz el test y repasa las cifras. Hasta la próxima."}],"preguntas":[{"q":"Según la normativa de préstamo de la Biblioteca Universitaria de Granada, el préstamo es:","o":["Personal e intransferible","Transferible a familiares","Solo transferible dentro de la misma Facultad","Libre para cualquier persona sin registro"],"c":0,"e":"Normativa del préstamo a domicilio. También art. 19.d del Reglamento.","r":"PRESTAMO_BUG art. doc"},{"q":"El horario del servicio de préstamo es, según la normativa, de:","o":["Lunes a viernes, de 8,30 a 20,30 horas","Lunes a sábado, de 9 a 21 horas","Lunes a viernes, de 9 a 14 horas","Todos los días, de 8 a 22 horas"],"c":0,"e":"Normativa del préstamo a domicilio.","r":"PRESTAMO_BUG art. doc"},{"q":"¿Cuál de los siguientes materiales queda excluido del préstamo a domicilio?","o":["Las publicaciones periódicas","Las monografías de la bibliografía recomendada","Los libros de 2020 con varios ejemplares","Los manuales de uso frecuente"],"c":0,"e":"Excluidos: publicaciones periódicas, manuscritos, incunables y obras anteriores a 1901, agotados, un solo ejemplar muy consultado, atlas, estampas, etc.","r":"PRESTAMO_BUG art. doc"},{"q":"Según la normativa de préstamo, no son prestables los manuscritos, incunables y obras publicadas con anterioridad a:","o":["1901","1800","1950","1500"],"c":0,"e":"Excepciones al préstamo de la normativa a domicilio. (El art. 27.2 del Reglamento limita la reproducción de obras publicadas entre 1500 y 1900.)","r":"PRESTAMO_BUG art. doc"},{"q":"Para utilizar el servicio de préstamo, excepto el interbibliotecario, es necesario:","o":["Estar registrado como usuario/a de la Biblioteca Universitaria de Granada","Ser profesor de la Universidad","Abonar una cuota anual","Presentar una solicitud ante el Consejo de Gobierno"],"c":0,"e":"Condiciones del préstamo.","r":"PRESTAMO_BUG art. doc"},{"q":"La devolución fuera de plazo en préstamos por días se penaliza con:","o":["Dos días de suspensión del derecho al préstamo por cada día y obra de retraso","Un día de suspensión por cada día de retraso","Una multa de 1 euro por día","Un mes de suspensión fija"],"c":0,"e":"Normativa del préstamo a domicilio.","r":"PRESTAMO_BUG art. doc"},{"q":"En los préstamos por horas, el retraso en la devolución se penaliza con:","o":["Un día de suspensión del derecho al préstamo por cada hora de retraso","Dos días por cada hora","Una semana de suspensión","Un mes de suspensión"],"c":0,"e":"Normativa del préstamo a domicilio.","r":"PRESTAMO_BUG art. doc"},{"q":"Si una persona usuaria pierde o deteriora un material prestado, según la normativa de préstamo:","o":["Debe reponerlo y, si no es posible, abonar el coste de su sustitución o reparación","Solo debe pedir disculpas","Se le sanciona con un día de bloqueo únicamente","El coste lo asume la Biblioteca"],"c":0,"e":"Normativa del préstamo a domicilio.","r":"PRESTAMO_BUG art. doc"},{"q":"Las modificaciones que introduzca la Dirección de la BUG en los tipos de usuarios, número de obras y plazos deberán ser, para ser permanentes:","o":["Ratificadas por la Comisión de Biblioteca","Aprobadas por el Claustro Universitario","Publicadas en el BOE","Aprobadas por el Consejo Social"],"c":0,"e":"Disposición final de la normativa de préstamo.","r":"PRESTAMO_BUG art. doc"},{"q":"El préstamo semipermanente permite a Departamentos y Grupos de Investigación solicitar hasta:","o":["50 ejemplares, por un curso académico","20 ejemplares, por un mes","100 ejemplares, por un año natural","10 ejemplares, por un trimestre"],"c":0,"e":"La duración es un curso académico, renovable anualmente.","r":"PRESTAMO_BUG art. doc"},{"q":"El plazo para retirar el material reservado es de:","o":["2 días","3 días hábiles","48 horas","15 días"],"c":0,"e":"Servicio de reservas. El intercampus es de 48 horas y el CBUA de 3 días hábiles.","r":"PRESTAMO_BUG art. doc"},{"q":"Según la guía de renovaciones, los préstamos por 2 días permitirán ser renovados hasta un máximo de:","o":["14 días desde la fecha inicial de préstamo","4 días","49 días","7 días"],"c":0,"e":"Renovaciones.","r":"PRESTAMO_BUG art. doc"},{"q":"Un préstamo semanal podrá renovarse, de forma general, por otras 6 semanas, con lo que el período máximo de préstamo llega a:","o":["7 semanas","6 semanas","14 días","1 mes"],"c":0,"e":"Renovaciones: hasta un máximo de 6 veces el periodo inicial (49 días).","r":"PRESTAMO_BUG art. doc"},{"q":"La renovación de un material prestado se realiza automáticamente siempre que:","o":["La persona usuaria no esté penalizada y el documento no esté reservado por otra persona","La persona usuaria lo solicite por escrito","Haya sido autorizada por la Dirección","El material sea un manual"],"c":0,"e":"Renovaciones.","r":"PRESTAMO_BUG art. doc"},{"q":"En el préstamo intercampus, el plazo para recoger el material es de:","o":["48 horas","2 días hábiles","3 días hábiles","15 días"],"c":0,"e":"Préstamo intercampus.","r":"PRESTAMO_BUG art. doc"},{"q":"El material solicitado por préstamo intercampus y no retirado en plazo supone para la persona usuaria:","o":["Una sanción de 15 días de bloqueo para el préstamo","Un mes de bloqueo","Dos días de bloqueo","Ninguna sanción"],"c":0,"e":"Préstamo intercampus.","r":"PRESTAMO_BUG art. doc"},{"q":"Según la normativa del préstamo intercampus, quedan excluidos de este préstamo:","o":["Los manuales","Las monografías","Los libros posteriores a 2000","Las tesis doctorales"],"c":0,"e":"Préstamo intercampus. También los dispositivos electrónicos.","r":"PRESTAMO_BUG art. doc"},{"q":"La sanción solidaria no puede aplicarse a la misma persona más de:","o":["Dos veces en el curso académico","Una vez en toda su vida universitaria","Tres veces en el curso académico","Cuatro veces al año"],"c":0,"e":"Sanción solidaria.","r":"PRESTAMO_BUG art. doc"},{"q":"En la sanción solidaria, la sanción por retraso se compensa:","o":["Con la entrega de material escolar, sin aceptarse nunca dinero en efectivo","Con el pago de una cantidad simbólica","Con horas de voluntariado en la Biblioteca","Con la compra de un libro"],"c":0,"e":"Sanción solidaria.","r":"PRESTAMO_BUG art. doc"},{"q":"¿Cuál es la duración del préstamo CBUA según su normativa?","o":["15 días","7 días","1 mes","45 días"],"c":0,"e":"Normativa del préstamo CBUA.","r":"PRESTAMO_BUG art. doc"},{"q":"En el préstamo CBUA, el número máximo de renovaciones por préstamo es de:","o":["3","1","5","No se permiten"],"c":0,"e":"Siempre que no haya sido solicitado por otra persona. Cada renovación es por 15 días.","r":"PRESTAMO_BUG art. doc"},{"q":"El número máximo de ejemplares que se pueden solicitar por préstamo CBUA es:","o":["3","5","10","1"],"c":0,"e":"Normativa del préstamo CBUA.","r":"PRESTAMO_BUG art. doc"},{"q":"¿De cuántos días hábiles se dispone para recoger un préstamo CBUA?","o":["3","2","5","15"],"c":0,"e":"Normativa del préstamo CBUA.","r":"PRESTAMO_BUG art. doc"},{"q":"La no recogida del documento solicitado en préstamo CBUA supone, según su normativa:","o":["La privación del préstamo local y CBUA durante 1 mes","Dos días de bloqueo","Una semana de bloqueo","Una multa económica"],"c":0,"e":"Normativa del préstamo CBUA.","r":"PRESTAMO_BUG art. doc"},{"q":"En el préstamo CBUA, la sanción por demora es de:","o":["2 días naturales de privación del préstamo local y CBUA por cada día de demora en cada documento, con 1 día de gracia","1 día por cada día de demora sin día de gracia","Un mes por cada demora","No hay sanción por demora"],"c":0,"e":"Normativa del préstamo CBUA: «Se establece 1 día de gracia».","r":"PRESTAMO_BUG art. doc"},{"q":"¿Quién asume el coste del servicio de préstamo CBUA?","o":["El CBUA; el servicio es gratuito para la persona usuaria","La persona usuaria","La biblioteca de origen del documento","La Gerencia de cada universidad"],"c":0,"e":"Normativa del préstamo CBUA.","r":"PRESTAMO_BUG art. doc"},{"q":"¿Cuál de los siguientes documentos queda excluido del préstamo CBUA?","o":["Los manuales y la bibliografía básica","Las monografías de otras disciplinas","Los libros de poesía","Los libros en inglés"],"c":0,"e":"Normativa del préstamo CBUA.","r":"PRESTAMO_BUG art. doc"},{"q":"No podrá realizarse una solicitud de préstamo CBUA si:","o":["Existe algún ejemplar disponible del documento en la universidad de la que la persona usuaria es miembro","El documento es de otra comunidad autónoma","La persona usuaria es del PTGAS","El documento está en inglés"],"c":0,"e":"Salvo que todas las copias estén prestadas o definidas como no prestables.","r":"PRESTAMO_BUG art. doc"},{"q":"¿Por qué medio se solicita el préstamo CBUA en la UGR?","o":["Por el Catálogo Colectivo CBUA (CatCBUA) y Granatensis","Solo en el mostrador de cada biblioteca","Por correo postal al CBUA","Por la sede electrónica de la UGR"],"c":0,"e":"Préstamo CBUA.","r":"PRESTAMO_BUG art. doc"},{"q":"¿Cómo se realiza el préstamo CBUA con la Universidad de Cádiz?","o":["A través del préstamo interbibliotecario","Directamente por CatCBUA","No se realiza","A través del préstamo intercampus"],"c":0,"e":"Nota de la página de préstamo CBUA.","r":"PRESTAMO_BUG art. doc"},{"q":"Según la normativa del préstamo interbibliotecario, solo pueden solicitarse materiales que:","o":["No se encuentren en la Biblioteca Universitaria de Granada","Estén en bibliotecas del mismo campus","Hayan sido publicados antes de 1901","Sean de uso exclusivo del profesorado"],"c":0,"e":"Normativa del préstamo interbibliotecario.","r":"PRESTAMO_BUG art. doc"},{"q":"La duración del préstamo interbibliotecario es:","o":["La que establezca la biblioteca suministradora","Siempre de 15 días","La que fije la Dirección de la BUG","De un mes improrrogable"],"c":0,"e":"Normativa del préstamo interbibliotecario.","r":"PRESTAMO_BUG art. doc"},{"q":"Según el artículo 25 del Reglamento, ¿qué proporciona la Biblioteca Universitaria mediante préstamo interbibliotecario?","o":["Los documentos no disponibles dentro de sus propios fondos","Los documentos prestables de otros campus de la UGR","Los documentos de la colección del Hospital Real","Las publicaciones periódicas de uso diario"],"c":0,"e":"Art. 25 del Reglamento de la Biblioteca.","r":"REGLAMENTO_BUG art. 25"}],"mp3":true},"e11":{"id":"e11","bloque":"Específico","num":11,"titulo":"Ciencia Abierta y repositorios institucionales","alcance":"Ciencia Abierta y repositorios institucionales. Digibug: repositorio institucional de la Universidad de Granada. Portal de investigación.","fuentes":["Política institucional de acceso abierto de la Universidad de Granada (ACG112/16, Consejo de Gobierno de 26/10/2016, BOUGR n.º 112)","Política de preservación del Repositorio Digibug (ACG173/11, Consejo de Gobierno de 29/10/2021, BOUGR n.º 173)","Páginas de la Biblioteca de la UGR sobre Digibug, Servicio de Documentación Científica y Distintivo FECYT 2025 (biblioteca.ugr.es)","Ley Orgánica 2/2023 (LOSU), art. 12 (Ciencia Abierta)","Creative Commons, Atribución 4.0 Internacional (resumen oficial en español)"],"peso":"alto","notas":["El examen de abril de 2025 preguntó sobre autoarchivo en Digibug, las licencias Creative Commons («By») y las herramientas para consultar políticas de editoriales. Estudia las premisas de la Política de acceso abierto y las licencias CC.","La Política institucional de acceso abierto es de 2016; Digibug nació en 2009; la Política de preservación es de 2021. No mezcles las fechas.","El texto de la Política de acceso abierto de 2016 viene de un PDF escaneado que hemos leído con OCR: las frases clave están comprobadas, pero si algo te suena distinto, mira el original en el BOUGR n.º 112.","La herramienta que sustituyó a SHERPA/RoMEO, SHERPA/Juliet y SHERPA/FACT es Open Policy Finder, de Jisc (desde noviembre de 2024), según Jisc y varias universidades. Esa pregunta salió en 2025; no tenemos documento oficial de la UGR sobre ella, así que no hay test.","Las cifras de Digibug (documentos, visitas, ranking) cambian cada año. Se dan como ejemplo; lo que se pregunta es más estable: fechas, premisas, responsables y características."],"apuntes":[{"h":"Ciencia Abierta y acceso abierto: ideas básicas","t":"- **Ciencia Abierta** (LOSU, art. 12): el conocimiento científico se considera un **bien común**; las Administraciones y las universidades promueven la **Ciencia Abierta** mediante el **acceso abierto a publicaciones, datos, códigos y metodologías**. El PDI debe **depositar la versión final aceptada para publicación y los datos asociados en repositorios institucionales o temáticos de acceso abierto**, de forma simultánea a la publicación.\n- **Repositorio institucional**: herramienta que permite **almacenar y conservar la producción científica** generada por los docentes e investigadores de una institución, **haciéndola visible a nivel mundial**.\n- **Autoarchivo**: el propio investigador deposita sus documentos en el repositorio.\n- **Marco legal español citado por la UGR**: **Ley 14/2011 de la Ciencia, la Tecnología y la Innovación, art. 37 (difusión en acceso abierto)**: el personal investigador cuya actividad esté financiada mayoritariamente con fondos de los Presupuestos Generales del Estado hará pública una versión digital de la versión final aceptada para publicación **no más tarde de doce meses después de la fecha oficial de publicación**; y **Real Decreto 99/2011, art. 14.5**: aprobada la tesis, la universidad se ocupa de su **archivo en formato electrónico abierto en un repositorio institucional**."},{"h":"Política institucional de acceso abierto de la UGR (2016)","t":"- **ACG112/16**, aprobada por el **Consejo de Gobierno el 26 de octubre de 2016** y publicada en el **BOUGR n.º 112 (9 de noviembre de 2016)**.\n- **Antecedentes**: la UGR se adhirió a la **Declaración de Berlín (2003) el 21 de noviembre de 2010**; cuenta con el proyecto Digibug **desde 2005** (depósito electrónico de tesis por Acuerdo Institucional entre la Comisión de Doctorado, el Vicerrectorado de Investigación, la Biblioteca y el Servicio de Publicaciones); y el repositorio **Digibug comenzó en 2009**.\n- **Premisas**: **1)** el PDI cuenta con Digibug para **depositar sus publicaciones científicas y académicas**; **2)** el depósito **tendrá en cuenta las políticas editoriales**, depositando **la versión permitida por el editor**, y respetará los derechos de autor y de propiedad intelectual; **3)** **tesis doctorales** según el **Acuerdo Institucional de 2005 y el RD 99/2011**; **4)** los **Trabajos de Fin de Grado y Máster** podrán depositarse **según criterios de calidad**.\n- **Política** (8 puntos): promover el acceso electrónico abierto de la producción científica, educativa y cultural; **promover y recomendar** a profesores e investigadores que depositen en Digibug; comunicar y difundir maximizando visibilidad e impacto; seguir las normativas y recomendaciones nacionales e internacionales; **garantizar que todos los contenidos están protegidos por derecho de autor y bajo licencias Creative Commons**; **preservación en el tiempo** de los archivos digitales; coordinación con la **Agencia Andaluza del Conocimiento**; y favorecer el acceso de la sociedad a la ciencia.\n- **Marco europeo y universitario**: Horizonte 2020 y **OpenAIRE**; Declaración REBIUN/CRUE (2004); conclusiones de la XXIII Asamblea de REBIUN (Santander, 2015)."},{"h":"Digibug, el repositorio institucional de la UGR","t":"- **Digibug** es el **Repositorio Institucional de la Universidad de Granada**. **Puesto en marcha en octubre de 2009**, desarrollado con el **software libre DSpace**.\n- **Objetivo**: **aumentar la visibilidad, accesibilidad e impacto** de sus contenidos, en consonancia con el compromiso institucional de la UGR con el acceso y la ciencia abierta (2010).\n- **Razones para usarlo**: visibilidad internacional; citas visibles en **Google Scholar**; distribución rápida de resultados; acceso organizado; **una URL permanente** para citar; **preservación en el tiempo**; contenidos **protegidos por derecho de autor y bajo licencias Creative Commons**.\n- **Perfiles de autor UGR** (octubre de 2022): cada investigador con producción en Digibug tiene una página de perfil con enlaces a sus identificadores (**ORCID, ResearcherID, Google Scholar**) y estadísticas de **visitas y descargas**.\n- **Distintivo de Calidad de los Repositorios de Acceso Abierto FECYT 2025** (octubre de 2025). En 2024 albergaba unos **90.000 documentos en acceso abierto**; en el ranking (mayo de 2025), puesto 12 entre 192 repositorios españoles.\n- **Quién lo gestiona**: el **Servicio de Documentación Científica** de la Biblioteca (Reglamento, art. 5.3), con apoyo técnico del **CSIRC**."},{"h":"Servicio de Documentación Científica y Portal de la Investigación","t":"- El **Servicio de documentación científica** es el responsable del mantenimiento y desarrollo de los aspectos técnicos de la **difusión y visibilidad de la producción científica, cultural e institucional** de la UGR y de la **coordinación, normalización y seguimiento de los procesos de gestión de contenidos de Digibug**.\n- **Tareas**: gestionar el conocimiento en acceso abierto; **asesorar sobre las políticas de acceso abierto**; fomentar el uso del repositorio; **apoyar a la investigación gestionando ORCID, perfiles de investigadores y asesorando en evaluación científica**; asesorar sobre criterios de calidad de las revistas científicas de la UGR; y formación permanente.\n- **Portal de la Investigación**: lo gestiona este Servicio y muestra los **resultados de la actividad investigadora del PDI** de la UGR. **Recolecta automáticamente** publicaciones científicas, proyectos, tesis doctorales dirigidas y patentes registradas procedentes de **Dialnet, Scopus y Web of Science**. Es un sistema de gestión de la información de investigación (**CRIS**): da soporte al PDI y a los órganos de gestión y es una ventana a la sociedad."},{"h":"Política de preservación de Digibug (2021)","t":"- **ACG173/11**, aprobada por el **Consejo de Gobierno el 29 de octubre de 2021** y publicada en el **BOUGR n.º 173 (8 de noviembre de 2021)**.\n- **Responsables**: el **Servicio de Biblioteca** y el **Centro de Servicios Informáticos y Redes de Comunicaciones (CSIRC)**. La **Biblioteca** localiza, alberga, difunde y promueve los contenidos y crea y mantiene los **metadatos** y la documentación de **licencias**; el **CSIRC** instala y mantiene el **hardware y el sistema operativo**, monitoriza el software y hardware y asegura la conectividad y la preservación digital.\n- **Objetivos**: convertir el formato de los materiales si es necesario; garantizar la **sostenibilidad** de Digibug; documentar políticas y procedimientos; **mantener identificadores permanentes y únicos**; dar acceso y preservar los documentos a lo largo del tiempo.\n- **Sostenibilidad técnica**: describir los contenidos con **metadatos administrativos, descriptivos, estructurales y de preservación**; **priorizar los formatos abiertos**; seguir el modelo **OAIS (Open Archival Information System, ISO 14721)**; garantizar la **interoperabilidad**; promover el **software libre**.\n- **Análisis de riesgos**: seguridad del edificio, hardware (copias de seguridad en disco y en cinta, control de versiones) y software (contrato anual de mantenimiento).\n- **Seguimiento**: el Servicio revisa periódicamente los contenidos y se apoya en los informes de **RECOLECTA** (plataforma de la **FECYT** que agrupa a los repositorios científicos nacionales) y **OpenAIRE**."},{"h":"Licencias Creative Commons","t":"- La UGR garantiza que **todos los contenidos depositados están protegidos por derecho de autor y bajo licencias Creative Commons**.\n- **CC BY (Atribución 4.0)**: permite **compartir** (copiar y redistribuir en cualquier medio o formato, incluso comercialmente) y **adaptar** (remezclar, transformar y crear a partir del material, incluso comercialmente), con la condición de la **Atribución**: **dar crédito de manera adecuada, enlazar a la licencia e indicar si se han realizado cambios**, sin sugerir que el licenciante apoya el uso.\n- «**By**» significa, por tanto, **reconocimiento de autoría**."}],"clave":["Política de acceso abierto: ACG112/16, 26/10/2016, BOUGR 112. Digibug: octubre de 2009. Política de preservación: ACG173/11, 29/10/2021, BOUGR 173.","Premisas: PDI deposita en Digibug; versión permitida por el editor; tesis (Acuerdo 2005 y RD 99/2011); TFG y TFM según criterios de calidad.","Digibug: software DSpace; perfiles de autor con ORCID, ResearcherID y Google Scholar; distintivo FECYT 2025.","Servicio de Documentación Científica: gestiona Digibug, ORCID, perfiles y el Portal de la Investigación (CRIS; Dialnet, Scopus, Web of Science).","Preservación: Servicio de Biblioteca + CSIRC; OAIS (ISO 14721); formatos abiertos; identificadores permanentes; RECOLECTA y OpenAIRE.","Ley 14/2011 art. 37: versión final en abierto como máximo 12 meses tras la publicación. CC BY = atribución."],"podcast":[{"v":"A","t":"Hola. Tema once del bloque específico: Ciencia Abierta y repositorios institucionales, con Digibug como protagonista."},{"v":"B","t":"Un repositorio institucional almacena y conserva la producción científica de una institución y la hace visible en todo el mundo. En la UGR es Digibug, que se puso en marcha en octubre de dos mil nueve y está desarrollado con el software libre DSpace."},{"v":"A","t":"La Política institucional de acceso abierto la aprobó el Consejo de Gobierno el veintiséis de octubre de dos mil dieciséis, y salió en el boletín número ciento doce. La UGR se adhirió a la Declaración de Berlín en dos mil diez y tiene el proyecto Digibug desde dos mil cinco."},{"v":"B","t":"Cuatro premisas. Uno: el profesorado y personal investigador cuenta con Digibug para depositar sus publicaciones. Dos: el depósito tiene en cuenta las políticas editoriales, y se deposita la versión permitida por el editor. Tres: las tesis doctorales, según el Acuerdo Institucional de dos mil cinco y el Real Decreto noventa y nueve de dos mil once. Cuatro: los trabajos de fin de grado y máster, según criterios de calidad."},{"v":"A","t":"Y la política: promover y recomendar el depósito, maximizar la visibilidad, seguir las recomendaciones nacionales e internacionales, garantizar que todo está protegido por derechos de autor y bajo licencias Creative Commons, y preservar los archivos digitales."},{"v":"B","t":"La licencia CC BY, de atribución, permite compartir y adaptar, incluso con fines comerciales, siempre que des crédito de manera adecuada, enlaces a la licencia e indiques si has hecho cambios."},{"v":"A","t":"En el marco legal: la Ley catorce de dos mil once de la Ciencia, artículo treinta y siete: la versión final aceptada debe hacerse pública en abierto no más tarde de doce meses después de la publicación. Y la LOSU, artículo doce, considera el conocimiento científico un bien común y obliga a depositar la versión final y los datos en repositorios abiertos."},{"v":"B","t":"Sobre Digibug: los investigadores tienen un perfil de autor, con enlaces a ORCID, ResearcherID y Google Scholar y estadísticas de visitas y descargas. En octubre de dos mil veinticinco recibió el Distintivo de Calidad de los Repositorios de Acceso Abierto de la FECYT."},{"v":"A","t":"Lo gestiona el Servicio de Documentación Científica de la Biblioteca. Asesora sobre políticas de acceso abierto, gestiona ORCID y perfiles de investigadores y asesora sobre evaluación científica. Y gestiona el Portal de la Investigación, que recoge automáticamente publicaciones, proyectos, tesis y patentes de Dialnet, Scopus y Web of Science."},{"v":"B","t":"La Política de preservación de Digibug es de dos mil veintiuno. La aplican el Servicio de Biblioteca y el CSIRC. La Biblioteca se ocupa de contenidos y metadatos; el CSIRC, del hardware y del software. Sigue el modelo OAIS, prioriza formatos abiertos y mantiene identificadores permanentes. Y se apoya en los informes de RECOLECTA y OpenAIRE."},{"v":"A","t":"Haz el test. Hasta la próxima."}],"preguntas":[{"q":"¿Cuándo aprobó el Consejo de Gobierno de la UGR la Política institucional de acceso abierto (ACG112/16)?","o":["El 26 de octubre de 2016","El 29 de octubre de 2021","El 25 de febrero de 2022","El 16 de junio de 2009"],"c":0,"e":"Publicada en el BOUGR n.º 112, de 9 de noviembre de 2016.","r":"DIGIBUG_ACCESO_ABIERTO art. doc"},{"q":"Según la Política de acceso abierto de la UGR, ¿a qué declaración se adhirió la UGR el 21 de noviembre de 2010?","o":["La Declaración de Berlín (2003)","La Declaración de Bolonia","La Declaración de Budapest","La Declaración de Salamanca"],"c":0,"e":"Apoyo al paradigma Open Access.","r":"DIGIBUG_ACCESO_ABIERTO art. doc"},{"q":"Según la Política institucional de acceso abierto, el depósito de los documentos publicados tendrá en cuenta:","o":["Las políticas editoriales, depositando la versión permitida por el editor","Solo la voluntad del autor","Únicamente la versión del editor en PDF","El criterio de la Dirección de la Biblioteca"],"c":0,"e":"Premisa 2 de la Política (2016).","r":"DIGIBUG_ACCESO_ABIERTO art. doc"},{"q":"Según la Política institucional de acceso abierto, los Trabajos de Fin de Grado y Máster:","o":["Podrán ser depositados en Digibug, según criterios de calidad","Deben depositarse obligatoriamente todos","No pueden depositarse","Solo se depositan si lo decide la Comisión de Doctorado"],"c":0,"e":"Premisa 4 de la Política (2016).","r":"DIGIBUG_ACCESO_ABIERTO art. doc"},{"q":"Según la Política institucional de acceso abierto, el depósito de las tesis doctorales se rige por:","o":["El Acuerdo Institucional de 2005 y el Real Decreto 99/2011","La Ley Orgánica 2/2023 únicamente","El Reglamento de la Biblioteca","El Código Ético de la UGR"],"c":0,"e":"Premisa 3 de la Política (2016).","r":"DIGIBUG_ACCESO_ABIERTO art. doc"},{"q":"Según la Política institucional de acceso abierto, la UGR se compromete a garantizar que todos los contenidos depositados están:","o":["Protegidos por derecho de autor y bajo licencias Creative Commons","En dominio público sin licencia","Bajo copyright exclusivo de la editorial","Sometidos a licencia comercial restringida"],"c":0,"e":"Punto 5 de la política institucional.","r":"DIGIBUG_ACCESO_ABIERTO art. doc"},{"q":"¿Cuándo se puso en marcha Digibug, el Repositorio Institucional de la UGR?","o":["En octubre de 2009","En 2005","En 2016","En 2018"],"c":0,"e":"Desarrollado con el software libre DSpace.","r":"DIGIBUG_WEB art. doc"},{"q":"¿Con qué software libre está desarrollado Digibug?","o":["DSpace","Koha","Evergreen","Alma"],"c":0,"e":"Koha y Evergreen son SIGB libres; Alma es de Ex Libris.","r":"DIGIBUG_WEB art. doc"},{"q":"Entre las razones para utilizar Digibug figura:","o":["Una URL permanente para citar sus trabajos en cualquier sitio","Cobro de derechos por cada descarga","Cesión de la propiedad intelectual a la UGR","Publicación automática en revistas de impacto"],"c":0,"e":"También visibilidad internacional, citas en Google Scholar, preservación y licencias Creative Commons.","r":"DIGIBUG_WEB art. doc"},{"q":"Los perfiles de autor UGR de Digibug incluyen enlaces a identificadores como:","o":["ORCID, ResearcherID y Google Scholar","DNI, ISBN y ISSN","DOI, ISBN y URN","Scopus, Dialnet y Latindex"],"c":0,"e":"Funcionalidad añadida en octubre de 2022.","r":"DIGIBUG_WEB art. doc"},{"q":"¿Qué distintivo obtuvo Digibug en octubre de 2025?","o":["Distintivo de Calidad de los Repositorios de Acceso Abierto FECYT 2025","Sello de Excelencia EFQM 500+","Premio Iberoamericano de la Calidad","Sello CBUA de repositorios"],"c":0,"e":"Noticia de la Biblioteca de 17/10/2025.","r":"DIGIBUG_WEB art. doc"},{"q":"El Servicio de documentación científica de la Biblioteca es responsable, entre otras tareas, de:","o":["Apoyar a la investigación gestionando ORCID, perfiles de investigadores y asesorando en evaluación científica","Gestionar las adquisiciones de monografías","Mantener el sistema integrado de gestión bibliotecaria","Custodiar el fondo histórico"],"c":0,"e":"Servicio de documentación científica (Reglamento, art. 5.3).","r":"DIGIBUG_WEB art. doc"},{"q":"El Portal de la Investigación de la UGR, gestionado por el Servicio de Documentación Científica, recolecta automáticamente documentos procedentes de:","o":["Dialnet, Scopus y Web of Science","Google Scholar, ResearchGate y Academia","Granatensis, REBIUN y CBUA","Digibug, Latindex y DOAJ"],"c":0,"e":"Publicaciones científicas, proyectos, tesis doctorales dirigidas y patentes registradas.","r":"DIGIBUG_WEB art. doc"},{"q":"El sistema de gestión de la información que da soporte al Portal de la Investigación se denomina:","o":["CRIS","SIGB","OPAC","CMS"],"c":0,"e":"CRIS: Current Research Information System.","r":"DIGIBUG_WEB art. doc"},{"q":"¿Cuándo aprobó el Consejo de Gobierno la Política de Preservación del Repositorio Digibug (ACG173/11)?","o":["El 29 de octubre de 2021","El 26 de octubre de 2016","El 25 de febrero de 2022","El 23 de julio de 2020"],"c":0,"e":"Publicada en el BOUGR n.º 173, de 8 de noviembre de 2021.","r":"DIGIBUG_PRESERVACION art. doc"},{"q":"¿Quiénes son los responsables directos de la preservación del contenido digital de Digibug?","o":["El Servicio de Biblioteca y el CSIRC","El Vicerrectorado de Investigación y la Gerencia","La Secretaría General y el Archivo Universitario","El Consejo Social y la Defensoría"],"c":0,"e":"Política de preservación de Digibug.","r":"DIGIBUG_PRESERVACION art. doc"},{"q":"Según la Política de preservación de Digibug, ¿quién es responsable de la instalación del hardware y del sistema operativo?","o":["El CSIRC","El Servicio de Biblioteca","El Servicio de Publicaciones","La Gerencia"],"c":0,"e":"La Biblioteca se encarga de los metadatos, los ficheros y las licencias.","r":"DIGIBUG_PRESERVACION art. doc"},{"q":"¿Qué modelo de referencia sigue la política de preservación de Digibug?","o":["Open Archival Information System (OAIS)","Dublin Core","ISBD","MARC 21"],"c":0,"e":"Norma OAIS/ISO 14721.","r":"DIGIBUG_PRESERVACION art. doc"},{"q":"¿Qué priorizará el Servicio de Biblioteca, según la política de preservación, para prevenir la obsolescencia?","o":["Los formatos abiertos y ampliamente aceptados","Los formatos propietarios de las editoriales","Los formatos exclusivamente impresos","Los formatos comprimidos cifrados"],"c":0,"e":"Sostenibilidad técnica.","r":"DIGIBUG_PRESERVACION art. doc"},{"q":"RECOLECTA es, según la política de preservación de Digibug:","o":["La plataforma de la FECYT que agrupa a todos los repositorios científicos nacionales","Un repositorio europeo de datos de investigación","El portal de la investigación de la UGR","Un gestor bibliográfico"],"c":0,"e":"OpenAIRE es la infraestructura europea para las políticas de acceso abierto.","r":"DIGIBUG_PRESERVACION art. doc"},{"q":"Según la Ley 14/2011, art. 37 (citada por la Política de la UGR), el personal de investigación con financiación mayoritaria de los Presupuestos Generales del Estado hará pública la versión final aceptada para publicación como máximo:","o":["Doce meses después de la fecha oficial de publicación","Seis meses antes de la publicación","Dos años después de la publicación","En el momento de la solicitud del proyecto"],"c":0,"e":"Art. 37.2 de la Ley 14/2011.","r":"DIGIBUG_ACCESO_ABIERTO art. doc"},{"q":"Según el artículo 12.1 de la LOSU, el conocimiento científico tendrá la consideración de:","o":["Un bien común","Un bien patrimonial de la universidad","Un secreto industrial","Un servicio comercial"],"c":0,"e":"Art. 12.1 LOSU. Las Administraciones y las universidades promueven la Ciencia Abierta.","r":"LOSU art. 12"},{"q":"Según el artículo 12.2 de la LOSU, el PDI deberá depositar una copia de la versión final aceptada para publicación y los datos asociados en repositorios institucionales o temáticos de acceso abierto:","o":["De forma simultánea a la fecha de publicación","Doce meses después de la publicación","Antes de enviar el artículo a la revista","Solo si la editorial lo permite en un año"],"c":0,"e":"Art. 12.2 LOSU.","r":"LOSU art. 12"},{"q":"En la licencia Creative Commons Atribución 4.0 («By»), la condición de atribución exige:","o":["Dar crédito de manera adecuada, enlazar a la licencia e indicar si se han realizado cambios","Pagar un canon al autor","No permitir usos comerciales","Compartir la obra derivada con la misma licencia"],"c":0,"e":"CC BY permite compartir y adaptar, incluso con fines comerciales, con atribución.","r":"CC_BY art. doc"}],"mp3":true},"e12":{"id":"e12","bloque":"Específico","num":12,"titulo":"Calidad en la Biblioteca","alcance":"El Sistema Universitario de Gestión Integrada (SUGI): política y manual. El sistema de gestión de la calidad en la Biblioteca de la Universidad de Granada: procedimientos. Cartas de servicios. El modelo de excelencia EFQM.","fuentes":["Sitio del SUGI en la UGR: Gerencia (presentación de 5/3/2026 y preguntas frecuentes), Servicio de Salud y Prevención y Vicerrectorado de Calidad (política de calidad)","Páginas de la Biblioteca de la UGR sobre Evaluación y Sello EFQM (biblioteca.ugr.es) y «Reconocimientos y menciones de calidad» (calidad.ugr.es)","Cartas de Servicios de la UGR (información de la UGR y resultados 2024-2025)","Reglamento de la Biblioteca Universitaria (arts. 3.f, 8.3.k y 17)"],"peso":"alto","notas":["Novedad importante: el SUGI (Sistema Universitario de Gestión Integrada) es muy reciente. Se presentó el 5 de marzo de 2026 y está en vigor desde el 1 de enero de 2026. Si usas apuntes anteriores, hablarán de sistemas separados de calidad, medio ambiente y prevención: ya no son así.","El SUGI integra tres normas ISO: 9001 (calidad), 14001 (medio ambiente) y 45001 (seguridad y salud en el trabajo). Aprende cuál es cuál.","Cifras del SUGI que se preguntan bien: de más de 40 procedimientos generales a 10; de 6 auditorías al año a 2 (una interna y otra externa); política aprobada por el Rector el 22 de diciembre de 2025.","El mapa de procesos y los procedimientos internos de la Biblioteca no están publicados en un documento que podamos citar. En el examen de 2025 salió una pregunta sobre el mapa de procesos de la UGR (ISO 9001:2015): repasa el SUGI en la web de Gerencia y revisa si hay un documento actualizado.","Los niveles del modelo EFQM (400+, 500+, 600+) y los sellos de la Biblioteca (500+ desde 2012; 600 en 2021-2024 y 2024-2027) sí están en la web de la Biblioteca. El certificado ISO 9001 que consta en esa web iba hasta el 28/08/2026: comprueba si se ha renovado."],"apuntes":[{"h":"El SUGI: qué es y por qué existe","t":"- El **Sistema Universitario de Gestión Integrada (SUGI)** es el sistema de gestión de la UGR. **Integra los dos sistemas que coexistían** y unifica la gestión de la **calidad (ISO 9001)**, el **medio ambiente (ISO 14001)** y la **seguridad y salud en el trabajo (ISO 45001)** en una estructura única.\n- **Presentación oficial**: **5 de marzo de 2026**. **En vigor desde el 1 de enero de 2026**.\n- **Novedades**: **de más de 40 procedimientos generales a 10**; el número de **auditorías anuales pasa de seis a dos (una interna y otra externa)**; **auditorías 360º** hechas por un **equipo auditor multinorma**; **una única plataforma documental (PDCA)**; una **web independiente** del SUGI; los registros de prevención siguen en **INTEGRA**. La codificación de los nuevos procedimientos comienza por **SUGI-XX-XXX**.\n- **Política**: la **Política de Gestión de la Calidad, de Medio Ambiente y de Seguridad y Salud en el Trabajo de la UGR** unifica las políticas anteriores; **aprobada por el Rector el 22 de diciembre de 2025**. También se actualizó el **Manual del SUGI** (ISO 9001, 14001 y 45001).\n- La UGR se presenta como **la primera universidad española con un único sistema para las tres normas**.\n- **Quién está detrás**: lo lidera el **Rectorado, la Gerencia y la Dirección del SUGI**; su gestión técnica diaria corresponde a la **Comisión Técnica del SUGI (CTSUGI)** y a la **Secretaría Técnica del SUGI (STSUGI)**, con tres unidades de apoyo: la **Unidad de Calidad** (ISO 9001), la **Unidad de Calidad Ambiental** (ISO 14001) y el **Servicio de Salud y Prevención** (ISO 45001).\n- **Quejas, sugerencias y felicitaciones**: se presentan mediante el **procedimiento SUGI-10**, disponible en la Sede Electrónica de la UGR."},{"h":"La política de calidad de la UGR","t":"- La política responde al **compromiso de la UGR con la excelencia** y a su apuesta por una **cultura de calidad** que asegure la **responsabilidad, la confianza, la transparencia, el control y la mejora continua**.\n- **Marco**: las directrices del **Espacio Europeo de Educación Superior**, las pautas de organismos nacionales y regionales y el **Plan Estratégico 2031** de la UGR.\n- **Ejes vertebradores de la calidad**: libertad e integridad académica, autonomía universitaria, perspectiva de género, atención a la diversidad, prácticas inclusivas y equitativas, desarrollo sostenible, protección del medio ambiente, promoción de la salud en el trabajo y prevención de accidentes, transparencia, corresponsabilidad y excelencia.\n- **Grandes proyectos** de la próxima década: UGR-DONES, UGR-AI, UGR-Sostenibilidad, Horizonte V Centenario y la Alianza ARQUS.\n- **Primer objetivo**: promover la **cultura de la calidad y mejora continua** en el funcionamiento y la gestión académica y administrativa."},{"h":"Calidad en la Biblioteca: ISO 9001 y Reglamento","t":"- **Reglamento**: entre las funciones de la Biblioteca está **promover estrategias de mejora continua** en consonancia con las políticas de calidad de la UGR (art. 3.f); la **Dirección lidera los procesos de calidad** (art. 8.3.k); y la Biblioteca cumple los **compromisos de calidad que aporta a la Carta de Servicios de la UGR** (art. 17).\n- **ISO 9001:2015**: todas las unidades administrativas y servicios de gestión de la UGR están certificadas, **incluida la Biblioteca Universitaria**. La web de la Biblioteca indicaba un certificado **en vigor del 29/08/2023 al 28/08/2026**.\n- Cada punto de servicio puede dictar normas complementarias (art. 18) y las quejas y sugerencias se recogen por cualquier medio (art. 16)."},{"h":"El modelo de excelencia EFQM y los sellos de la Biblioteca","t":"- El **Sello de Excelencia Europea** lo otorgan la **Fundación Europea para la Gestión de la Calidad (EFQM)** y el **Club de Excelencia en la Gestión**. La web de la Biblioteca explica que hay **cuatro niveles de excelencia, de los cuales el 500+ es el superior** (en los años en que se concedió el sello).\n- **Historia en la Biblioteca**: autoevaluación de 2004; **Sello 400+ (2010)**; **Sello 500+ (2012)**, siendo la Biblioteca **el primer servicio de la UGR** en conseguirlo y **la segunda biblioteca universitaria de España**; renovaciones en **2014**, **2016** (la **segunda** revalidación) y **2018**. En 2018 la puntuación fue de **600-649**, que da el distintivo de **«Embajadores de Excelencia»**.\n- **Sello de Excelencia Europea 600**: **2021-2024** y **2024-2027** (memorias de solicitud de 2021 y 2024).\n- **Premio Iberoamericano de la Calidad**: la UGR destaca que la Biblioteca cuenta con el **Premio Plata Iberoamericano de la Calidad** (postulación de 2013) y con el **Sello EFQM +500**."},{"h":"Cartas de servicios","t":"- **Qué es**: un documento que busca **acercar los servicios públicos a la ciudadanía**, explicando **los servicios ofrecidos, los derechos de los usuarios y los niveles de calidad alcanzados**. Esos niveles se concretan en **compromisos**.\n- **Quién las aprueba**: las Cartas de Servicios las **aprueba el Consejo de Gobierno de la UGR** y se **publican en el Boletín Oficial de la Universidad de Granada**.\n- **Protocolo**: el **Protocolo de Cartas de Servicio en la UGR** regula la sistemática de **elaboración, aprobación y seguimiento**.\n- **Periodo 2020/2021**: aprobadas por el **Consejo de Gobierno de 25 de noviembre de 2019**. Son siete: **Académicos al Estudiantado; Académicos y de Investigación al PDI; Universitaria de Servicios Institucionales; Internos al Personal; Sociales al Estudiantado; Sociales al Personal; y a Agentes Externos**.\n- **Estructura**: datos de carácter general (identificativos, misión de los servicios de apoyo a la comunidad universitaria, identificación de la unidad responsable…) y, después, servicios, derechos y compromisos de calidad con sus indicadores.\n- **Seguimiento**: se hace periódicamente para reflexionar no solo sobre el **cumplimiento** de los estándares sino sobre su **impacto en los grupos de interés**.\n- **Resultados**: en 2024, **92 compromisos de los 92** se cumplieron en el conjunto de cartas; en 2025, **95 compromisos**, con **95,23 %** en las cartas institucionales (20 de 21) y **83,33 %** en la de servicios sociales al personal (5 de 6)."}],"clave":["SUGI = ISO 9001 (calidad) + ISO 14001 (medio ambiente) + ISO 45001 (seguridad y salud). Presentado el 5/3/2026; en vigor desde el 1/1/2026.","De más de 40 procedimientos generales a 10; auditorías de 6 a 2 (una interna y una externa). Política aprobada por el Rector el 22/12/2025.","Gestión técnica: CTSUGI y STSUGI; unidades: Calidad (9001), Calidad Ambiental (14001) y Salud y Prevención (45001). Quejas: SUGI-10.","Biblioteca: EFQM 400+ (2010), 500+ (2012; primera de la UGR y segunda biblioteca universitaria de España), renovaciones 2014, 2016 y 2018 (600-649: Embajadores de Excelencia). Sello 600: 2021-2024 y 2024-2027.","Cartas de servicios: aprobadas por el Consejo de Gobierno y publicadas en el BOUGR; periodo 2020/2021 aprobado el 25/11/2019; siete cartas.","Reglamento: la Dirección lidera los procesos de calidad (art. 8.3.k); la Biblioteca cumple los compromisos de calidad de la Carta de Servicios (art. 17)."],"podcast":[{"v":"A","t":"Hola. Tema doce del bloque específico: la calidad en la Biblioteca. Y empezamos con una novedad: el SUGI."},{"v":"B","t":"El Sistema Universitario de Gestión Integrada integra los sistemas que coexistían hasta ahora y unifica tres normas ISO: la nueve mil uno de calidad, la catorce mil uno de medio ambiente y la cuarenta y cinco mil uno de seguridad y salud en el trabajo."},{"v":"A","t":"Se presentó oficialmente el cinco de marzo de dos mil veintiséis y está en vigor desde el uno de enero de dos mil veintiséis. La política la aprobó el Rector el veintidós de diciembre de dos mil veinticinco."},{"v":"B","t":"Las cifras de la simplificación: de más de cuarenta procedimientos generales a diez, y de seis auditorías anuales a solo dos, una interna y otra externa. Las auditorías son multinorma, de trescientos sesenta grados."},{"v":"A","t":"Lo lideran el Rectorado, la Gerencia y la Dirección del SUGI. La gestión técnica la llevan la Comisión Técnica del SUGI y la Secretaría Técnica, con tres unidades: la Unidad de Calidad para la ISO nueve mil uno, la Unidad de Calidad Ambiental para la catorce mil uno y el Servicio de Salud y Prevención para la cuarenta y cinco mil uno. Y las quejas, sugerencias y felicitaciones van por el procedimiento SUGI diez."},{"v":"B","t":"La política de calidad habla de una cultura de calidad que asegure responsabilidad, confianza, transparencia, control y mejora continua, con el Plan Estratégico dos mil treinta y uno como marco."},{"v":"A","t":"En la Biblioteca. El Reglamento dice que la Dirección lidera los procesos de calidad, y que la Biblioteca cumple los compromisos de calidad que aporta a la Carta de Servicios de la UGR. Y todas las unidades administrativas de la UGR, incluida la Biblioteca, están certificadas con la ISO nueve mil uno dos mil quince."},{"v":"B","t":"El modelo EFQM. La Biblioteca consiguió el Sello de Excelencia Europea quinientos más en dos mil doce: fue el primer servicio de la UGR en lograrlo y la segunda biblioteca universitaria de España. Lo renovó en dos mil catorce, dos mil dieciséis y dos mil dieciocho. En dos mil dieciocho la puntuación estuvo entre seiscientos y seiscientos cuarenta y nueve, lo que da el distintivo de Embajadores de Excelencia."},{"v":"A","t":"Después vinieron los Sellos de Excelencia Europea seiscientos: dos mil veintiuno a dos mil veinticuatro, y dos mil veinticuatro a dos mil veintisiete. Y la UGR destaca que la Biblioteca tiene el Premio Plata Iberoamericano de la Calidad."},{"v":"B","t":"Las cartas de servicios. Son documentos que acercan los servicios públicos a la ciudadanía explicando los servicios ofrecidos, los derechos de los usuarios y los niveles de calidad alcanzados, con compromisos. Las aprueba el Consejo de Gobierno y se publican en el Boletín Oficial de la Universidad."},{"v":"A","t":"Las del periodo dos mil veinte, dos mil veintiuno se aprobaron el veinticinco de noviembre de dos mil diecinueve. Son siete: académicos al estudiantado, académicos y de investigación al PDI, institucional, internos al personal, sociales al estudiantado, sociales al personal y a agentes externos."},{"v":"B","t":"Haz el test. Hasta la próxima."}],"preguntas":[{"q":"¿Qué normas ISO integra el Sistema Universitario de Gestión Integrada (SUGI) de la UGR?","o":["ISO 9001, ISO 14001 e ISO 45001","ISO 9001, ISO 27001 e ISO 50001","ISO 14001, ISO 26000 e ISO 45001","ISO 9001 e ISO 14721"],"c":0,"e":"Calidad (9001), medio ambiente (14001) y seguridad y salud en el trabajo (45001).","r":"SUGI art. doc"},{"q":"El SUGI unifica la gestión de la calidad, del medio ambiente y de:","o":["La seguridad y salud en el trabajo","La seguridad de la información","La gestión energética","La responsabilidad social corporativa"],"c":0,"e":"Presentación del SUGI (5/3/2026).","r":"SUGI art. doc"},{"q":"¿Cuándo tuvo lugar la sesión de presentación oficial del SUGI?","o":["El 5 de marzo de 2026","El 1 de enero de 2026","El 22 de diciembre de 2025","El 29 de octubre de 2021"],"c":0,"e":"El SUGI está en vigor desde el 1 de enero de 2026.","r":"SUGI art. doc"},{"q":"¿Desde cuándo está en vigor el SUGI?","o":["Desde el 1 de enero de 2026","Desde el 5 de marzo de 2026","Desde el 22 de diciembre de 2025","Desde el 1 de septiembre de 2025"],"c":0,"e":"Preguntas frecuentes del SUGI (Gerencia).","r":"SUGI art. doc"},{"q":"Con el SUGI, el número de procedimientos generales pasa de más de 40 a:","o":["10","20","5","15"],"c":0,"e":"Presentación del SUGI (5/3/2026).","r":"SUGI art. doc"},{"q":"Con el SUGI, el número de auditorías anuales disminuye de seis a:","o":["Dos (una interna y otra externa)","Una externa","Tres","Cuatro"],"c":0,"e":"Auditorías 360º por un equipo auditor multinorma.","r":"SUGI art. doc"},{"q":"La nueva Política del SUGI fue aprobada por el Rector el:","o":["22 de diciembre de 2025","5 de marzo de 2026","1 de enero de 2026","25 de noviembre de 2019"],"c":0,"e":"Preguntas frecuentes del SUGI.","r":"SUGI art. doc"},{"q":"Según la UGR, con el SUGI se posiciona como:","o":["La primera universidad española con un único sistema para las tres normas referidas","La primera universidad europea con certificación EFQM","La única universidad con ISO 14001","La primera universidad con un sistema de calidad propio"],"c":0,"e":"Preguntas frecuentes del SUGI.","r":"SUGI art. doc"},{"q":"La gestión técnica diaria del SUGI corresponde a:","o":["La Comisión Técnica del SUGI (CTSUGI) y la Secretaría Técnica del SUGI (STSUGI)","El Consejo Social y la Defensoría Universitaria","La Gerencia en exclusiva","El Claustro Universitario"],"c":0,"e":"Lo lideran el Rectorado, la Gerencia y la Dirección del SUGI.","r":"SUGI art. doc"},{"q":"Las quejas, sugerencias o felicitaciones sobre el SUGI se presentan mediante el procedimiento:","o":["SUGI-10","SUGI-01","P02","SUGI-XX-XXX"],"c":0,"e":"Disponible en la Sede Electrónica de la UGR.","r":"SUGI art. doc"},{"q":"¿Qué unidad de apoyo del SUGI se ocupa de los temas de medio ambiente (ISO 14001)?","o":["La Unidad de Calidad Ambiental","El Servicio de Salud y Prevención","La Unidad de Calidad","La Unidad Técnica"],"c":0,"e":"Calidad: Unidad de Calidad; seguridad y salud: Servicio de Salud y Prevención.","r":"SUGI art. doc"},{"q":"¿Qué plataforma documental utiliza el SUGI para sus procedimientos y documentos?","o":["La plataforma PDCA","INTEGRA para todo","La Sede Electrónica","Granatensis"],"c":0,"e":"Los registros de prevención siguen en INTEGRA.","r":"SUGI art. doc"},{"q":"Según el artículo 8.3.k) del Reglamento de la Biblioteca, la Dirección de la Biblioteca:","o":["Lidera los procesos de calidad de la Biblioteca Universitaria","Aprueba las Cartas de Servicios","Concede los sellos EFQM","Realiza las auditorías externas ISO"],"c":0,"e":"Reglamento de la Biblioteca, art. 8.3.k.","r":"REGLAMENTO_BUG art. 8"},{"q":"Según el artículo 17 del Reglamento de la Biblioteca, la Biblioteca Universitaria cumplirá:","o":["Todos los compromisos de calidad aportados por la Biblioteca a la Carta de Servicios de la UGR","Los compromisos de la Carta ISO 9001 únicamente","Los compromisos del Plan Estratégico de REBIUN","Los compromisos del Código Ético"],"c":0,"e":"Art. 17 del Reglamento.","r":"REGLAMENTO_BUG art. 17"},{"q":"¿Qué organismos otorgan el Sello de Excelencia Europea que posee la Biblioteca Universitaria de Granada?","o":["La Fundación Europea para la Gestión de la Calidad (EFQM) y el Club de Excelencia en la Gestión","ANECA y la Agencia Andaluza del Conocimiento","AENOR y la Comisión Europea","REBIUN y CRUE"],"c":0,"e":"Noticias de la Biblioteca sobre el Sello EFQM.","r":"EFQM_BUG art. doc"},{"q":"¿En qué año obtuvo la Biblioteca Universitaria de Granada el Sello de Excelencia Europea 500+?","o":["2012","2010","2016","2018"],"c":0,"e":"Fue el primer servicio de la UGR en conseguirlo y la segunda biblioteca universitaria de España.","r":"EFQM_BUG art. doc"},{"q":"Cuando obtuvo el Sello 500+ en 2012, la Biblioteca fue:","o":["El primer servicio de la UGR que lo consiguió y la segunda de todas las bibliotecas universitarias de España","La primera biblioteca universitaria de España","La tercera biblioteca universitaria de Andalucía","El único servicio de la UGR certificado"],"c":0,"e":"Noticia del 26/11/2012.","r":"EFQM_BUG art. doc"},{"q":"¿Qué distintivo se otorgó a la Biblioteca en 2018, al obtener una puntuación en el intervalo 600-649 en la renovación del Sello 500+?","o":["Embajadores de Excelencia","Premio Plata Iberoamericano","Sello 400+","Club de Excelencia"],"c":0,"e":"Renovación del Sello EFQM 500+ en diciembre de 2018.","r":"EFQM_BUG art. doc"},{"q":"La Biblioteca de la UGR revalidó en diciembre de 2016 el Sello EFQM 500+:","o":["Por segunda vez","Por primera vez","Por tercera vez","Por cuarta vez"],"c":0,"e":"Renovaciones: 2014, 2016 (la segunda) y 2018.","r":"EFQM_BUG art. doc"},{"q":"¿Qué Sello de Excelencia Europea figura en la web de la Biblioteca para el periodo 2024-2027?","o":["El Sello de Excelencia Europea 600","El Sello 500+","El Sello 400+","El Sello 700"],"c":0,"e":"También hubo un Sello 600 para 2021-2024.","r":"EFQM_BUG art. doc"},{"q":"Según el Vicerrectorado de Calidad, además del Sello EFQM +500, la Biblioteca cuenta con el:","o":["Premio Plata Iberoamericano de la Calidad","Premio Nacional de Calidad","Sello de Oro de ANECA","Premio Europeo de Biblioteconomía"],"c":0,"e":"Reconocimientos y menciones de calidad de la UGR.","r":"EFQM_BUG art. doc"},{"q":"¿Qué es una Carta de Servicios, según la UGR?","o":["Un documento que acerca los servicios públicos a la ciudadanía, explicando los servicios ofrecidos, los derechos de los usuarios y los niveles de calidad alcanzados","Un contrato entre la UGR y una empresa de servicios","Un reglamento sancionador de los servicios universitarios","Un informe de auditoría de la ISO 9001"],"c":0,"e":"Los niveles de calidad se concretan en compromisos.","r":"CARTAS_SERVICIOS art. doc"},
