igador, el estudiantado y el personal técnico, de gestión y de administración y servicios","El profesorado y el estudiantado","El personal funcionario y el laboral","Los órganos de gobierno y los centros"],"c":0,"e":"Art. 142 del Proyecto de Estatutos.","r":"ESTATUTOS art. 142"},{"q":"Según el artículo 245, la Biblioteca Universitaria conservará y gestionará los recursos bibliográficos y documentales de la Universidad:","o":["Con independencia del soporte material, de la asignación presupuestaria y del procedimiento de adquisición","Solo los adquiridos con cargo a su presupuesto","Solo los de soporte impreso","Solo los adquiridos por compra"],"c":0,"e":"Art. 245.2 del Proyecto de Estatutos.","r":"ESTATUTOS art. 245"},{"q":"¿De qué órgano depende orgánicamente el Archivo Universitario según el artículo 246.2?","o":["De la Secretaría General","De la Gerencia","De la Biblioteca Universitaria","Del Vicerrectorado de Investigación"],"c":0,"e":"Art. 246.2 del Proyecto de Estatutos.","r":"ESTATUTOS art. 246"},{"q":"El sistema de archivos que forma el Archivo Universitario está integrado por:","o":["Los Archivos de Gestión, el Archivo Intermedio y el Archivo Histórico","El Archivo Central y el Archivo Provincial","Solo el Archivo Histórico","Los archivos de cada Facultad exclusivamente"],"c":0,"e":"Art. 246.1 del Proyecto de Estatutos, más el archivo electrónico único.","r":"ESTATUTOS art. 246"}],"notas":["Este tema se estudia con el Proyecto de Estatutos aprobado por el Claustro en mayo de 2026, no con los Estatutos de 2011. Muchas cifras han cambiado, así que desconfía de apuntes antiguos.","La convocatoria cita este documento con dos fechas: 25 de mayo (programa) y 27 de mayo (nota del anexo, probablemente la del boletín BOUGR n.º 326). Es el mismo documento. Estudia siempre la versión aprobada por el Claustro.","Si la UGR publica una versión definitiva con cambios, la convocatoria dice que vale la aprobada por el Claustro. Revisa la web de la Secretaría General antes del examen.","Para ti tiene especial peso lo que toca a tu futuro puesto: Biblioteca (art. 245), Archivo (art. 246), PTGAS (art. 196) y los órganos de gobierno (Claustro, Consejo de Gobierno, Consejo Social y Rector)."],"mp3":true},"g4":{"id":"g4","bloque":"General","num":4,"titulo":"Empleo público: EBEP y Ley de la Función Pública de Andalucía","alcance":"Texto Refundido del EBEP (RDL 5/2015): Títulos I y II. Ley 5/2023 de Función Pública de Andalucía: Título I (cap. I y cap. III), Título IX, Título XI y Título XII.","fuentes":["BOE-A-2015-11719 (Texto Refundido de la Ley del Estatuto Básico del Empleado Público, consolidado)","BOE-A-2023-16066 (Ley 5/2023, de 7 de junio, de la Función Pública de Andalucía, consolidada)"],"peso":"alto","apuntes":[{"h":"EBEP, Título I: objeto y ámbito (arts. 1 a 7)","t":"- **Art. 1.1**: el Estatuto establece las **bases del régimen estatutario de los funcionarios públicos**; y las normas aplicables al **personal laboral** (art. 1.2).\n- **Art. 1.3**: fundamentos de actuación, entre ellos: servicio a los ciudadanos y a los intereses generales; **igualdad, mérito y capacidad** en el acceso y la promoción; sometimiento pleno a la ley y al Derecho; igualdad de trato entre mujeres y hombres; objetividad, profesionalidad e imparcialidad garantizadas con la **inamovilidad del funcionario de carrera**; transparencia; evaluación y responsabilidad; negociación colectiva y cooperación entre Administraciones.\n- **Art. 2.1**: se aplica al personal funcionario y, en lo que proceda, al laboral de: la Administración General del Estado; las **comunidades autónomas** y Ceuta y Melilla; las entidades locales; los organismos públicos y agencias; y **las Universidades Públicas** (letra e).\n- **Art. 4**: solo se aplica directamente cuando lo disponga su legislación específica a: personal de Cortes Generales, jueces, magistrados y fiscales, militares, Fuerzas y Cuerpos de Seguridad, CNI y Banco de España, entre otros.\n- **Art. 7**: el personal laboral se rige por la legislación laboral, los convenios y los preceptos del Estatuto que así lo dispongan."},{"h":"EBEP, Título II: clases de personal (arts. 8 a 13)","t":"- **Art. 8**: son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones al servicio de los intereses generales. Se clasifican en: **funcionarios de carrera, funcionarios interinos, personal laboral (fijo, indefinido o temporal) y personal eventual**.\n- **Art. 9.1 Funcionarios de carrera**: vinculados a una Administración por **nombramiento legal** y una **relación estatutaria regulada por el Derecho Administrativo**, para servicios profesionales retribuidos de carácter permanente.\n- **Art. 9.2**: las funciones que impliquen **participación directa o indirecta en el ejercicio de las potestades públicas** o en la salvaguardia de los intereses generales corresponden **exclusivamente a los funcionarios públicos**.\n- **Art. 10 Funcionarios interinos**: nombrados por razones de **necesidad y urgencia**, con carácter temporal, en estos casos: **a)** plazas vacantes sin posible cobertura por funcionario de carrera, **máximo tres años**; **b)** sustitución transitoria de titulares; **c)** **programas temporales** de duración no superior a **tres años**, ampliable hasta **doce meses** más; **d)** exceso o acumulación de tareas, **máximo nueve meses dentro de un periodo de dieciocho**. La selección es pública (igualdad, mérito, capacidad, publicidad y celeridad) y **nunca da la condición de funcionario de carrera**.\n- **Art. 11 Personal laboral**: contrato de trabajo **formalizado por escrito**; fijo, por tiempo indefinido o temporal. Selección pública por igualdad, mérito y capacidad.\n- **Art. 12 Personal eventual**: nombramiento **no permanente**, solo funciones de **confianza o asesoramiento especial**, retribuido con cargo a créditos presupuestarios para ese fin. **Nombramiento y cese libres.** Su condición **no puede ser mérito** para el acceso a la función pública ni la promoción interna.\n- **Art. 13 Personal directivo**: lo regulan el Gobierno y las CCAA; designación por **mérito y capacidad e idoneidad**, con procedimientos que garanticen **publicidad y concurrencia**; sujeto a evaluación por eficacia y eficiencia."},{"h":"Ley 5/2023 de Andalucía: objeto, ámbito y principios (arts. 1 a 6)","t":"- **Art. 1**: define y ordena la **función pública de la Administración de la Junta de Andalucía** y fija normas aplicables a todo el personal de las Administraciones públicas de Andalucía incluido en su ámbito.\n- **Art. 2**: se aplica al personal funcionario y laboral de la Administración General de la Junta, y de sus agencias y entes instrumentales. (El personal de las **universidades públicas andaluzas** se rige por su legislación específica y por el EBEP.)\n- **Art. 6.1 Principios del personal**: **profesionalidad, integridad, objetividad, neutralidad, imparcialidad, confidencialidad y dedicación al servicio público**, evitando conflictos de intereses."},{"h":"Ley 5/2023: personal al servicio de la Administración (arts. 12 a 18)","t":"- **Art. 12**: clasificación: **personal funcionario de carrera, personal funcionario interino, personal laboral (fijo, indefinido o temporal) y personal eventual**.\n- **Art. 13**: funcionario de carrera: **nombramiento legal**, **relación estatutaria regulada por el Derecho Administrativo**, servicios profesionales retribuidos de carácter **permanente**.\n- **Art. 14 Funcionario interino**: necesidad y urgencia; seleccionado conforme al **art. 115**; supuestos: vacantes (**máximo tres años**), sustitución transitoria, programas temporales y exceso o acumulación de tareas.\n- **Art. 15**: conforme al art. 9.2 EBEP, corresponden **exclusivamente al personal funcionario** las funciones que impliquen participación directa o indirecta en el ejercicio de potestades públicas o en la salvaguardia de los intereses generales.\n- **Art. 16 Personal laboral**: **contrato de trabajo formalizado por escrito**; fijo, por tiempo indefinido o temporal.\n- **Art. 17 Personal eventual**: nombramiento no permanente; solo funciones de **confianza o asesoramiento especial**; retribuido con cargo a créditos presupuestarios consignados para este fin."},{"h":"Ley 5/2023: acceso al empleo público (arts. 105 a 115)","t":"- **Art. 105**: el acceso se rige por los principios constitucionales de **igualdad, mérito y capacidad**, y además: **publicidad** de convocatorias y bases, **transparencia**, **imparcialidad y profesionalidad** de los órganos de selección, **independencia y discrecionalidad técnica** y confidencialidad.\n- **Art. 106.1 Requisitos generales**: **nacionalidad española** (sin perjuicio del art. 107); **capacidad funcional**; **tener cumplidos dieciséis años** y no exceder de la edad de jubilación forzosa (se puede exigir 18 años en cuerpos con ejercicio de autoridad o riesgo para la salud); no haber sido separado mediante procedimiento disciplinario ni estar inhabilitado; y la titulación exigida.\n- **Art. 107**: los nacionales de **otros Estados miembros de la UE** pueden acceder como personal funcionario en igualdad de condiciones, salvo en puestos que impliquen participación en el ejercicio de potestades públicas.\n- **Art. 111**: procesos **abiertos** con libre concurrencia. Sistemas: **oposición, concurso-oposición o concurso de valoración de méritos**.\n- **Art. 113**: se inician de oficio, de acuerdo con la **oferta de empleo público**, mediante convocatoria pública con las bases.\n- **Art. 114**: los órganos de selección **no pueden proponer más aprobados que plazas convocadas**, salvo que la convocatoria lo prevea.\n- **Art. 115**: selección del personal funcionario interino y laboral temporal: procedimientos ágiles con igualdad, mérito, capacidad, publicidad y **celeridad**."},{"h":"Ley 5/2023: adquisición y pérdida de la condición (arts. 116 a 122)","t":"- **Art. 116.1 Adquisición de la condición de funcionario de carrera** (requisitos sucesivos): **a)** superar el proceso selectivo (y prácticas, en su caso); **b)** acreditar los requisitos de la convocatoria antes del nombramiento; **c)** **nombramiento** por el órgano competente, publicado en el **BOJA** o boletín correspondiente; **d)** **acto de acatamiento** de la Constitución, el Estatuto de Autonomía para Andalucía y el resto del ordenamiento; **e)** **toma de posesión** dentro del plazo establecido.\n- **Art. 117 Pérdida de la condición**: **renuncia**; pérdida de la **nacionalidad** (salvo que no sea requisito); **jubilación total**; **sanción disciplinaria de separación del servicio** firme; **pena principal o accesoria de inhabilitación** absoluta o especial para cargo público firme.\n- **Art. 118**: la renuncia se manifiesta por escrito y debe ser aceptada expresamente; no puede aceptarse si hay procedimiento disciplinario o auto de procesamiento.\n- **Art. 120**: se puede solicitar la **prolongación en el servicio activo** hasta un máximo de **setenta años**, por **períodos de un año** renovables.\n- **Art. 122**: personal laboral fijo: superar el proceso selectivo, formalizar el contrato, acto de acatamiento e incorporación al puesto."},{"h":"Ley 5/2023: situaciones administrativas (arts. 144 a 164)","t":"- **Art. 144.1**: el personal funcionario de carrera está en una de estas situaciones: **servicio activo, servicios especiales, servicio en otras Administraciones públicas, excedencia voluntaria, excedencia forzosa, expectativa de destino y suspensión de funciones**.\n- **Art. 145**: **servicio activo**: quien presta servicios como funcionario de carrera y no le corresponde otra situación.\n- **Art. 148 Modalidades de excedencia voluntaria**: por **interés particular**, por **agrupación familiar**, por **cuidado de familiares**, por **violencia de género**, por **violencia terrorista**, por **prestación de servicios en el sector público andaluz**, por **incompatibilidad**, **con reserva de puesto** e **incentivada**.\n- **Art. 149 Interés particular**: haber prestado servicios efectivos en cualquier Administración durante un mínimo de **dos años** inmediatamente anteriores; permanecer al menos **un año**.\n- **Art. 150 Agrupación familiar**: sin requisito de servicios previos y con permanencia mínima de **un año**.\n- **Art. 151 Cuidado de familiares**: duración **no superior a tres años**, sin servicios previos.\n- **Art. 152**: víctimas de violencia de género: sin servicios previos ni plazo mínimo de permanencia.\n- **Art. 156 Con reserva de puesto**: si lo permiten las necesidades del servicio, tras **diez años** de servicios efectivos; duración mínima **seis meses** y máxima **un año**.\n- **Art. 159 Expectativa de destino**: funcionarios afectados por reasignación de efectivos sin destino.\n- **Art. 160 Suspensión de funciones**: provisional o firme. La **provisional** durante un disciplinario, por un máximo de **seis meses** (salvo excepciones).\n- **Art. 162**: reingreso al servicio activo sin puesto reservado: por concurso o libre designación, o por adjudicación provisional de un puesto vacante.\n- **Art. 163 Interinos**: pueden estar en servicio activo, excedencia por cuidado de familiares, por violencia de género, por violencia terrorista y suspensión de funciones."},{"h":"Ley 5/2023: régimen disciplinario (arts. 165 a 177)","t":"- **Art. 165**: el personal queda sujeto al régimen disciplinario de la normativa estatal básica y de este título.\n- **Art. 166 Principios**: **legalidad y tipicidad**, **irretroactividad** de las disposiciones no favorables y retroactividad de las favorables, entre otros.\n- **Art. 167**: las faltas se clasifican en **muy graves, graves y leves**.\n- **Art. 168**: faltas muy graves (las de la normativa estatal básica y otras, por ejemplo la agresión física a cualquier persona con la que se relacione en el ejercicio de sus funciones).\n- **Art. 169**: faltas **graves**, por ejemplo el **incumplimiento de las órdenes o instrucciones** de los superiores relativas al desempeño del puesto.\n- **Art. 170**: faltas **leves**, por ejemplo el **retraso, negligencia o descuido** en el cumplimiento de las funciones, o el **trato irrespetuoso** con la ciudadanía, superiores o compañeros.\n- **Art. 171 Sanciones por faltas muy graves**: la **suspensión firme de funciones** tiene una duración **mínima de un año y un día** y supone la pérdida del puesto; el **traslado forzoso** puede imponerse por un período **máximo de un año**.\n- **Art. 172**: proporcionalidad y necesidad de la sanción.\n- **Art. 173**: la prescripción se rige por la normativa estatal básica.\n- **Art. 174**: no puede imponerse sanción sino mediante el procedimiento previamente establecido.\n- **Art. 177**: la responsabilidad disciplinaria se extingue por **cumplimiento de la sanción, prescripción, pérdida de la condición de personal funcionario o laboral y fallecimiento**."}],"clave":["Clases de personal (EBEP art. 8): funcionarios de carrera, interinos, personal laboral y personal eventual.","Interinos (EBEP art. 10): vacantes máx. 3 años; programas 3 años + 12 meses; exceso de tareas 9 meses en 18.","Funciones exclusivas de funcionarios: potestades públicas (art. 9.2 EBEP; art. 15 Ley 5/2023).","Personal eventual: nombramiento y cese libres; no es mérito.","Requisitos de acceso (art. 106 Ley 5/2023): nacionalidad, capacidad, 16 años, no separación, titulación.","Adquisición condición funcionario: proceso selectivo, requisitos, nombramiento en BOJA, acatamiento, toma de posesión.","Situaciones (art. 144): activo, servicios especiales, otras AAPP, excedencia voluntaria, excedencia forzosa, expectativa de destino, suspensión.","Excedencia por interés particular: 2 años previos y 1 año mínimo de permanencia.","Faltas: muy graves, graves y leves. Suspensión firme: mínimo 1 año y 1 día."],"podcast":[{"v":"A","t":"Hola. Cuarta lección del bloque general. Hoy toca empleo público: el Estatuto Básico del Empleado Público y la Ley 5 de 2023 de la Función Pública de Andalucía."},{"v":"B","t":"Empezamos por el Estatuto Básico. Los títulos uno y dos. El título uno dice a quién se aplica: a la Administración General del Estado, a las comunidades autónomas y ciudades de Ceuta y Melilla, a las entidades locales, a organismos públicos y agencias, y a las Universidades Públicas. Esa última es la tuya."},{"v":"A","t":"El título dos clasifica a los empleados públicos en cuatro clases: funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual. Cuatro clases, apúntalo."},{"v":"B","t":"Funcionario de carrera: nombramiento legal y relación estatutaria regulada por el Derecho Administrativo, para servicios profesionales retribuidos de carácter permanente. Y las funciones que impliquen participar en potestades públicas corresponden exclusivamente a funcionarios."},{"v":"A","t":"Interinos. Son nombrados por necesidad y urgencia, con carácter temporal. Hay cuatro supuestos. Uno: plazas vacantes, máximo tres años. Dos: sustituir a un titular el tiempo estrictamente necesario. Tres: programas temporales, no más de tres años, ampliables doce meses. Cuatro: exceso o acumulación de tareas, máximo nueve meses dentro de un periodo de dieciocho."},{"v":"B","t":"Y un detalle que cae mucho: ser interino nunca da la condición de funcionario de carrera."},{"v":"A","t":"El personal laboral tiene un contrato por escrito, puede ser fijo, indefinido o temporal. El personal eventual solo hace funciones de confianza o asesoramiento especial. Su nombramiento y cese son libres, y su condición no cuenta como mérito para acceder a la función pública."},{"v":"B","t":"Ahora la Ley andaluza. En el artículo seis, los principios del personal: profesionalidad, integridad, objetividad, neutralidad, imparcialidad, confidencialidad y dedicación al servicio público."},{"v":"A","t":"El acceso al empleo público, título nueve. Se rige por igualdad, mérito y capacidad. Requisitos: nacionalidad española, capacidad funcional, tener cumplidos dieciséis años, no estar separado del servicio ni inhabilitado, y la titulación exigida."},{"v":"B","t":"Sistemas selectivos: oposición, concurso-oposición o concurso de valoración de méritos. Y los órganos de selección no pueden proponer más aprobados que plazas convocadas."},{"v":"A","t":"Para ser funcionario de carrera hay cinco pasos sucesivos: superar el proceso selectivo, acreditar los requisitos, nombramiento publicado en el BOJA, acto de acatamiento de la Constitución y del Estatuto de Autonomía, y toma de posesión."},{"v":"B","t":"Pierdes la condición por renuncia, pérdida de la nacionalidad, jubilación total, sanción firme de separación del servicio o inhabilitación firme. Se puede pedir prolongar el servicio activo hasta los setenta años, por periodos de un año."},{"v":"A","t":"Situaciones administrativas del artículo ciento cuarenta y cuatro: servicio activo, servicios especiales, servicio en otras Administraciones, excedencia voluntaria, excedencia forzosa, expectativa de destino y suspensión de funciones. Siete."},{"v":"B","t":"Dentro de las excedencias voluntarias, la de interés particular exige dos años de servicios efectivos previos y permanecer al menos un año. La de cuidado de familiares dura no más de tres años. La excedencia con reserva de puesto requiere diez años de servicios, y dura entre seis meses y un año."},{"v":"A","t":"Por último, el régimen disciplinario. Las faltas se clasifican en muy graves, graves y leves. La suspensión firme por falta muy grave dura como mínimo un año y un día, y el traslado forzoso, como máximo un año."},{"v":"B","t":"Haz el test y repasa los números: tres años, nueve meses de dieciocho, dieciséis años, setenta años, seis meses. Hasta la próxima."}],"preguntas":[{"q":"Según el artículo 2.1 del EBEP, el Estatuto se aplica al personal de las siguientes Administraciones. ¿Cuál de ellas incluye expresamente?","o":["Las Universidades Públicas","Solo la Administración General del Estado","Solo las entidades locales","Las universidades privadas"],"c":0,"e":"Art. 2.1.e EBEP.","r":"EBEP art. 2"},{"q":"Según el artículo 8.2 del EBEP, ¿cuál de las siguientes NO es una clase de empleado público?","o":["Personal honorario","Funcionarios interinos","Personal laboral","Personal eventual"],"c":0,"e":"Las clases son: funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual.","r":"EBEP art. 8"},{"q":"Según el artículo 9.1 del EBEP, los funcionarios de carrera están vinculados a una Administración Pública por:","o":["Una relación estatutaria regulada por el Derecho Administrativo","Un contrato de trabajo regulado por el Estatuto de los Trabajadores","Un contrato administrativo de servicios","Un nombramiento libre y revocable"],"c":0,"e":"Art. 9.1 EBEP.","r":"EBEP art. 9"},{"q":"Las funciones que impliquen participación directa o indirecta en el ejercicio de las potestades públicas corresponden, según el artículo 9.2 del EBEP:","o":["Exclusivamente a los funcionarios públicos","Indistintamente a funcionarios y personal laboral","Al personal eventual","A los contratistas de la Administración"],"c":0,"e":"Art. 9.2 EBEP.","r":"EBEP art. 9"},{"q":"Según el artículo 10.1.a) del EBEP, el nombramiento de funcionarios interinos por existencia de plazas vacantes, cuando no sea posible su cobertura por funcionarios de carrera, es por un máximo de:","o":["Un año","Dos años","Tres años","Cinco años"],"c":2,"e":"Art. 10.1.a EBEP.","r":"EBEP art. 10"},{"q":"En el supuesto de exceso o acumulación de tareas, el EBEP permite el nombramiento de funcionarios interinos por un plazo máximo de:","o":["Seis meses dentro de un periodo de doce","Nueve meses dentro de un periodo de dieciocho","Un año dentro de un periodo de dos","Tres meses dentro de un periodo de seis"],"c":1,"e":"Art. 10.1.d EBEP.","r":"EBEP art. 10"},{"q":"Los programas de carácter temporal que justifican el nombramiento de funcionarios interinos no podrán tener una duración superior a tres años, ampliable hasta:","o":["Doce meses más","Seis meses más","Dos años más","Tres años más"],"c":0,"e":"Art. 10.1.c EBEP.","r":"EBEP art. 10"},{"q":"El nombramiento derivado de los procedimientos de selección de funcionarios interinos:","o":["En ningún caso dará lugar al reconocimiento de la condición de funcionario de carrera","Da derecho a la condición de funcionario de carrera tras tres años","Da derecho a plaza fija tras superar el periodo de prueba","Equivale al nombramiento de funcionario de carrera"],"c":0,"e":"Art. 10.2 EBEP.","r":"EBEP art. 10"},{"q":"Según el artículo 11.1 del EBEP, el personal laboral presta servicios en virtud de:","o":["Un contrato de trabajo formalizado por escrito","Un nombramiento legal","Un acuerdo verbal con el órgano de contratación","Una orden de servicio"],"c":0,"e":"Art. 11.1 EBEP. Fijo, por tiempo indefinido o temporal según su duración.","r":"EBEP art. 11"},{"q":"El nombramiento y cese del personal eventual, según el artículo 12.3 del EBEP, son:","o":["Libres","Por concurso público","Por oposición","Con informe vinculante del Consejo de Estado"],"c":0,"e":"Art. 12.3 EBEP. Su condición no podrá constituir mérito para el acceso a la función pública (art. 12.4).","r":"EBEP art. 12"},{"q":"La condición de personal eventual, según el artículo 12.4 del EBEP:","o":["No podrá constituir mérito para el acceso a la función pública o para la promoción interna","Constituye mérito preferente en los concursos","Da acceso directo a plazas de funcionario","Computa como servicios prestados con doble valor"],"c":0,"e":"Art. 12.4 EBEP.","r":"EBEP art. 12"},{"q":"La designación del personal directivo, según el artículo 13 del EBEP, atenderá a principios de:","o":["Mérito y capacidad y a criterios de idoneidad, con publicidad y concurrencia","Libre designación sin publicidad","Antigüedad exclusivamente","Confianza política"],"c":0,"e":"Art. 13.2 EBEP.","r":"EBEP art. 13"},{"q":"Según el artículo 6.1 de la Ley 5/2023, ¿cuál de los siguientes es un principio de actuación del personal incluido en su ámbito?","o":["Confidencialidad","Rentabilidad","Competitividad","Exclusividad política"],"c":0,"e":"Art. 6.1 de la Ley 5/2023.","r":"LFPA art. 6"},{"q":"Según el artículo 13 de la Ley 5/2023, es personal funcionario de carrera el que está vinculado a la Administración pública:","o":["Por una relación estatutaria regulada por el Derecho Administrativo, para servicios profesionales retribuidos de carácter permanente","Por un contrato por tiempo indefinido","Por un nombramiento no permanente","Por una relación laboral especial"],"c":0,"e":"Art. 13 de la Ley 5/2023.","r":"LFPA art. 13"},{"q":"El personal funcionario interino nombrado por existencia de plazas vacantes lo será, según el artículo 14 de la Ley 5/2023, por un máximo de:","o":["Tres años","Dos años","Cuatro años","Seis años"],"c":0,"e":"Art. 14.1.a de la Ley 5/2023.","r":"LFPA art. 14"},{"q":"El personal laboral, según el artículo 16 de la Ley 5/2023, puede ser en función de la duración de su contrato:","o":["Fijo, por tiempo indefinido o temporal","Fijo o eventual","Temporal o de confianza","Funcionario o interino"],"c":0,"e":"Art. 16 de la Ley 5/2023.","r":"LFPA art. 16"},{"q":"El personal eventual realiza, según el artículo 17 de la Ley 5/2023, solo funciones:","o":["De confianza o asesoramiento especial","De ejecución de programas temporales","De sustitución de titulares","De carácter permanente y técnico"],"c":0,"e":"Art. 17.1 de la Ley 5/2023.","r":"LFPA art. 17"},{"q":"Según el artículo 105.1 de la Ley 5/2023, el acceso al empleo público se rige por el pleno respeto a los principios constitucionales de:","o":["Igualdad, mérito y capacidad","Mérito, antigüedad y confianza","Igualdad, libertad y justicia","Capacidad y libre designación"],"c":0,"e":"Art. 105.1 de la Ley 5/2023.","r":"LFPA art. 105"},{"q":"¿Qué edad mínima general exige el artículo 106.1 de la Ley 5/2023 para participar en los procesos selectivos?","o":["Haber cumplido dieciséis años","Haber cumplido dieciocho años","Haber cumplido veintiún años","No se exige edad mínima"],"c":0,"e":"Art. 106.1.c. Se puede exigir 18 años para cuerpos con ejercicio de autoridad o riesgo para la salud.","r":"LFPA art. 106"},{"q":"Según el artículo 111.2 de la Ley 5/2023, los sistemas selectivos serán:","o":["Oposición, concurso-oposición o concurso de valoración de méritos","Solo oposición","Oposición o libre designación","Concurso de méritos o sorteo"],"c":0,"e":"Art. 111.2 de la Ley 5/2023.","r":"LFPA art. 111"},{"q":"Según el artículo 114.1 de la Ley 5/2023, los órganos de selección no podrán proponer el acceso de un número de personas aprobadas:","o":["Superior al de plazas convocadas, salvo que lo prevea la propia convocatoria","Inferior al de plazas convocadas","Superior al 10 % de las plazas convocadas","Superior al doble de las plazas convocadas"],"c":0,"e":"Art. 114.1 de la Ley 5/2023.","r":"LFPA art. 114"},{"q":"¿Cuál es el último requisito sucesivo para adquirir la condición de funcionario de carrera según el artículo 116.1 de la Ley 5/2023?","o":["La toma de posesión dentro del plazo que se establezca","El acto de acatamiento de la Constitución","La publicación del nombramiento en el BOJA","La superación del proceso selectivo"],"c":0,"e":"Art. 116.1.e. Antes: proceso selectivo, acreditación de requisitos, nombramiento publicado, acatamiento.","r":"LFPA art. 116"},{"q":"¿Cuál de las siguientes es causa de pérdida de la condición de funcionario de carrera según el artículo 117 de la Ley 5/2023?","o":["La sanción disciplinaria de separación del servicio que tenga carácter firme","El traslado forzoso por tres años","La excedencia por cuidado de familiares","La suspensión provisional de funciones"],"c":0,"e":"Art. 117.d de la Ley 5/2023.","r":"LFPA art. 117"},{"q":"Según el artículo 120.1 de la Ley 5/2023, la prolongación de la permanencia en el servicio activo tiene como límite máximo el cumplimiento de:","o":["Setenta años","Sesenta y siete años","Sesenta y cinco años","Setenta y dos años"],"c":0,"e":"Art. 120.1: por períodos de un año renovables.","r":"LFPA art. 120"},{"q":"¿Cuál de las siguientes NO es una situación administrativa del personal funcionario de carrera según el artículo 144.1 de la Ley 5/2023?","o":["Permiso sin sueldo","Servicios especiales","Expectativa de destino","Suspensión de funciones"],"c":0,"e":"Son siete: servicio activo, servicios especiales, servicio en otras Administraciones, excedencia voluntaria, excedencia forzosa, expectativa de destino y suspensión de funciones.","r":"LFPA art. 144"},{"q":"Para solicitar la excedencia voluntaria por interés particular, el personal funcionario de carrera debe haber prestado servicios efectivos en cualquier Administración durante:","o":["Un mínimo de dos años inmediatamente anteriores","Un mínimo de cinco años","Un mínimo de diez años","No se exige tiempo mínimo"],"c":0,"e":"Art. 149.1 de la Ley 5/2023. Además debe permanecer en esa situación un mínimo de un año.","r":"LFPA art. 149"},{"q":"La excedencia por cuidado de familiares tiene, según el artículo 151.1 de la Ley 5/2023, una duración:","o":["No superior a tres años","No superior a un año","No superior a cinco años","No superior a seis meses"],"c":0,"e":"Art. 151.1 de la Ley 5/2023, sin que sea exigible un mínimo de servicios previos.","r":"LFPA art. 151"},{"q":"Para la excedencia con reserva de puesto de trabajo (art. 156 de la Ley 5/2023) se exige haber prestado servicios efectivos durante:","o":["Diez años","Dos años","Cinco años","Quince años"],"c":0,"e":"Art. 156.1: duración mínima de seis meses y máxima de un año.","r":"LFPA art. 156"},{"q":"La suspensión provisional de funciones con ocasión de la tramitación de un procedimiento disciplinario tiene, según el artículo 160.3, un período máximo de:","o":["Seis meses, salvo excepciones","Tres meses","Un año","Dos años"],"c":0,"e":"Art. 160.3 de la Ley 5/2023.","r":"LFPA art. 160"},{"q":"Según el artículo 167.2 de la Ley 5/2023, las faltas disciplinarias se clasifican en:","o":["Muy graves, graves y leves","Graves y leves","Muy graves y leves","Mayores, menores y simples"],"c":0,"e":"Art. 167.2 de la Ley 5/2023.","r":"LFPA art. 167"},{"q":"La suspensión firme de funciones impuesta por falta muy grave tendrá, según el artículo 171.1.a) de la Ley 5/2023, una duración mínima de:","o":["Un año y un día","Seis meses","Un año exacto","Tres años"],"c":0,"e":"Art. 171.1.a de la Ley 5/2023. Determina la pérdida del puesto de trabajo.","r":"LFPA art. 171"},{"q":"El traslado forzoso, como sanción por faltas muy graves, podrá imponerse según el artículo 171.1.b) de la Ley 5/2023 por un período máximo de:","o":["Un año","Seis meses","Tres años","Cinco años"],"c":0,"e":"Art. 171.1.b de la Ley 5/2023.","r":"LFPA art. 171"}],"notas":["La Ley 5/2023 de Andalucía se modificó en marzo de 2026 (Decreto-ley 3/2026). La convocatoria exige la versión vigente a 6 de octubre de 2026. Estos apuntes siguen la versión consolidada del BOE descargada el 27 de octubre de 2026; si ves cambios en el BOE más adelante, prevalece lo que diga el texto oficial vigente.","Los plazos y números se preguntan mucho: vacantes 3 años, programas 3 años más 12 meses, exceso de tareas 9 meses en 18, edad mínima 16 años, prolongación hasta los 70 años, excedencia por interés particular (2 años previos y 1 año de permanencia), con reserva de puesto (10 años; 6 meses a 1 año), suspensión provisional máximo 6 meses.","En el EBEP entran solo los Títulos I y II. En la Ley 5/2023 entran el Título I (cap. I y cap. III), el IX, el XI y el XII."],"mp3":true},"g5":{"id":"g5","bloque":"General","num":5,"titulo":"Prevención de Riesgos Laborales","alcance":"Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales (completa).","fuentes":["BOE-A-1995-24292 (Ley 31/1995, de Prevención de Riesgos Laborales, texto consolidado)"],"peso":"medio","apuntes":[{"h":"Objeto y ámbito (arts. 1 a 3)","t":"- **Art. 1**: la normativa de prevención la forman la Ley, sus disposiciones de desarrollo y cualquier otra norma, legal o convencional, con prescripciones preventivas.\n- **Art. 2.1**: el **objeto** es **promover la seguridad y la salud de los trabajadores** mediante medidas y actividades de **prevención de los riesgos derivados del trabajo**.\n- **Art. 3.1**: se aplica a las relaciones **laborales** y también a las **administrativas o estatutarias del personal al servicio de las Administraciones Públicas**, con las peculiaridades que se prevean. Se aplica también a cooperativas y a autónomos en lo previsto."},{"h":"Conceptos clave (art. 4)","t":"- **Prevención**: conjunto de actividades o medidas adoptadas o previstas en **todas las fases de actividad** de la empresa para **evitar o disminuir los riesgos derivados del trabajo**.\n- **Riesgo laboral**: la **posibilidad de que un trabajador sufra un determinado daño derivado del trabajo**. Su gravedad se valora con la **probabilidad** y la **severidad** del daño.\n- **Daños derivados del trabajo**: **enfermedades, patologías o lesiones** sufridas con motivo u ocasión del trabajo.\n- **Riesgo grave e inminente**: el que resulte **probable racionalmente que se materialice en un futuro inmediato** y pueda suponer un **daño grave** para la salud.\n- **Condiciones de trabajo**: cualquier característica del trabajo que pueda tener una influencia significativa en la generación de riesgos."},{"h":"Política preventiva y organismos (arts. 5 a 13)","t":"- **Art. 5**: la política de prevención busca **mejorar las condiciones de trabajo** para elevar el nivel de protección de la seguridad y la salud.\n- **Art. 6**: el **Gobierno** regula por **normas reglamentarias**, previa consulta a las organizaciones sindicales y empresariales más representativas, los requisitos mínimos de las condiciones de trabajo, entre otras materias.\n- **Art. 9**: la **Inspección de Trabajo y Seguridad Social** vigila y controla el cumplimiento de la normativa.\n- **Art. 12**: la **participación de empresarios y trabajadores**, a través de sus organizaciones más representativas, es principio básico de la política de prevención.\n- **Art. 13**: se crea la **Comisión Nacional de Seguridad y Salud en el Trabajo**: órgano colegiado **asesor de las Administraciones públicas** y de participación institucional."},{"h":"Derechos y obligaciones (arts. 14 a 29)","t":"- **Art. 14.1**: los trabajadores tienen **derecho a una protección eficaz** en materia de seguridad y salud. Esto supone el **deber del empresario** de protegerlos. **Este deber también lo tienen las Administraciones públicas respecto del personal a su servicio.**\n- Forman parte de ese derecho: **información, consulta y participación, formación preventiva, paralización de la actividad en riesgo grave e inminente y vigilancia de la salud**.\n- **Art. 15.1 Principios de la acción preventiva**: **a)** evitar los riesgos; **b)** evaluar los que no se puedan evitar; **c)** combatirlos en su origen; **d)** adaptar el trabajo a la persona; **e)** tener en cuenta la evolución de la técnica; **f)** sustituir lo peligroso por lo que entrañe poco o ningún peligro; **g)** planificar la prevención; **h)** **anteponer la protección colectiva a la individual**; **i)** dar las debidas instrucciones a los trabajadores.\n- **Art. 16**: la prevención se integra en el sistema general de gestión de la empresa mediante un **plan de prevención de riesgos laborales**. Instrumentos esenciales: la **evaluación de riesgos** y la **planificación de la actividad preventiva**.\n- **Art. 17**: equipos de trabajo y medios de protección adecuados.\n- **Art. 18**: **información** sobre riesgos, medidas de protección y emergencias.\n- **Art. 19**: **formación teórica y práctica, suficiente y adecuada**, centrada en el puesto, al contratarse y cuando haya cambios de funciones o tecnologías.\n- **Art. 20**: **medidas de emergencia**: primeros auxilios, lucha contra incendios y evacuación.\n- **Art. 21 Riesgo grave e inminente**: el trabajador tiene derecho a **interrumpir su actividad y abandonar el lugar de trabajo** (21.2). Si el empresario no actúa, los **representantes legales** pueden acordar la **paralización de la actividad por mayoría de sus miembros** (21.3).\n- **Art. 22 Vigilancia de la salud**: periódica, **solo con el consentimiento del trabajador**, salvo excepciones (previo informe de los representantes) cuando sea imprescindible para evaluar efectos de las condiciones de trabajo, comprobar si su estado de salud supone un peligro para él o terceros, o lo establezca una norma. Se eligen las pruebas que **causen menores molestias** y sean **proporcionales al riesgo**.\n- **Art. 23**: documentación que el empresario conserva a disposición de la autoridad laboral: plan de prevención, evaluación de riesgos, planificación de la actividad preventiva, controles del estado de salud y **relación de accidentes de trabajo y enfermedades profesionales que causen una incapacidad laboral superior a un día**.\n- **Art. 24**: coordinación de actividades empresariales: cooperación entre empresas que concurren en un mismo centro.\n- **Art. 25**: protección de **trabajadores especialmente sensibles** (incluye personas con discapacidad). **Art. 26**: protección de la **maternidad**. **Art. 27**: protección de **menores de 18 años**. **Art. 28**: relaciones de trabajo **temporales**: **mismo nivel de protección** que el resto.\n- **Art. 29 Obligaciones de los trabajadores**: velar por su propia seguridad y la de otras personas, usar adecuadamente máquinas y equipos, usar correctamente los medios de protección, no inutilizar los dispositivos de seguridad, **informar de inmediato** a su superior de cualquier situación de riesgo, contribuir al cumplimiento de las obligaciones y cooperar con el empresario."},{"h":"Servicios de prevención (arts. 30 a 32 bis)","t":"- **Art. 30.1**: el empresario **designará uno o varios trabajadores**, **constituirá un servicio de prevención** o **concertará dicho servicio con una entidad especializada ajena a la empresa**.\n- **Art. 31**: si la designación de trabajadores es insuficiente, debe recurrir a **servicios de prevención propios o ajenos**. Los servicios de prevención asesoran y asisten al empresario, a los trabajadores y a sus representantes.\n- **Art. 32 bis**: **recursos preventivos**: presencia necesaria cuando los riesgos se agravan por la concurrencia de operaciones, en actividades peligrosas reglamentadas o cuando lo requiera la Inspección."},{"h":"Consulta y participación (arts. 33 a 40)","t":"- **Art. 33**: el empresario **consulta a los trabajadores**, con la debida antelación, las decisiones sobre planificación del trabajo, organización de la prevención, designación de los trabajadores, formación, etc.\n- **Art. 34.1**: derecho a participar. En empresas o centros con **seis o más trabajadores**, la participación se canaliza a través de sus **representantes** y de la **representación especializada**.\n- **Art. 35 Delegados de Prevención**: representantes de los trabajadores **con funciones específicas** en prevención, **designados por y entre los representantes del personal**. Escala: **50 a 100 trabajadores: 2**; **101 a 500: 3**; **501 a 1.000: 4**; **1.001 a 2.000: 5**; **2.001 a 3.000: 6**; **3.001 a 4.000: 7**; **4.001 en adelante: 8**. En empresas de **31 a 49 trabajadores** hay **un** Delegado elegido por y entre los Delegados de Personal; hasta 30 trabajadores, el propio Delegado de Personal.\n- **Art. 36**: competencias: colaborar con la dirección, promover la cooperación, ser **consultados**, vigilar el cumplimiento de la normativa.\n- **Art. 37**: garantías: las del **art. 68 del Estatuto de los Trabajadores**; el tiempo empleado es de ejercicio de funciones de representación.\n- **Art. 38 Comité de Seguridad y Salud**: órgano **paritario y colegiado** de participación para la consulta regular y periódica. Se constituye en empresas o centros con **50 o más trabajadores**. Lo forman los **Delegados de Prevención** y el **empresario o sus representantes**, en igual número. Participan **con voz pero sin voto** los delegados sindicales y los responsables técnicos de prevención.\n- **Art. 39**: competencias del Comité: participar en la elaboración, puesta en práctica y evaluación de los planes y programas de prevención.\n- **Art. 40**: los trabajadores y sus representantes pueden **recurrir a la Inspección de Trabajo y Seguridad Social** si consideran insuficientes las medidas del empresario."},{"h":"Fabricantes, Inspección y responsabilidades (arts. 41 a 45)","t":"- **Art. 41**: **fabricantes, importadores y suministradores** deben asegurar que sus productos no sean fuente de peligro.\n- **Art. 42.1**: el incumplimiento del empresario da lugar a **responsabilidades administrativas** y, en su caso, **penales** y **civiles** por los daños y perjuicios.\n- **Art. 43**: ante una infracción, el Inspector **requiere la subsanación** de deficiencias, sin perjuicio de la propuesta de sanción.\n- **Art. 44**: si hay **riesgo grave e inminente**, el Inspector puede ordenar la **paralización inmediata** de los trabajos.\n- **Art. 45**: en el ámbito del **personal civil al servicio de las Administraciones públicas**, las infracciones dan lugar a la imposición, por resolución de la autoridad competente, de la **realización de las medidas correctoras**, conforme al procedimiento que se establezca."}],"clave":["Art. 2.1: objeto = promover la seguridad y la salud de los trabajadores.","Art. 3.1: se aplica también al personal administrativo o estatutario de las Administraciones públicas.","Art. 4: riesgo laboral = posibilidad de que un trabajador sufra un daño derivado del trabajo (probabilidad + severidad).","Art. 14.1: el deber de protección también es de las Administraciones públicas respecto de su personal.","Art. 15: nueve principios de la acción preventiva; protección colectiva antes que la individual.","Art. 21.3: representantes pueden paralizar la actividad por mayoría de sus miembros.","Art. 22: vigilancia de la salud solo con consentimiento, con excepciones.","Art. 35: Delegados de Prevención: 50-100 = 2; 101-500 = 3; 501-1.000 = 4.","Art. 38: Comité de Seguridad y Salud en centros con 50 o más trabajadores; paritario."],"podcast":[{"v":"A","t":"Hola. Quinta lección: la Ley treinta y uno de mil novecientos noventa y cinco, de Prevención de Riesgos Laborales."},{"v":"B","t":"Empecemos por lo básico. El objeto de la ley es promover la seguridad y la salud de los trabajadores mediante medidas de prevención de riesgos derivados del trabajo. Y se aplica tanto a las relaciones laborales como a las administrativas o estatutarias del personal de las Administraciones Públicas. O sea, también a ti cuando seas funcionaria."},{"v":"A","t":"Cuatro definiciones. Prevención: medidas en todas las fases de actividad para evitar o disminuir los riesgos. Riesgo laboral: la posibilidad de que un trabajador sufra un daño derivado del trabajo, y se valora con probabilidad y severidad. Daños derivados del trabajo: enfermedades, patologías o lesiones. Y riesgo grave e inminente: el que es probable racionalmente que se materialice en un futuro inmediato y pueda causar un daño grave."},{"v":"B","t":"El artículo catorce: los trabajadores tienen derecho a una protección eficaz. Eso supone un deber del empresario, y un deber también de las Administraciones públicas respecto de su personal."},{"v":"A","t":"Los principios de la acción preventiva del artículo quince son nueve: evitar los riesgos, evaluar los que no se pueden evitar, combatirlos en su origen, adaptar el trabajo a la persona, tener en cuenta la evolución de la técnica, sustituir lo peligroso por lo que entrañe poco o ningún peligro, planificar la prevención, anteponer la protección colectiva a la individual y dar instrucciones a los trabajadores."},{"v":"B","t":"La prevención se integra en la empresa mediante un plan de prevención. Los instrumentos esenciales son la evaluación de riesgos y la planificación de la actividad preventiva."},{"v":"A","t":"Riesgo grave e inminente: el trabajador puede interrumpir su actividad y abandonar el lugar de trabajo. Y si el empresario no actúa, los representantes de los trabajadores pueden acordar la paralización por mayoría de sus miembros."},{"v":"B","t":"Vigilancia de la salud: es periódica y voluntaria, solo con consentimiento del trabajador. Hay excepciones, previo informe de los representantes, cuando es imprescindible para evaluar los efectos del trabajo, comprobar si su estado de salud puede ser un peligro, o lo establezca una norma."},{"v":"A","t":"Obligaciones de los trabajadores en el artículo veintinueve: velar por su propia seguridad y la de otros, usar bien máquinas y equipos de protección, no inutilizar los dispositivos de seguridad, informar de inmediato a su superior de cualquier riesgo, y cooperar con el empresario."},{"v":"B","t":"Organización de la prevención: el empresario designa a uno o varios trabajadores, constituye un servicio de prevención propio, o lo concierta con una entidad especializada ajena."},{"v":"A","t":"Participación. Hasta aquí lo de los Delegados de Prevención: son los representantes de los trabajadores con funciones específicas. La escala del artículo treinta y cinco: de cincuenta a cien trabajadores, dos delegados; de ciento uno a quinientos, tres; de quinientos uno a mil, cuatro."},{"v":"B","t":"El Comité de Seguridad y Salud es un órgano paritario y colegiado. Se constituye con cincuenta o más trabajadores. Lo forman los Delegados de Prevención y el empresario o sus representantes, en igual número."},{"v":"A","t":"Y por último, la Inspección de Trabajo. Puede ordenar la paralización inmediata si hay riesgo grave e inminente. El incumplimiento del empresario da lugar a responsabilidades administrativas, penales y civiles. En el personal civil de las Administraciones públicas, la sanción es imponer la realización de las medidas correctoras."},{"v":"B","t":"Haz el test y recuerda: nueve principios, el cincuenta de los delegados y del comité, y la voluntariedad del reconocimiento médico. Hasta la próxima."}],"preguntas":[{"q":"Según el artículo 2.1 de la Ley 31/1995, ¿cuál es el objeto de la ley?","o":["Promover la seguridad y la salud de los trabajadores mediante la prevención de los riesgos derivados del trabajo","Regular las prestaciones por accidente de trabajo","Fijar el salario mínimo de los trabajadores expuestos a riesgo","Establecer las sanciones a los trabajadores negligentes"],"c":0,"e":"Art. 2.1 LPRL.","r":"LPRL art. 2"},{"q":"Según el artículo 3.1 de la LPRL, la ley se aplica a las relaciones laborales y también a:","o":["Las relaciones de carácter administrativo o estatutario del personal al servicio de las Administraciones Públicas","Solo a las empresas privadas","Solo a los trabajadores por cuenta ajena del sector industrial","Únicamente a las Administraciones Públicas"],"c":0,"e":"Art. 3.1 LPRL, con las peculiaridades que se prevean.","r":"LPRL art. 3"},{"q":"Según el artículo 4 de la LPRL, se entiende por «riesgo laboral»:","o":["La posibilidad de que un trabajador sufra un determinado daño derivado del trabajo","El daño sufrido con motivo del trabajo","Cualquier característica del trabajo que influya en la salud","El conjunto de medidas para evitar daños"],"c":0,"e":"Art. 4.2.º LPRL. Para calificar su gravedad se valoran la probabilidad y la severidad del daño.","r":"LPRL art. 4"},{"q":"Según el artículo 4 de la LPRL, ¿qué se considera «daños derivados del trabajo»?","o":["Las enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo","Solo los accidentes con baja médica","Solo las enfermedades profesionales reconocidas","Los daños materiales a los equipos de trabajo"],"c":0,"e":"Art. 4.3.º LPRL.","r":"LPRL art. 4"},{"q":"Se entenderá como «riesgo laboral grave e inminente» aquel que resulte:","o":["Probable racionalmente que se materialice en un futuro inmediato y pueda suponer un daño grave para la salud de los trabajadores","Posible en cualquier momento de la vida laboral","Que ya ha causado un daño grave a un trabajador","Que haya sido calificado por el servicio de prevención ajeno"],"c":0,"e":"Art. 4.4.º LPRL.","r":"LPRL art. 4"},{"q":"Según el artículo 4 de la LPRL, la «prevención» es el conjunto de actividades o medidas adoptadas o previstas en:","o":["Todas las fases de actividad de la empresa, con el fin de evitar o disminuir los riesgos derivados del trabajo","El momento de la contratación del trabajador","La evaluación inicial de los puestos de trabajo exclusivamente","Las situaciones de emergencia"],"c":0,"e":"Art. 4.1.º LPRL.","r":"LPRL art. 4"},{"q":"Se crea como órgano colegiado asesor de las Administraciones públicas en la formulación de las políticas de prevención:","o":["La Comisión Nacional de Seguridad y Salud en el Trabajo","El Consejo de Estado","La Inspección de Trabajo y Seguridad Social","El Comité de Seguridad y Salud"],"c":0,"e":"Art. 13.1 LPRL.","r":"LPRL art. 13"},{"q":"Según el artículo 14.1 de la LPRL, el deber de protección de los trabajadores frente a los riesgos laborales constituye también un deber:","o":["De las Administraciones públicas respecto del personal a su servicio","Exclusivo de la Inspección de Trabajo","De los sindicatos más representativos","Únicamente de los servicios de prevención ajenos"],"c":0,"e":"Art. 14.1 LPRL.","r":"LPRL art. 14"},{"q":"Según el artículo 15.1 de la LPRL, ¿cuál de los siguientes es un principio general de la acción preventiva?","o":["Adoptar medidas que antepongan la protección colectiva a la individual","Anteponer la protección individual a la colectiva","Mantener el trabajo monótono y repetitivo","Sustituir lo poco peligroso por lo muy peligroso"],"c":0,"e":"Art. 15.1.h LPRL.","r":"LPRL art. 15"},{"q":"Según el artículo 15.1 de la LPRL, el empresario aplicará, entre otros, el principio de:","o":["Evitar los riesgos y evaluar los que no se puedan evitar","Trasladar todos los riesgos al trabajador","Evaluar solo los riesgos que se puedan evitar","Combatir los riesgos solo en su destino"],"c":0,"e":"Art. 15.1.a y b LPRL.","r":"LPRL art. 15"},{"q":"Según el artículo 16.1 de la LPRL, la prevención de riesgos laborales se integra en el sistema general de gestión de la empresa a través de:","o":["La implantación y aplicación de un plan de prevención de riesgos laborales","Un acuerdo de la Inspección de Trabajo","La contratación de un seguro de accidentes","Un reglamento del Comité de Empresa"],"c":0,"e":"Art. 16.1 LPRL. Sus instrumentos esenciales son la evaluación de riesgos y la planificación de la actividad preventiva.","r":"LPRL art. 16"},{"q":"El artículo 19 de la LPRL exige que la formación en materia preventiva sea:","o":["Teórica y práctica, suficiente y adecuada","Solo teórica y anual","Voluntaria para el trabajador","Impartida únicamente por la Inspección de Trabajo"],"c":0,"e":"Art. 19.1 LPRL: al contratarse y cuando cambien las funciones o las tecnologías.","r":"LPRL art. 19"},{"q":"Según el artículo 20 de la LPRL, el empresario debe analizar las posibles situaciones de emergencia y adoptar medidas en materia de:","o":["Primeros auxilios, lucha contra incendios y evacuación de los trabajadores","Seguros de vida y accidentes","Contratación de personal sanitario propio","Indemnizaciones por despido"],"c":0,"e":"Art. 20 LPRL.","r":"LPRL art. 20"},{"q":"Ante un riesgo grave e inminente, el artículo 21.2 de la LPRL reconoce al trabajador el derecho a:","o":["Interrumpir su actividad y abandonar el lugar de trabajo","Exigir una indemnización inmediata","Convocar una huelga sin preaviso","Cobrar un complemento de peligrosidad"],"c":0,"e":"Art. 21.2 LPRL, cuando considere que la actividad entraña un riesgo grave e inminente para su vida o su salud.","r":"LPRL art. 21"},{"q":"Si el empresario no adopta las medidas necesarias ante un riesgo grave e inminente, los representantes legales de los trabajadores podrán acordar la paralización de la actividad:","o":["Por mayoría de sus miembros","Por unanimidad de sus miembros","Por decisión del Delegado de Prevención más antiguo","Previa autorización judicial"],"c":0,"e":"Art. 21.3 LPRL.","r":"LPRL art. 21"},{"q":"Según el artículo 22.1 de la LPRL, la vigilancia periódica del estado de salud de los trabajadores solo podrá llevarse a cabo:","o":["Cuando el trabajador preste su consentimiento, salvo las excepciones previstas","En todo caso, sin excepciones y de forma obligatoria","Solo si lo decide el Comité de Empresa","Cuando lo pida el servicio de prevención ajeno"],"c":0,"e":"Art. 22.1 LPRL. Excepciones, previo informe de los representantes, en los supuestos legales.","r":"LPRL art. 22"},{"q":"Según el artículo 28.1 de la LPRL, los trabajadores con contrato temporal o de duración determinada deberán disfrutar:","o":["Del mismo nivel de protección en materia de seguridad y salud que los restantes trabajadores","De un nivel inferior de protección","De protección solo si superan seis meses","De protección únicamente en caso de accidente"],"c":0,"e":"Art. 28.1 LPRL.","r":"LPRL art. 28"},{"q":"Entre las obligaciones de los trabajadores en materia de prevención (art. 29.2 LPRL) figura:","o":["Informar de inmediato a su superior jerárquico de cualquier situación que entrañe un riesgo para la seguridad y la salud","Costear los equipos de protección individual","Realizar la evaluación de riesgos de su puesto","Designar al servicio de prevención"],"c":0,"e":"Art. 29.2.4.º LPRL.","r":"LPRL art. 29"},{"q":"Según el artículo 30.1 de la LPRL, para cumplir el deber de prevención, el empresario designará uno o varios trabajadores, constituirá un servicio de prevención o:","o":["Concertará dicho servicio con una entidad especializada ajena a la empresa","Solicitará un informe a la Inspección de Trabajo","Nombrará un Delegado de Prevención","Contratará una mutua de accidentes"],"c":0,"e":"Art. 30.1 LPRL.","r":"LPRL art. 30"},{"q":"Según el artículo 34.1 de la LPRL, en empresas o centros de trabajo que cuenten con seis o más trabajadores, la participación de estos en prevención se canalizará a través de:","o":["Sus representantes y de la representación especializada","Asambleas de todos los trabajadores","Un buzón de sugerencias","El empresario exclusivamente"],"c":0,"e":"Art. 34.1 LPRL.","r":"LPRL art. 34"},{"q":"Los Delegados de Prevención son, según el artículo 35.1 de la LPRL:","o":["Los representantes de los trabajadores con funciones específicas en materia de prevención de riesgos en el trabajo","Técnicos nombrados por el empresario","Funcionarios de la Inspección de Trabajo","Miembros del servicio de prevención ajeno"],"c":0,"e":"Art. 35.1 LPRL. Se designan por y entre los representantes del personal.","r":"LPRL art. 35"},{"q":"¿Cuántos Delegados de Prevención corresponden a una empresa de 101 a 500 trabajadores según el artículo 35.2?","o":["2","3","4","5"],"c":1,"e":"50 a 100: 2; 101 a 500: 3; 501 a 1.000: 4; 1.001 a 2.000: 5.","r":"LPRL art. 35"},{"q":"En empresas de 31 a 49 trabajadores habrá, según el artículo 35.2 de la LPRL:","o":["Un Delegado de Prevención, elegido por y entre los Delegados de Personal","Dos Delegados de Prevención","Un Comité de Seguridad y Salud","Ningún Delegado de Prevención"],"c":0,"e":"Art. 35.2 LPRL.","r":"LPRL art. 35"},{"q":"El Comité de Seguridad y Salud, según el artículo 38 de la LPRL, es:","o":["Un órgano paritario y colegiado de participación destinado a la consulta regular y periódica","Un órgano unipersonal de la empresa","Un órgano de la Inspección de Trabajo","Un órgano consultivo del Gobierno"],"c":0,"e":"Art. 38.1 LPRL.","r":"LPRL art. 38"},{"q":"Se constituirá un Comité de Seguridad y Salud en todas las empresas o centros de trabajo que cuenten con:","o":["50 o más trabajadores","25 o más trabajadores","100 o más trabajadores","Más de 250 trabajadores"],"c":0,"e":"Art. 38.2 LPRL.","r":"LPRL art. 38"},{"q":"Según el artículo 40.1 de la LPRL, los trabajadores y sus representantes podrán recurrir a la Inspección de Trabajo y Seguridad Social si consideran que:","o":["Las medidas adoptadas y los medios utilizados por el empresario no son suficientes para garantizar la seguridad y la salud","El salario es insuficiente","El horario de trabajo es excesivo","La empresa no tiene Comité de Empresa"],"c":0,"e":"Art. 40.1 LPRL.","r":"LPRL art. 40"},{"q":"El incumplimiento por los empresarios de sus obligaciones en materia de prevención dará lugar, según el artículo 42.1, a responsabilidades:","o":["Administrativas y, en su caso, penales y civiles","Solo administrativas","Solo penales","Solo laborales"],"c":0,"e":"Art. 42.1 LPRL.","r":"LPRL art. 42"},{"q":"Si el Inspector de Trabajo comprueba un riesgo grave e inminente para la seguridad y la salud de los trabajadores, según el artículo 44.1 podrá:","o":["Ordenar la paralización inmediata de tales trabajos o tareas","Solo proponer una sanción económica","Esperar al informe del Comité de Seguridad y Salud","Delegar la decisión en el servicio de prevención"],"c":0,"e":"Art. 44.1 LPRL.","r":"LPRL art. 44"}],"notas":["Los artículos 47, 48 y 49 de la Ley 31/1995 están derogados. No los estudies.","Para una funcionaria cuenta sobre todo: el art. 3 (se aplica al personal de las Administraciones), el art. 14 (el deber de protección es también de las Administraciones), el art. 45 (en el personal civil de las Administraciones, la sanción es imponer medidas correctoras) y la organización de la participación (Delegados de Prevención y Comité de Seguridad y Salud).","Las cifras que se preguntan: 6 trabajadores (representantes), 50 o más (Comité de Seguridad y Salud), la escala de Delegados (50-100: 2; 101-500: 3; 501-1.000: 4)."],"mp3":true},"g6":{"id":"g6","bloque":"General","num":6,"titulo":"Igualdad: Ley Orgánica 3/2007 y Ley 4/2023 (LGTBI)","alcance":"LO 3/2007 (Igualdad efectiva de mujeres y hombres): Título Preliminar, Título I y Título IV. Ley 4/2023: Título Preliminar y Título I (cap. I y cap. II, secciones 1.ª y 2.ª).","fuentes":["BOE-A-2007-6115 (Ley Orgánica 3/2007, de 22 de marzo, texto consolidado)","BOE-A-2023-5366 (Ley 4/2023, de 28 de febrero, texto consolidado)"],"peso":"medio","apuntes":[{"h":"LO 3/2007: Título Preliminar (arts. 1 y 2)","t":"- **Art. 1.1**: las mujeres y los hombres son **iguales en dignidad humana, e iguales en derechos y deberes**. La ley tiene por objeto **hacer efectivo el derecho de igualdad de trato y de oportunidades entre mujeres y hombres**, eliminando la discriminación de la mujer en cualquier ámbito, en desarrollo de los **arts. 9.2 y 14 de la Constitución**.\n- **Art. 1.2**: establece principios de actuación de los poderes públicos, regula derechos y deberes de personas físicas y jurídicas, públicas y privadas, y prevé medidas para eliminar y corregir toda forma de discriminación por razón de sexo.\n- **Art. 2.1**: **todas las personas** gozarán de los derechos derivados de la igualdad de trato y de la prohibición de discriminación por razón de sexo.\n- **Art. 2.2**: las obligaciones se aplican a toda persona, física o jurídica, que **se encuentre o actúe en territorio español**, sea cual fuere su nacionalidad, domicilio o residencia."},{"h":"LO 3/2007: Título I, principio de igualdad y tutela (arts. 3 a 13)","t":"- **Art. 3 Principio de igualdad de trato**: **ausencia de toda discriminación, directa o indirecta, por razón de sexo**, y especialmente las derivadas de la **maternidad, la asunción de obligaciones familiares y el estado civil**.\n- **Art. 4**: la igualdad de trato y de oportunidades es un **principio informador del ordenamiento jurídico** y se integra en la interpretación y aplicación de las normas.\n- **Art. 5**: se garantiza en el empleo privado y público: **acceso al empleo (incluso por cuenta propia), formación profesional, promoción profesional, condiciones de trabajo (retributivas y de despido)** y afiliación a organizaciones sindicales y empresariales.\n- **Art. 6.1 Discriminación directa**: ser tratada, haber sido tratada o poder serlo, por razón de sexo, **de manera menos favorable que otra en situación comparable**.\n- **Art. 6.2 Discriminación indirecta**: una disposición, criterio o práctica **aparentemente neutros** pone a personas de un sexo en desventaja particular, salvo justificación objetiva por una finalidad legítima con medios necesarios y adecuados.\n- **Art. 6.3**: se considera discriminatoria **toda orden de discriminar**.\n- **Art. 7 Acoso**: **acoso sexual**: comportamiento verbal o físico de naturaleza sexual con el propósito o efecto de atentar contra la dignidad y crear un entorno intimidatorio, degradante u ofensivo. **Acoso por razón de sexo**: comportamiento realizado en función del sexo con ese propósito o efecto. Ambos son **siempre discriminatorios**; condicionar un derecho a aceptar el acoso también lo es.\n- **Art. 8**: todo **trato desfavorable a las mujeres relacionado con el embarazo o la maternidad** es discriminación directa.\n- **Art. 9 Indemnidad frente a represalias**: es discriminación cualquier trato adverso por haber presentado **queja, reclamación, denuncia, demanda o recurso** para exigir la igualdad.\n- **Art. 10**: los actos y cláusulas discriminatorios son **nulos y sin efecto** y dan lugar a responsabilidad con reparaciones o indemnizaciones reales, efectivas y proporcionadas.\n- **Art. 11 Acciones positivas**: los poderes públicos adoptarán medidas específicas a favor de las mujeres para corregir desigualdades de hecho; han de ser **razonables y proporcionadas** y duran mientras subsistan esas situaciones.\n- **Art. 12**: **tutela judicial** del derecho a la igualdad (art. 53.2 CE) para cualquier persona, incluso tras terminar la relación.\n- **Art. 13 Prueba**: si la parte actora alega discriminación por razón de sexo, **corresponde a la persona demandada probar la ausencia de discriminación** y la proporcionalidad de las medidas."},{"h":"LO 3/2007: Título IV, derecho al trabajo en igualdad (arts. 42 a 50)","t":"- **Art. 42**: las políticas de empleo tienen entre sus objetivos prioritarios **aumentar la participación de las mujeres en el mercado de trabajo**.\n- **Art. 43**: la **negociación colectiva** puede establecer medidas de acción positiva para favorecer el acceso de las mujeres al empleo.\n- **Art. 44**: **conciliación** de la vida personal, familiar y laboral: derechos que **fomenten la asunción equilibrada de las responsabilidades familiares**, evitando toda discriminación por su ejercicio.\n- **Art. 45**: las empresas respetarán la igualdad de trato y oportunidades y negociarán con los representantes de los trabajadores medidas para evitar la discriminación. Las empresas de **cincuenta o más trabajadores** deben elaborar y aplicar un **plan de igualdad**.\n- **Art. 46**: los planes de igualdad son un conjunto ordenado de medidas, adoptadas **después de realizar un diagnóstico de situación**, para alcanzar la igualdad y eliminar la discriminación por razón de sexo; fijan objetivos, estrategias y sistemas de seguimiento y evaluación.\n- **Art. 47**: la representación legal de los trabajadores tiene acceso a la información sobre el contenido de los planes de igualdad y sus objetivos.\n- **Art. 48**: las empresas promoverán condiciones de trabajo que eviten el **acoso sexual y el acoso por razón de sexo**, incluidos los del ámbito digital, con medidas negociadas como **códigos de buenas prácticas**, campañas informativas o formación.\n- **Art. 49**: el Gobierno fomenta la adopción voluntaria de planes de igualdad, sobre todo en pymes.\n- **Art. 50**: **distintivo empresarial** para reconocer a las empresas que destaquen por sus políticas de igualdad."},{"h":"Ley 4/2023: Título Preliminar (arts. 1 a 3)","t":"- **Art. 1**: la finalidad es **garantizar y promover el derecho a la igualdad real y efectiva de las personas lesbianas, gais, trans, bisexuales e intersexuales (LGTBI)** y de sus familias. Establece principios de actuación de los poderes públicos y medidas contra toda forma de discriminación.\n- **Art. 2**: se aplica a toda persona física o jurídica, pública o privada, que **resida, se encuentre o actúe en territorio español**, sea cual sea su nacionalidad, origen, religión, domicilio, edad o situación administrativa.\n- **Art. 3 Definiciones**: **discriminación directa**: ser tratada de manera menos favorable que otras en situación comparable por razón de orientación sexual, identidad sexual, expresión de género o características sexuales; **se considera discriminación directa la denegación de ajustes razonables a las personas con discapacidad**. **Discriminación indirecta**: disposición, criterio o práctica **aparentemente neutros** que ocasiona una desventaja particular. También se definen la discriminación múltiple e interseccional, el acoso discriminatorio, la intersexualidad, la identidad sexual, la persona trans, la familia LGTBI, la LGTBIfobia, la homofobia y la transfobia."},{"h":"Ley 4/2023: Título I, Capítulo I (arts. 4 a 9)","t":"- **Art. 4**: los poderes públicos desarrollarán las medidas necesarias para **reconocer, garantizar, proteger y promover** la igualdad de trato y no discriminación de las personas LGTBI y sus familias.\n- **Art. 5**: poner en valor la **diversidad** en orientación sexual, identidad sexual, expresión de género, características sexuales y la diversidad familiar; fomentar el reconocimiento institucional y la participación en actos conmemorativos.\n- **Art. 6**: **campañas de sensibilización**, divulgación y fomento del respeto a la diversidad.\n- **Art. 7**: impulsar **estudios y encuestas** sobre la situación de las personas LGTBI, con indicadores que permitan conocer las causas y la evolución de la discriminación.\n- **Art. 8**: **cooperación** entre la Administración General del Estado, las comunidades autónomas, Ceuta y Melilla y las entidades locales; planes y programas conjuntos en la **Conferencia Sectorial de Igualdad**.\n- **Art. 9 Consejo de Participación de las Personas LGTBI**: es el **órgano de participación ciudadana** en materia de derechos y libertades de las personas LGTBI. Es un órgano colegiado del art. 22.3 de la Ley 40/2015. **Depende del Ministerio de Igualdad** a través de la Secretaría de Estado de Igualdad y contra la Violencia de Género. Presenta una **memoria semestral**."},{"h":"Ley 4/2023: Título I, Capítulo II, secciones 1.ª y 2.ª (arts. 10 a 13)","t":"- **Art. 10 Estrategia estatal** para la igualdad de trato y no discriminación de las personas LGTBI: es el **instrumento principal de colaboración territorial** para impulsar las políticas básicas de la ley. La elabora el **Ministerio de Igualdad**; se aprueba mediante **Acuerdo del Consejo de Ministros**, previo informe favorable de la **Conferencia Sectorial de Igualdad**. Tiene **carácter cuatrienal** y se evalúa al terminar su duración.\n- **Art. 11 (ámbito administrativo)**: las Administraciones públicas garantizarán los derechos de la ley para **el conjunto del personal a su servicio** y adoptarán medidas para la promoción y defensa de la igualdad de trato en el **acceso al empleo público y la carrera profesional**, previa **negociación con las organizaciones sindicales**.\n- **Art. 12**: las Administraciones impartirán **formación inicial y continuada** al personal sobre diversidad y no discriminación LGTBI. Además, **incluirán en los programas de las pruebas selectivas de acceso al empleo público formación y conocimientos sobre igualdad de trato y no discriminación de las personas LGTBI** (art. 12.2).\n- **Art. 13**: las Administraciones procurarán que la **documentación administrativa y los formularios** sean adecuados a la diversidad en orientación sexual, identidad sexual, expresión de género, características sexuales y diversidad familiar."}],"clave":["LO 3/2007 art. 6: discriminación directa (trato menos favorable) e indirecta (aparentemente neutro).","LO 3/2007 art. 7: el acoso sexual y el acoso por razón de sexo son siempre discriminatorios.","LO 3/2007 art. 13: la persona demandada debe probar la ausencia de discriminación.","LO 3/2007 art. 45: plan de igualdad en empresas de cincuenta o más trabajadores.","LO 3/2007 art. 46: el plan de igualdad se basa en un diagnóstico de situación.","Ley 4/2023 art. 3: denegar ajustes razonables a personas con discapacidad es discriminación directa.","Ley 4/2023 art. 10: Estrategia estatal cuatrienal, aprobada por Acuerdo del Consejo de Ministros.","Ley 4/2023 art. 12.2: las pruebas selectivas incluyen conocimientos sobre igualdad LGTBI."],"podcast":[{"v":"A","t":"Hola. Sexta lección del bloque general, y última de esta tanda: igualdad. Dos leyes: la Ley Orgánica 3 de 2007 de igualdad efectiva de mujeres y hombres, y la Ley 4 de 2023 para la igualdad real de las personas trans y para la garantía de los derechos de las personas LGTBI."},{"v":"B","t":"Primera ley. En el artículo uno, mujeres y hombres son iguales en dignidad humana, e iguales en derechos y deberes. La ley desarrolla los artículos nueve punto dos y catorce de la Constitución. Y se aplica a toda persona que se encuentre o actúe en territorio español, sea cual sea su nacionalidad."},{"v":"A","t":"El principio de igualdad de trato es la ausencia de toda discriminación, directa o indirecta, por razón de sexo, y en especial las derivadas de la maternidad, de las obligaciones familiares y del estado civil. Es un principio informador del ordenamiento jurídico."},{"v":"B","t":"Discriminación directa: tratar a una persona de manera menos favorable que a otra en situación comparable. Discriminación indirecta: una disposición, criterio o práctica aparentemente neutros que pone a personas de un sexo en desventaja particular, salvo justificación objetiva. Y también es discriminatoria toda orden de discriminar."},{"v":"A","t":"Acoso. El acoso sexual es un comportamiento, verbal o físico, de naturaleza sexual con el propósito o efecto de atentar contra la dignidad. El acoso por razón de sexo es el comportamiento realizado en función del sexo con ese mismo propósito o efecto. Los dos son siempre discriminatorios."},{"v":"B","t":"Más cosas del Título Uno. Todo trato desfavorable a las mujeres por embarazo o maternidad es discriminación directa. Hay protección frente a represalias por reclamar. Los actos discriminatorios son nulos. Y las acciones positivas deben ser razonables y proporcionadas."},{"v":"A","t":"Un dato procesal importante: si la parte actora alega discriminación por razón de sexo, corresponde a la persona demandada probar la ausencia de discriminación y la proporcionalidad de las medidas."},{"v":"B","t":"Título Cuatro, el trabajo. Las políticas de empleo buscan aumentar la participación de las mujeres. Las empresas de cincuenta o más trabajadores deben elaborar y aplicar un plan de igualdad. Y el plan se hace después de un diagnóstico de situación, con objetivos, estrategias y sistemas de seguimiento y evaluación."},{"v":"A","t":"Las empresas deben promover condiciones de trabajo que eviten el acoso sexual y el acoso por razón de sexo, también en el ámbito digital, con medidas como códigos de buenas prácticas o campañas. Y existe un distintivo empresarial para reconocer las buenas políticas de igualdad."},{"v":"B","t":"Pasamos a la Ley 4 de 2023. Su finalidad es garantizar y promover la igualdad real y efectiva de las personas lesbianas, gais, trans, bisexuales e intersexuales y de sus familias. Se aplica a quien resida, se encuentre o actúe en territorio español."},{"v":"A","t":"Definiciones. Discriminación directa: trato menos favorable por razón de orientación sexual, identidad sexual, expresión de género o características sexuales. Importante: la denegación de ajustes razonables a personas con discapacidad se considera discriminación directa. Y discriminación indirecta, de nuevo, disposiciones aparentemente neutras."},{"v":"B","t":"Título Uno. Los poderes públicos deben reconocer, garantizar, proteger y promover la igualdad de trato. Hacen campañas de sensibilización, estudios y encuestas, y cooperan en la Conferencia Sectorial de Igualdad."},{"v":"A","t":"El Consejo de Participación de las Personas LGTBI es el órgano de participación ciudadana. Depende del Ministerio de Igualdad y presenta una memoria semestral."},{"v":"B","t":"La Estrategia estatal es el instrumento principal de colaboración territorial. La elabora el Ministerio de Igualdad, la aprueba el Consejo de Ministros previo informe favorable de la Conferencia Sectorial, y es cuatrienal."},{"v":"A","t":"Y para ti, lo más curioso: el artículo doce dice que las Administraciones incluirán en los programas de las pruebas selectivas de acceso al empleo público formación y conocimientos sobre igualdad de trato y no discriminación de las personas LGTBI. Por eso entra en tu examen. Haz el test, y hasta la próxima."}],"preguntas":[{"q":"Según el artículo 1.1 de la LO 3/2007, las mujeres y los hombres son:","o":["Iguales en dignidad humana, e iguales en derechos y deberes","Iguales solo en derechos laborales","Iguales en derechos, pero con deberes distintos","Iguales ante la ley, salvo en el ámbito familiar"],"c":0,"e":"Art. 1.1 LO 3/2007.","r":"LOIG art. 1"},{"q":"La LO 3/2007 desarrolla, según su artículo 1.1, los artículos de la Constitución:","o":["9.2 y 14","10 y 15","14 y 53","35 y 39"],"c":0,"e":"Art. 1.1 LO 3/2007.","r":"LOIG art. 1"},{"q":"Las obligaciones de la LO 3/2007 se aplican, según su artículo 2.2, a toda persona física o jurídica que:","o":["Se encuentre o actúe en territorio español, cualquiera que fuese su nacionalidad, domicilio o residencia","Tenga nacionalidad española","Resida en España más de un año","Sea empresaria o trabajadora por cuenta ajena"],"c":0,"e":"Art. 2.2 LO 3/2007.","r":"LOIG art. 2"},{"q":"El principio de igualdad de trato entre mujeres y hombres supone, según el artículo 3, la ausencia de toda discriminación:","o":["Directa o indirecta, por razón de sexo, y especialmente las derivadas de la maternidad, la asunción de obligaciones familiares y el estado civil","Solo directa, por razón de sexo","Solo en el ámbito laboral","Solo en el acceso al empleo público"],"c":0,"e":"Art. 3 LO 3/2007.","r":"LOIG art. 3"},{"q":"Según el artículo 4 de la LO 3/2007, la igualdad de trato y de oportunidades entre mujeres y hombres es:","o":["Un principio informador del ordenamiento jurídico","Un derecho exclusivo del ámbito laboral","Un principio solo aplicable a las Administraciones","Una recomendación sin efecto interpretativo"],"c":0,"e":"Art. 4 LO 3/2007.","r":"LOIG art. 4"},{"q":"Según el artículo 5 de la LO 3/2007, el principio de igualdad se garantiza, entre otros ámbitos, en:","o":["El acceso al empleo, incluso al trabajo por cuenta propia, la formación y la promoción profesionales","Solo en el acceso al empleo público","Solo en las condiciones retributivas","Solo en el despido"],"c":0,"e":"Art. 5 LO 3/2007.","r":"LOIG art. 5"},{"q":"Se considera discriminación directa por razón de sexo, según el artículo 6.1:","o":["Ser tratada, haber sido tratada o poder serlo de manera menos favorable que otra persona en situación comparable, en atención al sexo","Aplicar una práctica aparentemente neutra que perjudique a un sexo","Recibir una orden de discriminar","Sufrir acoso en el trabajo"],"c":0,"e":"Art. 6.1 LO 3/2007.","r":"LOIG art. 6"},{"q":"La discriminación indirecta por razón de sexo se produce, según el artículo 6.2, cuando una disposición, criterio o práctica:","o":["Aparentemente neutros pone a personas de un sexo en desventaja particular, salvo justificación objetiva","Trata explícitamente peor a las mujeres","Se aplica solo a un sexo por ley","Se origina en una orden de la dirección"],"c":0,"e":"Art. 6.2 LO 3/2007.","r":"LOIG art. 6"},{"q":"Según el artículo 6.3 de la LO 3/2007, se considera discriminatoria:","o":["Toda orden de discriminar, directa o indirectamente, por razón de sexo","Solo la orden de discriminar por escrito","Solo la orden dada por un superior jerárquico","Ninguna orden, si no se ejecuta"],"c":0,"e":"Art. 6.3 LO 3/2007.","r":"LOIG art. 6"},{"q":"El acoso sexual y el acoso por razón de sexo se consideran, según el artículo 7.3:","o":["En todo caso discriminatorios","Discriminatorios solo si se reiteran","Discriminatorios solo si hay denuncia penal","Faltas administrativas sin carácter discriminatorio"],"c":0,"e":"Art. 7.3 LO 3/2007.","r":"LOIG art. 7"},{"q":"Constituye acoso sexual, según el artículo 7.1 de la LO 3/2007, cualquier comportamiento, verbal o físico, de naturaleza sexual que tenga:","o":["El propósito o produzca el efecto de atentar contra la dignidad de una persona, en particular creando un entorno intimidatorio, degradante u ofensivo","Intención de ofender públicamente","Carácter reiterado durante más de seis meses","Consecuencias laborales demostrables"],"c":0,"e":"Art. 7.1 LO 3/2007.","r":"LOIG art. 7"},{"q":"Según el artículo 8 de la LO 3/2007, constituye discriminación directa por razón de sexo:","o":["Todo trato desfavorable a las mujeres relacionado con el embarazo o la maternidad","Solo el despido durante el embarazo","Solo la negativa a contratar embarazadas","Ninguna situación relacionada con la maternidad"],"c":0,"e":"Art. 8 LO 3/2007.","r":"LOIG art. 8"},{"q":"Según el artículo 9 de la LO 3/2007, también es discriminación por razón de sexo cualquier trato adverso como consecuencia de:","o":["La presentación de queja, reclamación, denuncia, demanda o recurso destinados a impedir la discriminación","El cambio de puesto de trabajo","La baja médica por enfermedad","La participación en un sindicato"],"c":0,"e":"Art. 9 LO 3/2007 (indemnidad frente a represalias).","r":"LOIG art. 9"},{"q":"Los actos y cláusulas de los negocios jurídicos que constituyan o causen discriminación por razón de sexo se considerarán, según el artículo 10:","o":["Nulos y sin efecto","Anulables a instancia de parte","Válidos pero sancionables","Válidos si hay acuerdo de las partes"],"c":0,"e":"Art. 10 LO 3/2007.","r":"LOIG art. 10"},{"q":"Las medidas específicas en favor de las mujeres para corregir desigualdades de hecho (art. 11.1) habrán de ser:","o":["Razonables y proporcionadas en relación con el objetivo perseguido","Permanentes e irrevocables","Generales y sin límite de tiempo","Aprobadas solo por ley orgánica"],"c":0,"e":"Art. 11.1 LO 3/2007. Se aplican en tanto subsistan las situaciones de desigualdad.","r":"LOIG art. 11"},{"q":"En los procedimientos en que la parte actora alegue discriminación por razón de sexo, según el artículo 13.1, corresponderá a la persona demandada:","o":["Probar la ausencia de discriminación en las medidas adoptadas y su proporcionalidad","Probar solo que actuó sin intención","Aportar un informe de la Inspección","Nada: la carga de la prueba es siempre de la actora"],"c":0,"e":"Art. 13.1 LO 3/2007 (inversión de la carga de la prueba).","r":"LOIG art. 13"},{"q":"Según el artículo 42.1 de la LO 3/2007, las políticas de empleo tendrán como uno de sus objetivos prioritarios:","o":["Aumentar la participación de las mujeres en el mercado de trabajo y avanzar en la igualdad efectiva","Reducir el empleo a tiempo parcial","Garantizar el empleo público a las mujeres","Fomentar la jubilación anticipada de las mujeres"],"c":0,"e":"Art. 42.1 LO 3/2007.","r":"LOIG art. 42"},{"q":"Los derechos de conciliación de la vida personal, familiar y laboral se reconocerán, según el artículo 44.1, de forma que fomenten:","o":["La asunción equilibrada de las responsabilidades familiares, evitando toda discriminación basada en su ejercicio","Que solo las mujeres asuman el cuidado familiar","La reducción de la jornada de las mujeres","La concentración de permisos en un progenitor"],"c":0,"e":"Art. 44.1 LO 3/2007.","r":"LOIG art. 44"},{"q":"¿A partir de cuántos trabajadores están obligadas las empresas a elaborar y aplicar un plan de igualdad según el artículo 45.2?","o":["Cincuenta o más","Veinticinco o más","Cien o más","Doscientos cincuenta o más"],"c":0,"e":"Art. 45.2 LO 3/2007.","r":"LOIG art. 45"},{"q":"Los planes de igualdad de las empresas son, según el artículo 46.1, un conjunto ordenado de medidas adoptadas:","o":["Después de realizar un diagnóstico d
