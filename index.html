{"q":"Las Cartas de Servicios de la UGR son aprobadas por:","o":["El Consejo de Gobierno de la UGR y publicadas en el Boletín Oficial de la Universidad de Granada","El Rector, mediante resolución","El Consejo Social","El Claustro Universitario"],"c":0,"e":"Preguntas frecuentes de Cartas de Servicios.","r":"CARTAS_SERVICIOS art. doc"},{"q":"¿Cuándo aprobó el Consejo de Gobierno las Cartas de Servicios para el periodo 2020/2021?","o":["El 25 de noviembre de 2019","El 26 de octubre de 2016","El 29 de octubre de 2021","El 22 de diciembre de 2025"],"c":0,"e":"Son siete cartas.","r":"CARTAS_SERVICIOS art. doc"},{"q":"¿Qué regula el Protocolo de Cartas de Servicio en la UGR?","o":["La sistemática de elaboración, aprobación y seguimiento de las cartas de servicio","El régimen sancionador de las unidades","La asignación de plazas del PTGAS","Las auditorías de la ISO 9001"],"c":0,"e":"Protocolo de Cartas de Servicio de la UGR.","r":"CARTAS_SERVICIOS art. doc"}],"mp3":true},"e13":{"id":"e13","bloque":"Específico","num":13,"titulo":"Códigos éticos","alcance":"El código ético de la Biblioteca Universitaria de Granada y el código ético de la Universidad de Granada.","fuentes":["Código Ético de la Biblioteca Universitaria de Granada (biblioteca.ugr.es, Normativa de la BUG)","Código Ético de la Universidad de Granada (ACG178/2, Consejo de Gobierno de 25 de febrero de 2022, BOUGR n.º 178, de 4 de marzo de 2022)"],"peso":"medio","notas":["Son dos documentos distintos. El código de la Biblioteca (BUG) es deontológico y para su personal profesional; el de la Universidad tiene ocho valores y se dirige a toda la comunidad universitaria. No los mezcles.","El texto oficial del código de la BUG salta del artículo 13 al 15: no existe artículo 14 en el documento publicado. No lo busques.","El código de la UGR es orientador y preventivo: no tiene carácter sancionador ni disciplinario. Es una de las frases que más se presta a preguntas de test.","El código de la UGR figura en el BOUGR n.º 178 (4/3/2022) como ACG178/2. Es posible que la UGR prepare una actualización (no está confirmado). Para el examen, estudia el aprobado en 2022 salvo que la UGR publique uno nuevo.","Aprende de memoria los ocho valores del código de la UGR y el órgano de seguimiento: la Comisión de Ética e Integridad."],"apuntes":[{"h":"Código ético de la Biblioteca (BUG): ámbito y normas generales","t":"- Implica a **todo el personal de la BUG**. Su aceptación es una **obligación voluntaria de autodisciplina «sobre y más allá de lo requerido por la ley»**.\n- Los profesionales tendrán en cuenta los **Estatutos** y las normas del entorno universitario, sin perjuicio de la **Declaración de los Derechos Humanos de las Naciones Unidas**, las proposiciones de la **IFLA** y el marco legal de la **Unión Europea, el Estado español y la Comunidad Autónoma de Andalucía**.\n- Se inspira, entre otros, en el **Código ético de la IFLA** (2012), el del **Col·legi de Bibliotecaris-Documentalistes de Catalunya** y el **código deontológico de la SEDIC**.\n- Estructura: 1 Preámbulo; 2 Ámbito y normas generales; 3 Principios generales; 4 **De los servicios a los usuarios**; 5 **Del fondo documental**; 6 **De las relaciones entre compañeros**; 7 **De la gestión de los puntos de servicio**; 8 De la contribución al decoro, la actualización y la formación profesional; 9 De la colaboración con la docencia, la investigación y la transferencia; 10 Disposiciones finales."},{"h":"Principios generales (arts. 1 a 6)","t":"- **Art. 1**: la declaración primordial es respetar la **libertad intelectual** y la defensa del **derecho de expresión** de cualquier opinión en el marco de la convivencia democrática y del respeto de los derechos humanos.\n- **Art. 2**: **no discriminación** por origen, edad, ideas, sexo, convicciones religiosas, políticas o cualquier otra diferencia.\n- **Art. 3**: velar por el **equilibrio entre los derechos de los autores en su obra y el derecho al acceso a la información y la cultura**.\n- **Art. 4**: no dejarse influir por **presiones internas o externas** y actuar con **máxima profesionalidad y objetividad**.\n- **Art. 5** (responsabilidades a-h): respeto a sí mismo y a la profesión; estar atento a los cambios técnicos; imagen innovadora; promover el reconocimiento de los servicios bibliotecarios; difundir el prestigio de la profesión; **guardar el secreto profesional**; no valerse de su influencia en provecho propio; combatir el ejercicio ilegal y la precariedad laboral.\n- **Art. 6**: contribuir al desarrollo de la profesión con aportaciones en revistas, intercambio de conocimientos, colaboración en investigación y participación en asociaciones profesionales."},{"h":"Servicios, fondo documental y compañeros (arts. 7 a 13)","t":"- **Art. 7**: servicios **de calidad** orientados a las necesidades informativas. Los **datos personales o de uso** quedan sometidos al **secreto profesional**; solo pueden difundirse si la persona afectada **lo autoriza expresamente** o en los **supuestos marcados por la ley**.\n- **Art. 8**: facilitar el acceso a la información y a los servicios **a todos los usuarios, sin distinción de sexo, edad, raza o condición social, de forma igualitaria**. Compromisos: atención ecuánime y honesta, hacer llegar la información, libre acceso a la información y al material, trato correcto, amable y personalizado, planificar y promocionar los servicios, escuchar con paciencia, **formar a los usuarios para que localicen la información por sí mismos** y apoyar sus tareas docentes y de investigación.\n- **Art. 9 Fondo documental**: debe reflejar la **diversidad cultural e ideológica**; **no se rechazarán adquisiciones o donaciones por razones ideológicas**, de origen, religión o política.\n- **Art. 10**: gestión **responsable y con criterios de sostenibilidad económica** de los fondos lícitamente adquiridos. **Art. 11**: **fomentar el acceso gratuito** a la información de los servicios propios.\n- **Art. 12**: fomentar el cumplimiento del código por todo el personal. **Art. 13** (compañeros): respeto mutuo, consideración y solidaridad; **en ningún caso se atribuirá el mérito de un trabajo que no haya realizado**."},{"h":"Gestión, formación y docencia (arts. 15 a 25) y disposiciones finales","t":"- **Art. 15** (no hay art. 14): la planificación de los servicios se hace conforme a la **legislación vigente** y a las normas y recomendaciones **reconocidas internacionalmente**.\n- **Art. 16**: implicarse en la **Misión y Visión** de la Biblioteca. **Art. 17**: fomentar la **cooperación** local, nacional e internacional y proyectos con colectivos desfavorecidos y países en vías de desarrollo.\n- **Art. 18**: **no ocultar** información necesaria a los usuarios **ni difundir información que se sepa falsa**.\n- **Art. 19**: ejercicio responsable y de calidad: usar bien los recursos, **defender el criterio profesional independiente**, abstenerse de actividades que perjudiquen la **integridad o imparcialidad**, y garantizar el **secreto profesional**.\n- **Arts. 20 a 22**: actualización sistemática de conocimientos técnicos y legislación; participación en formación, innovación e investigación; **formación interna**.\n- **Arts. 23 a 25**: apoyo a la enseñanza universitaria, formación en la investigación y la docencia mediante sesiones y talleres, y elaboración de materiales didácticos.\n- **Disposiciones finales**: **primera**, velar por el cumplimiento; **segunda**, darle **la máxima difusión** entre los miembros; **tercera**, el código **se renovará de manera permanente**, sujeto a mejoras y revisiones."},{"h":"Código ético de la Universidad de Granada: origen y características","t":"- Aprobado en la **sesión ordinaria del Consejo de Gobierno de 25 de febrero de 2022** y publicado en el **BOUGR n.º 178, de 4 de marzo de 2022** (**ACG178/2**). Lo elaboró la **Comisión de Ética e Integridad Académica**, adscrita al **Vicerrectorado de Política Institucional y Planificación**.\n- **Finalidad**: recoger los principios que guían la conducta de la comunidad universitaria y orientar su actuación ética frente a otros actores sociales y entidades colaboradoras.\n- **Carácter**: **orientador y preventivo; no tiene carácter sancionador o disciplinario**. Si un acto contrario al código constituye además una infracción administrativa, se aplican las normas legales y reglamentarias vigentes.\n- **Destinatarios**: **todo el personal docente e investigador, el personal de administración y servicios y el estudiantado**, y cualquier otra persona que participe en la actividad de la Universidad. También orienta las relaciones con entidades externas que colaboran con ella.\n- Es general, actual y propio de una **universidad pública**: da especial peso a la **transparencia, la rendición de cuentas y la integridad y honestidad en la gestión de los recursos públicos**."},{"h":"Los ocho valores del código de la UGR","t":"1. **Libertad académica**: es el fundamento de la actividad de la Universidad; libertad de enseñanza, estudio e investigación.\n2. **Dignidad y respeto**.\n3. **Igualdad, diversidad e inclusión**.\n4. **Integridad académica y honestidad**.\n5. **Buen gobierno, transparencia y rendición de cuentas**.\n6. **Corresponsabilidad y excelencia**.\n7. **Sostenibilidad**.\n8. **Compromiso con la institución y servicio público**: implica **anteponer los fines de la Universidad como servicio público a cualquier interés particular**, contribuir a su reputación y fomentar el sentido de pertenencia.\n\nCada valor se concreta, «a modo de ejemplo» y de forma **no exhaustiva**, en compromisos éticos y directrices de conducta."},{"h":"Seguimiento: la Comisión de Ética e Integridad","t":"- La **Comisión de Ética e Integridad de la Universidad de Granada** es el órgano encargado del **seguimiento** del código, de **interpretarlo** y de **velar por su cumplimiento**, según su Reglamento de funcionamiento interno, que aprueba el Consejo de Gobierno.\n- Es un órgano **institucional y representativo** de los distintos sectores, de carácter **independiente e interdisciplinar**, que actúa como **órgano consultivo y deliberativo**.\n- Fines: promover la **integridad científica, académica, de gestión** y las buenas prácticas; **elaborar y actualizar el código**; elaborar pautas y recomendaciones; y prevenir conductas que vulneren los derechos y la dignidad de las personas o la honorabilidad de la institución.\n- Elabora un **informe anual** de sus actuaciones.\n- **Participación**: un procedimiento abierto para que la comunidad dirija a la Comisión **consultas, propuestas y alertas de incumplimiento**."}],"clave":["Código BUG: se aplica a todo el personal de la BUG; aceptación voluntaria de autodisciplina.","Código BUG: no se rechazan adquisiciones o donaciones por razones ideológicas (art. 9).","Código BUG: no hay artículo 14; los datos personales solo se difunden con autorización expresa o por ley (art. 7).","Código UGR: Consejo de Gobierno, 25/02/2022, BOUGR 178 (ACG178/2); ocho valores.","Código UGR: orientador y preventivo, no sancionador.","Seguimiento: Comisión de Ética e Integridad; informe anual; canal de consultas, propuestas y alertas."],"podcast":[{"v":"A","t":"Hola. Tema trece del bloque específico: los códigos éticos. Dos documentos distintos, así que atención a no mezclarlos."},{"v":"B","t":"El primero es el Código Ético de la Biblioteca Universitaria de Granada. Implica a todo el personal de la Biblioteca. Su aceptación es voluntaria: una obligación de autodisciplina sobre y más allá de lo requerido por la ley."},{"v":"A","t":"Se guía por la Declaración de los Derechos Humanos de las Naciones Unidas, las proposiciones de la IFLA y el marco legal de la Unión Europea, el Estado español y Andalucía."},{"v":"B","t":"Principios generales. El artículo uno: respetar la libertad intelectual y el derecho de expresión. El dos: no discriminar. El tres: equilibrio entre los derechos de los autores y el derecho de acceso a la información. El cuatro: no dejarse influir por presiones internas o externas. Y el cinco incluye guardar el secreto profesional."},{"v":"A","t":"En los servicios a los usuarios: los datos personales o de uso están sometidos al secreto profesional y solo se difunden si la persona lo autoriza expresamente o lo marca la ley. Y hay que dar acceso a todos, sin distinción de sexo, edad, raza o condición social."},{"v":"B","t":"Sobre el fondo documental: debe reflejar la diversidad cultural e ideológica, y no se rechazarán adquisiciones ni donaciones por razones ideológicas. Se gestiona con criterios de sostenibilidad económica y se fomenta el acceso gratuito."},{"v":"A","t":"Entre compañeros: respeto mutuo y solidaridad, y en ningún caso se atribuirá el mérito de un trabajo que no se haya realizado. Y el artículo dieciocho: no ocultar información necesaria ni difundir información que se sepa falsa. Un dato curioso: en el texto publicado no existe el artículo catorce."},{"v":"B","t":"Las disposiciones finales: velar por el cumplimiento, darle la máxima difusión, y renovarlo de manera permanente."},{"v":"A","t":"Segundo documento: el Código Ético de la Universidad de Granada. Lo aprobó el Consejo de Gobierno el veinticinco de febrero de dos mil veintidós y se publicó en el Boletín Oficial de la Universidad, número ciento setenta y ocho, el cuatro de marzo. Lo elaboró la Comisión de Ética e Integridad Académica."},{"v":"B","t":"Es orientador y preventivo. No tiene carácter sancionador ni disciplinario. Se dirige a todo el personal docente e investigador, al personal de administración y servicios y al estudiantado."},{"v":"A","t":"Tiene ocho valores. Uno, libertad académica. Dos, dignidad y respeto. Tres, igualdad, diversidad e inclusión. Cuatro, integridad académica y honestidad. Cinco, buen gobierno, transparencia y rendición de cuentas. Seis, corresponsabilidad y excelencia. Siete, sostenibilidad. Y ocho, compromiso con la institución y servicio público."},{"v":"B","t":"El seguimiento corresponde a la Comisión de Ética e Integridad: interpreta el código, vela por su cumplimiento, es independiente e interdisciplinar, actúa como órgano consultivo y deliberativo y elabora un informe anual. Y la comunidad universitaria puede dirigirle consultas, propuestas y alertas de incumplimiento."},{"v":"A","t":"Haz el test. Hasta la próxima."}],"preguntas":[{"q":"Según el Código Ético de la Biblioteca Universitaria de Granada, el código implica:","o":["A todo el personal de la BUG","Solo a la Dirección de la Biblioteca","Solo al personal bibliotecario con plaza de funcionario","A los usuarios de la Biblioteca"],"c":0,"e":"Apartado 2 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"El Código Ético de la BUG significa, para el personal, una aceptación voluntaria de la obligación de autodisciplina:","o":["Sobre y más allá de lo requerido por la ley","Exclusivamente en lo requerido por la ley","Solo respecto a las normas internas de cada biblioteca","Con carácter sancionador"],"c":0,"e":"Apartado 2 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"Según el Código Ético de la BUG, la declaración primordial (art. 1) es respetar:","o":["La libertad intelectual y la defensa del derecho de expresión de cualquier opinión en el marco de la convivencia democrática","La propiedad intelectual de los autores por encima de todo","La política de adquisiciones de la Universidad","El horario de apertura de las bibliotecas"],"c":0,"e":"Art. 1 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"El artículo 3 del Código Ético de la BUG establece que los profesionales velarán por el equilibrio entre:","o":["Los derechos de los autores en su obra y el derecho al acceso a la información y la cultura","El presupuesto de monografías y el de revistas","Los fondos impresos y los electrónicos","La docencia y la investigación"],"c":0,"e":"Art. 3 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"Según el artículo 4 del Código Ético de la BUG, los profesionales no deberán:","o":["Dejarse influir por presiones internas o externas","Aceptar donaciones de fondos","Impartir formación a los usuarios","Participar en asociaciones profesionales"],"c":0,"e":"Art. 4 del Código Ético de la BUG: máxima profesionalidad y objetividad.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"Entre las responsabilidades del artículo 5 del Código Ético de la BUG figura:","o":["Guardar el secreto profesional sobre las cuestiones, información y datos obtenidos en sus funciones","Publicar los datos de uso de las personas usuarias","Anteponer su criterio personal a las normas de la Biblioteca","Difundir las preferencias de lectura de los usuarios"],"c":0,"e":"Art. 5.f del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"Los datos personales o de uso de los servicios prestados por la BUG solo podrán difundirse, según el artículo 7, si:","o":["La persona afectada lo autoriza expresamente o en los supuestos marcados por la ley","Lo solicita cualquier profesor","Lo decide la Dirección sin más","Han pasado cinco años"],"c":0,"e":"Art. 7 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"Según el artículo 8 del Código Ético de la BUG, el acceso a la información y a los servicios se facilitará a todos los usuarios:","o":["Sin distinción de sexo, edad, raza o condición social, de forma igualitaria","Solo a los miembros de la comunidad universitaria","Con prioridad para el profesorado","Previo pago de una cuota simbólica"],"c":0,"e":"Art. 8 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"Según el artículo 9 del Código Ético de la BUG, respecto a adquisiciones o donaciones de fondos:","o":["No se rechazarán por razones ideológicas, de origen, religión, política o cualquier otra condición","Se rechazarán las que contradigan la ideología de la Dirección","Solo se aceptarán las de autores reconocidos","Se aceptarán únicamente si son gratuitas"],"c":0,"e":"Art. 9 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"El artículo 11 del Código Ético de la BUG compromete a los profesionales a:","o":["Fomentar el acceso gratuito a la información de los servicios que le son propios","Cobrar por el acceso a todos los recursos","Limitar el acceso a los recursos electrónicos","Restringir el préstamo a quien lo solicite por escrito"],"c":0,"e":"Art. 11 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"En la relación con los compañeros (art. 13 del Código Ético de la BUG), en ningún caso se atribuirá:","o":["El mérito de un trabajo que no haya realizado","Las funciones de la Dirección","Las competencias del Gerente","El presupuesto de otra biblioteca"],"c":0,"e":"Art. 13.f del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"Según el artículo 18 del Código Ético de la BUG, los profesionales no:","o":["Ocultarán expresamente información necesaria a sus usuarios ni difundirán información si saben que es falsa","Atenderán consultas telefónicas","Participarán en proyectos de cooperación","Realizarán actividades de formación"],"c":0,"e":"Art. 18 del Código Ético de la BUG.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"Según la disposición final tercera del Código Ético de la BUG, el código:","o":["Se renovará de manera permanente, sujeto a las mejoras y revisiones que lo mantengan vigente","Se revisará únicamente cada diez años","No puede modificarse","Será sustituido por el código de la IFLA"],"c":0,"e":"Disposición final tercera.","r":"CODIGO_ETICO_BUG art. doc"},{"q":"¿Cuándo fue aprobado el Código Ético de la Universidad de Granada?","o":["En la sesión ordinaria del Consejo de Gobierno de 25 de febrero de 2022","En el Claustro de 25 de mayo de 2026","Por el Consejo Social el 4 de marzo de 2022","Por Decreto 231/2011, de 12 de julio"],"c":0,"e":"ACG178/2, BOUGR n.º 178, de 4 de marzo de 2022.","r":"CODIGO_ETICO_UGR art. doc"},{"q":"¿Qué carácter tiene el Código Ético de la UGR?","o":["Orientador y preventivo; no tiene carácter sancionador o disciplinario","Sancionador, con un catálogo de infracciones","Disciplinario para el personal funcionario únicamente","Meramente informativo y sin destinatarios"],"c":0,"e":"Su vocación es orientativa o preventiva.","r":"CODIGO_ETICO_UGR art. doc"},{"q":"El Código Ético de la UGR se dirige a:","o":["Todas las personas que integran la comunidad universitaria (PDI, PAS y estudiantado) y a cualquier otra que participe en la actividad de la Universidad","Solo al personal docente e investigador","Solo al personal de administración y servicios","Únicamente a los órganos de gobierno"],"c":0,"e":"Naturaleza y características del Código.","r":"CODIGO_ETICO_UGR art. doc"},{"q":"Según el Código Ético de la UGR, la libertad académica es:","o":["El fundamento de la actividad de la Universidad","Un límite a la autonomía universitaria","Un derecho exclusivo del profesorado catedrático","Una recomendación sin efecto"],"c":0,"e":"Primer valor del Código Ético de la UGR.","r":"CODIGO_ETICO_UGR art. doc"},{"q":"¿Cuál de los siguientes es el octavo valor del Código Ético de la UGR?","o":["Compromiso con la institución y servicio público","Sostenibilidad","Corresponsabilidad y excelencia","Buen gobierno, transparencia y rendición de cuentas"],"c":0,"e":"Los ocho: libertad académica; dignidad y respeto; igualdad, diversidad e inclusión; integridad académica y honestidad; buen gobierno, transparencia y rendición de cuentas; corresponsabilidad y excelencia; sostenibilidad; compromiso con la institución y servicio público.","r":"CODIGO_ETICO_UGR art. doc"},{"q":"El compromiso con la institución, según el Código Ético de la UGR, implica:","o":["Anteponer los fines de la Universidad como servicio público a cualquier interés particular","Priorizar el interés del propio departamento","Evitar toda crítica a la institución","Limitar la participación en la sociedad civil"],"c":0,"e":"Valor 8 del Código Ético de la UGR.","r":"CODIGO_ETICO_UGR art. doc"},{"q":"¿Qué órgano se encarga del seguimiento del Código Ético de la UGR, de interpretarlo y de velar por su cumplimiento?","o":["La Comisión de Ética e Integridad de la Universidad de Granada","El Consejo Social","La Defensoría Universitaria","La Inspección de Servicios"],"c":0,"e":"Apartado «Desarrollo y seguimiento del Código Ético».","r":"CODIGO_ETICO_UGR art. doc"},{"q":"La Comisión de Ética e Integridad de la UGR actúa, según el Código, como:","o":["Órgano consultivo y deliberativo, independiente e interdisciplinar","Órgano ejecutivo con potestad sancionadora","Tribunal de apelación del Consejo de Gobierno","Órgano de gestión económica"],"c":0,"e":"Es institucional y representativo de los sectores de la comunidad universitaria.","r":"CODIGO_ETICO_UGR art. doc"},{"q":"La Comisión de Ética e Integridad elaborará, según el Código Ético de la UGR:","o":["Un informe anual con las actuaciones llevadas a cabo","Un informe mensual al Rector","Un informe cada cuatro años","Ningún informe"],"c":0,"e":"Incluye información general sobre las incidencias y un resumen de las actuaciones.","r":"CODIGO_ETICO_UGR art. doc"},{"q":"La comunidad universitaria puede dirigir a la Comisión de Ética e Integridad, mediante un procedimiento abierto:","o":["Consultas, propuestas y alertas de incumplimiento del Código Ético","Solo quejas anónimas","Únicamente recursos de alzada","Solo propuestas de reforma de los Estatutos"],"c":0,"e":"Mecanismo de participación del seguimiento.","r":"CODIGO_ETICO_UGR art. doc"}],"mp3":true},"e14":{"id":"e14","bloque":"Específico","num":14,"titulo":"El Archivo de la Universidad de Granada","alcance":"El Archivo de la Universidad de Granada. Evolución histórica, normativa, estructura y organigrama. Fondos y colecciones.","fuentes":["Reglamento del Archivo Universitario de Granada (Consejo de Gobierno, 27/11/2008)","NCG260/5: modificación parcial del Reglamento (Consejo de Gobierno, 16/12/2024, BOUGR n.º 260)","Páginas del Archivo Universitario (archivo.ugr.es): organización, presentación, fondo de la UGR, descripción ISAD(G)","Guía de los fondos del Archivo de la Universidad de Granada (2023)"],"peso":"alto","notas":["Novedad importante: el Reglamento del Archivo es de 2008, pero el Consejo de Gobierno aprobó el 16 de diciembre de 2024 una modificación parcial (NCG260/5). La «Comisión Calificadora de Documentos Administrativos» pasa a llamarse «Comisión de Valoración de Documentos Administrativos» y cambia su composición. Los apuntes antiguos te darán la versión vieja.","El Archivo depende orgánicamente de la Secretaría General (no de la Gerencia ni de la Biblioteca). Es una pregunta típica.","Hay fechas muy fáciles de confundir: la UGR se fundó en 1531; los Libros de Actas del Claustro se conservan desde 1532; las primeras Constituciones son de 1542; los inventarios del Archivo van de 1599 a 1778; el incendio fue en 1886; el Archivo se ubicó en el Hospital Real en 1980.","Al Archivo le dedicamos también el tema E15 (documento de archivo, ciclo documental, transferencias y servicios). Los dos se complementan: aquí, qué es y qué tiene; allí, cómo funciona.","En el examen de 2025 hubo preguntas sobre el Archivo (el Reglamento, la organización de los fondos de personas como José Palanco Romero y Juan José Santa Cruz y la documentación de apoyo informativo). Los fondos personales se resumen aquí; si quieres ir más allá, la Guía de los fondos del Archivo está en archivo.ugr.es."],"apuntes":[{"h":"Qué es el Archivo Universitario y de quién depende","t":"- El **Archivo de la Universidad de Granada (AUG)** es **un servicio de apoyo a la comunidad universitaria** cuya **función principal es la reunión, conservación, organización y difusión del Patrimonio Documental** de la UGR (Reglamento, art. 2).\n- Según los **Estatutos**, el Archivo está **compuesto por todos los documentos de cualquier naturaleza, época y soporte material producidos por cualquier órgano o servicio de la Universidad, así como los aportados a estos** (art. 204 de los Estatutos de 2011; en el Proyecto de Estatutos, art. 246).\n- **Dependencia (art. 3)**: **depende orgánicamente de la Secretaría General**, que dicta las instrucciones y le da la dotación presupuestaria. **La gestión corresponde al Servicio de Archivos.**\n- Tiene **funciones de archivo histórico y de archivo intermedio** y custodia documentación **desde 1532 hasta la actualidad**.\n- **Patrimonio Documental (art. 1)**: documentos de cualquier época generados, reunidos o conservados por **los órganos de gobierno y representación**; **Facultades, Escuelas, Departamentos e Institutos**; y **servicios administrativos, centros culturales y unidades de gestión**. También los que ingresan por **donación, depósito, compraventa** u otro título. **Quedan excluidos**: los documentos producidos por miembros de la comunidad universitaria **en actividades privadas o profesionales**, las obras de creación e investigación editadas y lo que forma parte del Patrimonio Bibliográfico."},{"h":"Funciones del Archivo Universitario (art. 5)","t":"- **a)** **Recoger, organizar, conservar y hacer accesible** la documentación, como salvaguarda de derechos, en la gestión administrativa y como fuente de información, con acceso para la comunidad universitaria y los ciudadanos.\n- **b)** Elaborar los **instrumentos de descripción** adecuados.\n- **c)** Implantar las **directrices del Sistema Archivístico**.\n- **d)** Establecer **criterios y pautas sobre transferencias, selección y eliminación** de documentos y gestión documental.\n- **e)** Establecer pautas sobre la **ubicación, seguridad y utilización** de las instalaciones.\n- **f)** **Asesorar** a la administración universitaria sobre organización y tratamiento técnico.\n- **g)** Estudios de **identificación y valoración de series documentales**.\n- **h)** **Elaborar y proponer el Reglamento** del Archivo, para su aprobación o reforma.\n- **i)** Promover actividades de **difusión** del patrimonio documental y de **apoyo a la docencia**.\n- **j)** Ofrecer **servicios de acceso al documento**: **consulta, préstamo y reproducciones**."},{"h":"Normativa","t":"- **Reglamento del Archivo Universitario**: aprobado por el **Consejo de Gobierno el 27 de noviembre de 2008**. Su exposición de motivos cita la **Ley 3/1984 de Archivos de Andalucía** (los documentos producidos por las universidades andaluzas forman parte del **Patrimonio Documental Andaluz**) y el **Reglamento del Sistema Andaluz de Archivos** (art. 25: las universidades andaluzas constituirán sus **redes de archivos de acuerdo con el ciclo vital de los documentos**).\n- **Modificación parcial NCG260/5**: aprobada por el **Consejo de Gobierno el 16 de diciembre de 2024** (BOUGR n.º 260, de 20/12/2024), porque la Comisión Calificadora **no se había convocado en los últimos años** por la falta de operatividad de su composición. Cambios: **art. 18** (composición), **art. 19** (acuerdos) y la **disposición adicional**.\n  - La **Comisión Calificadora de Documentos Administrativos** pasa a denominarse **Comisión de Valoración de Documentos Administrativos**, de conformidad con la **Ley 7/2011, de 3 de noviembre, de Documentos, Archivos y Patrimonio Documental de Andalucía**.\n  - **Presidente**: la persona titular de la **Secretaría General** (o su delegada). **Vocales**: las personas titulares de la **Gerencia**, de la **Jefatura de Servicio del Archivo Universitario**, de la **Dirección de los Servicios Jurídicos** y de la **Presidencia de la Mesa Técnica de Administradores** (o sus delegadas). Puede contar con **expertos** de las áreas relacionadas.\n  - **Acuerdos**: **públicos** y de aplicación general.\n- **Reforma del Reglamento (art. 59)**: iniciativa del **Secretario General**; voto favorable de la **mayoría del Consejo de Gobierno**; entra en vigor al día siguiente de su publicación en el **BOUGR**."},{"h":"Evolución histórica","t":"- **1531**: la UGR se funda por iniciativa del **Emperador Carlos V**, mediante una **Bula del Papa Clemente VII**. Continúa la tradición de la Universidad árabe de **Yusuf I (la Madraza, siglo XIV)**. Ampliaciones: la **donación de Juan Crespo Marmolejo (1626)**, considerada una **segunda fundación**, y la **incautación del patrimonio de los jesuitas (1767)**.\n- **1532**: fecha desde la que se conservan los **Libros de Actas del Claustro**, una de las series más destacadas.\n- **1542**: las primeras **Constituciones** recogen las funciones del Secretario General sobre la **custodia de los documentos** (primeras manifestaciones del Archivo).\n- **1599-1778**: se realizan varios **inventarios** del Archivo; al compararlos con los fondos actuales se deduce que hubo numerosas pérdidas de documentación.\n- **1886**: un **incendio** (al parecer para ocultar un robo) destruyó y deterioró gran cantidad de documentación.\n- **Años 50**: se hace cargo del Archivo un funcionario del **Cuerpo de Archiveros**; de su trabajo procede el inventario hoy en servicio.\n- **Ubicaciones**: edificio del **Rectorado** (antigua Curia y actual Facultad de Derecho), **Hospital Real en 1980**, **Edificio Santa Lucía** hasta **1999**, y hoy el **Centro de Documentación Científica**. Mantiene además un depósito en **Atarfe** con documentación hasta **1998**.\n- **Años 80 en adelante**: constitución de un servicio moderno, con **automatización, digitalización** y creación de **instrumentos de descripción**."},{"h":"Estructura y organigrama","t":"- **Dependencia orgánica**: **Secretaría General** de la UGR.\n- **Personal**: **Archivera Jefa de Servicio**, **Archivera Jefa de Sección**, **Archivera Responsable de Área** y **Técnicos Especialistas / bibliotecarios de Archivos y Bibliotecas**. Dentro de la **Biblioteca Universitaria** existe una **Subdirección y Área de Archivo**.\n- **Organización del sistema (Reglamento, art. 6)**: los **Archivos de Gestión**, el **Archivo Intermedio** y el **Archivo Histórico** integran el **Archivo Universitario**. **El Archivo Universitario asume las funciones de Archivo Intermedio y de Archivo Histórico** y es la **cabecera del sistema** (art. 15).\n- **Órgano asesor**: la **Comisión de Valoración de Documentos Administrativos**, asesora de la Secretaría General (antes, Comisión Calificadora).\n- **Servicios** que ofrece la web: **servicios a la investigación**, **servicios a la administración universitaria** y **programas de financiación recibidos**."},{"h":"Fondos y colecciones","t":"- **Fondo de la Universidad de Granada**: alberga **toda la documentación de la Universidad desde su fundación hasta la actualidad** (por ser archivo intermedio e histórico). Fechas: **1532**; incorpora documentación hasta **1998**; volumen: **14.316 cajas + 8.440 libros**, más **5.000 placas de vidrio estereográficas** y **1.124 fotografías**. **Series principales**: Actas de Claustro, Libros de Grados, Libros de Actos, Libros de Matrículas, **Expedientes académicos** y **Expedientes de limpieza de sangre** (útiles para estudios genealógicos).\n- **Secciones con cuadro de clasificación propio**: **Primera Enseñanza**, **Segunda Enseñanza** (la UGR tuvo competencias administrativas desde mediados del siglo XIX hasta el primer tercio del XX) y **Hospital Clínico de Granada** (**1953 a 1971**, cuando su gestión pasó al Servicio Andaluz de Salud).\n- **Fondos institucionales: nueve**, entre ellos el **Colegio Real de Santa Cruz de la Fe y Santa Catalina Mártir** (**adquirido en subasta el 6 de octubre de 1995**), la **Real Sociedad Económica de Amigos del País**, la **Escuela Normal**, la **Escuela de Comercio**, la **Escuela Social**, la **Escuela Universitaria Virgen de las Nieves**, el **Colegio Oficial de Matronas** y la **Junta Provincial de Sanidad**.\n- **Fondos personales: diez**, **todos donaciones**: **Paul Fallot, Elena Martín Vivaldi, Familia Burgos, José Palanco Romero, Juan José Santa Cruz, Pedro Ortiz Ramos, José María Clavera Armenteros, Audiovisual Sánchez Montes, Martínmorales y Antonina Rodrigo** (las dos últimas, donaciones de 2022 y 2023, en proceso de organización).\n- **Descripción**: según la norma **ISAD(G)** (siete áreas: identificación, contexto, contenido y estructura, condiciones de acceso y utilización, documentación asociada, notas y control de la descripción) y con **cuadros de clasificación**. La **Guía de los fondos** (2023) está financiada por el Ministerio de Cultura y Deporte (Plan de Recuperación, Transformación y Resiliencia)."}],"clave":["Archivo = servicio de apoyo; función principal: reunión, conservación, organización y difusión del Patrimonio Documental; depende orgánicamente de la Secretaría General.","Reglamento: CG 27/11/2008. Modificación NCG260/5: CG 16/12/2024; Comisión Calificadora → Comisión de Valoración de Documentos Administrativos.","Presidente de la Comisión de Valoración: titular de la Secretaría General; vocales: Gerencia, Archivo, Servicios Jurídicos y Mesa Técnica de Administradores.","UGR fundada en 1531 (Carlos V, bula de Clemente VII); Actas del Claustro desde 1532; Constituciones 1542; inventarios 1599-1778; incendio 1886; Hospital Real 1980.","Fondos: nueve institucionales (con el Fondo UGR y sus secciones de Primera y Segunda Enseñanza y Hospital Clínico) y diez personales donados.","Descripción ISAD(G) en siete áreas y cuadros de clasificación."],"podcast":[{"v":"A","t":"Hola. Tema catorce del bloque específico: el Archivo de la Universidad de Granada."},{"v":"B","t":"El Archivo es un servicio de apoyo a la comunidad universitaria. Su función principal es la reunión, conservación, organización y difusión del patrimonio documental de la UGR. Según los Estatutos, está compuesto por todos los documentos de cualquier naturaleza, época y soporte producidos por cualquier órgano o servicio de la Universidad, así como los aportados a estos."},{"v":"A","t":"Depende orgánicamente de la Secretaría General. Su gestión corresponde al Servicio de Archivos. Tiene funciones de archivo intermedio y de archivo histórico y custodia documentación desde mil quinientos treinta y dos."},{"v":"B","t":"Funciones: recoger, organizar, conservar y hacer accesible la documentación; elaborar instrumentos de descripción; implantar las directrices del sistema archivístico; establecer criterios sobre transferencias, selección y eliminación; asesorar a la administración; estudiar y valorar series; proponer el Reglamento; difundir el patrimonio; y ofrecer consulta, préstamo y reproducciones."},{"v":"A","t":"El Reglamento lo aprobó el Consejo de Gobierno el veintisiete de noviembre de dos mil ocho. Pero atención a la novedad: el dieciséis de diciembre de dos mil veinticuatro se aprobó una modificación parcial. La Comisión Calificadora de Documentos Administrativos pasa a llamarse Comisión de Valoración de Documentos Administrativos, de acuerdo con la Ley siete de dos mil once de Andalucía."},{"v":"B","t":"La preside quien sea titular de la Secretaría General. Los vocales son los titulares de la Gerencia, de la Jefatura de Servicio del Archivo, de la Dirección de los Servicios Jurídicos y de la Presidencia de la Mesa Técnica de Administradores. Y sus acuerdos son públicos."},{"v":"A","t":"Un poco de historia. La Universidad se fundó en mil quinientos treinta y uno por iniciativa de Carlos Quinto, con una bula del Papa Clemente Séptimo. Los Libros de Actas del Claustro se conservan desde mil quinientos treinta y dos. Las primeras Constituciones son de mil quinientos cuarenta y dos. Los inventarios del Archivo van de mil quinientos noventa y nueve a mil setecientos setenta y ocho. En mil ochocientos ochenta y seis hubo un incendio. En mil novecientos ochenta el Archivo se instaló en el Hospital Real."},{"v":"B","t":"El fondo principal es el de la propia Universidad: más de catorce mil cajas y ocho mil libros, con secciones propias de Primera Enseñanza, Segunda Enseñanza y el Hospital Clínico. Series destacadas: las Actas de Claustro, los Libros de Grados y los expedientes académicos y de limpieza de sangre."},{"v":"A","t":"Además hay nueve fondos institucionales, como el Colegio de Santa Cruz y Santa Catalina Mártir, y diez fondos personales, todos donados: Paul Fallot, Elena Martín Vivaldi, la familia Burgos, José Palanco Romero, Juan José Santa Cruz, Pedro Ortiz Ramos, José María Clavera, el audiovisual Sánchez Montes, Martínmorales y Antonina Rodrigo."},{"v":"B","t":"Y se describen con la norma ISAD de G, con siete áreas, y con cuadros de clasificación. Haz el test. Hasta la próxima."}],"preguntas":[{"q":"Según el artículo 2 del Reglamento, ¿cuál es la función principal del Archivo Universitario?","o":["La reunión, conservación, organización y difusión del Patrimonio Documental de la Universidad de Granada","La custodia exclusiva de documentos históricos anteriores a 1900","La gestión de las bibliotecas de los centros","La expedición de títulos universitarios"],"c":0,"e":"Art. 2 del Reglamento del Archivo Universitario.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El Archivo Universitario depende orgánicamente, según el artículo 3 del Reglamento, de:","o":["La Secretaría General de la Universidad","La Gerencia","La Biblioteca Universitaria","El Vicerrectorado de Investigación"],"c":0,"e":"Art. 3 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"La gestión del Archivo Universitario corresponde, según el artículo 3 del Reglamento:","o":["Al Servicio de Archivos de la Universidad de Granada","A la Comisión de Valoración de Documentos","A la Gerencia","Al Servicio Jurídico"],"c":0,"e":"Art. 3 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según los Estatutos, citados por el Archivo, el Archivo Universitario está compuesto por:","o":["Todos los documentos de cualquier naturaleza, época y soporte material producidos por cualquier órgano o servicio de la Universidad, así como los aportados a estos","Solo los documentos históricos anteriores a 1900","Solo los documentos en papel de los órganos de gobierno","Los libros editados por la Universidad"],"c":0,"e":"Art. 204 de los Estatutos de 2011; art. 246 del Proyecto de Estatutos.","r":"ARCHIVO_WEB art. doc"},{"q":"¿Cuál de los siguientes documentos queda excluido del Patrimonio Documental de la Universidad (art. 1 del Reglamento)?","o":["Los documentos producidos por miembros de la comunidad universitaria en el ejercicio de actividades privadas o profesionales","Los documentos de las Facultades","Los documentos de los servicios administrativos","Los documentos recibidos por donación"],"c":0,"e":"Art. 1 del Reglamento. También las obras editadas y las del Patrimonio Bibliográfico.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Entre las funciones del Archivo Universitario (art. 5) figura:","o":["Establecer criterios y pautas sobre transferencias de documentación, selección y eliminación de documentos","Aprobar el Reglamento del Archivo","Acordar la eliminación de series documentales","Nombrar a la Comisión de Valoración"],"c":0,"e":"Art. 5.d del Reglamento. La eliminación la acuerda la Comisión (art. 29).","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"¿Cuándo aprobó el Consejo de Gobierno de la UGR el Reglamento del Archivo Universitario?","o":["El 27 de noviembre de 2008","El 26 de octubre de 2016","El 23 de julio de 2020","El 16 de diciembre de 2024"],"c":0,"e":"Página «Documentos» del Archivo.","r":"ARCHIVO_WEB art. doc"},{"q":"¿Cuándo aprobó el Consejo de Gobierno la modificación parcial del Reglamento del Archivo (NCG260/5)?","o":["El 16 de diciembre de 2024","El 27 de noviembre de 2008","El 29 de octubre de 2021","El 25 de febrero de 2022"],"c":0,"e":"Publicada en el BOUGR n.º 260, de 20 de diciembre de 2024.","r":"ARCHIVO_MOD art. doc"},{"q":"¿Por qué se modificó parcialmente el Reglamento del Archivo en 2024?","o":["Por la falta de operatividad de la Comisión Calificadora de Documentos Administrativos, que no se había convocado en los últimos años","Por el cambio de sede del Archivo","Por la entrada en vigor de la LOSU","Por la creación del Servicio de Archivos"],"c":0,"e":"NCG260/5, exposición de motivos.","r":"ARCHIVO_MOD art. doc"},{"q":"Tras la modificación de 2024, la Comisión Calificadora de Documentos Administrativos se entiende denominada:","o":["Comisión de Valoración de Documentos Administrativos de la Universidad de Granada","Comisión Superior de Archivos","Comisión de Evaluación Documental","Comité de Eliminación de Documentos"],"c":0,"e":"Disposición adicional modificada.","r":"ARCHIVO_MOD art. doc"},{"q":"¿Quién preside la Comisión de Valoración de Documentos Administrativos tras la modificación de 2024 (art. 18)?","o":["La persona titular de la Secretaría General o persona en quien delegue","El Rector","La persona titular de la Gerencia","La persona titular de la Jefatura de Servicio del Archivo"],"c":0,"e":"Antes de la modificación la presidía el Rector.","r":"ARCHIVO_MOD art. doc"},{"q":"Entre los vocales de la Comisión de Valoración (art. 18 modificado) NO figura:","o":["El Defensor Universitario","La persona titular de la Gerencia","La persona titular de la Jefatura de Servicio del Archivo Universitario","La persona titular de la Presidencia de la Mesa Técnica de Administradores"],"c":0,"e":"Vocales: Gerencia, Jefatura del Servicio de Archivo, Servicios Jurídicos y Mesa Técnica de Administradores.","r":"ARCHIVO_MOD art. doc"},{"q":"Según el artículo 19 modificado, los acuerdos de la Comisión de Valoración serán:","o":["Públicos y de aplicación general","Reservados","Aprobados siempre por el Claustro","Recurribles solo ante el Rector"],"c":0,"e":"Art. 19 modificado por NCG260/5.","r":"ARCHIVO_MOD art. doc"},{"q":"¿Qué ley andaluza se cita para la nueva denominación «Comisión de Valoración de Documentos Administrativos»?","o":["La Ley 7/2011, de 3 de noviembre, de Documentos, Archivos y Patrimonio Documental de Andalucía","La Ley 3/1984, de Archivos de Andalucía","La Ley 16/1985 del Patrimonio Histórico Español","La Ley 5/2023 de Función Pública de Andalucía"],"c":0,"e":"Disposición adicional modificada.","r":"ARCHIVO_MOD art. doc"},{"q":"La reforma del Reglamento del Archivo requiere, según el artículo 59:","o":["La iniciativa del Secretario General y el voto favorable de la mayoría del Consejo de Gobierno","La iniciativa del Rector y la aprobación del Claustro","El informe de la Gerencia y el voto de dos tercios del Consejo de Gobierno","La propuesta de la Comisión de Valoración y la aprobación del Consejo Social"],"c":0,"e":"Art. 59: entra en vigor al día siguiente de su publicación en el BOUGR.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"¿Cuándo se fundó la Universidad de Granada según la descripción ISAD(G) del Archivo?","o":["En 1531, por iniciativa del Emperador Carlos V, mediante una Bula del Papa Clemente VII","En 1492, por los Reyes Católicos","En 1532, por una Bula de Paulo III","En el siglo XIV, por Yusuf I"],"c":0,"e":"Continúa la tradición de la Universidad árabe de Yusuf I (Madraza, siglo XIV).","r":"ARCHIVO_WEB art. doc"},{"q":"La donación de Juan Crespo Marmolejo en 1626 se considera, por su importancia:","o":["Una segunda fundación de la Universidad","El origen del Archivo Histórico","La creación de la Biblioteca","La incautación de los bienes jesuitas"],"c":0,"e":"En 1767 se produce la incautación del patrimonio de los jesuitas.","r":"ARCHIVO_WEB art. doc"},{"q":"Una de las series más destacadas del Fondo de la UGR, los Libros de Actas del Claustro, se conserva desde:","o":["1532","1531","1599","1980"],"c":0,"e":"Hay un índice de esta serie disponible.","r":"ARCHIVO_WEB art. doc"},{"q":"Las primeras manifestaciones del Archivo se encuentran, según su historia archivística, en las primeras Constituciones de:","o":["1542","1531","1626","1767"],"c":0,"e":"Recogen las funciones del Secretario General sobre la custodia de los documentos.","r":"ARCHIVO_WEB art. doc"},{"q":"¿Entre qué años se realizaron varios inventarios del Archivo Universitario, según su historia archivística?","o":["1599 y 1778","1531 y 1626","1886 y 1950","1980 y 1999"],"c":0,"e":"Al compararlos con los fondos actuales se deduce que hubo numerosas pérdidas.","r":"ARCHIVO_WEB art. doc"},{"q":"¿Qué ocurrió en 1886 con el Archivo de la Universidad?","o":["Un incendio destruyó y deterioró gran cantidad de documentación","Se trasladó al Hospital Real","Se hizo cargo un funcionario del Cuerpo de Archiveros","Se aprobó su primer Reglamento"],"c":0,"e":"Historia archivística del Fondo UGR.","r":"ARCHIVO_WEB art. doc"},{"q":"¿En qué año se ubicó el Archivo de la Universidad en el Hospital Real?","o":["1980","1999","1886","1998"],"c":0,"e":"Después estuvo en el Edificio Santa Lucía hasta 1999.","r":"ARCHIVO_WEB art. doc"},{"q":"El depósito de documentación del Archivo situado en Atarfe contiene documentación hasta:","o":["1998","1980","2008","1953"],"c":0,"e":"Descripción ISAD(G) del Fondo UGR.","r":"ARCHIVO_WEB art. doc"},{"q":"¿Qué volumen tiene el Fondo de la Universidad de Granada según su descripción ISAD(G)?","o":["14.316 cajas y 8.440 libros, además de placas de vidrio estereográficas y fotografías","2.000 cajas y 500 libros","100.000 cajas","8.440 cajas y 14.316 libros"],"c":0,"e":"Más 5.000 placas de vidrio estereográficas y 1.124 fotografías.","r":"ARCHIVO_WEB art. doc"},{"q":"¿Qué sección del Fondo de la UGR abarca el periodo de 1953 a 1971, año en que su gestión se cedió al Servicio Andaluz de Salud?","o":["La Sección del Hospital Clínico de Granada","La Sección de Primera Enseñanza","La Sección de Segunda Enseñanza","La Sección de la Escuela de Comercio"],"c":0,"e":"Tiene su propio cuadro de clasificación.","r":"ARCHIVO_WEB art. doc"},{"q":"¿Cuántos fondos institucionales y cuántos fondos personales tiene actualmente el Archivo, según su Guía de los fondos?","o":["Nueve institucionales y diez personales","Diez institucionales y nueve personales","Cinco institucionales y cinco personales","Doce institucionales y tres personales"],"c":0,"e":"Los fondos personales son todos donaciones.","r":"ARCHIVO_GUIA art. doc"},{"q":"¿Qué norma de descripción archivística se usa en la Guía de los fondos del Archivo?","o":["ISAD(G)","ISBD","RDA","MARC 21"],"c":0,"e":"Completada con los cuadros de clasificación.","r":"ARCHIVO_GUIA art. doc"}],"mp3":true},"e15":{"id":"e15","bloque":"Específico","num":15,"titulo":"El documento de archivo y el ciclo documental","alcance":"El documento de archivo. El ciclo documental y las fases de archivo. Tramitación y revisión de transferencias documentales, organización física e instalación en depósitos de archivo. Servicios de consulta en sala y online, gestión del préstamo administrativo a oficinas, acceso ciudadano y reproducción de documentos.","fuentes":["Reglamento del Archivo Universitario de Granada (Consejo de Gobierno, 27/11/2008), con la modificación parcial NCG260/5 (16/12/2024)","Páginas del Archivo Universitario (archivo.ugr.es)"],"peso":"alto","notas":["Este tema se estudia con el Reglamento del Archivo, artículo por artículo. Los plazos y números exactos (cinco años, 48 horas...) son los que más se preguntan.","Recuerda la novedad de 2024: la antigua «Comisión Calificadora de Documentos Administrativos» es ahora la «Comisión de Valoración de Documentos Administrativos». En algunos artículos (16 a 21) el texto de 2008 todavía usa el nombre antiguo.","Los tres tipos de archivo del sistema son: de gestión (o de oficina), intermedio e histórico. El Archivo Universitario asume las funciones de intermedio e histórico y es la cabecera del sistema.","Ojo con las responsabilidades: en el archivo de gestión, quien responde de conservar y transferir los documentos es el jefe de cada unidad; en el intermedio e histórico, exclusivamente el Servicio de Archivo.","La consulta online no la regula el Reglamento de 2008: el Archivo tiene un portal en línea de acceso público con sus instrumentos de descripción. Para el examen, céntrate en consulta en sala, préstamo administrativo, acceso ciudadano y reproducción (arts. 30 a 50)."],"apuntes":[{"h":"El documento de archivo (art. 4)","t":"- **Documento de archivo**: toda **expresión en lenguaje natural o convencional** y cualquier otra expresión **gráfica, sonora o en imagen**, recogidas en **cualquier tipo de soporte material, incluidos los informáticos**, que constituyan **el testimonio de los fines y actividades** propios de la Universidad.\n- **Excepción**: las **obras de creación literaria, científica o técnica editadas**, que forman parte del **Patrimonio Bibliográfico**.\n- **Serie documental (art. 23)**: conjunto de **unidades documentales de estructura y contenido homogéneo**, generadas por **un mismo órgano o sujeto productor en el ejercicio de cada una de sus funciones específicas**.\n- **Fondo**: **conjunto de series con una misma procedencia**.\n- **Clasificación**: labor intelectual por la que se **identifican y establecen las series** que componen cada fondo. Se basa en el **principio de procedencia** (art. 22)."},{"h":"El ciclo documental y las tres fases de archivo (arts. 6 a 15)","t":"El **Sistema de Archivos** de la UGR lo forman los **Archivos de Gestión**, el **Archivo Intermedio** y el **Archivo Histórico**, que **se corresponden con las etapas del ciclo vital de los documentos** (art. 6).\n- **Archivo de gestión o de oficina (arts. 7 a 11)**: reúne la documentación **en trámite o sometida a continua utilización y consulta** por la unidad productora. Conserva los documentos **mientras dura la tramitación y durante los cinco años siguientes a la finalización del trámite**, en los términos de la Comisión. Después se **transfiere al Archivo Intermedio**. La **responsabilidad** de conservar, custodiar y transferir **recae en los jefes de las unidades** (que pueden designar un encargado). Es **obligatorio** que cada servicio, centro u órgano equivalente tenga uno (art. 10) y debe aplicar las **directrices técnicas del Archivo Universitario** (art. 11).\n- **Archivo intermedio (art. 12)**: documentos **transferidos por las unidades productoras**; fase **semiactiva**, con consulta **esporádica**; permanecen hasta su **eliminación o transferencia al Archivo Histórico**.\n- **Archivo histórico (art. 13)**: documentos **transferidos por el intermedio** que, por su **valor histórico**, se conservan **permanentemente**; también lo que se recibe por **donación, compra, cesión** u otro título.\n- **Gestión (art. 14)**: la del intermedio y el histórico corresponde **exclusivamente al Servicio de Archivo**.\n- **Cabecera del sistema (art. 15)**: el **Archivo Universitario** reúne y custodia los documentos transferidos una vez cumplidos los plazos del **calendario de transferencia**, y **asume las funciones de intermedio e histórico**."},{"h":"Valoración y eliminación: la Comisión de Valoración","t":"- La **Comisión de Valoración de Documentos Administrativos** (antes Calificadora) es un **órgano colegiado asesor de la Secretaría General**. Estudia y dictamina las cuestiones de **calificación y utilización** de los documentos, su **integración en el Archivo** y el **régimen de acceso y utilidad administrativa** (art. 16, con referencia al art. 58 de la Ley 16/1985 del Patrimonio Histórico Español).\n- **Funciones (art. 17)**: analizar las **tipologías documentales**; establecer los **períodos de conservación** y la **accesibilidad**; **regularizar el expurgo y la eliminación**, dictaminando la forma de **disposición final**; y resolver las propuestas de valoración del Archivo.\n- **Discrepancias** con la Comisión Superior Calificadora de la Consejería de Cultura: prevalece **el principio de conservación frente al de eliminación** (art. 20).\n- **Eliminación (art. 29)**: **prohibida** cualquier eliminación, total o parcial, **no acordada por la Comisión**; se levanta **acta** con los documentos y las razones; puede conservarse **una muestra de originales**, según las **tablas de valoración**."},{"h":"Transferencias, ingreso y registro (arts. 26 a 28)","t":"- **Ingreso (art. 26)**: por **transferencia ordinaria y regular** de las unidades, servicios y centros; o por **transferencia extraordinaria** (donación, depósito, herencia, legado, compra…) **aceptada, aprobada u ordenada por el Consejo de Gobierno**.\n- **Transferencia (art. 27)**: toda entrada va acompañada del **acta o impreso de transferencia o relación de entrega**, según los **modelos normalizados** del Archivo. Se ajusta al **calendario de transferencias** de las **tablas de valoración de series** aprobadas por la Comisión. Los documentos deben ser **originales o copias únicas**. El Archivo **puede rechazar** los envíos que no cumplan la normativa y pedir una nueva remisión. En las **extraordinarias**, la adquisición se formaliza mediante **resolución del Rector** y posterior información al Consejo de Gobierno.\n- **Registro (art. 28)**: el Archivo tiene un **Registro General de entrada de fondos**."},{"h":"Organización física e instalación en depósitos (arts. 22 a 25 y 51 a 54)","t":"- **Ordenación (art. 24)**: una vez clasificados los documentos y las series, se ordenan las unidades documentales con criterios **cronológicos, alfabéticos, numéricos** u otros según el **principio de estructura interna**.\n- **Instalación (art. 25)**: terminada la organización, se instalan en **unidades de conservación adecuadas**, identificadas por la **signatura**.\n- **Depósitos (art. 34)**: el **acceso directo a los depósitos está reservado al personal del Archivo**, salvo visitas autorizadas. El servicio de documentos lo realiza **exclusivamente** el personal del Archivo.\n- **Preservación (arts. 51 a 54)**: la Universidad es responsable de la preservación de su patrimonio documental; el Archivo cuenta con **locales adecuados**; medidas **preventivas** (unidades de conservación apropiadas y condiciones ambientales óptimas); y un **plan de emergencia** actualizado y un **programa de seguridad para documentos esenciales**."},{"h":"Acceso, consulta en sala y acceso ciudadano (arts. 30 a 41)","t":"- **Acceso (art. 30)**: se reconoce a la **comunidad universitaria y a los ciudadanos en general** el derecho de acceso a los documentos, conforme a la legislación; con **datos personales**, se aplica la normativa de protección de datos.\n- **Restricciones (art. 31)**: se puede **restringir el acceso y la reproducción de originales** cuya manipulación ponga en peligro su conservación; **el Secretario General puede autorizar** la consulta de cualquier documento, previo informe del responsable del Archivo. Restricciones temporales por circunstancias extraordinarias (obras, traslados, desinfección…) en el art. 37.\n- **Consulta (art. 33)**: **consulta gratuita en las instalaciones** del Archivo o **entrega de copias a cargo del solicitante**.\n- **Consultas internas (art. 35)**: las realizadas por las unidades administrativas en el ejercicio de sus funciones.\n- **Solicitud (art. 36)**: se rellena un **formulario**, se **acredita la personalidad** y se indica, a efectos estadísticos, el **tema de investigación** (protegido por el **secreto estadístico**).\n- **Responsabilidad (art. 38)**: los usuarios responden de la **integridad** de los fondos mientras los consultan y **no pueden sacarlos del espacio de consulta**.\n- **Procedimiento (art. 39)**: **cada unidad documental no puede ser consultada por más de un usuario a la vez** (salvo autorización especial), ni se permite la consulta simultánea de varias unidades por un mismo investigador.\n- **Instrumentos de descripción (art. 40)**: de **libre acceso**, pero **se prohíbe su reproducción** para salvaguardar la **propiedad intelectual** de la Universidad.\n- **Obligación de cita (art. 41)**: los investigadores deben **citar la procedencia** y **entregar una copia** de su trabajo publicado al Archivo."},{"h":"Reproducción de documentos (arts. 42 a 47)","t":"- **Solicitud (art. 43)**: el Archivo facilita reproducciones **previa solicitud en impreso normalizado y pago** según las **tarifas aprobadas por la Universidad**, en la medida de su capacidad y medios.\n- **Realización (art. 44)**: las hace **el personal del Archivo**; en casos excepcionales, el responsable puede autorizar la salida de la documentación para reproducirla, **controlada en todo momento**.\n- **Acceso restringido (art. 45)**: hace falta la **autorización previa y expresa** de la autoridad que estableció la restricción. Para documentación **con valor administrativo**, la petición se dirige a la **unidad administrativa responsable** del procedimiento.\n- **Restricciones (art. 46)**: no se hacen copias cuando el estado de conservación no lo permita.\n- **Copias (art. 47)**: **copias simples**; **copias informadas** de documentación de **conservación permanente cuyo valor administrativo haya prescrito**; y facilita la obtención de **copias certificadas** (solicitud por escrito al Archivo)."},{"h":"Préstamo administrativo a oficinas y préstamos para difusión (arts. 33, 48 a 50)","t":"- **Préstamo (art. 48)**: el Archivo puede prestar **documentos originales a las unidades administrativas y servicios de la Universidad, generados y remitidos por ellos**, para facilitar la consulta y agilizar los trámites y la toma de decisiones. **Durante el préstamo, la unidad solicitante es responsable de la integridad** del documento.\n- **Solicitud (art. 49)**: **petición por escrito del responsable de la unidad**. El Archivo puede **reclamar por escrito**, con relación de los pendientes, los documentos no devueltos en plazo.\n- **Préstamo para difusión (art. 50)**: en casos excepcionales, **préstamo temporal** para actividades formativas o de difusión cultural externas (por ejemplo, **exposiciones**); **autoriza la Secretaría General**, previo informe del Archivo.\n- **Resumen del acceso**: el público en sala (consulta), las oficinas (préstamo de lo que remitieron) y los ciudadanos e investigadores (copias y consulta)."},{"h":"Consulta online y servicios del Archivo","t":"- El Archivo cuenta con un **portal en línea de acceso público** que difunde los fondos (descripción **ISAD(G)** de los fondos, cuadros de clasificación, inventarios) y con una **Guía de los fondos**, una guía de **«El Archivo de la A a la Z»** (Cuaderno Técnico de Patrimonio n.º 12) y una **Guía del Archivo**.\n- Su web agrupa los servicios en **servicios a la investigación**, **servicios a la administración universitaria** y **programas de financiación recibidos**.\n- Los precios de **reproducción y digitalización** los aprueba el Consejo de Gobierno (art. 43: tarifas aprobadas por la Universidad)."}],"clave":["Documento de archivo: testimonio de los fines y actividades de la Universidad, en cualquier soporte; excluye las obras editadas (Patrimonio Bibliográfico).","Serie = documentos homogéneos del mismo órgano y función; fondo = conjunto de series con la misma procedencia; clasificación por principio de procedencia.","Archivo de gestión: trámite + 5 años; responsables: jefes de unidad. Intermedio: fase semiactiva, consulta esporádica. Histórico: valor permanente.","Transferencia: acta o relación de entrega; calendario de las tablas de valoración; originales o copias únicas; el Archivo puede rechazar envíos.","Eliminación: solo con acuerdo de la Comisión de Valoración; acta; posible muestra.","Consulta en sala gratuita; un solo usuario por unidad documental; depósitos solo personal del Archivo; préstamo administrativo solo a la unidad remitente, por escrito."],"podcast":[{"v":"A","t":"Hola. Último tema del bloque específico: el documento de archivo y el ciclo documental. Es el Reglamento del Archivo Universitario, artículo por artículo."},{"v":"B","t":"Un documento de archivo es toda expresión en lenguaje natural o convencional, gráfica, sonora o en imagen, en cualquier soporte, incluidos los informáticos, que constituya el testimonio de los fines y actividades de la Universidad. Se exceptúan las obras editadas, que son Patrimonio Bibliográfico."},{"v":"A","t":"Una serie documental es un conjunto de unidades documentales homogéneas, generadas por un mismo órgano en el ejercicio de una función. Y un fondo es un conjunto de series con una misma procedencia. La clasificación sigue el principio de procedencia."},{"v":"B","t":"El ciclo documental son tres fases. El archivo de gestión, de oficina, guarda los documentos en trámite durante el trámite y cinco años más. Los responsables son los jefes de las unidades. Luego se transfieren al archivo intermedio, que es la fase semiactiva, con consulta esporádica. Y los de valor histórico pasan al archivo histórico, para conservarse permanentemente."},{"v":"A","t":"El Archivo Universitario es la cabecera del sistema y asume las funciones de archivo intermedio e histórico. La gestión de esos dos corresponde exclusivamente al Servicio de Archivo."},{"v":"B","t":"Las transferencias. Ordinarias, de las unidades, y extraordinarias, por donación, compra o legado, que aprueba el Consejo de Gobierno. Toda entrada lleva un acta o relación de entrega, se ajusta al calendario de las tablas de valoración, y los documentos deben ser originales o copias únicas. El Archivo puede rechazar envíos incorrectos. Y hay un Registro General de entrada de fondos."},{"v":"A","t":"Eliminar documentos está prohibido salvo que lo acuerde la Comisión de Valoración. Se levanta acta y puede conservarse una muestra de originales."},{"v":"B","t":"Organización física. Se ordena por criterios cronológicos, alfabéticos o numéricos, y se instala en unidades de conservación identificadas por su signatura. Solo el personal del Archivo accede a los depósitos."},{"v":"A","t":"Consulta. Es un derecho de la comunidad universitaria y de los ciudadanos. La consulta en sala es gratuita o se entregan copias a cargo del solicitante. Hay que rellenar un formulario, acreditar la identidad e indicar el tema de investigación, protegido por el secreto estadístico. Una unidad documental no puede ser consultada por más de un usuario a la vez. Y los investigadores deben citar la procedencia y entregar una copia de su trabajo."},{"v":"B","t":"Reproducción: previa solicitud en impreso y pago de las tarifas. Las hace el personal del Archivo. Hay copias simples, informadas y certificadas. Los instrumentos de descripción son de libre acceso, pero está prohibido reproducirlos."},{"v":"A","t":"El préstamo administrativo: el Archivo presta originales a las unidades administrativas que los generaron y remitieron. La petición es por escrito del responsable de la unidad, que responde de la integridad del documento. El Archivo puede reclamar por escrito los no devueltos. Y para exposiciones, el préstamo temporal lo autoriza la Secretaría General, previo informe del Archivo."},{"v":"B","t":"Haz el test. Y con esto, termina el bloque específico. Mucho ánimo."}],"preguntas":[{"q":"Según el artículo 4 del Reglamento, ¿qué es un documento de archivo?","o":["Toda expresión en lenguaje natural o convencional, gráfica, sonora o en imagen, en cualquier soporte, que constituya el testimonio de los fines y actividades de la Universidad","Solo los documentos en papel generados por los órganos de gobierno","Cualquier obra editada por la Universidad","Solo los expedientes terminados"],"c":0,"e":"Art. 4 del Reglamento del Archivo.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Las obras de creación literaria, científica o técnica editadas se consideran, según el artículo 4:","o":["Parte del Patrimonio Bibliográfico, no documentos de archivo","Documentos de archivo de conservación permanente","Patrimonio Documental Universitario","Documentos de apoyo informativo"],"c":0,"e":"Art. 4 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El Sistema de Archivos de la UGR está constituido, según el artículo 6, por:","o":["Los Archivos de Gestión, el Archivo Intermedio y el Archivo Histórico","El Archivo Central y los archivos de las Facultades","El Archivo Histórico y el Archivo Provincial","Solo el Archivo Histórico"],"c":0,"e":"Art. 6 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Los Archivos de Gestión o de oficinas reúnen, según el artículo 7:","o":["La documentación en trámite o sometida a continua utilización y consulta por la unidad productora","Los documentos de consulta esporádica","Los documentos de valor histórico","Las donaciones de particulares"],"c":0,"e":"Art. 7 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Los Archivos de Gestión conservarán los documentos mientras dure la tramitación y durante:","o":["Los cinco años siguientes a la finalización del trámite administrativo","Los dos años siguientes","Los diez años siguientes","Un año desde la recepción"],"c":0,"e":"Art. 8 del Reglamento. Después se transfieren al Archivo Intermedio.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"¿Sobre quién recae la responsabilidad de la conservación y custodia de los documentos de los Archivos de Gestión y de su transferencia al Archivo Intermedio (art. 9)?","o":["Los jefes de las unidades correspondientes","El Servicio de Archivo","El Secretario General","La Comisión de Valoración"],"c":0,"e":"Art. 9 del Reglamento: pueden designar un encargado.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según el artículo 10 del Reglamento, deberán contar con Archivos de Gestión:","o":["Todos los servicios académicos y administrativos centrales y cada centro u órgano equivalente","Solo los servicios centrales","Únicamente las Facultades","Solo el Rectorado"],"c":0,"e":"Art. 10 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El Archivo Intermedio está integrado, según el artículo 12, por documentos:","o":["Transferidos por las unidades productoras, en fase semiactiva y de consulta esporádica","En trámite y de uso continuo","De valor histórico permanente","Recibidos por donación"],"c":0,"e":"Permanecen hasta su eliminación o transferencia al Archivo Histórico.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El Archivo Histórico lo integran, según el artículo 13:","o":["Los documentos transferidos por el Archivo Intermedio que, por su valor histórico, deben conservarse permanentemente","Todos los documentos con más de 5 años","Solo los documentos anteriores a 1900","Los documentos en trámite"],"c":0,"e":"También lo que se reciba por donación, compra o cesión.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"La gestión, organización y dirección del Archivo Intermedio y del Archivo Histórico corresponde, según el artículo 14:","o":["Exclusivamente al Servicio de Archivo","A los jefes de unidad","A la Comisión de Valoración","A la Gerencia"],"c":0,"e":"Art. 14 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El Archivo Universitario es, según el artículo 15, la cabecera del sistema archivístico y asume las funciones de:","o":["Archivo Intermedio y de Archivo Histórico","Archivo de Gestión y de Archivo Intermedio","Archivo Central y de Archivo de Gestión","Solo Archivo Histórico"],"c":0,"e":"Art. 15 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"¿Qué es una serie documental según el artículo 23 del Reglamento?","o":["El conjunto de unidades documentales de estructura y contenido homogéneo, generadas por un mismo órgano o sujeto productor en el ejercicio de cada una de sus funciones específicas","El conjunto de fondos de una misma época","Un expediente completo","El conjunto de documentos de un archivo"],"c":0,"e":"El fondo es el conjunto de series con una misma procedencia.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Los fondos del Sistema Archivístico se clasifican, según el artículo 22, siguiendo un criterio que tendrá como base el principio de:","o":["Procedencia","Orden original","Valoración","Cronología"],"c":0,"e":"Art. 22 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según el artículo 25 del Reglamento, terminada la organización de los documentos se procederá a su instalación en unidades de conservación adecuadas, identificadas por:","o":["La signatura que les corresponda","El código de barras","La fecha de transferencia","El nombre del productor"],"c":0,"e":"Art. 25 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El ingreso de documentos en el Archivo se realizará, según el artículo 26:","o":["Por transferencia ordinaria y regular, o por transferencia extraordinaria (donación, depósito, herencia, legado…)","Solo por transferencia ordinaria","Solo por compra","Por decisión de cada unidad"],"c":0,"e":"Las extraordinarias han de ser aceptadas, aprobadas u ordenadas por el Consejo de Gobierno.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Toda entrada de documentos en el Archivo Universitario irá acompañada, según el artículo 27:","o":["Del acta o impreso de transferencia o relación de entrega, ajustada a los modelos normalizados","De una resolución del Rector siempre","De una copia digital obligatoria","De un informe del Servicio Jurídico"],"c":0,"e":"Art. 27.a del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Los documentos objeto de transferencia deberán ser, según el artículo 27:","o":["Originales o copias únicas","Copias simples","Siempre originales","Digitalizaciones"],"c":0,"e":"Art. 27.b del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Si el Archivo recibe un envío que no cumple la normativa de transferencias, según el artículo 27.c):","o":["Podrá rechazarlo y solicitar una nueva remisión","Debe aceptarlo y corregirlo","Lo transfiere al Archivo Histórico","Lo elimina"],"c":0,"e":"Art. 27.c del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"La adquisición de documentación por transferencia extraordinaria se formaliza, según el artículo 27.d), mediante:","o":["Una resolución del Rector y posterior información al Consejo de Gobierno","Un acuerdo del Claustro","Una resolución de la Gerencia","Un acta de la Comisión de Valoración"],"c":0,"e":"Art. 27.d del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El Archivo Universitario contará, según el artículo 28, con:","o":["Un Registro General de entrada de fondos","Un registro de salida de documentos","Un libro de visitas","Un registro de préstamos de oficinas"],"c":0,"e":"Art. 28 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según el artículo 29 del Reglamento, la eliminación de documentos:","o":["Está prohibida si no la acuerda la Comisión de Valoración (antes Calificadora), y de toda eliminación se levanta acta","Puede decidirla cada unidad administrativa","Corresponde al Rector","Se hace siempre sin acta"],"c":0,"e":"Art. 29 del Reglamento. Puede conservarse una muestra de originales.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según el artículo 33 del Reglamento, el acceso a los documentos podrá llevarse a cabo mediante:","o":["Consulta gratuita en las instalaciones del Archivo o entrega de copias a cargo del solicitante","Consulta previo pago de una tasa","Solo copias digitales","Solo consulta por correo"],"c":0,"e":"Art. 33 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"¿Quién tiene acceso directo a los depósitos del Archivo (art. 34)?","o":["Únicamente el personal del Archivo Universitario, salvo visitas previamente autorizadas","Los investigadores acreditados","Las unidades administrativas","Cualquier miembro de la comunidad universitaria"],"c":0,"e":"Art. 34 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Para solicitar la consulta de documentos, según el artículo 36, el solicitante debe:","o":["Cumplimentar un formulario, acreditar su personalidad e indicar el tema de su investigación a efectos estadísticos","Pagar una tasa y firmar un compromiso de confidencialidad","Presentar una autorización del Rector","Solicitar cita previa con el Secretario General"],"c":0,"e":"Los datos están amparados por el secreto estadístico.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según el artículo 39, cada unidad documental:","o":["No podrá ser consultada por más de un usuario a la vez, salvo autorización especial","Puede ser consultada por varios usuarios a la vez","Solo puede consultarse por el personal del Archivo","Debe consultarse en dos días diferentes"],"c":0,"e":"Art. 39 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Los instrumentos de descripción existentes en el Archivo Universitario son, según el artículo 40:","o":["De libre acceso, pero queda prohibida su reproducción por los usuarios","De acceso restringido","De libre acceso y reproducción","Solo para el personal"],"c":0,"e":"Para salvaguardar la propiedad intelectual de la Universidad.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según el artículo 41, los investigadores que publiquen trabajos con documentos del Archivo deberán:","o":["Citar la procedencia y entregar una copia del trabajo al Archivo","Solicitar permiso del Rector","Pagar un canon","Hacer una donación al fondo"],"c":0,"e":"Obligación de cita (art. 41).","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Las reproducciones de documentos del Archivo se facilitan, según el artículo 43:","o":["Previa solicitud en impreso normalizado y pago según las tarifas aprobadas por la Universidad","Gratuitamente y sin solicitud","Solo a investigadores","Solo en soporte digital"],"c":0,"e":"Art. 43 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Las copias informadas que facilita el Archivo (art. 47) se refieren a documentación:","o":["De conservación permanente cuyo valor administrativo haya prescrito","En trámite","Con datos personales sensibles","De acceso restringido"],"c":0,"e":"Art. 47 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según el artículo 48, el Archivo podrá prestar documentos originales a:","o":["Las unidades administrativas y servicios de la Universidad, generados y remitidos por ellos","Cualquier usuario externo","Las bibliotecas de otras universidades","Cualquier miembro de la comunidad universitaria"],"c":0,"e":"Durante el préstamo, la unidad solicitante es la responsable de la integridad del documento.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El préstamo de documentos originales a las unidades administrativas, según el artículo 49, se realiza previa:","o":["Petición por escrito del responsable de la unidad","Petición verbal de cualquier empleado","Autorización de la Gerencia","Resolución del Rector"],"c":0,"e":"El Archivo puede reclamar por escrito los documentos no devueltos.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"El préstamo temporal de documentos para actividades de difusión cultural externas, como exposiciones, lo autoriza (art. 50):","o":["La Secretaría General, previo informe del Archivo","El Servicio de Archivo por sí solo","El Rector","La Comisión de Valoración"],"c":0,"e":"Art. 50 del Reglamento: solo en casos excepcionales.","r":"ARCHIVO_REGLAMENTO art. doc"},{"q":"Según el artículo 54 del Reglamento, la Universidad facilitará los medios para que el Archivo elabore y mantenga actualizado:","o":["Un plan de emergencia y un programa de seguridad para documentos esenciales","Un plan de digitalización masiva","Un protocolo de préstamo","Un plan de expurgo anual"],"c":0,"e":"Art. 54 del Reglamento.","r":"ARCHIVO_REGLAMENTO art. doc"}],"mp3":true},"e8":{"id":"e8","bloque":"Específico","num":8,"titulo":"Servicios y atención al usuario de la Biblioteca de la UGR","alcance":"Tipología de usuarios. Formación de usuarios. Servicios de la Biblioteca de la Universidad de Granada: información y referencia, consulta, préstamo, préstamo interbibliotecario, reproducción. Derechos, deberes y régimen de incumplimiento.","fuentes":["Reglamento de la Biblioteca Universitaria de Granada (NCG1582), capítulos V y VI (arts. 15 a 31)","Normas de uso generales de la BUG (Dirección de la Biblioteca, 12/02/2026)","Normativa del préstamo a domicilio de la BUG (Biblioguías)"],"peso":"alto","notas":["Este tema es muy preguntable porque son listas cerradas: los derechos del art. 15, los deberes del art. 19 y las sanciones (art. 20 y normas de uso). Apréndete los verbos y los plazos.","Ojo con una trampa habitual: la sanción por retraso es de DOS días de suspensión por cada día de retraso y por cada documento (en préstamos por horas, un día por hora). No confundas con «un día por día».","Los precios y los límites de préstamo cambian de un curso a otro. Lo que cuenta para el examen es la regla (qué se presta, a quién, qué sanción), más que la cifra concreta. Las cifras de la tabla de usuarios están en la sección de préstamo del tema E9.","Para repasar el préstamo en detalle (tipos, renovaciones, reservas, sanción solidaria, CBUA), ve al tema E9. Este tema E8 se centra en los servicios y en la relación con la persona usuaria."],"apuntes":[{"h":"Tipología de usuarios de la Biblioteca","t":"- **Comunidad universitaria de Granada**: profesorado, personal investigador, becarios, estudiantado y PTGAS.\n- **Personal de Centros Adscritos** y **personal de otras universidades en estancia oficial**.\n- **Personal de organismos e instituciones con convenio** en materia de bibliotecas.\n- **Personal no universitario** autorizado por la Dirección de la Biblioteca.\n- **Personas usuarias externas**: instituciones ajenas a la UGR que solicitan **préstamo interbibliotecario**.\n- En la tabla de préstamo se distinguen, entre otros, estudiantado de **grado** y de **postgrado**, **PDI e investigador**, **PTGAS**, **egresados** (Alumni), **jubilados** (Senior UGR), **visitante** (PDI no UGR) y **usuarios no UGR**. Cuanto más vinculada está la persona a la UGR, más documentos puede llevarse y en más condiciones."},{"h":"Derechos de las personas usuarias (art. 15)","t":"Son derechos de las personas usuarias:\n- **Recibir todos los servicios** que la Biblioteca oferta (con manuales de funcionamiento al día).\n- **Atención personalizada** presencial, telefónica o virtual.\n- **Información y asesoramiento** sobre la Biblioteca, sus servicios y recursos.\n- **Acceso libre y gratuito** a los espacios destinados a las personas usuarias.\n- **Espacios** para la lectura, el estudio, el aprendizaje y la investigación.\n- **Acceder y consultar** los fondos y recursos de información.\n- **Recursos de información de calidad**, impresos y electrónicos.\n- **Equipamientos e infraestructuras** adecuados.\n- **Participar** en la consecución de los fines de la Biblioteca.\n- **Trato amable y cordial**.\n- **Privacidad y confidencialidad** de la informac
