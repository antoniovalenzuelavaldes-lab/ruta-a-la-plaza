ión y datos personales."},{"h":"Deberes de las personas usuarias (art. 19)","t":"- **Cumplir** las normativas de la Biblioteca y los acuerdos y resoluciones de los órganos de gobierno de la Universidad.\n- **Respetar el patrimonio** de la Biblioteca y hacer **correcto uso** de instalaciones, equipos y recursos.\n- **Evitar comportamientos que interfieran en los derechos de los demás** (como **reservar puestos de lectura** o el uso inadecuado de los medios informáticos).\n- Para usar el préstamo hay que **estar registrado en el sistema de gestión bibliotecaria**; es **personal e intransferible**.\n- En la estancia presencial, **velar por las propias pertenencias**: la Biblioteca **no se hace responsable** de pérdidas, robos o deterioros."},{"h":"Quejas, sugerencias y compromisos de calidad (arts. 16, 17 y 28)","t":"- Las personas usuarias pueden exponer **observaciones, sugerencias o quejas** por **cualquier medio** a su alcance (art. 16).\n- La **Dirección de la Biblioteca**, o por delegación la persona responsable de cada punto de servicio, **resuelve** las sugerencias y quejas (art. 28).\n- La Biblioteca **cumplirá todos los compromisos de calidad** que aporta a la **Carta de Servicios de la UGR** (art. 17).\n- Cada punto de servicio puede dictar **normas complementarias**, que deben remitirse a la Dirección para ser **refrendadas** (art. 18)."},{"h":"Incumplimiento de la normativa (art. 20 y Normas de uso)","t":"- Quien **altere el orden** en las dependencias abiertas al público es **expulsado de la sala de lectura hasta el día siguiente**; en caso de **reincidencia**, el órgano competente propone al Rector las medidas necesarias (art. 20.1).\n- Quien **deteriore libros** u otro material debe **reponerlos** y, si no es posible, **indemnizar** el perjuicio (art. 20.2).\n- La **falta de respeto al personal** o el **incumplimiento reiterado** llevan a la **privación del derecho de préstamo**, previa autorización de la Dirección (art. 20.4).\n- Si los hechos pudieran ser **falta administrativa o delito**, se comunican al Rector, que lo pone en conocimiento de las unidades administrativas o del **Ministerio Fiscal** (art. 20.5).\n- Normas de uso (2026): el retraso en la devolución, tras el **aviso por correo electrónico institucional**, supone **suspensión del préstamo de dos días por cada día de retraso y por cada documento**. Si se altera el orden, se **apercibe verbalmente**, y si no se corrige, se puede **expulsar** y avisar a **seguridad**; los hechos graves se comunican a la **Inspección de Servicios** de la UGR."},{"h":"Servicio de información y referencia (art. 21)","t":"Es **el núcleo central del servicio a las personas usuarias** y comprende:\n- **Orientación en el uso de los recursos de información**.\n- **Orientación personalizada, presencial y remota**, en las áreas de interés de la persona usuaria.\n- **Información presencial y remota** sobre la Biblioteca, sus servicios y recursos.\n- **Asesoramiento para buscar y localizar información** tanto en la Biblioteca como en otras bibliotecas."},{"h":"Formación de personas usuarias (art. 22)","t":"- **Objetivo prioritario**: orientar, facilitar y contribuir al proceso de **enseñanza y aprendizaje** de todos los miembros de la comunidad universitaria, y la **capacitación en competencias informacionales** para gestionar la información de forma eficaz y eficiente.\n- **Actividades**: **cursos de formación, charlas y visitas guiadas**; además se facilitan **guías** sobre el funcionamiento de la Biblioteca y el uso de sus recursos."},{"h":"Consulta, préstamo, interbibliotecario y reproducción (arts. 23 a 27)","t":"- **Consulta y acceso (art. 23)**: a los **recursos de apoyo a la docencia, investigación, aprendizaje y creación**, sea cual sea su soporte; a la **producción científica** de la UGR; y al **fondo bibliográfico histórico**, según la normativa de la Biblioteca del Hospital Real.\n- **Préstamo a domicilio (art. 24)**: préstamo de los documentos definidos como prestables y, en su caso, **renovación y reserva**.\n- **Préstamo interbibliotecario (art. 25)**: la Biblioteca facilita a los usuarios los documentos **no disponibles en sus fondos** y suministra a otras bibliotecas los que soliciten y sean susceptibles de envío.\n- **Incremento y actualización (art. 26)**: la Biblioteca garantiza una **colección suficiente y actualizada**.\n- **Reproducción (art. 27)**: en todos los puntos de servicio hay medios de reproducción, siempre con respeto a los **derechos de autor**; **no se permiten copias** de **manuscritos, incunables y obras publicadas entre 1500 y 1900**, para lo que se ofrece un **servicio central de digitalización** en la **Biblioteca del Hospital Real**; los **precios** son uniformes para toda la UGR."},{"h":"Otros servicios: proyección social, fondos en departamentos, fondos raros","t":"- **Proyección social (art. 29)**: actividades para **interactuar con la sociedad** y **alianzas** dentro y fuera de la Universidad.\n- **Materiales en departamentos e institutos (art. 30)**: derecho de acceso a las colecciones adquiridas por cualquier vía y depositadas en **Departamentos, Institutos, sedes de grupos de investigación, despachos…**; los **responsables de esas dependencias** custodian los fondos y facilitan su acceso.\n- **Fondos raros y preciosos (art. 31)**: manuscritos, incunables, libros raros, mapas, grabados y estampas… se consultan según **normativa específica**."},{"h":"Condiciones generales del préstamo","t":"- **Definición**: la Biblioteca pone a disposición de sus usuarios, **por un tiempo limitado y fuera del ámbito de la Biblioteca**, su material bibliográfico y documental. Es **personal e intransferible**.\n- **Horario del servicio**: de **lunes a viernes, de 8,30 a 20,30** horas.\n- **No se prestan**: publicaciones periódicas; manuscritos, incunables y obras anteriores a **1901**; libros, documentos y mapas modernos **agotados y de difícil reposición**; los **muy consultados de los que solo hay un ejemplar**; atlas, dibujos, estampas, grabados; y lo que, a juicio de la Biblioteca, deba preservarse.\n- **Para prestar**: estar **registrado**; se formaliza con el **carné de la Biblioteca**, el **carné de la UGR** u otro documento justificativo.\n- **Confidencialidad**: el personal se compromete a **guardar la confidencialidad** de los datos de las personas usuarias y de los documentos que tienen o han tenido en préstamo."}],"clave":["Derechos (art. 15): servicios, atención personalizada, información, espacios, fondos, recursos de calidad, equipamiento, participación, trato amable, privacidad.","Deberes (art. 19): cumplir normas, respetar patrimonio, no interferir (puestos de lectura), registro para préstamo, velar por pertenencias.","Información y referencia: núcleo central del servicio (art. 21).","Formación: cursos, charlas y visitas guiadas + guías; objetivo: competencias informacionales (art. 22).","Orden alterado: expulsión de la sala hasta el día siguiente; deterioro: reposición; falta de respeto: privación del préstamo.","Retraso: 2 días de suspensión por día y por documento; copia prohibida de manuscritos, incunables y obras 1500-1900."],"podcast":[{"v":"A","t":"Hola. Tema de servicios y atención al usuario de la Biblioteca de la Universidad de Granada. Se estudia con los capítulos de usuarios y servicios del Reglamento, los artículos 15 a 31."},{"v":"B","t":"Primero, los usuarios. La comunidad universitaria, el personal de centros adscritos, el de otras universidades en estancia oficial, el de organismos con convenio, el personal no universitario autorizado por la Dirección, y las instituciones externas que piden préstamo interbibliotecario."},{"v":"A","t":"Los derechos del artículo 15. Recibir todos los servicios, atención personalizada presencial, telefónica o virtual, información y asesoramiento, acceso libre y gratuito a los espacios, espacios para estudio y aprendizaje, acceso a los fondos, recursos de calidad impresos y electrónicos, equipamientos adecuados, participar en los fines de la Biblioteca, trato amable y cordial, y privacidad."},{"v":"B","t":"Los deberes del artículo 19. Cumplir las normativas, respetar el patrimonio, evitar comportamientos que interfieran en los derechos de los demás, como reservar puestos de lectura. Para el préstamo hay que estar registrado y es personal e intransferible. Y la Biblioteca no se responsabiliza de las pérdidas o robos de las pertenencias."},{"v":"A","t":"Si alguien altera el orden, es expulsado de la sala de lectura hasta el día siguiente. Quien deteriora el material, lo repone o indemniza. La falta de respeto al personal o el incumplimiento reiterado llevan a la privación del derecho de préstamo. Si hay delito, se comunica al Rector, que avisa al Ministerio Fiscal."},{"v":"B","t":"Servicios. La información y referencia es el núcleo central del servicio: orientación en el uso de recursos, orientación personalizada presencial y remota, información sobre la Biblioteca, y asesoramiento para localizar información, también en otras bibliotecas."},{"v":"A","t":"La formación tiene como objetivo prioritario la capacitación en competencias informacionales. Se organizan cursos, charlas y visitas guiadas, y se facilitan guías."},{"v":"B","t":"El préstamo a domicilio incluye renovación y reserva. El interbibliotecario proporciona los documentos que no están en los fondos propios. La reproducción respeta los derechos de autor, y no se permiten copias de manuscritos, incunables ni obras entre 1500 y 1900; para eso hay un servicio central de digitalización en el Hospital Real."},{"v":"A","t":"La normativa del préstamo: horario de lunes a viernes de ocho y media a ocho y media. No se prestan publicaciones periódicas, manuscritos, incunables, ni obras anteriores a 1901, ni lo agotado o con un único ejemplar muy consultado. El retraso se penaliza con dos días de suspensión por cada día de retraso y por documento."},{"v":"B","t":"Haz el test. Y recuerda: cada pregunta de este tema se resuelve con una lista cerrada del Reglamento."}],"preguntas":[{"q":"Según el artículo 15 del Reglamento, ¿cuál de los siguientes es un derecho de las personas usuarias?","o":["Recibir atención personalizada presencial, telefónica o virtual","Reservar puestos de lectura de forma indefinida","Sacar libros sin registrarse","Reproducir cualquier fondo sin limitaciones"],"c":0,"e":"Art. 15.b del Reglamento.","r":"REGLAMENTO_BUG art. 15"},{"q":"Entre los derechos de las personas usuarias (art. 15) figura acceder a los espacios destinados a ellas de forma:","o":["Libre y gratuita, en las condiciones de la normativa vigente","Solo previo pago de tasa","Solo con cita previa","Solo en horario de mañana"],"c":0,"e":"Art. 15.d del Reglamento.","r":"REGLAMENTO_BUG art. 15"},{"q":"El artículo 15 del Reglamento reconoce a las personas usuarias el derecho a:","o":["Privacidad y confidencialidad de la información y datos de carácter personal","Elegir el horario de la Biblioteca","Seleccionar las adquisiciones","Recibir préstamos ilimitados"],"c":0,"e":"Art. 15.k del Reglamento.","r":"REGLAMENTO_BUG art. 15"},{"q":"Según el artículo 16, las personas usuarias pueden exponer sus observaciones, sugerencias o quejas:","o":["A través de cualquier medio que esté a su alcance","Solo por escrito en registro","Solo por el buzón físico","Solo a través del Defensor Universitario"],"c":0,"e":"Art. 16 del Reglamento.","r":"REGLAMENTO_BUG art. 16"},{"q":"¿Quién resuelve las sugerencias y quejas sobre la Biblioteca, según el artículo 28?","o":["La Dirección de la Biblioteca o, por delegación, la persona responsable de cada punto de servicio","El Rector","La Gerencia","La Comisión de Biblioteca"],"c":0,"e":"Art. 28 del Reglamento.","r":"REGLAMENTO_BUG art. 28"},{"q":"Según el artículo 17, la Biblioteca Universitaria cumplirá todos los compromisos de calidad aportados por ella:","o":["A la Carta de Servicios de la UGR","Al Plan Estratégico de REBIUN","Al Consejo de Gobierno","Al Reglamento de la Gerencia"],"c":0,"e":"Art. 17 del Reglamento.","r":"REGLAMENTO_BUG art. 17"},{"q":"Las normas complementarias que dicte cada punto de servicio (art. 18) deben:","o":["Remitirse a la Dirección de la Biblioteca para ser refrendadas","Aprobarse por el Consejo de Gobierno","Publicarse en el BOE","Ratificarse por el Claustro"],"c":0,"e":"Art. 18 del Reglamento.","r":"REGLAMENTO_BUG art. 18"},{"q":"Según el artículo 19, las personas usuarias deben evitar comportamientos que interfieran en los derechos de las demás, como:","o":["Reservar puestos de lectura o usar inadecuadamente los medios informáticos","Hablar con el personal","Consultar los fondos","Pedir préstamos"],"c":0,"e":"Art. 19.c del Reglamento.","r":"REGLAMENTO_BUG art. 19"},{"q":"Para hacer uso del servicio de préstamo, según el artículo 19, es necesario:","o":["Estar registrado en el sistema de gestión bibliotecaria; el uso es personal e intransferible","Pagar una cuota anual","Ser personal docente","Haber realizado un curso de formación"],"c":0,"e":"Art. 19.d del Reglamento.","r":"REGLAMENTO_BUG art. 19"},{"q":"Respecto de las pérdidas, robos o deterioros de las pertenencias de las personas usuarias durante su estancia, el artículo 19 dice que la Biblioteca:","o":["No se hará responsable","Responderá siempre","Responderá solo de los robos","Indemnizará hasta cierto límite"],"c":0,"e":"Art. 19.e del Reglamento.","r":"REGLAMENTO_BUG art. 19"},{"q":"Según el artículo 20, la persona que altere el orden en las dependencias abiertas al público será:","o":["Expulsada de la sala de lectura hasta el día siguiente","Expulsada de la Universidad","Privada del préstamo durante un mes","Apercibida por escrito solamente"],"c":0,"e":"Art. 20.1 del Reglamento. En caso de reincidencia, el órgano competente propone medidas al Rector.","r":"REGLAMENTO_BUG art. 20"},{"q":"La persona que deteriore libros y demás material de la Biblioteca, según el artículo 20, estará obligada a:","o":["Reponerlos y, si no fuera posible, indemnizar el perjuicio causado","Pagar siempre el doble de su valor","Sustituirlos por libros de otro tema","Dejar de usar la Biblioteca"],"c":0,"e":"Art. 20.2 del Reglamento.","r":"REGLAMENTO_BUG art. 20"},{"q":"La falta de respeto al personal de la Biblioteca o el incumplimiento reiterado de la normativa llevará consigo, según el artículo 20:","o":["La privación del derecho de préstamo, previa autorización de la Dirección de la Biblioteca","La expulsión definitiva de la Universidad","Una multa de 30 euros","El cierre de su cuenta de correo"],"c":0,"e":"Art. 20.4 del Reglamento.","r":"REGLAMENTO_BUG art. 20"},{"q":"Cuando los hechos pudieran ser constitutivos de falta administrativa o de delito, según el artículo 20.5, se pondrán en conocimiento:","o":["Del Rector, que lo comunicará, si procede, a las unidades administrativas correspondientes o al Ministerio Fiscal","Directamente de la Policía Nacional","Del Defensor Universitario","De la Gerencia"],"c":0,"e":"Art. 20.5 del Reglamento.","r":"REGLAMENTO_BUG art. 20"},{"q":"Según el artículo 21, ¿qué constituye el núcleo central del servicio a las personas usuarias?","o":["La información y referencia","El préstamo a domicilio","La reprografía","La formación de usuarios"],"c":0,"e":"Art. 21 del Reglamento.","r":"REGLAMENTO_BUG art. 21"},{"q":"El servicio de información y referencia comprende (art. 21), entre otras cosas:","o":["El asesoramiento para buscar y localizar información tanto en la Biblioteca como en otras bibliotecas","Solo la información presencial","La compra de libros","La digitalización de manuscritos"],"c":0,"e":"Art. 21.d del Reglamento.","r":"REGLAMENTO_BUG art. 21"},{"q":"Según el artículo 22, la formación de personas usuarias tiene como objetivo prioritario orientar, facilitar y contribuir al proceso de enseñanza y aprendizaje y la capacitación en:","o":["Competencias informacionales","Competencias digitales","Gestión documental","Catalogación"],"c":0,"e":"Art. 22 del Reglamento.","r":"REGLAMENTO_BUG art. 22"},{"q":"Para la formación de personas usuarias, el artículo 22 prevé la organización de:","o":["Cursos de formación, charlas y visitas guiadas","Solo cursos reglados","Exposiciones bibliográficas","Becas de formación"],"c":0,"e":"Además se facilitan guías sobre el funcionamiento de la Biblioteca y el uso de sus recursos.","r":"REGLAMENTO_BUG art. 22"},{"q":"El servicio de consulta y acceso a los recursos de información (art. 23) se realiza, entre otros, a:","o":["La producción científica de la Universidad de Granada","Únicamente los fondos impresos","Las bibliotecas de otras universidades","Los archivos de gestión"],"c":0,"e":"Art. 23.b del Reglamento.","r":"REGLAMENTO_BUG art. 23"},{"q":"Según el artículo 24, el préstamo a domicilio consiste en el préstamo de los documentos definidos como prestables y, en su caso:","o":["La renovación y la reserva de los mismos","La digitalización","La donación","El expurgo"],"c":0,"e":"Art. 24 del Reglamento.","r":"REGLAMENTO_BUG art. 24"},{"q":"El préstamo interbibliotecario (art. 25) proporciona a las personas usuarias:","o":["Los documentos no disponibles dentro de los propios fondos, en la medida de lo posible","Solo documentos de la UGR","Solo documentos digitales","Únicamente material audiovisual"],"c":0,"e":"Art. 25 del Reglamento. También suministra fondos a otras bibliotecas.","r":"REGLAMENTO_BUG art. 25"},{"q":"Según el artículo 27.2, por razones de conservación del patrimonio no se permite hacer copias de:","o":["Manuscritos, incunables y obras publicadas entre 1500 y 1900","Obras posteriores a 1950","Publicaciones periódicas","Tesis doctorales"],"c":0,"e":"Para estos casos hay un servicio central de digitalización en la Biblioteca del Hospital Real.","r":"REGLAMENTO_BUG art. 27"},{"q":"¿Dónde está situado el servicio central de digitalización al que se refiere el artículo 27?","o":["En la Biblioteca del Hospital Real","En la Biblioteca de Ciencias de la Salud","En el Archivo Universitario","En el Edificio Elvira"],"c":0,"e":"Art. 27.2 del Reglamento.","r":"REGLAMENTO_BUG art. 27"},{"q":"Los precios de los servicios de reproducción, según el artículo 27.3, se fijan:","o":["Periódicamente y con carácter uniforme para toda la Universidad de Granada","Por cada biblioteca de manera independiente","Por la Gerencia, anualmente","Por cada usuario"],"c":0,"e":"Art. 27.3 del Reglamento.","r":"REGLAMENTO_BUG art. 27"},{"q":"Según el artículo 30, las personas usuarias tienen derecho de acceso a las colecciones adquiridas por cualquier vía de financiación y depositadas en:","o":["Departamentos, Institutos, sedes de grupos de investigación y despachos individuales de la UGR","Solo en bibliotecas","Solo en el Archivo","Únicamente en las Facultades"],"c":0,"e":"Los responsables de esas dependencias custodian los fondos.","r":"REGLAMENTO_BUG art. 30"},{"q":"Los manuscritos, incunables, libros raros o preciosos y otros fondos valiosos (art. 31) se consultan:","o":["De acuerdo con la normativa específica desarrollada a tal efecto","Igual que el resto de fondos","Solo con permiso del Rector","Solo en reproducción digital"],"c":0,"e":"Art. 31 del Reglamento.","r":"REGLAMENTO_BUG art. 31"},{"q":"Según las Normas de uso generales de la BUG (2026), el retraso en la devolución del material prestado, tras la comunicación al correo institucional, conlleva:","o":["Suspensión del préstamo durante dos días por cada día de retraso y por cada documento","Una multa económica","Suspensión de un día por cada día","Expulsión de la Biblioteca"],"c":0,"e":"Normas de uso generales de la BUG.","r":"NORMAS_USO_BUG art. doc"},{"q":"Según las Normas de uso generales, si una persona altera el orden o tiene un comportamiento ruidoso o molesto, será apercibida:","o":["De forma verbal por la persona responsable de la Biblioteca y, si no lo corrige, podrá ser expulsada","Por escrito","Con una multa","Sin posibilidad de expulsión"],"c":0,"e":"Si persiste, se puede avisar a los servicios de seguridad.","r":"NORMAS_USO_BUG art. doc"},{"q":"Los hechos de gravedad o presuntamente constitutivos de infracción disciplinaria, según las Normas de uso generales, se comunican a:","o":["La Inspección de Servicios de la UGR","El Defensor Universitario","La Gerencia","La Policía Local"],"c":0,"e":"Para su estudio por si pudiera derivar en sanciones.","r":"NORMAS_USO_BUG art. doc"},{"q":"¿Cuál es el horario del servicio de préstamo a domicilio según la normativa de la BUG?","o":["De lunes a viernes, de 8,30 a 20,30 horas","De lunes a sábado de 9 a 14 horas","Todos los días de 8 a 21 horas","De lunes a viernes de 9 a 15 horas"],"c":0,"e":"Normativa del préstamo a domicilio.","r":"PRESTAMO_NORMATIVA art. doc"},{"q":"Según la normativa del préstamo, el material que NO es objeto de préstamo incluye:","o":["Publicaciones periódicas, manuscritos, incunables y obras anteriores a 1901","Los libros de texto","Los manuales","Las novelas"],"c":0,"e":"También los libros agotados y de difícil reposición, los muy consultados con un único ejemplar, atlas, dibujos, estampas y grabados.","r":"PRESTAMO_NORMATIVA art. doc"},{"q":"El personal de la Biblioteca se compromete, según la normativa del préstamo, a:","o":["Guardar la confidencialidad de los datos de las personas usuarias y de los documentos que tienen o han tenido en préstamo","Cobrar las multas","Publicar las listas de morosos","Enviar los datos a otras universidades"],"c":0,"e":"Compromiso de la Biblioteca.","r":"PRESTAMO_NORMATIVA art. doc"}],"mp3":true},"e10":{"id":"e10","bloque":"Específico","num":10,"titulo":"La digitalización en bibliotecas","alcance":"Técnicas y procedimientos de digitalización: formatos, metadatos, almacenamiento y preservación. La digitalización en la Biblioteca de la Universidad de Granada: el proyecto Ilíberis, el Plan de Preservación Digital y Digibug.","fuentes":["Recomendaciones REBIUN en materia de digitalización y preservación digital de documentos (Línea 3, 2014)","F. Hidalgo Estévez, «Preservación: experiencia de la Biblioteca de la Universidad de Granada» (I Jornadas de Gestión del Patrimonio Bibliográfico, Toledo, 2017)","Reglamento de la Biblioteca Universitaria de Granada, art. 27"],"peso":"medio","notas":["El examen suele preguntar por parámetros concretos: el formato máster (TIFF versión 6), la regla de escanear a 1,5 veces la resolución final, los esquemas de metadatos (Dublin Core, MARC 21, METS, PREMIS) y el almacenamiento (RAID, cinta LTO, checksum).","Distingue bien tres cosas que se confunden: copia de conservación (máster, TIFF sin comprimir), copia de consulta (derivados para la web, como JPEG) y copia de seguridad (en otro lugar).","Del caso UGR, recuerda las fechas y los nombres: proyecto Ilíberis en 2002, repositorio Digibug en 2009, Plan de Preservación Digital desde finales de 2015, sistema LibSafe basado en OAIS e ISO 14721. Las cifras (17.095 documentos, 2.577.155 imágenes) son de 2017: sirven como orden de magnitud.","Mantén la distinción fondo antiguo / propiedad intelectual: el artículo 27 del Reglamento prohíbe copiar manuscritos, incunables y obras de 1500 a 1900, y ofrece el servicio central de digitalización en la Biblioteca del Hospital Real."],"apuntes":[{"h":"Para qué se digitaliza y qué recomienda REBIUN","t":"- REBIUN (Línea 3 del III Plan Estratégico, «Biblioteca digital 2.0») publicó en **2014** las **Recomendaciones en materia de digitalización y preservación digital de documentos**.\n- Definen los procedimientos para crear **copias digitales de alta calidad** a partir de originales, destinadas sobre todo al **acceso en línea** y a la **reproducción en papel**, y que pueden usarse con fines de **conservación** como «copias que podrían sustituir el original».\n- Principio de partida (Objetivo 1): **tecnologías y estándares abiertos** como garantía de **viabilidad, perdurabilidad y preservación**.\n- Hay recomendaciones **generales** (entorno, ficheros máster, visionado, escaneado, archivos, metadatos y directorios, almacenamiento), para **manuscritos e impresos** y para **material audiovisual**."},{"h":"Entorno y equipos de digitalización","t":"- Entorno de visualización en **colores neutros**, con una **reflectancia del 60 % o menos**.\n- El área de trabajo se mantiene **limpia**; escáneres, rodillos y tableros se limpian con regularidad.\n- Los escáneres o cámaras deben **respetar la integridad de los originales** (luz cenital fría, tablero basculante…) y adecuarse a las dimensiones, al tipo de soporte, al detalle y al estado físico.\n- No existe un escáner apto para todo: cuando falte el equipo adecuado se recomienda la **externalización**, mediante el correspondiente **pliego de condiciones técnicas**.\n- Tras comprar el equipo, conviene hacer un **test de rendimiento**.\n- Normas ISO de visionado: **ISO 3664** (condiciones de visionado) e **ISO 12646** (monitores). Monitor de **24 bits o superior**, calibrado a **gamma 2,2**, y cajas de luz de **5000 K (D50)**."},{"h":"Ficheros máster y escaneado","t":"- El **máster** es la copia de uso a partir de la cual se obtienen las copias sucesivas; representa la mejor copia producida y el contenido que la institución quiere mantener a **largo plazo**.\n- Se digitaliza el **documento completo, sin cortes**, dejando un borde que se recorta después; en documentos textuales **no se digitaliza a doble página**.\n- Resolución: se recomienda escanear a **1,5 veces la resolución final deseada**; para **400 ppi** finales, **600 ppi** de escaneado.\n- Perfiles de color: **Adobe RGB 1998** (color) o **Gray Gamma 2.2** (grises). Conversión final a **8 bits por canal** (RGB de 24 bits o 8 bits en escala de grises).\n- Los textos con buen contraste pueden ir en 1 bit, 8 bits de grises o 24 bits RGB; los documentos antiguos o con anotaciones suelen funcionar mejor en **escala de grises**; el **color** se reserva para cuando es importante para el contenido.\n- Se hacen **controles de calidad** durante todo el proceso (resolución, profundidad de color, formato y compresión)."},{"h":"Formatos de archivo","t":"- Se recomiendan **estándares de código abierto**, ampliamente usados y estandarizados, rechazando soluciones propietarias.\n- **TIFF versión 6** para los **ficheros máster** de contenido textual o de imagen, **sin comprimir** (sobre todo si no se usan habitualmente). Si se gestionan activamente en un repositorio, puede valorarse la compresión **sin pérdida LZW o ZIP**; **nunca compresión JPEG en TIFF**.\n- Muchas instituciones se mueven hacia **JPEG2000** como formato máster.\n- **Audio**: **WAVE o BWF**. **Vídeo**: no hay estándar; se recomienda **MXF y JPG2000** (MPEG-2, MPEG-4 o DV no se recomiendan por la pérdida por compresión)."},{"h":"Metadatos, nombres de archivo y directorios","t":"- Sin metadatos una imagen no reúne calidad suficiente: **las imágenes sin un mínimo de metadatos corren el riesgo de perderse**. La política de metadatos se define **antes del inicio** del proyecto.\n- **Descriptivos**: **Dublín Core RDF** o **MARC 21 RDA**. Como contenedor de los descriptivos, administrativos, de derechos y de preservación: **METS XML 2.0**. Para los de preservación: **PREMIS versión 2**. Para participar en **Europeana**: **Europeana Data Model**.\n- **Nombres de archivo**: únicos, estructurados de forma consistente, bien definidos, **persistentes**, **minúsculas**, extensión de tres caracteres, **no más de 32 caracteres**, con ceros a la izquierda en numeraciones.\n- Los **máster se almacenan por separado de los derivados**; los derivados heredan el nombre del máster con un calificador (por ejemplo «pr» para impresión, «t» para miniaturas)."},{"h":"Almacenamiento y copias de seguridad","t":"- Los máster se almacenan en **discos duros con redundancia (RAID)** y no en medios ópticos como CD-R.\n- Un conjunto adicional con metadatos en **cinta abierta estándar (LTO)**, y una **copia de seguridad en otro lugar**.\n- Debe generarse y almacenarse un **checksum** con los archivos de imagen.\n- **CD-ROM y DVD-R no se recomiendan** como almacenamiento a largo plazo; si se usan, CD-R «de archivo», dos o más copias (una sin manipular y guardada en otro lugar) y **inspecciones periódicas con un CRC**."},{"h":"Manuscritos e impresos antiguos","t":"- Manipulación según los criterios de **conservación preventiva**; se utilizan **guantes y batas** y se evita la excesiva manipulación.\n- **No se desencuadernan** los documentos ni siquiera para obtener una mejor reproducción.\n- Los originales con problemas se abren con un **ángulo nunca superior a 120º**; la mesa portalibros no puede usar prensa ni cristal sobre el original ni sistemas hidráulicos.\n- Preferentemente **escáner aéreo o cenital**; el de sobremesa solo para documentos **no encuadernados**. Con cámara digital: focal recomendada de **50 mm**, columna **nivelada y cenital**, **sin flash**.\n- Del proceso salen **dos copias: conservación y consulta**."},{"h":"La digitalización en la BUG: el proyecto Ilíberis","t":"- En **2002** la BUG pone en marcha el proyecto **Ilíberis**, de digitalización y preservación del **fondo antiguo**.\n- Después se firmó un convenio con la **Biblioteca Virtual de Andalucía** y llegaron **subvenciones del Ministerio de Cultura** (2008, 2010, 2011, 2012 y 2013), además de digitalizaciones propias.\n- El objetivo principal, la difusión y preservación, se materializó con el **repositorio institucional Digibug en 2009**.\n- La BUG elaboró un **Manual Técnico de Digitalización** para una política unitaria; recoge formatos (**TIFF, JPG, PDF**) y metadatos (**MODS, METS, PREMIS, DC, ESE, EDM**), siguiendo las **Directrices para proyectos de digitalización de colecciones y fondos de dominio público**.\n- Balance 2002-2017 (según la fuente): **17.095 documentos** y **2.577.155 imágenes**."},{"h":"El Plan de Preservación Digital de la BUG","t":"- Desde **finales de 2015** la BUG cuenta con un **Plan de Preservación Digital**. Es un documento **abierto, en continua actualización**.\n- Punto de partida: en 2015 había unos **30 TB** almacenados en **27 discos externos** (la fuente habla de 36 discos en otro punto), sin preservarse todos en Digibug.\n- Estrategia: un **servidor oscuro** (sin acceso público) que controla la ingesta y **monitoriza periódicamente la integridad (MD5)** y la consistencia de la replicación.\n- Solución: software **LibSafe** de la empresa **Libnova**, hardware en colaboración con el **CSIRC**: almacenamiento masivo con **12 discos de 4 TB en RAID 6** (**36 TB**; tolera el fallo de hasta dos discos).\n- LibSafe se basa en **OAIS e ISO 14721** y automatiza **ingesta, recuperación, diseminación, auditoría, análisis y transformación**.\n- A 12 de abril de 2016 estaban preservados **2.676 objetos digitales** de **5 proyectos**.\n- Siguiente paso: automatizar la digitalización, la **generación de metadatos** y la estructura del objeto digital."},{"h":"La reproducción de fondos antiguos en el Reglamento","t":"- **Art. 27.2**: por razones de conservación del patrimonio, **no se permite hacer copias de manuscritos, incunables y obras publicadas entre 1500 y 1900**. Para estos casos, la BUG ofrece un **servicio central de digitalización** situado en la **Biblioteca del Hospital Real**.\n- Para las obras de comienzos del siglo XX o de características especiales se sigue el **criterio de los profesionales responsables del fondo**.\n- Los **precios** se fijan con carácter **uniforme** para toda la UGR."}],"clave":["REBIUN 2014: estándares abiertos; máster en TIFF 6 sin comprimir; JPEG2000 como tendencia; escanear a 1,5 veces la resolución final.","Metadatos: Dublín Core RDF o MARC 21 RDA; METS como contenedor; PREMIS para preservación; Europeana Data Model.","Almacenamiento: RAID + cinta LTO + copia en otro lugar; checksum; el CD/DVD no sirve a largo plazo.","Manuscritos: no se desencuadernan; apertura máxima 120º; escáner cenital; dos copias (conservación y consulta).","BUG: Ilíberis (2002), Digibug (2009), Plan de Preservación Digital (finales de 2015), LibSafe (OAIS, ISO 14721), servidor oscuro y control MD5.","Reglamento art. 27: sin copias de manuscritos, incunables y obras 1500-1900; digitalización central en el Hospital Real."],"podcast":[{"v":"A","t":"Hola. Tema sobre digitalización en bibliotecas: técnicas y procedimientos y el caso de la Universidad de Granada."},{"v":"B","t":"En 2014, REBIUN publicó sus recomendaciones en materia de digitalización y preservación digital de documentos. Defienden los estándares abiertos como garantía de viabilidad, perdurabilidad y preservación."},{"v":"A","t":"Para el escaneado, se recomienda digitalizar el documento completo, sin cortes, dejando un borde, y no a doble página. Se escanea a una vez y media la resolución final: para cuatrocientos ppi finales, seiscientos ppi. Los perfiles de color son Adobe RGB 1998 y Gray Gamma 2,2. Y se convierte a ocho bits por canal."},{"v":"B","t":"Formatos. Los ficheros máster, en TIFF versión 6 sin comprimir. Si se gestionan en un repositorio, se puede valorar compresión sin pérdida LZW o ZIP. Nunca compresión JPEG dentro de TIFF. Muchas instituciones se mueven hacia JPEG2000. Para audio, WAVE o BWF, y para vídeo, MXF y JPEG2000."},{"v":"A","t":"Metadatos. Los descriptivos, en Dublín Core o MARC 21. METS como contenedor, que incluye los administrativos, de derechos y de preservación. PREMIS para preservación. Y el Europeana Data Model si se quiere participar en Europeana. Una imagen sin metadatos corre el riesgo de perderse."},{"v":"B","t":"Los nombres de archivo: únicos, consistentes, persistentes, en minúsculas, con extensión, y de no más de treinta y dos caracteres. Los máster se guardan separados de los derivados."},{"v":"A","t":"Almacenamiento: discos con redundancia, como RAID, una copia adicional en cinta LTO, y otra copia de seguridad en otro lugar. Siempre un checksum. Los CD y DVD no se recomiendan a largo plazo."},{"v":"B","t":"Manuscritos e impresos antiguos: guantes y batas, no se desencuadernan, la apertura no supera los ciento veinte grados, escáner cenital, y dos copias: conservación y consulta."},{"v":"A","t":"Ahora la BUG. En dos mil dos arranca el proyecto Ilíberis, de digitalización del fondo antiguo. En dos mil nueve se pone en marcha el repositorio Digibug. Con ayudas del Ministerio de Cultura y un convenio con la Biblioteca Virtual de Andalucía se digitalizaron miles de documentos."},{"v":"B","t":"A finales de dos mil quince, la BUG tiene su Plan de Preservación Digital. Parte de unos treinta terabytes en discos externos. La estrategia es un servidor oscuro, sin acceso público, con control periódico de integridad mediante MD5. El software es LibSafe, de Libnova, basado en OAIS y la norma ISO catorce mil setecientos veintiuno."},{"v":"A","t":"Y recuerda el artículo veintisiete del Reglamento: no se hacen copias de manuscritos, incunables ni obras entre mil quinientos y mil novecientos. Existe un servicio central de digitalización en la Biblioteca del Hospital Real. Haz el test."}],"preguntas":[{"q":"¿En qué año publicó REBIUN sus «Recomendaciones en materia de digitalización y preservación digital de documentos» (Línea 3)?","o":["2014","2009","2019","2005"],"c":0,"e":"Pertenecen a la Línea 3 del III Plan Estratégico (Biblioteca digital 2.0).","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"El Objetivo 1 de la Línea 3 de REBIUN era potenciar el uso de tecnologías y estándares abiertos en proyectos de biblioteca digital como garantía de:","o":["Viabilidad, perdurabilidad y preservación","Menor coste y mayor velocidad","Acceso exclusivo de la comunidad universitaria","Cumplimiento de la normativa de propiedad intelectual"],"c":0,"e":"Objetivo 1, Línea 3.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Para el entorno de visualización, REBIUN recomienda colores neutros con una reflectancia de:","o":["El 60 % o menos","El 90 % o más","Entre el 70 y el 80 %","Exactamente el 50 %"],"c":0,"e":"Para minimizar reflejos y sesgos perceptivos.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Si una institución no dispone de un equipo adecuado para un tipo de trabajo de digitalización, REBIUN recomienda:","o":["Externalizar los trabajos mediante el correspondiente pliego de condiciones técnicas","No digitalizar","Usar siempre escáner de sobremesa","Fotografiar el original con flash"],"c":0,"e":"Apartado 2.1.1.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"¿Qué normas ISO recomienda REBIUN para las condiciones de visionado?","o":["ISO 3664 e ISO 12646","ISO 15489 e ISO 23081","ISO 2709 e ISO 690","ISO 14721 e ISO 16363"],"c":0,"e":"Apartado 2.1.3.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Según REBIUN, el fichero máster es:","o":["La copia de uso a partir de la cual se obtienen las copias sucesivas","Una copia comprimida para web","El archivo original sin tocar que no se vuelve a manipular","La miniatura de la imagen"],"c":0,"e":"Apartado 2.1.2.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Respecto al documento, REBIUN recomienda en la captura:","o":["Digitalizarlo en su totalidad, sin cortes y dejando un borde; en textuales, no digitalizar a doble página","Recortarlo al texto y digitalizar a doble página","Digitalizar solo las páginas con ilustraciones","Digitalizar siempre desencuadernado"],"c":0,"e":"Apartado 2.1.4.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Según REBIUN, ¿a qué resolución se escanea en general respecto a la resolución final deseada?","o":["A 1,5 veces la resolución final: para 400 ppi finales, 600 ppi","A la misma resolución","Al doble","A la mitad"],"c":0,"e":"Apartado 2.1.4.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Para las imágenes en color, REBIUN recomienda convertir los perfiles desde el escáner a:","o":["Adobe RGB 1998 (y Gray Gamma 2.2 en escala de grises)","sRGB y CMYK","CMYK y Lab","Pantone"],"c":0,"e":"Apartado 2.1.4.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"¿A qué profundidad de bits se recomienda convertir las imágenes tras los ajustes?","o":["8 bits por canal (RGB de 24 bits o 8 bits en escala de grises)","1 bit","16 bits por canal","32 bits"],"c":0,"e":"Apartado 2.1.4.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"¿Qué formato recomienda REBIUN para los ficheros máster de contenido textual o de imagen?","o":["TIFF (versión 6), preferiblemente sin comprimir","JPEG con alta compresión","GIF","PDF protegido"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Respecto a la compresión de los TIFF máster, REBIUN indica que:","o":["Puede valorarse LZW o ZIP sin pérdida si se gestionan en un repositorio, pero no debe emplearse compresión JPEG","Siempre debe emplearse compresión JPEG","No existe ninguna compresión válida","Debe usarse compresión con pérdida"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"¿Qué formato están adoptando muchas instituciones como alternativa para el máster de imagen?","o":["JPEG2000","BMP","GIF animado","PNG con pérdida"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Para la digitalización de audio, REBIUN considera preferible el formato:","o":["WAVE o BWF","MP3","AAC","OGG"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Para la digitalización de vídeo, REBIUN recomienda usar:","o":["MXF y JPEG2000","MP4 y H.264","AVI y DivX","MOV y ProRes obligatoriamente"],"c":0,"e":"Apartado 2.1.5. MPEG-2, MPEG-4 o DV no son lo recomendado por la pérdida que conlleva la compresión.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Para los metadatos descriptivos de objetos digitalizados, REBIUN recomienda de modo general:","o":["Dublín Core RDF o MARC 21 RDA","ISBD o ISSN","Solo MARC 21","Solo EAD"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Como contenedor para incorporar los metadatos descriptivos, administrativos, de derechos y de preservación, REBIUN recomienda el esquema:","o":["METS XML 2.0","PREMIS","MODS","OAI-PMH"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Para los metadatos de preservación, REBIUN recomienda seguir el esquema:","o":["PREMIS versión 2","Dublin Core","MARCXML","EDM"],"c":0,"e":"Preservation Metadata Implementation Strategies.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Si uno de los propósitos de la digitalización es participar en Europeana, los objetos digitales deberán adaptarse a:","o":["El Europeana Data Model","El esquema METS exclusivamente","MARC 21 sin adaptación","El formato ISBD"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"¿Qué riesgo corren, según REBIUN, las imágenes que no tienen asociado un mínimo de metadatos?","o":["Corren el riesgo de perderse","Se degradan físicamente","Pierden la resolución","Deben comprimirse"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Respecto al nombre de los archivos, REBIUN recomienda como mejor práctica limitar la longitud a:","o":["No más de 32 caracteres","No más de 8 caracteres","No más de 64 caracteres","No más de 128 caracteres"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"En la estructura de directorios, REBIUN indica que los archivos máster:","o":["Deberán estar almacenados por separado de los archivos derivados","Se guardan junto a los derivados","No deben guardarse","Se sustituyen por los derivados"],"c":0,"e":"Apartado 2.1.5.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Para almacenar los máster de imágenes, REBIUN recomienda sistemas de disco duro con redundancia, como:","o":["Unidades RAID, y no medios ópticos como CD-R","Memorias USB","CD-R de archivo","Solo DVD"],"c":0,"e":"Apartado 2.1.6.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"REBIUN recomienda que un conjunto adicional de imágenes con metadatos se almacene en:","o":["Cinta estándar abierta (LTO), con una copia de seguridad en otro lugar","CD-R baratos","Discos USB","La nube pública sin copia"],"c":0,"e":"Apartado 2.1.6.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Con los archivos de imagen, REBIUN recomienda generar y almacenar:","o":["Un checksum","Una firma manuscrita escaneada","Una versión en JPEG a baja resolución","Un código de barras"],"c":0,"e":"Apartado 2.1.6.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Al digitalizar manuscritos y textos antiguos, REBIUN recomienda como regla general:","o":["No desencuadernar los documentos ni adoptar medidas contra su integridad física, ni aunque sea para obtener una mejor reproducción","Desencuadernar para obtener mejores imágenes","Usar una prensa o cristal sobre el original","Usar flash"],"c":0,"e":"Apartado 2.2.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Los originales con problemas de conservación se abrirán, según REBIUN, con un ángulo nunca superior a:","o":["120º","45º","180º","90º"],"c":0,"e":"Apartado 2.2.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"Como resultado de la digitalización de manuscritos e impresos se deben obtener dos tipos de copias:","o":["Conservación y consulta","Original y duplicado","Color y blanco y negro","Máster y miniatura"],"c":0,"e":"Apartado 2.2.","r":"REBIUN_DIGITALIZACION art. doc"},{"q":"¿En qué año puso en marcha la BUG el proyecto Ilíberis?","o":["2002","1998","2009","2015"],"c":0,"e":"Hidalgo Estévez (2017).","r":"BUG_PRESERVACION art. doc"},{"q":"¿En qué año se puso en marcha el repositorio institucional Digibug, según Hidalgo Estévez?","o":["2009","2002","2012","2015"],"c":0,"e":"El resumen indica 2009.","r":"BUG_PRESERVACION art. doc"},{"q":"¿Con qué entidad firmó la BUG un convenio de digitalización (2010) de obras del siglo XIX impresas en Granada o vinculadas con Andalucía?","o":["Biblioteca Virtual de Andalucía","Biblioteca Nacional de España","Europeana","Biblioteca Virtual Miguel de Cervantes"],"c":0,"e":"Se digitalizaron 346 obras (37.932 imágenes).","r":"BUG_PRESERVACION art. doc"},{"q":"¿Qué formatos de objetos digitales recoge el Manual Técnico de Digitalización de la BUG?","o":["TIFF, JPG y PDF","Solo TIFF","PNG y GIF","MP3 y WAV"],"c":0,"e":"Y los metadatos MODS, METS, PREMIS, DC, ESE y EDM.","r":"BUG_PRESERVACION art. doc"},{"q":"¿Desde cuándo cuenta la BUG con un Plan de Preservación Digital?","o":["Desde finales de 2015","Desde 2002","Desde 2009","Desde 2020"],"c":0,"e":"Hidalgo Estévez (2017).","r":"BUG_PRESERVACION art. doc"},{"q":"¿Qué estrategia de preservación decidió seguir la BUG?","o":["Mantener un servidor oscuro (sin acceso público) que controle la ingesta y monitorice periódicamente la integridad (MD5) y la replicación","Subir todo a Digibug sin copias","Conservar solo discos externos","Externalizar toda la custodia a una empresa"],"c":0,"e":"La integridad se controla mediante MD5.","r":"BUG_PRESERVACION art. doc"},{"q":"¿Qué solución software de preservación contrató la BUG?","o":["LibSafe, de la empresa Libnova","LOCKSS","Rosetta, de Ex Libris","Archivematica"],"c":0,"e":"El hardware se implantó en colaboración con el CSIRC.","r":"BUG_PRESERVACION art. doc"},{"q":"El modelo de preservación digital en que se basa LibSafe es:","o":["OAIS e ISO 14721","OAI-PMH e ISO 2709","METS e ISO 15489","Dublin Core e ISO 690"],"c":0,"e":"Hidalgo Estévez (2017).","r":"BUG_PRESERVACION art. doc"},{"q":"El sistema de almacenamiento de la BUG para la preservación utiliza 12 discos de 4 TB en RAID 6, con una capacidad total de:","o":["36 TB, con tolerancia al fallo de hasta 2 discos","48 TB sin tolerancia a fallos","12 TB","4 TB"],"c":0,"e":"Hidalgo Estévez (2017).","r":"BUG_PRESERVACION art. doc"},{"q":"¿Cuántos objetos digitales estaban preservados a 12 de abril de 2016 en la BUG?","o":["2.676 objetos de 5 proyectos de digitalización","30 TB","17.095 documentos","450 documentos"],"c":0,"e":"Ocupaban 10 discos externos.","r":"BUG_PRESERVACION art. doc"},{"q":"¿Qué dice el artículo 27.2 del Reglamento de la BUG sobre la reproducción de fondos antiguos?","o":["No se permite hacer copias de manuscritos, incunables y obras publicadas entre 1500 y 1900","Se permiten copias de cualquier obra","Solo se prohíben copias de los incunables","Las copias se hacen en cualquier punto de servicio"],"c":0,"e":"Para ello hay un servi "}],"puntuacion":["Preguntas puntuables: NPP = aciertos − (fallos ÷ 4). Con 4 respuestas alternativas, cada fallo resta un cuarto de acierto. Las preguntas en blanco no restan.","Nota de corte: NC = el mayor de (35 % de las preguntas válidas) y (50 % de la media aritmética de referencia, MAR). La MAR es la media de los NPP iguales o superiores al percentil 95 de todos los opositores. Es decir, cuanto mejor lo haga la gente de arriba, más sube el corte.","Calificación: CF = NPP × 40 ÷ PM, donde PM es el mayor NPP obtenido por cualquier opositor. La mejor nota del examen recibe los 40 puntos y el resto se reparte en proporción.","Consecuencia práctica: como cada fallo solo resta 0,25, conviene contestar cuando puedas descartar al menos una opción. Si no tienes ni idea, déjala en blanco."],"enlaces":[{"t":"Convocatoria en el BOE","u":"https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-20786"},{"t":"Página del proceso en el Servicio de PTGAS de la UGR","u":"https://serviciopas.ugr.es/acceso-empleo-publico/30-09-2026-e-aux-bibli"},{"t":"Sede electrónica de la UGR","u":"https://sede.ugr.es"},{"t":"Exámenes anteriores de la escala (Transparencia)","u":"https://serviciopas.ugr.es/informacion/transparencia-proteccion-datos/transparencia/auxiliares-bibliotecas"},{"t":"Proyecto de Estatutos de la UGR","u":"https://secretariageneral.ugr.es/informacion/presentacion/reforma-estatutos-ugr/proyecto-estatutos"}],"acciones":[{"id":"a1","t":"Solicitud de admisión presentada","d":"Registrada el 27/10/2026 a las 21:29.","hecha":true},{"id":"a2","t":"Tasa pagada: 14 €","d":"Transferencia del 27/10/2026, registrada a las 21:42.","hecha":true},{"id":"c1","t":"Guarda el justificante de la solicitud y el del pago","d":"Un PDF de cada uno en el móvil y otra copia en el correo."},{"id":"c2","t":"Localiza el título de familia numerosa en vigor","d":"La UGR lo comprueba por la plataforma de datos de las Administraciones. Si no puede verificarlo, pedirá el documento. Debe estar vigente."},{"id": /* ---------- Dominio: progreso y plan ---------- */
const conContenido=id=>!!TEMAS[id];
function testsDe(id){return S.tests.filter(t=>t.t===id)}
function dominio(id){const ts=testsDe(id).slice(-3);if(!ts.length)return null;return ts.reduce((a,t)=>a+t.pct,0)/ts.length}
function progresoTema(id){if(!conContenido(id))return 0;const d=S.done[id]||{};const m=dominio(id);
  return .2*(d.apuntes?1:0)+.15*(d.audio?1:0)+.65*(m==null?0:Math.min(1,Math.max(0,m)/UMBRAL))}
function estadoTema(id){if(!conContenido(id))return['próximamente',''];const m=dominio(id);const d=S.done[id]||{};
  if(m!=null&&m>=UMBRAL&&testsDe(id).length>=2)return['dominado','ok'];
  if(m!=null&&m<60)return['refuerzo','bad'];
  if(d.apuntes||d.audio||m!=null)return['en curso','warn'];return['sin empezar','']}
function progresoTotal(bloque){const ts=TEMARIO.filter(t=>!bloque||t.bloque===bloque);const W=ts.reduce((a,t)=>a+t.dias,0);
  return ts.reduce((a,t)=>a+t.dias*progresoTema(t.id),0)/W}
function racha(){let n=0,d=new Date();if(!S.act[hoyStr(d)])d.setDate(d.getDate()-1);while(S.act[hoyStr(d)]){n++;d.setDate(d.getDate()-1)}return n}
function plan(){const ini=pf(FECHA_INICIO),ex=pf(S.examDate);const total=Math.max(30,dd(ini,ex));
  const fin=Math.min(14,Math.round(total*.11));const aprender=total-fin;const p1=Math.round(aprender*.7);
  const W=TEMARIO.reduce((a,t)=>a+t.dias,0);const out=[];
  const reparte=(desde,dias,fase,tarea)=>{let cum=0,prev=0;TEMARIO.forEach(t=>{cum+=t.dias;const hasta=Math.round(cum/W*dias);const n=hasta-prev;for(let k=1;k<=n;k++)out.push({i:desde+prev+k-1,fase,t,k,n,tarea:tarea(k,n)});prev=hasta})};
  reparte(0,p1,'Primera vuelta',(k,n)=>n===1?'Apuntes, podcast y test del tema':k===1?'Lee los apuntes y escucha el podcast':k===n?'Test del tema y repaso de fallos (objetivo 75 %)':'Segunda lectura y test parcial');
  reparte(p1,aprender-p1,'Segunda vuelta',(k,n)=>k===n?'Test final del tema':'Test del tema y repaso de fallos');
  for(let k=0;k<fin;k++)out.push({i:aprender+k,fase:'Simulacros y repaso final',t:null,tarea:k%3===2?'Repaso de fallos y descanso mental':'Simulacro completo con cronómetro'});
  return out.map(e=>({...e,fecha:new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+e.i)}))}
function entradaHoy(){const P=plan(),h=pf(hoyStr());return P.find(e=>hoyStr(e.fecha)===hoyStr(h))||(h<P[0].fecha?P[0]:P[P.length-1])}

function md(t){const L=esc(t).split('\n');let h='',ul=false;const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  for(const l of L){if(/^- /.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(l.slice(2))+'</li>'}else{if(ul){h+='</ul>';ul=false}if(l.trim())h+='<p>'+inl(l)+'</p>'}}

/* ---------- Reconocimiento de voz (Chrome, Edge, Safari) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const sinTilde=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zñ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
let reco=null;
function escuchar(cb,fin){if(!SR){toast('Este navegador no reconoce voz. Usa los botones.');fin&&fin();return}
  try{reco&&reco.abort()}catch(e){}
  const r=new SR();reco=r;r.lang='es-ES';r.interimResults=false;r.maxAlternatives=4;let oyo=false;
  r.onresult=e=>{oyo=true;cb([...e.results[0]].map(a=>a.transcript))};
  r.onerror=ev=>{if(ev.error==='not-allowed')toast('Permite el micrófono en el navegador para hablar.')};
  r.onend=()=>{document.querySelectorAll('[data-mic],[data-micp]').forEach(b=>b.classList.remove('acc'));if(reco===r)reco=null;fin&&fin(oyo)};
  document.querySelectorAll('[data-mic],[data-micp]').forEach(b=>b.classList.add('acc'));
  try{r.start()}catch(e){fin&&fin(false)}}
function ordenAudio(alts){const t=alts.map(sinTilde).join(' | ');const a=audioEl;if(!a)return false;
  const cueIdx=()=>{let k=0;tiem.forEach((c,i)=>{if(a.currentTime>=c.ini-.05)k=i});return k};
  const ir=k=>{if(tiem.length)a.currentTime=tiem[Math.max(0,Math.min(tiem.length-1,k))].ini;else a.currentTime=Math.max(0,a.currentTime+(k>cueIdx()?12:-12));a.play()};
  if(/\b(mas lento|despacio)\b/.test(t)){a.playbackRate=Math.max(.7,+(a.playbackRate-.1).toFixed(1));toast('Velocidad '+a.playbackRate+'×');return true}
  if(/\b(mas rapido|mas deprisa|acelera)\b/.test(t)){a.playbackRate=Math.min(1.6,+(a.playbackRate+.1).toFixed(1));toast('Velocidad '+a.playbackRate+'×');return true}
  if(/\b(pausa|para|parar|detente|alto|silencio)\b/.test(t)){a.pause();return true}
  if(/\b(repite|repetir|otra vez|no he entendido|no entendi)\b/.test(t)){ir(cueIdx());return true}
  if(/\b(anterior|atras|vuelve|retrocede)\b/.test(t)){ir(cueIdx()-1);return true}
  if(/\b(siguiente|adelante|salta|avanza)\b/.test(t)){ir(cueIdx()+1);return true}
  if(/\b(sigue|continua|reanuda|seguir|play|empieza|reproduce)\b/.test(t)){a.play();return true}
  if(/\b(pregunta|preguntame|test|examen|quiz)\b/.test(t)){a.pause();iniciar({id:tema,modo:'voz'});return true}
  return false}
function interpretaRespuesta(alts,q){const L={a:0,b:1,c:2,d:3};
  for(const raw of alts){const t=sinTilde(raw);
    if(/\b(repite|repetir|otra vez)\b/.test(t))return{cmd:'repite'};
    if(/\b(siguiente|sigue|adelante|continua)\b/.test(t))return{cmd:'sigue'};
    if(/\b(no se|en blanco|paso|ni idea|no lo se)\b/.test(t))return{sel:null};
    let m=t.match(/\b(?:opcion|respuesta|la|es la|es)?\s*(a|b|c|d|be|ce|de|primera|segunda|tercera|cuarta|uno|dos|tres|cuatro)\b/);
    if(m){const w=m[1];const mp={be:'b',ce:'c',de:'d',primera:'a',uno:'a',segunda:'b',dos:'b',tercera:'c',tres:'c',cuarta:'d',cuatro:'d'};return{sel:L[mp[w]||w]}}
    const pal=s=>new Set(sinTilde(s).split(' ').filter(x=>x.length>3));const H=pal(raw);
    let mejor=-1,pm=0;q.opts.forEach((o,i)=>{const O=pal(o);if(!O.size)return;let c=0;O.forEach(w=>{if(H.has(w))c++});const p=c/O.size;if(p>pm){pm=p;mejor=i}});
    if(pm>=.5)return{sel:mejor}}
  return null}
function escucharRespuesta(){if(!T||T.modo!=='voz'||T.fb||T.fin)return;const i=T.i;
  escuchar(alts=>{if(!T||T.i!==i||T.fb)return;const r=interpretaRespuesta(alts,T.qs[i]);
    if(!r){hablar('No te he entendido. Di A, B, C o D.','A',()=>escucharRespuesta());return}
    if(r.cmd==='repite'){leePregunta();return}if(r.cmd==='sigue')return;responde(r.sel)})}
function escucharOrden(){if(!T||T.modo!=='voz'||!T.fb)return;const i=T.i;
  escuchar(alts=>{if(!T||T.i!==i)return;const t=alts.map(sinTilde).join(' ');if(/\b(repite|repetir|otra vez)\b/.test(t)){const q=T.qs[i];hablar(`${q.e}`,'A',()=>escucharOrden())}else if(/\b(siguiente|sigue|adelante|continua|vale|ok)\b/.test(t))sig()})}

const mezcla=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function todasPreguntas(){const o=[];Object.values(TEMAS).forEach(t=>t.preguntas.forEach((p,i)=>o.push({...p,id:t.id+':'+i,tema:t.id})));return o}
function prepara(p){const orden=mezcla([0,1,2,3]);return {...p,opts:orden.map(i=>p.o[i]),corr:orden.indexOf(p.c)}}
function iniciar({id,modo,ids}){let qs;const all=todasPreguntas();
  if(modo==='tema'||modo==='voz'){qs=all.filter(p=>p.tema===id);if(modo==='voz')qs=mezcla(qs).slice(0,10)}
  else if(modo==='sim'){const blq=p=>TEMARIO.find(t=>t.id===p.tema).bloque;/* ~30 % general y ~70 % específico, como en el examen de 2025; si faltan específicas se rellena con generales */
    const gen=mezcla(all.filter(p=>blq(p)==='General')),esp=mezcla(all.filter(p=>blq(p)==='Específico'));
    const nEsp=Math.min(esp.length,70),nGen=Math.min(gen.length,100-nEsp);qs=[...gen.slice(0,nGen),...esp.slice(0,nEsp)]}
  else if(modo==='ids'){qs=all.filter(p=>(ids||[]).includes(p.id))}
  else if(modo==='fallos'){qs=all.filter(p=>S.fallos[p.id])}
  else if(modo==='bloque'){qs=mezcla(all.filter(p=>TEMARIO.find(t=>t.id===p.tema).bloque===id)).slice(0,50)}
  if(!qs||!qs.length){toast('No hay preguntas para este modo todavía');return}
  T={modo,id:id||modo,ids,wrong:[],qs:mezcla(qs).map(prepara),i:0,res:[],ini:Date.now(),fin:false,fb:false};render();if(modo==='voz')leePregunta();if(modo==='sim')cron()}
let crT=null;function cron(){clearInterval(crT);crT=setInterval(()=>{const e=$('#crono');if(!T||T.fin||!e){clearInterval(crT);return}const r=Math.max(0,6000-Math.floor((Date.now()-T.ini)/1000));e.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(!r)terminar()},1000)}
function leePregunta(){if(!TTS||T.modo!=='voz')return;callar();const q=T.qs[T.i];
  hablar(`Pregunta ${T.i+1}. ${q.q}`,'A',()=>{let k=0;const L='ABCD';const next=()=>{if(!T||T.modo!=='voz'||T.fb)return;if(k<4)hablar(`${L[k]}. ${q.opts[k]}`,'A',()=>{k++;next()});else escucharRespuesta()};next()})}
function vTest(app){if(T.fin)return vResultado(app);const q=T.qs[T.i],sim=T.modo==='sim',r=T.res[T.i];const L='ABCD';
  app.innerHTML=`<div class="q-head"><button class="btn ghost sm" data-salir>← Salir</button><span class="mono">${T.i+1} / ${T.qs.length}</span>${sim?'<span class="chip" id="crono">100:00</span>':''}${T.modo==='voz'?'<button class="btn ghost sm" data-repite>🔊 Repetir</button><button class="btn ghost sm" data-mic>🎤 Responder</button>':''}</div>${barra((T.i)/T.qs.length,'acc')}
  <div class="card"><p class="eyebrow">${esc(TEMARIO.find(t=>t.id===q.tema).titulo)}${q.oficial?` <span class="pill ok" style="margin-left:6px">Examen ${esc(q.oficial)}</span>`:''}</p><p class="q">${esc(q.q)}</p>
  ${q.opts.map((o,i)=>{let c='';if(T.fb&&!sim){if(i===q.corr)c='right';else if(r&&r.sel===i)c='wrong'}else if(r&&r.sel===i)c='sel';return `<button class="opt ${c}" data-o="${i}" ${T.fb&&!sim?'disabled':''}><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`}).join('')}
  ${T.fb&&!sim?`<div class="fb ${r.sel===q.corr?'ok':'ko'}"><b>${r.sel===q.corr?'Correcto.':r.sel==null?'En blanco.':'Incorrecto.'}</b> La respuesta es ${L[q.corr]}. ${esc(q.e)} <span class="muted">(${esc(q.r)})</span></div>`:''}
  <div class="row" style="margin-top:8px">${!T.fb||sim?`<button class="btn ghost sm" data-blank>No lo sé (en blanco)</button>`:''}${T.fb&&!sim||sim&&r?`<button class="btn acc" data-sig>${T.i===T.qs.length-1?'Terminar':'Siguiente'}</button>`:''}${sim&&T.i>0?'<button class="btn ghost sm" data-ant>Anterior</button>':''}</div></div>`;
  if(sim)cron();
  app.onclick=e=>{if(e.target.closest('[data-salir]')){callar();clearInterval(crT);T=null;render();return}
    if(e.target.closest('[data-repite]')){leePregunta();return}
    if(e.target.closest('[data-mic]')){callar();escucharRespuesta();return}
    const o=e.target.closest('[data-o]');if(o){responde(+o.dataset.o);return}
    if(e.target.closest('[data-blank]')){responde(null);return}
    if(e.target.closest('[data-ant]')){T.i--;T.fb=false;render();return}
    if(e.target.closest('[data-sig]')){sig()}}}
function responde(sel){const q=T.qs[T.i],sim=T.modo==='sim';T.res[T.i]={sel};callar();
  if(sim){if(sel==null){T.res[T.i]={sel:null}}render();if(sel==null)sig();return}
  T.fb=true;const ok=sel===q.corr;
  if(ok){if(S.fallos[q.id]&&T.modo==='fallos')delete S.fallos[q.id]}else if(sel!=null)S.fallos[q.id]=1;
  render();if(T.modo==='voz'){hablar(ok?'Correcto.':sel==null?'En blanco.':'Incorrecto.','A',()=>{hablar(`La respuesta correcta es ${'ABCD'[q.corr]}: ${q.opts[q.corr]}. ${q.e} Di siguiente para continuar.`,'A',()=>escucharOrden())})}}
function sig(){if(T.i>=T.qs.length-1){terminar();return}T.i++;T.fb=false;render();if(T.modo==='voz')leePregunta()}
function terminar(){clearInterval(crT);callar();let ok=0,ko=0,bl=0;T.qs.forEach((q,i)=>{const r=T.res[i];if(!r||r.sel==null)bl++;else if(r.sel===q.corr){ok++;if(T.modo==='sim'&&S.fallos[q.id])delete S.fallos[q.id]}else{ko++;S.fallos[q.id]=1;T.wrong.push(q.id)}});
  const npp=ok-ko/PEN,pct=npp/T.qs.length*100;T.r={ok,ko,bl,npp,pct};
  S.tests.push({t:T.id,ts:Date.now(),n:T.qs.length,ok,ko,bl,npp,pct});marcar();guardar();T.fin=true;render()}
function vResultado(app){const r=T.r,n=T.qs.length;const nota40=Math.max(0,r.npp)/n*40;
  const msg=r.pct>=85?'Nivel excelente. Mantén el ritmo.':r.pct>=UMBRAL?'Vas muy bien. Repasa los fallos y sigue.':r.pct>=50?'Buen punto de partida. Repasa los fallos y repite en un par de días.':'Normal al principio. Vuelve a los apuntes, escucha el podcast y repite el test.';
  app.innerHTML=`<div><p class="eyebrow">Resultado</p><h1>${r.ok} de ${n} aciertos</h1><p class="quote muted" style="margin-top:8px">${msg}</p></div>
  <section class="grid2"><div class="card"><dl class="kv"><dt>Aciertos</dt><dd class="mono">${r.ok}</dd><dt>Fallos</dt><dd class="mono">${r.ko}</dd><dt>En blanco</dt><dd class="mono">${r.bl}</dd><dt>Preguntas puntuables</dt><dd class="mono">${r.npp.toFixed(3)}</dd><dt>Porcentaje neto</dt><dd class="mono">${r.pct.toFixed(1)} %</dd></dl></div>
  <div class="card"><h3>¿Y en el examen real?</h3><p class="muted" style="margin-top:6px">Con este resultado, tus preguntas puntuables serían ${r.npp.toFixed(2)} sobre ${n}. Si lo escalas a 100 preguntas son ≈ ${(r.npp/n*100).toFixed(1)}. La nota de corte mínima es el 35 % de las preguntas válidas y sube si los mejores sacan mucho. Apunta a un 75 % neto o más.</p></div></section>
  <div class="row">${r.ko>0?'<button class="btn acc" data-fint>Repasar los fallos de este intento</button>':''}<button class="btn ${r.ko>0?'ghost':'acc'}" data-fallos>Repasar todos mis fallos</button><button class="btn ghost" data-again>Repetir</button><button class="btn ghost" data-fin>Volver</button></div>`;
  app.onclick=e=>{if(e.target.closest('[data-again]')){iniciar({id:T.id,modo:T.modo,ids:T.ids})}
    if(e.target.closest('[data-fint]')){iniciar({id:'fallos',modo:'ids',ids:T.wrong})}
    if(e.target.closest('[data-fallos]')){iniciar({modo:'fallos'})}
    if(e.target.closest('[data-fin]')){T=null;render()}}}
function resultados(){const med=b=>{const v=TEMARIO.filter(t=>t.bloque===b&&conContenido(t.id)).map(t=>dominio(t.id)).filter(x=>x!=null);return v.length?v.reduce((a,x)=>a+x,0)/v.length:null};
  const fila=t=>{const ts=testsDe(t.id),l=ts[ts.length-1],mj=ts.length?Math.max(...ts.map(x=>x.pct)):null,[et,cl]=estadoTema(t.id);
    return `<div class="card" style="padding:12px;display:grid;gap:8px"><div class="row" style="justify-content:space-between;align-items:start"><span><b>${t.bloque==='General'?'G':'E'}${t.num}</b> ${esc(t.titulo)}</span><span class="pill ${cl}">${et}</span></div>
    ${l?`<div class="row mono" style="font-size:.85rem;gap:16px"><span>Último: ${l.ok}/${l.n} · ${l.pct.toFixed(0)} % neto</span><span>Mejor: ${mj.toFixed(0)} %</span><span>${ts.length} intento${ts.length>1?'s':''}</span></div>${barra(Math.max(0,l.pct)/100)}`:'<p class="muted" style="font-size:.9rem">Todavía no has hecho este test.</p>'}
    <div><button class="btn ghost sm" data-rt="${t.id}">${l?'Repetir test':'Hacer test'}</button></div></div>`};
  const bloque=b=>{const m=med(b);const ts=TEMARIO.filter(t=>t.bloque===b&&conContenido(t.id));return `<div class="row" style="justify-content:space-between"><h3>Bloque ${b==='General'?'general':'específico'}</h3><span class="mono">${m==null?'sin datos':'media '+m.toFixed(0)+' %'}</span></div>${ts.length?ts.map(fila).join(''):'<p class="muted">Todavía no hay temas disponibles en este bloque.</p>'}`};
  return `<section class="list"><h2>Mis resultados</h2><p class="muted" style="font-size:.9rem">El porcentaje es neto: cada fallo resta 0,25 aciertos. Con un 75 % o más en los últimos tests, el tema pasa a «dominado».</p>${bloque('General')}${bloque('Específico')}</section>`}
function vTestMenu(app){const n=Object.keys(S.fallos).length,tot=todasPreguntas().length;
  app.innerHTML=`<div><h1>Test</h1><p class="muted" style="margin-top:6px">${tot} preguntas disponibles. Se corrigen como en el examen: un fallo resta 0,25 y lo que dejas en blanco no resta.</p></div>
  <section class="grid2"><div class="card"><h3>Simulacro</h3><p class="muted" style="margin:6px 0 12px">Hasta 100 preguntas con el reparto del último examen de la escala (unas 30 del bloque general y 70 del específico), cronómetro de 100 minutos y corrección al final. Se parecerá más al examen real cuando estén todos los temas.</p><button class="btn acc" data-sim="1">Empezar simulacro</button></div>
  <div class="card"><h3>Repaso de fallos</h3><p class="muted" style="margin:6px 0 12px">${n?`Tienes ${n} preguntas falladas guardadas. Acertarlas las saca de la lista.`:'Aún no tienes fallos guardados.'}</p><button class="btn" data-fb ${n?'':'disabled'}>Repasar fallos</button></div>
  <div class="card"><h3>Bloque general</h3><p class="muted" style="margin:6px 0 12px">50 preguntas mezcladas de los temas generales.</p><button class="btn ghost" data-bl="General">Empezar</button></div>
  <div class="card"><h3>Modo voz</h3><p class="muted" style="margin:6px 0 12px">Te leo cada pregunta y sus opciones en voz alta; contestas tocando A, B, C o D y te explico la respuesta. Ideal para el coche o para andar. Elige un tema abajo.</p>
  <div class="row">${Object.values(TEMAS).map(t=>`<button class="btn ghost sm" data-vz="${t.id}">${t.bloque==='General'?'G':'E'}${t.num}</button>`).join('')}</div></div></section>
  ${resultados()}`;
  app.onclick=e=>{if(e.target.closest('[data-fb]'))iniciar({modo:'fallos'});const rt=e.target.closest('[data-rt]');if(rt)iniciar({id:rt.dataset.rt,modo:'tema'});const b=e.target.closest('[data-bl]');if(b)iniciar({id:b.dataset.bl,modo:'bloque'});const v=e.target.closest('[data-vz]');if(v)iniciar({id:v.dataset.vz,modo:'voz'})}}


async function peticiones(){const box=$('#pet');if(!box||!sb)return;
  if(!usuario){box.innerHTML='<h2>Pide algo a Claude</h2><p class="muted" style="margin-top:6px">Entra con tu correo (pestaña Plan) para pedir más exámenes, otro temario o cualquier cosa que eches en falta.</p>';return}
  box.innerHTML=`<h2>Pide algo a Claude</h2><p class="muted" style="margin:6px 0 10px">Cuéntalo con tus palabras: «quiero más exámenes del tema 3», «busca otro temario», «no entiendo el tema 4»… Queda como «pendiente» hasta que se resuelva y la respuesta aparecerá aquí. No es inmediato. Cuando envíes una petición, avisa también a quien te ayuda con la preparación para que la vea.</p>
  <textarea id="pt" rows="3" maxlength="1000" placeholder="¿Qué necesitas?" style="width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn acc sm" id="penv">Enviar</button></div><div id="plist" style="margin-top:14px;display:grid;gap:8px"></div>`;
  const pintar=async()=>{const{data}=await sb.from('peticiones').select('*').order('creada',{ascending:false}).limit(20);
    $('#plist').innerHTML=(data||[]).map(p=>`<div class="card" style="padding:12px"><div class="row" style="justify-content:space-between"><span class="muted mono" style="font-size:.8rem">${fmt(new Date(p.creada))}</span><span class="pill ${p.estado==='hecha'?'ok':'warn'}">${p.estado}</span></div><p style="margin-top:6px">${esc(p.texto)}</p>${p.respuesta?`<div class="fb ok" style="margin-top:8px"><b>Claude:</b> ${esc(p.respuesta)}</div>`:''}</div>`).join('')||'<p class="muted">Todavía no has pedido nada.</p>'};
  $('#penv').onclick=async()=>{const t=$('#pt').value.trim();if(t.length<3)return;const{error}=await sb.from('peticiones').insert({texto:t});if(error){toast('No se pudo enviar. Inténtalo de nuevo.');return}$('#pt').value='';toast('Enviado. Te contestaremos aquí.');pintar()};
  pintar()}

/* ---------- Plan ---------- */
const planAb={};
document.addEventListener('toggle',e=>{const k=e.target&&e.target.dataset&&e.target.dataset.k;if(k)planAb[k]=e.target.open},true);
function vPlan(app){const P=plan(),h=hoyStr();
  const dia=e=>{const es=hoyStr(e.fecha),dom=e.fecha.getDay()===0,t=e.t;
    return `<div class="day ${es===h?'hoy':''} ${es<h?'pas':''}" ${t&&conContenido(t.id)?`data-ir="${t.id}:apuntes" style="cursor:pointer" title="Abrir este tema"`:''}><span class="dt">${fmt(e.fecha)}</span><span>${t?`<b>${t.bloque==='General'?'G':'E'}${t.num}</b> ${esc(t.titulo)}<br><span class="muted" style="font-size:.88rem">${dom?'Día ligero: escucha el podcast del tema.':esc(e.tarea)}</span>`:`<b>Simulacro y repaso</b><br><span class="muted" style="font-size:.88rem">${esc(e.tarea)}</span>`}</span>${t&&!conContenido(t.id)?'<span class="pill">en preparación</span>':t?`<span class="pill ${estadoTema(t.id)[1]}">${estadoTema(t.id)[0]}</span>`:''}</div>`};
  const hoyE=P.find(e=>hoyStr(e.fecha)===h)||P[0];
  const rango=a=>`${fmt(a[0].fecha,{day:'numeric',month:'short'})} – ${fmt(a[a.length-1].fecha,{day:'numeric',month:'short'})}`;
  const abierto=(k,def)=>k in planAb?planAb[k]:def;
  let html='';
  [...new Set(P.map(e=>e.fase))].forEach(f=>{const a=P.filter(e=>e.fase===f),kf='f:'+f;let cuerpo='';
    if(a[0].t){['General','Específico'].forEach(bl=>{const sb2=a.filter(e=>e.t&&e.t.bloque===bl);if(!sb2.length)return;const kb=kf+'|'+bl;
      cuerpo+=`<details class="sub" data-k="${kb}" ${abierto(kb,sb2.includes(hoyE))?'open':''}><summary><span>Bloque ${bl==='General'?'general':'específico'}</span><span class="mono">${rango(sb2)} · ${sb2.length} d</span></summary><div class="week">${sb2.map(dia).join('')}</div></details>`})}
    else cuerpo=`<div class="week">${a.map(dia).join('')}</div>`;
    html+=`<details class="fase" data-k="${kf}" ${abierto(kf,a.includes(hoyE))?'open':''}><summary><span>${f}</span><span class="mono">${rango(a)} · ${a.length} d</span></summary>${cuerpo}</details>`});
  app.innerHTML=`<div><h1>Plan de estudio</h1><p class="muted" style="margin-top:6px">Se reparte entre hoy y la fecha del examen según el peso de cada tema. Primero el bloque general, después el específico, una segunda vuelta y, al final, simulacros.</p></div>
  <section class="card" id="cuenta" ${sb?'':'hidden'}><h3>Tu cuenta</h3><p class="muted" style="margin:6px 0 10px">${usuario?'Sesión iniciada. Tu progreso se guarda en la nube y se comparte entre tus dispositivos.':'Entra con tu correo para guardar el progreso y verlo en el móvil, el iPad y el ordenador. Te enviamos un enlace, sin contraseña.'}</p>
  ${usuario?'<button class="btn ghost sm" id="salir">Cerrar sesión</button>':'<div class="row"><input type="email" id="mail" placeholder="tu correo" autocomplete="email" style="flex:1;min-width:200px;font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)"><button class="btn acc sm" id="enviar">Enviarme el enlace</button></div>'}</section>
  <section class="card"><label class="row"><span><b>Fecha del primer ejercicio</b><br><span class="muted" style="font-size:.88rem">Por ahora usamos el primer día posible. Cámbiala cuando la UGR publique la real.</span></span>
  <input type="date" id="fex" value="${S.examDate}" min="${hoyStr()}"></label></section><section class="week" style="gap:12px">${html}</section>
  <section class="card flat"><button class="btn ghost sm" id="reset">Borrar mi progreso en este dispositivo</button></section>`;
  const f=$('#fex');f.onchange=()=>{if(f.value){S.examDate=f.value;guardar();toast('Calendario recalculado');render()}};
  const en=$('#enviar');if(en)en.onclick=async()=>{const m=$('#mail').value.trim();if(!m)return;const{error}=await sb.auth.signInWithOtp({email:m,options:{emailRedirectTo:location.origin+location.pathname}});toast(error?'No se pudo enviar el enlace':'Revisa tu correo y abre el enlace')};
  const so=$('#salir');if(so)so.onclick=async()=>{await sb.auth.signOut()};
  const rs=$('#reset');rs.onclick=()=>{if(rs.dataset.s){S={done:{},tests:[],fallos:{},checks:{},act:{},examDate:S.examDate,voz:S.voz,upd:0};guardar();toast('Progreso borrado');render()}else{rs.dataset.s=1;rs.textContent='Pulsa otra vez para confirmar'}}}

/* ---------- Proceso ---------- */
function vProceso(app){app.innerHTML=`<div><h1>Resumen del proceso</h1><p class="muted" style="margin-top:6px">Resumen de la convocatoria publicada en el BOE el 6 de octubre de 2026.</p></div>
  ${(PROC.importante&&PROC.importante.length)?`<section class="warnbox"><b>Importante</b><ul style="margin:6px 0 0;padding-left:1.1em;display:grid;gap:6px">${PROC.importante.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></section>`:''}
  <section class="card"><dl class="kv">${PROC.resumen.map(r=>`<dt>${esc(r.k)}</dt><dd>${esc(r.v)}</dd>`).join('')}</dl></section>
  <section class="list"><h2>Los ejercicios</h2>${PROC.ejercicios.map(x=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(x.n)}</h3><span class="pill">${esc(x.pts)}</span></div><p style="margin-top:6px">${esc(x.d)}</p></div>`).join('')}</section>
  <section class="card"><h2>Cómo se puntúa el primer ejercicio</h2><div class="md">${PROC.puntuacion.map(p=>`<p>${esc(p)}</p>`).join('')}</div></section>
  <section class="card" id="pet" ${sb?'':'hidden'}></section>
  <section class="card"><h2>Enlaces oficiales</h2><ul style="padding-left:1.1em;margin:8px 0 0;display:grid;gap:6px">${PROC.enlaces.map(l=>`<li><a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a></li>`).join('')}</ul></section>`}

render();window.addEventListener('load',initNube);if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
