e situación","Antes de cualquier evaluación","Sin necesidad de negociación","Solo a petición de la Inspección"],"c":0,"e":"Art. 46.1 LO 3/2007.","r":"LOIG art. 46"},{"q":"Según el artículo 48.1 de la LO 3/2007, para prevenir el acoso sexual y el acoso por razón de sexo en el trabajo se podrán establecer medidas negociadas como:","o":["Códigos de buenas prácticas, campañas informativas o acciones de formación","Sanciones automáticas a las víctimas","Reducción de plantilla","Cambios obligatorios de puesto de la persona acosada"],"c":0,"e":"Art. 48.1 LO 3/2007.","r":"LOIG art. 48"},{"q":"¿Cuál es la finalidad de la Ley 4/2023, según su artículo 1.1?","o":["Garantizar y promover el derecho a la igualdad real y efectiva de las personas LGTBI y de sus familias","Regular exclusivamente el cambio registral del nombre","Establecer un régimen sancionador general","Crear el Ministerio de Igualdad"],"c":0,"e":"Art. 1.1 de la Ley 4/2023.","r":"LGTBI art. 1"},{"q":"La Ley 4/2023 se aplica, según su artículo 2, a toda persona física o jurídica, pública o privada, que:","o":["Resida, se encuentre o actúe en territorio español","Tenga nacionalidad española","Resida en España al menos un año","Sea empleada pública"],"c":0,"e":"Art. 2 de la Ley 4/2023.","r":"LGTBI art. 2"},{"q":"Según el artículo 3.a) de la Ley 4/2023, se considerará discriminación directa:","o":["La denegación de ajustes razonables a las personas con discapacidad","Solo el trato desfavorable explícito por orientación sexual","Cualquier práctica aparentemente neutra","El acoso discriminatorio"],"c":0,"e":"Art. 3.a de la Ley 4/2023.","r":"LGTBI art. 3"},{"q":"Los poderes públicos desarrollarán, según el artículo 4 de la Ley 4/2023, todas las medidas necesarias para:","o":["Reconocer, garantizar, proteger y promover la igualdad de trato y no discriminación de las personas LGTBI y sus familias","Registrar a las personas LGTBI en un censo específico","Prohibir la publicidad sobre diversidad familiar","Limitar la visibilidad en el ámbito educativo"],"c":0,"e":"Art. 4 de la Ley 4/2023.","r":"LGTBI art. 4"},{"q":"Los planes y programas conjuntos de actuación entre las Administraciones para integrar la igualdad de trato y no discriminación LGTBI se adoptan, según el artículo 8.2, en el seno de:","o":["La Conferencia Sectorial de Igualdad","El Consejo de Estado","El Consejo de Ministros","La Federación Española de Municipios"],"c":0,"e":"Art. 8.2 de la Ley 4/2023.","r":"LGTBI art. 8"},{"q":"El Consejo de Participación de las Personas LGTBI es, según el artículo 9:","o":["El órgano de participación ciudadana en materia de derechos y libertades de las personas LGTBI","Un órgano jurisdiccional especial","Un órgano consultivo del Consejo de Estado","Una agencia de evaluación de políticas"],"c":0,"e":"Art. 9.1 de la Ley 4/2023. Depende del Ministerio de Igualdad; presenta una memoria semestral.","r":"LGTBI art. 9"},{"q":"Según el artículo 10 de la Ley 4/2023, la Estrategia estatal para la igualdad de trato y no discriminación de las personas LGTBI tendrá carácter:","o":["Cuatrienal","Anual","Bienal","Indefinido"],"c":0,"e":"Art. 10.3 de la Ley 4/2023.","r":"LGTBI art. 10"},{"q":"La Estrategia estatal LGTBI se aprueba, según el artículo 10.2, mediante:","o":["Acuerdo del Consejo de Ministros, previo informe favorable de la Conferencia Sectorial de Igualdad","Real decreto-ley","Orden ministerial sin informe","Ley de las Cortes Generales"],"c":0,"e":"Art. 10.2 de la Ley 4/2023.","r":"LGTBI art. 10"},{"q":"Según el artículo 11 de la Ley 4/2023, las medidas para la promoción y defensa de la igualdad de trato LGTBI en el acceso al empleo público y la carrera profesional se implantarán:","o":["Previa negociación con las organizaciones sindicales","Sin necesidad de negociación","Previo informe del Defensor del Pueblo","Solo en la Administración General del Estado"],"c":0,"e":"Art. 11 de la Ley 4/2023.","r":"LGTBI art. 11"},{"q":"Según el artículo 12.2 de la Ley 4/2023, los programas de las pruebas selectivas de acceso al empleo público incluirán:","o":["Formación y conocimientos sobre igualdad de trato y no discriminación de las personas LGTBI","Solo conocimientos sobre igualdad entre mujeres y hombres","Una prueba psicotécnica específica","Ningún contenido sobre igualdad"],"c":0,"e":"Art. 12.2 de la Ley 4/2023.","r":"LGTBI art. 12"},{"q":"El artículo 13 de la Ley 4/2023 establece que las Administraciones públicas procurarán que:","o":["La documentación administrativa y los formularios sean adecuados a la diversidad en orientación sexual, identidad sexual, expresión de género y características sexuales y a la diversidad familiar","Los formularios incluyan un apartado obligatorio de orientación sexual","La documentación se redacte solo en lenguaje neutro","Se eliminen los formularios en papel"],"c":0,"e":"Art. 13 de la Ley 4/2023.","r":"LGTBI art. 13"}],"notas":["Importante: el art. 12.2 de la Ley 4/2023 dice que las pruebas selectivas de acceso al empleo público incluyen conocimientos sobre igualdad de trato y no discriminación de las personas LGTBI. Es materia de examen.","En esta ley algunos artículos del texto consolidado conservan redacciones antiguas (por ejemplo, el art. 44.3 de la LO 3/2007 habla de permiso de paternidad). Estudia lo que dice el texto consolidado y no lo que recuerdes de otras normas laborales.","Las dos leyes definen de forma casi idéntica la discriminación directa y la indirecta. Aprende la diferencia: directa = trato menos favorable; indirecta = norma o práctica aparentemente neutra que perjudica."],"mp3":true},"e1":{"id":"e1","bloque":"Específico","num":1,"titulo":"Las bibliotecas universitarias y la Biblioteca de la UGR","alcance":"Las bibliotecas universitarias. La Biblioteca de la Universidad de Granada: misión, visión, valores y estrategia. Evolución histórica, marco normativo, estructura y organigrama.","fuentes":["Reglamento de la Biblioteca Universitaria de la UGR (Consejo de Gobierno, 23/07/2020, BOUGR n.º 158, de 29/07/2020)","Estrategia de la Biblioteca Universitaria 2024-2031 (biblioteca.ugr.es)","Propósito, misión, visión y valores de la Biblioteca Universitaria (biblioteca.ugr.es)","Biblioteca Universitaria. Ficha de patrimonio de la UGR, 2024 (Vicerrectorado de Extensión Universitaria, Patrimonio y Relaciones Institucionales)","Estructura, equipamiento y fondos de la Biblioteca del Hospital Real (biblioteca.ugr.es)"],"peso":"alto","notas":["En el examen de abril de 2025 se preguntó el artículo 15 del Reglamento de la Biblioteca (derechos de las personas usuarias). Aprende sus 11 derechos, de la a) a la k).","El Reglamento vigente es el aprobado por el Consejo de Gobierno el 23 de julio de 2020 (BOUGR n.º 158). Deroga el de 17 de diciembre de 2008. No uses apuntes o resúmenes antiguos: la numeración de artículos y las listas de derechos eran distintas.","La Estrategia vigente es la de 2024-2031, con seis ejes. Los planes anteriores fueron 2008-2011, 2012-2015, 2016-2019 y 2020-2023, y no se estudian.","El art. 8.3.j) dice que la Dirección de la Biblioteca propone a la Gerencia los temarios de las oposiciones y otras pruebas de selección de personal. Es un detalle que conecta directamente con tu proceso.","Las cifras que se preguntan: 7 miembros de la Comisión que representan a las personas usuarias (5 profesorado y 2 estudiantado), 3 del personal, mandato de 4 años."],"apuntes":[{"h":"Qué es la Biblioteca Universitaria (Reglamento, arts. 1 a 3)","t":"- **Art. 1 Definición**: la Biblioteca Universitaria es una **unidad funcional, administrativa y de gestión** en la que se **conservan, organizan, procesan y ponen a disposición** de las personas usuarias todos los **recursos bibliográficos y documentales** de la UGR, **independientemente del soporte material, del lugar en que estén depositados y de las partidas presupuestarias** a las que se haya aplicado su adquisición.\n- **Art. 2 Finalidad**: la finalidad principal es **facilitar el acceso, la difusión y el uso de los recursos de información** de la UGR y **colaborar en los procesos de creación del conocimiento**.\n- **Art. 3 Funciones**: planificar y gestionar la **adquisición, proceso, conservación y difusión** de los recursos; garantizar su conocimiento y uso; facilitar el acceso a los recursos cualquiera que sea su localización; participar en programas, proyectos y convenios; participar en la creación de conocimiento (investigación aplicada); y **promover estrategias de mejora continua** en consonancia con las políticas de calidad.\n- El marco estatutario: el **art. 245 del Proyecto de Estatutos** (la Biblioteca como servicio de gestión de recursos de información) y, en el Reglamento de 2020, el art. 203 de los Estatutos de 2011."},{"h":"Estructura del servicio (arts. 4 a 7)","t":"- **Art. 4.1**: la Biblioteca es un **sistema único** compuesto por distintos **puntos de servicio**: **a)** la **Biblioteca del Hospital Real**, depositaria del **fondo histórico** de la UGR; **b)** las **bibliotecas de Facultades, Escuelas Técnicas Superiores y otros centros**; **c)** los **servicios centralizados** de gestión técnica y coordinación.\n- **Art. 4.2**: al frente están la **Dirección y la Subdirección**, con la colaboración de una **Junta Técnica** y la supervisión de una **Comisión delegada del Consejo de Gobierno**.\n- **Art. 4.3**: la responsabilidad de cada punto de servicio recae sobre la persona que ostenta su **Jefatura**.\n- **Art. 5 Servicios centralizados**: **Servicio de Adquisiciones** (compras centralizadas, seguimiento del presupuesto, recepción de donaciones y **préstamo interbibliotecario**); **Servicio de documentación científica** (visibilidad de la producción científica, **Repositorio Institucional**, acceso abierto y propiedad intelectual); **Servicio de coordinación y gestión del programa de gestión de bibliotecas** (mantenimiento y desarrollo del **sistema integrado de gestión**); **Servicio de recursos electrónicos** (selección, tratamiento y puesta a disposición, y **la página web** de la Biblioteca).\n- **Art. 6**: la **Biblioteca del Hospital Real** coordina la política de **conservación y difusión del fondo histórico**. Las **bibliotecas de centros** ofrecen los fondos de las áreas de especialización de sus Facultades, Escuelas, Campus, Departamentos e Institutos, **con dependencia orgánica y funcional de la Dirección de la Biblioteca**.\n- **Art. 7**: la estructura puede modificarse para adaptarse a nuevos modelos de gestión."},{"h":"Órganos de gestión (arts. 8 a 12)","t":"- **Art. 8 Dirección**: **ostenta la representación** de la Biblioteca y ejerce la dirección y gestión ordinaria. Entre sus funciones: cumplir y hacer cumplir el Reglamento; ejercer la dirección técnica; elevar a la Gerencia la propuesta de plantilla y distribución del personal; proponer y administrar el presupuesto anual; **elaborar el informe anual**; **proponer a la Gerencia los temarios de las oposiciones** y otras pruebas de selección; **liderar los procesos de calidad**; incentivar la formación de personas usuarias; recoger y resolver propuestas, sugerencias y reclamaciones; asumir la responsabilidad final del **expurgo**.\n- **Art. 9 Subdirección**: actúa **por delegación** de la Dirección y la sustituye en caso de ausencia, vacante o enfermedad.\n- **Art. 10 Comisión de Biblioteca**: comisión **consultiva del Consejo de Gobierno y del Rector**. Composición: el **Rector** (o por delegación el Vicerrector), el **Director** del servicio, **tres miembros del personal** adscrito y **siete en representación de las personas usuarias** (**cinco del profesorado y dos del estudiantado**), elegidos por el **Pleno del Consejo de Gobierno**. **Mandato de cuatro años**. Funciones: proponer las directrices generales de la política bibliotecaria, criterios para los presupuestos de adquisición, conocer sugerencias y reclamaciones, informar normativa interna e **informar las modificaciones del Reglamento**.\n- **Art. 11 Junta Técnica**: **órgano de apoyo, consulta y asesoramiento a la Dirección en los ámbitos técnico y económico**. La preside el Director.\n- **Art. 12 Responsables de las bibliotecas**: organizan y supervisan al personal, controlan las adquisiciones, elaboran estadísticas e informes, son interlocutores con el equipo de gobierno del centro, canalizan sugerencias y reclamaciones, elaboran y evalúan el plan de formación de sus personas usuarias y gestionan los fondos asignados."},{"h":"Personal y personas usuarias (arts. 13 y 14)","t":"- **Art. 13**: el personal es el que ocupa en cada momento las plazas de las **Relaciones de Puestos de Trabajo**. La Biblioteca colabora en actualizar el **catálogo de servicios** y los **perfiles profesionales**.\n- **Art. 14 Personas usuarias**: **a)** la comunidad universitaria de la UGR y la de **centros adscritos**; **b)** miembros de **otras comunidades universitarias en estancia oficial** en la UGR. Las demás personas podrán usar los servicios según reglamentaciones y convenios. La Biblioteca facilitará, en la medida de sus posibilidades, el uso por parte de **cualquier persona**."},{"h":"Derechos y deberes de las personas usuarias (arts. 15 a 20)","t":"**Art. 15. Derechos** (once, de la a) a la k)):\n- **a)** Recibir todos los servicios que la Biblioteca oferta (con manuales de funcionamiento al día).\n- **b)** Recibir **atención personalizada** presencial, telefónica o virtual.\n- **c)** Recibir **información y asesoramiento** sobre la Biblioteca, sus servicios y recursos.\n- **d)** Acceder **libre y gratuitamente** a los espacios destinados a las personas usuarias.\n- **e)** Disponer de espacios para la lectura, el estudio, el aprendizaje y la investigación.\n- **f)** Acceder y consultar los fondos y recursos de información según la normativa.\n- **g)** Disponer de **recursos de información de calidad**, impresos y electrónicos.\n- **h)** Disponer de equipamientos e infraestructuras adecuados.\n- **i)** **Participar en la consecución de los fines de la Biblioteca.**\n- **j)** Recibir un **trato amable y cordial** del personal.\n- **k)** **Privacidad y confidencialidad** de la información y de los datos personales.\n\nOjo: el derecho a utilizar «libre y gratuitamente **todos** los servicios» NO está en el artículo, y tampoco «participar en la **toma de decisiones** sobre los servicios». El artículo dice **participar en la consecución de los fines**.\n\n- **Art. 16**: quejas y sugerencias **a través de cualquier medio que esté a su alcance**.\n- **Art. 17 Compromisos de calidad**: la Biblioteca cumplirá los compromisos de calidad aportados a la **Carta de Servicios de la UGR**.\n- **Art. 18**: cada punto de servicio puede dictar **normas complementarias**, que deben remitirse a la Dirección **para ser refrendadas**.\n- **Art. 19 Deberes**: cumplir las normativas; respetar el patrimonio y usar correctamente instalaciones y recursos; no interferir en los derechos de los demás (por ejemplo, reservar puestos de lectura); para el **préstamo** hay que estar **registrado en el sistema de gestión bibliotecaria** y el uso del préstamo es **personal e intransferible**; velar por las pertenencias (la Biblioteca no se hace responsable de pérdidas, robos o deterioros).\n- **Art. 20 Incumplimientos**: quien altere el orden será **expulsado de la sala de lectura hasta el día siguiente**; quien deteriore material debe **reponerlo** o indemnizar; la falta de respeto al personal o el incumplimiento reiterado puede suponer la **privación del derecho de préstamo**."},{"h":"Servicios y recursos económicos (arts. 21 a 36), en resumen","t":"- **Art. 21 Información y referencia**: es el **núcleo central** del servicio a las personas usuarias.\n- **Art. 22 Formación de personas usuarias**: cursos, charlas, visitas guiadas y guías, para la **competencia informacional**.\n- **Art. 24 Préstamo a domicilio** (préstamo, renovación y reserva) y **art. 25 Préstamo interbibliotecario** (se desarrollan en el tema E9).\n- **Art. 27.2**: por conservación, **no se permite copiar manuscritos, incunables ni obras publicadas entre 1500 y 1900**; el servicio de **digitalización** está en la Biblioteca del Hospital Real.\n- **Art. 31**: los fondos raros y preciosos se consultan según normativa específica.\n- **Arts. 32 a 36**: presupuesto (la Dirección propone objetivos y necesidades; la **Comisión de Biblioteca** fija las fórmulas de distribución) y facturación: **toda facturación de materiales bibliográficos pasa por la Biblioteca Universitaria** para que consten en los catálogos.\n- **Disposición derogatoria**: deroga el Reglamento de **17 de diciembre de 2008**. **Disposición adicional**: se modifica a instancias de la Dirección o del **20 %** de los miembros de la Comisión."},{"h":"Propósito, misión, visión y valores (Estrategia 2024-2031)","t":"- **Propósito**: «**Conectar mentes, forjar el futuro**». La Biblioteca impulsa la enseñanza, el aprendizaje, la investigación, la innovación, la creatividad, la transferencia, la gestión y la preservación en un entorno inclusivo, diverso, colaborativo, crítico y reflexivo.\n- **Misión**: la Biblioteca es un **servicio clave, en constante evolución y alineado con la Universidad**, que **conecta a las personas usuarias con sus recursos y colecciones** para que apliquen el conocimiento en beneficio de una **sociedad más justa e igualitaria**.\n- **Visión** (siete rasgos): **Innovadora, Creativa, Participativa, Abierta, Socialmente responsable, Valiente y Transversal**.\n- **Valores** (seis): **Dignidad y respeto**; **Compromiso** (accesibilidad, inclusión, diversidad e igualdad); **Sostenibilidad ambiental**; **Creatividad e innovación**; **Pleno apoyo a la Ciencia Abierta**; **Excelencia**."},{"h":"Los seis ejes de la Estrategia 2024-2031","t":"- **Eje 1. Aprendizaje transformador para una docencia innovadora**: líneas para el estudiantado, el PDI y el PTGAS.\n- **Eje 2. Generación de conocimiento**: apoyar la investigación, **impulsar la Ciencia Abierta** y aplicar las políticas nacionales de investigación.\n- **Eje 3. Innovación en espacios y servicios. Una biblioteca socialmente responsable**: biblioteca inclusiva y abierta a la ciudadanía, nuevos espacios y programación cultural.\n- **Eje 4. Transformación digital**: servicios e infraestructuras digitales y **preservación digital** del patrimonio documental.\n- **Eje 5. Personas**: formación del personal y bienestar y salud emocional.\n- **Eje 6. Modelo de gobierno y de gestión excelente, innovadora y sostenible**: excelencia, gobierno horizontal y participativo y alianzas.\n- **Seguimiento**: anual, con el Cuadro de Mando, los objetivos de la Carta de Servicios, las revisiones del sistema de calidad y las auditorías."},{"h":"Evolución histórica","t":"- El origen está ligado a la propia Universidad y a los fondos que se fueron sumando. Bajo los **Austrias** se forma el contenido inicial; se conserva el inventario de la Biblioteca del **Colegio de Santa Cruz y de Santa Catalina**, incorporada en **1835** (1.775 volúmenes).\n- **1767**: expulsión de la **Compañía de Jesús**. La Universidad se traslada al antiguo **Colegio de San Pablo** y allí se instala la Biblioteca, con los fondos jesuitas (**29.483 volúmenes impresos**).\n- **1780**: nombramiento del **primer bibliotecario** reconocido, **Juan Gil Palomino**; le siguen Juan Velázquez de Echevarría y **Antonio de Pineda y Barragán**.\n- **1841**: la **desamortización de Mendizábal** incrementa los fondos con documentos de bibliotecas monásticas y conventuales.\n- Desde la segunda mitad del siglo XIX y en el XX, las **Facultades se independizan** y sus bibliotecas cuentan con espacios propios; aun así, **presupuestos e inventario siguen centralizados**.\n- Hoy: sede principal en el **crucero alto del Hospital Real** (Avenida del Hospicio, 1), con **más de 80.000 títulos** en la ficha de patrimonio."},{"h":"La Biblioteca del Hospital Real","t":"- Superficie de **1.422 m²**; está formada fundamentalmente por **fondo antiguo** y los servicios especiales de gestión de ese fondo.\n- Fondo **histórico multidisciplinar** que abarca fundamentalmente **del siglo XV al XIX**, organizado según la **Clasificación Decimal Universal (CDU)** y **números currens**.\n- Equipamiento: 96 puestos de consulta, 2 ordenadores para usuarios, 1 máquina de reprografía y 1 lector de microformas.\n- Dispone del **servicio central de digitalización** (Reglamento, art. 27.2)."},{"h":"Marco normativo: dónde está cada documento","t":"La web de la Biblioteca recoge su **normativa**: el **Reglamento** (aprobado en la sesión ordinaria del Consejo de Gobierno de **23 de julio de 2020, BOUGR n.º 158**), el **propósito, misión, visión y valores**, la **Normativa de préstamo**, la **normativa de uso de los recursos informáticos y de comunicaciones** de la UGR, las **normas de acceso y uso de cada punto de servicio**, las **normas de uso generales complementarias**, la **Carta de Servicios de la UGR**, el **Código ético**, los **criterios de aceptación de donaciones** y la **Guía verde**. Planes estratégicos: vigente **Estrategia 2024-2031**; anteriores 2008-2011, 2012-2015, 2016-2019 y 2020-2023."}],"clave":["Reglamento de la BUG: Consejo de Gobierno, 23/07/2020, BOUGR n.º 158. Deroga el de 17/12/2008.","La Biblioteca es un sistema único con tres tipos de puntos de servicio: Hospital Real, bibliotecas de centros y servicios centralizados.","Servicios centralizados: Adquisiciones (y préstamo interbibliotecario), documentación científica, gestión del programa de bibliotecas y recursos electrónicos.","Comisión de Biblioteca: 3 del personal + 7 de personas usuarias (5 profesorado, 2 estudiantado); mandato de 4 años.","Art. 15: once derechos. «Participar en la consecución de los fines de la Biblioteca» sí; «participar en la toma de decisiones» no.","Propósito: «Conectar mentes, forjar el futuro». Visión: 7 rasgos. Valores: 6. Estrategia 2024-2031: 6 ejes.","Historia: 1767 Colegio de San Pablo; 1780 primer bibliotecario (Juan Gil Palomino); 1841 desamortización de Mendizábal."],"podcast":[{"v":"A","t":"Hola. Empezamos el bloque específico, y empezamos fuerte: las bibliotecas universitarias y, sobre todo, la Biblioteca de la Universidad de Granada. Este tema se estudia con documentos de la propia Universidad."},{"v":"B","t":"Y el documento clave es el Reglamento de la Biblioteca Universitaria, aprobado por el Consejo de Gobierno el veintitrés de julio de dos mil veinte y publicado en el Boletín Oficial de la Universidad de Granada, número ciento cincuenta y ocho. Deroga el de diciembre de dos mil ocho."},{"v":"A","t":"Artículo uno: la Biblioteca es una unidad funcional, administrativa y de gestión que conserva, organiza, procesa y pone a disposición de las personas usuarias todos los recursos, independientemente del soporte, del lugar donde estén y de la partida presupuestaria con la que se compraron."},{"v":"B","t":"Su finalidad principal es facilitar el acceso, la difusión y el uso de los recursos de información, y colaborar en los procesos de creación del conocimiento."},{"v":"A","t":"Estructura. Es un sistema único con varios puntos de servicio: la Biblioteca del Hospital Real, depositaria del fondo histórico; las bibliotecas de Facultades, Escuelas y otros centros; y los servicios centralizados."},{"v":"B","t":"Al frente, la Dirección y la Subdirección, con una Junta Técnica y bajo la supervisión de una Comisión delegada del Consejo de Gobierno. Los servicios centralizados son cuatro: Adquisiciones, que también lleva el préstamo interbibliotecario; documentación científica, con el repositorio institucional; el que gestiona el programa de gestión de bibliotecas; y recursos electrónicos, que mantiene la página web."},{"v":"A","t":"La Dirección ostenta la representación de la Biblioteca, elabora el informe anual, lidera los procesos de calidad y, dato curioso, propone a la Gerencia los temarios de las oposiciones. La Subdirección actúa por delegación."},{"v":"B","t":"La Comisión de Biblioteca es consultiva del Consejo de Gobierno y del Rector. Tiene tres miembros del personal y siete en representación de las personas usuarias: cinco del profesorado y dos del estudiantado. Mandato de cuatro años. Y la Junta Técnica es el órgano de apoyo y asesoramiento a la Dirección en los ámbitos técnico y económico."},{"v":"A","t":"Ahora lo que cayó en el examen de dos mil veinticinco: el artículo quince, los derechos de las personas usuarias. Son once. Recibir los servicios, atención personalizada, información y asesoramiento, acceso libre y gratuito a los espacios, espacios de estudio, acceso a los fondos, recursos de calidad, equipamientos adecuados, participar en la consecución de los fines de la Biblioteca, trato amable y cordial, y privacidad y confidencialidad."},{"v":"B","t":"Mucho cuidado con las trampas. El artículo no dice utilizar libre y gratuitamente todos los servicios. Dice acceder libre y gratuitamente a los espacios. Y no dice participar en la toma de decisiones, sino participar en la consecución de los fines."},{"v":"A","t":"Deberes: cumplir la normativa, respetar el patrimonio, no interferir en los derechos de los demás, y el préstamo es personal e intransferible y exige estar registrado en el sistema de gestión bibliotecaria. Si alguien altera el orden, es expulsado de la sala de lectura hasta el día siguiente."},{"v":"B","t":"Pasamos a la Estrategia dos mil veinticuatro a dos mil treinta y uno. El propósito es Conectar mentes, forjar el futuro. La misión: un servicio clave, en constante evolución, que conecta a las personas usuarias con sus recursos y colecciones para que apliquen el conocimiento en beneficio de una sociedad más justa e igualitaria."},{"v":"A","t":"La visión tiene siete rasgos: innovadora, creativa, participativa, abierta, socialmente responsable, valiente y transversal. Los valores son seis: dignidad y respeto, compromiso, sostenibilidad ambiental, creatividad e innovación, pleno apoyo a la Ciencia Abierta y excelencia. Y seis ejes: aprendizaje, generación de conocimiento, innovación en espacios y servicios, transformación digital, personas y modelo de gobierno y gestión."},{"v":"B","t":"Un poco de historia. En mil setecientos sesenta y siete se expulsa a los jesuitas, la Universidad se traslada al Colegio de San Pablo y la Biblioteca recibe los fondos jesuitas. En mil setecientos ochenta, primer bibliotecario reconocido: Juan Gil Palomino. En mil ochocientos cuarenta y uno, la desamortización de Mendizábal aumenta los fondos. Hoy la sede principal está en el crucero alto del Hospital Real."},{"v":"A","t":"Haz el test y repasa sobre todo el artículo quince. Hasta la próxima."}],"preguntas":[{"q":"Según el artículo 1 del Reglamento de la Biblioteca Universitaria de la UGR, la Biblioteca Universitaria se define como:","o":["Una unidad funcional, administrativa y de gestión que conserva, organiza, procesa y pone a disposición de las personas usuarias los recursos de información","Un servicio exclusivo de préstamo de monografías","Un departamento académico de la Facultad de Documentación","Un órgano consultivo del Consejo Social"],"c":0,"e":"Art. 1 del Reglamento de la Biblioteca Universitaria (2020).","r":"REGLAMENTO_BUG art. 1"},{"q":"¿Cuál es la finalidad principal de la Biblioteca según el artículo 2 del Reglamento?","o":["Facilitar el acceso, la difusión y el uso de los recursos de información y colaborar en los procesos de creación del conocimiento","Vender publicaciones de la Universidad","Conservar únicamente el fondo histórico","Gestionar los presupuestos de investigación"],"c":0,"e":"Art. 2 del Reglamento.","r":"REGLAMENTO_BUG art. 2"},{"q":"Según el artículo 3 del Reglamento, entre las funciones de la Biblioteca Universitaria figura:","o":["Promover estrategias de mejora continua en consonancia con las políticas de calidad de la Universidad","Fijar el calendario académico","Expedir títulos universitarios","Aprobar los planes de estudio"],"c":0,"e":"Art. 3.f del Reglamento.","r":"REGLAMENTO_BUG art. 3"},{"q":"Según el artículo 4.1 del Reglamento, la Biblioteca Universitaria es:","o":["Un sistema único compuesto por diferentes puntos de servicio","Una red de bibliotecas independientes de cada Facultad","Un consorcio con otras universidades andaluzas","Una fundación con personalidad jurídica propia"],"c":0,"e":"Art. 4.1 del Reglamento.","r":"REGLAMENTO_BUG art. 4"},{"q":"¿Qué biblioteca es, según el artículo 4.1 del Reglamento, la depositaria del fondo histórico de la UGR?","o":["La Biblioteca del Hospital Real","La Biblioteca de la Facultad de Letras","La Biblioteca del Campus de Cartuja","La Biblioteca Universitaria de Ceuta"],"c":0,"e":"Art. 4.1.a del Reglamento.","r":"REGLAMENTO_BUG art. 4"},{"q":"Según el artículo 4.2 del Reglamento, al frente de la Biblioteca están:","o":["La Dirección y Subdirección, con una Junta técnica y la supervisión de una Comisión delegada del Consejo de Gobierno","El Gerente y el Secretario General","El Rector y el Consejo Social","Un Comité de Dirección elegido por el Claustro"],"c":0,"e":"Art. 4.2 del Reglamento.","r":"REGLAMENTO_BUG art. 4"},{"q":"¿Qué servicio centralizado es, según el artículo 5 del Reglamento, el responsable del préstamo interbibliotecario?","o":["El Servicio de Adquisiciones","El Servicio de documentación científica","El Servicio de recursos electrónicos","La Biblioteca del Hospital Real"],"c":0,"e":"Art. 5.2 del Reglamento.","r":"REGLAMENTO_BUG art. 5"},{"q":"¿Qué servicio centralizado coordina la gestión de contenidos del Repositorio Institucional de la UGR y asesora sobre acceso abierto y propiedad intelectual (art. 5)?","o":["El Servicio de documentación científica","El Servicio de Adquisiciones","El Servicio de recursos electrónicos","El Servicio de coordinación del programa de gestión de bibliotecas"],"c":0,"e":"Art. 5.3 del Reglamento.","r":"REGLAMENTO_BUG art. 5"},{"q":"Según el artículo 5.5 del Reglamento, el Servicio de recursos electrónicos se encarga, entre otras cosas, de:","o":["Coordinar y mantener la página web de la Biblioteca Universitaria","Mantener el sistema integrado de gestión","Gestionar el presupuesto de adquisiciones","Custodiar el fondo histórico"],"c":0,"e":"Art. 5.5 del Reglamento.","r":"REGLAMENTO_BUG art. 5"},{"q":"La dependencia de las bibliotecas de centros respecto de la Dirección de la Biblioteca Universitaria es, según el artículo 6.2 del Reglamento:","o":["Orgánica y funcional","Solo funcional","Solo orgánica","Inexistente: dependen del Decano"],"c":0,"e":"Art. 6.2 del Reglamento.","r":"REGLAMENTO_BUG art. 6"},{"q":"Según el artículo 8 del Reglamento, ¿quién ostenta la representación de la Biblioteca Universitaria?","o":["La Dirección","La Gerencia","La Comisión de Biblioteca","La Junta Técnica"],"c":0,"e":"Art. 8.1 del Reglamento.","r":"REGLAMENTO_BUG art. 8"},{"q":"Según el artículo 8.3.j) del Reglamento, ¿qué debe proponer a la Gerencia la persona que ostente la Dirección de la Biblioteca?","o":["Los temarios de las oposiciones y otras pruebas de selección de personal","El presupuesto general de la Universidad","Los precios de los servicios de reproducción","El calendario de apertura de las bibliotecas"],"c":0,"e":"Art. 8.3.j del Reglamento.","r":"REGLAMENTO_BUG art. 8"},{"q":"¿Cómo actúa la Subdirección según el artículo 9 del Reglamento?","o":["Por delegación de la Dirección, a la que sustituye en caso de ausencia, vacante o enfermedad","De forma autónoma, sin depender de la Dirección","Solo cuando lo decide la Comisión de Biblioteca","Únicamente en las bibliotecas de centros"],"c":0,"e":"Art. 9 del Reglamento.","r":"REGLAMENTO_BUG art. 9"},{"q":"La Comisión de Biblioteca es, según el artículo 10.1 del Reglamento:","o":["Una comisión consultiva del Consejo de Gobierno y del Rector","Un órgano ejecutivo con poder sancionador","Un órgano de representación del PTGAS","Un órgano del Consejo Social"],"c":0,"e":"Art. 10.1 del Reglamento.","r":"REGLAMENTO_BUG art. 10"},{"q":"Según el artículo 10.2.c) del Reglamento, en la Comisión de Biblioteca hay siete miembros en representación de las personas usuarias. ¿Cómo se distribuyen?","o":["Cinco del profesorado y dos del estudiantado","Cuatro del profesorado y tres del estudiantado","Tres del profesorado y cuatro del estudiantado","Siete del estudiantado"],"c":0,"e":"Art. 10.2.c del Reglamento.","r":"REGLAMENTO_BUG art. 10"},{"q":"El mandato de los miembros electos de la Comisión de Biblioteca es, según el artículo 10.3, de:","o":["Cuatro años","Dos años","Seis años","Tres años"],"c":0,"e":"Art. 10.3 del Reglamento.","r":"REGLAMENTO_BUG art. 10"},{"q":"Según el artículo 11 del Reglamento, la Junta Técnica es:","o":["El órgano de apoyo, consulta y asesoramiento a la Dirección en los ámbitos técnico y económico de la Biblioteca","El órgano que aprueba el Reglamento","El órgano de representación de los usuarios","El órgano de gestión del Repositorio Institucional"],"c":0,"e":"Art. 11.1 del Reglamento.","r":"REGLAMENTO_BUG art. 11"},{"q":"Según el artículo 15 del Reglamento, ¿cuál de los siguientes es un derecho de las personas usuarias de la Biblioteca Universitaria?","o":["Participar en la consecución de los fines de la Biblioteca","Participar en la toma de decisiones sobre los servicios bibliotecarios","Utilizar libre y gratuitamente todos los servicios que se prestan desde la Biblioteca","Prestar cualquier documento sin límite de unidades"],"c":0,"e":"Art. 15.i del Reglamento. La opción sobre «toma de decisiones» y la de «todos los servicios libre y gratuitamente» no figuran en el artículo (sí el acceso libre y gratuito a los espacios, art. 15.d).","r":"REGLAMENTO_BUG art. 15"},{"q":"Entre los derechos del artículo 15 del Reglamento figura el de:","o":["Privacidad y confidencialidad de la información y datos de carácter personal","Solicitar cualquier obra por préstamo interbibliotecario gratuito","Disponer de una sala de estudio reservada permanentemente","Recibir formación acreditada con créditos ECTS"],"c":0,"e":"Art. 15.k del Reglamento.","r":"REGLAMENTO_BUG art. 15"},{"q":"Según el artículo 15.d) del Reglamento, las personas usuarias tienen derecho a:","o":["Acceder libre y gratuitamente a los espacios destinados a las personas usuarias de la Biblioteca en las condiciones establecidas por la normativa vigente","Acceder gratuitamente a todas las bases de datos comerciales desde su domicilio","Reservar mesas de estudio de forma permanente","Disponer de servicio de reprografía gratuito"],"c":0,"e":"Art. 15.d del Reglamento.","r":"REGLAMENTO_BUG art. 15"},{"q":"Según el artículo 16 del Reglamento, las personas usuarias podrán exponer sus observaciones, sugerencias o quejas:","o":["A través de cualquier medio que esté a su alcance","Solo por escrito en el registro general","Solo mediante el buzón de la sala de lectura","Únicamente a través de la sede electrónica"],"c":0,"e":"Art. 16 del Reglamento.","r":"REGLAMENTO_BUG art. 16"},{"q":"Según el artículo 19.d) del Reglamento, el uso del servicio de préstamo es:","o":["Personal e intransferible, y requiere estar registrado en el sistema de gestión bibliotecaria","Transferible a familiares con autorización","Libre para cualquier persona sin registro","Gratuito pero limitado a un documento al mes"],"c":0,"e":"Art. 19.d del Reglamento.","r":"REGLAMENTO_BUG art. 19"},{"q":"Según el artículo 20.1 del Reglamento, la persona que altere el orden en las dependencias abiertas al público:","o":["Será expulsada de la sala de lectura hasta el día siguiente","Será sancionada con la pérdida de matrícula","Pagará una multa fija de 30 euros","Será expulsada de la Universidad una semana"],"c":0,"e":"Art. 20.1 del Reglamento.","r":"REGLAMENTO_BUG art. 20"},{"q":"Según el artículo 27.2 del Reglamento, por razones de conservación del patrimonio, no se permitirá hacer copias de:","o":["Manuscritos, incunables y obras publicadas entre 1500 y 1900","Cualquier libro anterior a 1950","Obras publicadas después de 1900","Publicaciones periódicas en soporte digital"],"c":0,"e":"Art. 27.2 del Reglamento. El servicio central de digitalización está en la Biblioteca del Hospital Real.","r":"REGLAMENTO_BUG art. 27"},{"q":"El Reglamento de la Biblioteca Universitaria vigente deroga, según su disposición derogatoria, el reglamento aprobado por el Consejo de Gobierno el:","o":["17 de diciembre de 2008","23 de julio de 2020","28 de julio de 2011","5 de julio de 2024"],"c":0,"e":"Disposición derogatoria única del Reglamento (2020).","r":"REGLAMENTO_BUG art. 36"},{"q":"¿Cuándo fue aprobado el Reglamento vigente de la Biblioteca Universitaria?","o":["En la sesión ordinaria del Consejo de Gobierno de 23 de julio de 2020 (BOUGR n.º 158)","En la sesión del Claustro de 25 de mayo de 2026","Por resolución del Rector de 17 de diciembre de 2008","Por Decreto 231/2011, de 12 de julio"],"c":0,"e":"Página «Normativa de la BUG» de biblioteca.ugr.es.","r":"NORMATIVA_BUG art. doc"},{"q":"¿Cuál es el propósito de la Biblioteca Universitaria de Granada según su Estrategia 2024-2031?","o":["«Conectar mentes, forjar el futuro»","«Saber para servir»","«Conocimiento abierto para todos»","«Libros para la ciudadanía»"],"c":0,"e":"Propósito, misión, visión y valores de la BUG.","r":"PMVV_BUG art. doc"},{"q":"Según su misión, la Biblioteca Universitaria de Granada conecta a las personas usuarias con sus recursos y colecciones para que el conocimiento adquirido lo apliquen en beneficio de:","o":["Una sociedad más justa e igualitaria","La competitividad empresarial","El prestigio internacional de la Universidad","La digitalización de la administración"],"c":0,"e":"Misión de la BUG (Estrategia 2024-2031).","r":"PMVV_BUG art. doc"},{"q":"¿Cuál de los siguientes es uno de los valores de la Biblioteca Universitaria de Granada?","o":["Pleno apoyo a la Ciencia Abierta","Competitividad","Rentabilidad económica","Confidencialidad comercial"],"c":0,"e":"Valores: dignidad y respeto, compromiso, sostenibilidad ambiental, creatividad e innovación, pleno apoyo a la Ciencia Abierta y excelencia.","r":"ESTRATEGIA_BUG art. doc"},{"q":"¿Cuál de los siguientes rasgos NO forma parte de la visión de la Biblioteca según la Estrategia 2024-2031?","o":["Competitiva","Valiente","Transversal","Socialmente responsable"],"c":0,"e":"La visión tiene siete rasgos: innovadora, creativa, participativa, abierta, socialmente responsable, valiente y transversal.","r":"ESTRATEGIA_BUG art. doc"},{"q":"El Eje 4 de la Estrategia de la Biblioteca 2024-2031 se titula:","o":["Transformación digital","Personas","Generación de conocimiento","Innovación en espacios y servicios"],"c":0,"e":"Los seis ejes: 1 Aprendizaje transformador; 2 Generación de conocimiento; 3 Innovación en espacios y servicios; 4 Transformación digital; 5 Personas; 6 Modelo de gobierno y de gestión.","r":"ESTRATEGIA_BUG art. doc"},{"q":"¿Con qué periodicidad se realiza el seguimiento global de la implantación de la Estrategia 2024-2031?","o":["Un seguimiento anual del nivel de cumplimiento de las acciones","Una evaluación única al final de 2031","Un seguimiento mensual por la Gerencia","Ninguno: no prevé seguimiento"],"c":0,"e":"Apartado «Seguimiento y control» de la Estrategia 2024-2031.","r":"ESTRATEGIA_BUG art. doc"},{"q":"Según la ficha de patrimonio de la UGR, ¿qué ocurre en 1767 que repercute en la Biblioteca?","o":["La expulsión de la Compañía de Jesús; la Universidad se traslada al antiguo Colegio de San Pablo, donde se instala la Biblioteca","La desamortización de Mendizábal","El nombramiento del primer bibliotecario reconocido","El traslado de la sede al Hospital Real"],"c":0,"e":"1767: expulsión de los jesuitas; 1780: primer bibliotecario (Juan Gil Palomino); 1841: desamortización de Mendizábal.","r":"HISTORIA_BUG art. doc"},{"q":"¿Quién fue el primer bibliotecario reconocido de la Biblioteca de la Universidad de Granada, nombrado en 1780?","o":["Juan Gil Palomino","Antonio de Pineda y Barragán","Juan Velázquez de Echevarría","Manuel José Guillén"],"c":0,"e":"Le sucedieron Juan Velázquez de Echevarría y Antonio de Pineda y Barragán.","r":"HISTORIA_BUG art. doc"},{"q":"Según la ficha técnica de patrimonio de la UGR, la sede principal de la Biblioteca Universitaria se encuentra en:","o":["El crucero alto del Hospital Real","El Colegio de San Pablo","El Campus de Fuentenueva","La Facultad de Filosofía y Letras"],"c":0,"e":"Avenida del Hospicio, 1, Granada.","r":"HISTORIA_BUG art. doc"},{"q":"El fondo de la Biblioteca del Hospital Real está organizado sistemáticamente según:","o":["La Clasificación Decimal Universal (CDU) y números currens","La Clasificación de la Library of Congress","Un orden alfabético por autores","La clasificación Dewey exclusivamente"],"c":0,"e":"Fondo histórico multidisciplinar, fundamentalmente del siglo XV al XIX.","r":"HOSPITAL_REAL art. doc"}],"mp3":true},"e6":{"id":"e6","bloque":"Específico","num":6,"titulo":"Sistemas integrados de gestión bibliotecaria y catálogo","alcance":"Los sistemas integrados de gestión bibliotecaria (SIGB). El SIGB de la Biblioteca Universitaria de Granada. El catálogo de la Biblioteca de la Universidad de Granada (Granatensis).","fuentes":["Guía de Granatensis de la Biblioteca Universitaria de Granada (bibliotecaugr.libguides.com/Granatensis), consultada el 28/10/2026","Memoria 2017-2018 de la Biblioteca Universitaria de Granada (migración a Alma/Primo)","Wikipedia en español: Sistema Integrado de Gestión Bibliotecaria, Z39.50, Koha, Evergreen, Catálogo en línea y PhpMyBibli (fuente NO oficial, solo para conceptos generales de SIGB)"],"peso":"alto","notas":["Este tema pesó mucho en el examen de abril de 2025: hubo preguntas sobre las funciones de Granatensis (compartir un registro, localizar a la vez e-books y revistas electrónicas, qué puede hacer cualquier persona sin identificarse) y sobre los subcatálogos. Estudia bien los subcatálogos y qué incluye y qué no cada uno.","El SIGB de la Biblioteca es Alma y el descubrimiento es Primo (Ex Libris). La Biblioteca terminó la migración en noviembre de 2018. Granatensis es el nombre del catálogo público.","Para los conceptos generales de SIGB (módulos, historia, software libre, Z39.50) la fuente es una enciclopedia abierta, no un documento oficial. Sirven para entender, pero el examen puede preguntarlos con otras palabras: refuerza con tus apuntes si los tienes.","La Guía de Granatensis es una página web que se actualiza. Las funciones y nombres (por ejemplo, el «Asistente de investigación») pueden cambiar. Mira Granatensis tú misma antes del examen para ver la versión actual.","No confundas Catálogo BUG (lo que tiene la Biblioteca) con Catálogo Colectivo CBUA (lo que tienen todas las bibliotecas del consorcio andaluz) ni con «Artículos y más» (artículos y otros documentos de plataformas y repositorios)."],"apuntes":[{"h":"Qué es un SIGB","t":"- **Definición**: un **Sistema Integrado de Gestión Bibliotecaria (SIGB)** es un **software destinado a la gestión informática y a la automatización de las actividades** de una biblioteca: gestión de colecciones y usuarios, catalogación, circulación, adquisiciones, consultas y estadísticas.\n- Suele basarse en una **base de datos relacional**, un software para interactuar con ella, una **interfaz para los profesionales** y otra **para los usuarios**.\n- **Módulos tradicionales**: **administración** (configuración: tipos de usuarios, de registros…), **adquisiciones** (pedidos, recepciones, facturación), **catalogación** (creación de registros), **préstamo** (circulación), **publicaciones periódicas** (control de revistas y periódicos) y el **catálogo en línea (OPAC)**, interfaz para los usuarios.\n- **OPAC** (Online Public Access Catalog): catálogo automatizado de acceso público; suele formar parte del SIGB. Desde mediados de los años 80 sustituyó al catálogo de fichas; desde los 90, interfaces web.\n- **Historia**: aparecieron en los años **70 y 80**. Con el auge de las publicaciones electrónicas surgieron sistemas en la nube (**SaaS**) y **herramientas de descubrimiento** (Summon, **Primo**, EDS) que sustituyen a los OPAC. Desde **2011** surgen las **Plataformas de Servicios Bibliotecarios (PSB / LSP)**, siendo el primer ejemplo **Alma (Ex Libris)**: gestionan todos los flujos de trabajo y todos los recursos de información.\n- **Software libre**: **Koha** (el primero de código abierto, licencia GNU GPL, creado en **1999** por Katipo Communications para la Horowhenua Library Trust, Nueva Zelanda; «koha» significa «obsequio» en maorí), **Evergreen** (desarrollado por el Servicio de Bibliotecas Públicas de Georgia, EE. UU.; red PINES) y **PMB / PhpMyBibli** (iniciado en 2002 por François Lemarchand, Francia).\n- **Z39.50**: **protocolo cliente-servidor** para buscar y recuperar información en distintos sistemas desde una misma interfaz; estándar **ANSI/NISO Z39.50** e **ISO 23950**. Permite consultar bases de datos de bibliotecas distribuidas."},{"h":"El SIGB de la Biblioteca de la UGR: Alma y Primo","t":"- La Biblioteca Universitaria de Granada **finalizó en noviembre de 2018 la migración al nuevo sistema de gestión ALMA/PRIMO** (Ex Libris). **Alma** es el sistema de gestión (plataforma de servicios bibliotecarios) y **Primo**, el descubrimiento.\n- Según la Memoria 2017-2018, el sistema contaba con **1.714.113 títulos y 2.357.240 ejemplares** (físicos 62,96 % y electrónicos 37,04 %) y **103.077 usuarios**.\n- El **Servicio de coordinación y gestión del programa de gestión de bibliotecas** (Reglamento, art. 5.4) mantiene y desarrolla el sistema integrado de gestión y coordina, normaliza y difunde los procesos relacionados.\n- Parámetros **Z39.50** del servidor de la UGR: servidor **eu02.alma.exlibrisgroup.com**, base de datos **34CBUA_UGR**, puerto **1921**, sintaxis **MARC21**; nombre a mostrar «Granatensis UGR»."},{"h":"Granatensis: qué es y qué aporta","t":"- **Granatensis** es la **plataforma de acceso a todos los recursos de información** de la Biblioteca Universitaria de Granada. **Combina los recursos del catálogo de la Biblioteca con registros de bases de datos, repositorios, recursos web**, etc. Concentra la información de una publicación en una sola página, es personalizable y se adapta a dispositivos móviles.\n- **Área de usuario**: reúne **préstamos, reservas, favoritos** y, según la configuración, el **historial de búsqueda**.\n- **Filtros**: por **tipo de material** (Todos, Libros, Artículos, Revistas…) en la parte superior; más facetas en «Todos los filtros»; filtros de **disponibilidad** (en biblioteca, en línea, revisados por pares, acceso abierto).\n- **Menú principal**: página principal; **Ayuda** (Guía de Granatensis); **Revistas** (búsqueda por **título o ISSN** y consulta de revistas electrónicas por áreas temáticas); **Búsqueda por índices** (términos normalizados de autores, materias…); **Asistente de investigación**; idioma."},{"h":"Los subcatálogos de Granatensis (muy preguntado)","t":"Se puede buscar de forma individual o combinada en:\n- **Catálogo BUG** (por defecto): **material impreso** (libros, revistas, mapas), **e-books y revistas electrónicas contratadas por la BUG**, **colección multimedia** (CD, DVD) y el **Repositorio Digibug**. **No cubre**: capítulos de libros, artículos de revistas, contenido de las bases de datos suscritas, libros electrónicos gratuitos en plataformas externas ni sitios web.\n- **Catálogo Colectivo CBUA**: además de los resultados del Catálogo BUG, informa de la **disponibilidad en cualquier biblioteca del Consorcio de Bibliotecas Universitarias de Andalucía** y permite solicitar el documento (comunidad universitaria).\n- **Artículos y más**: referencias y **texto completo** de artículos, capítulos, libros electrónicos y otros documentos de las suscripciones de la BUG o en acceso abierto, incluidos en el **Índice Central de Descubrimiento (CDI)**. No incluye necesariamente todo el contenido de las revistas y bases de datos suscritas.\n- **Bibliografía recomendada**: filtra los materiales vinculados a **listas de lectura de las asignaturas** (Leganto).\n- **Catálogo BUG + Artículos y más**: incluye el contenido de ambos.\n- **Fondo antiguo**: todo el **fondo bibliográfico de la BUG anterior a 1900**.\n- **Recursos online UGR**: **libros electrónicos y revistas electrónicas contratadas por la BUG** y el **Repositorio Digibug**.\n- **Digibug**: contenido completo del **Repositorio Institucional** de la UGR.\n- El acceso a los recursos electrónicos está **restringido a miembros de la comunidad universitaria**."},{"h":"Identificación y servicios personalizados","t":"- **Hay que identificarse** para: ver las **condiciones de préstamo** de los documentos, **reservar**, acceder a **Mi Biblioteca** (renovaciones, reservas, solicitudes, historial), gestionar **favoritos y alertas** y personalizar los resultados.\n- Dos opciones: **Usuario UGR** (cuenta de correo y contraseña de la UGR) y **Usuario visitante autorizado** (correo de cualquier proveedor): recibe un mensaje «[BIBLIOTECA] Inicie sesión con su dirección de correo electrónico» con un enlace que **caduca a los 10 minutos**.\n- Si no estás registrado como usuario, se solicita el alta en la **sede electrónica** (carné de biblioteca para personas externas).\n- Sin identificarse se puede **buscar en el catálogo** y consultar la información básica de los registros."},{"h":"Cómo buscar","t":"- **Búsqueda simple**: caja de búsqueda de la página inicial; a la izquierda se elige el **subcatálogo** (por defecto, **Catálogo BUG**) y a la derecha los términos (título, autor, materias). Hay un **icono de micrófono** para introducir los términos **por voz**.\n- **Búsqueda avanzada**: combina campos con operadores **Y, O, NO**; permite filtrar por tipo de material, idioma y fecha; el «Campo de búsqueda» (Cualquier campo, Autor/Creador, Título…) y el «Tipo de coincidencia» (**contiene, es exacto, empieza por**…).\n- **Búsqueda por código de barras** del ejemplar (la etiqueta de la BUG) para localizar la referencia.\n- **Operadores booleanos**: **AND** (todos los términos), **OR** (al menos uno; amplía) y **NOT** (excluye un término).\n- **Comodines**: **?** sustituye **un** carácter (operador?s); **\\*** sustituye **varios** (cultur*). Las **comillas** buscan **frases exactas**."},{"h":"Resultados, facetas y registro completo","t":"- **Registro breve**: tipo de recurso, icono o portada, título, autoría, datos de publicación, resumen y disponibilidad. Desde la lista se puede **compartir la referencia** (por e-mail, copiando el enlace permanente o por redes sociales), **generar una cita**, **guardar en favoritos** o exportar, y acceder al texto completo.\n- Las **distintas versiones o ediciones** de una obra se agrupan y se muestra primero el registro recomendado (la edición más reciente).\n- **Expandir resultados** (en «Artículos y más»): incorpora citas de recursos externos a los que la biblioteca no tiene acceso («Sin acceso en línea»).\n- **Registro completo**: descripción bibliográfica completa, texto completo en línea, ejemplares físicos, otras versiones, **herramientas de usuario** (favoritos, exportar, citar, enviar por correo, enlaces permanentes), servicios (reservas, **préstamo intercampus**, **digitalización de artículos**), ejemplares vecinos en la estantería y vista en formato **MARC21**.\n- **Facetas** («Todos los filtros»): Disponibilidad; Biblioteca; Tipo de recurso; **Autor/Creador (los 50 primeros nombres)**; Fecha de publicación; Materia/Descriptores; Idioma; Registros nuevos; **Asignatura/Titulación/Profesorado** (bibliografía recomendada, Leganto). **Al realizar una nueva búsqueda, los filtros se desactivan.**"},{"h":"Historial, favoritos, reservas y renovaciones","t":"- **Historial de búsquedas**: «Guardar consulta» asocia la estrategia (no una lista fija de registros) a tu cuenta; se puede activar un **aviso por correo** cuando haya nuevos registros. Los **registros guardados** (favoritos) se agrupan en el área de usuario.\n- **Reservas** desde Granatensis (identificada): **reserva local** (títulos de tu biblioteca sin ejemplares disponibles) y **reserva intercampus** (títulos de otros campus, excluidos los manuales). El máximo de reservas activas depende del tipo de usuario. Se activa la opción «Reservar» en el apartado **Localizaciones** del registro completo.\n- **Renovaciones**: la Biblioteca **renueva automáticamente** los préstamos **hasta un máximo de 6 veces el periodo inicial** si la política lo permite, el ejemplar no está vencido, la persona no está sancionada y no hay reserva. La fecha máxima se ve en «Mi actividad en la biblioteca» → «préstamos». También se puede renovar manualmente («Renovar» o «Renovar todos»).\n- **Digitalización de artículos de revista en papel** y consulta de **préstamos y reservas activas** desde el área de usuario."},{"h":"Asistente de investigación y CatCBUA","t":"- **Asistente de investigación**: funcionalidad de **inteligencia artificial generativa** integrada en Granatensis. Permite hacer **preguntas en lenguaje natural** y ofrece **un resumen breve con referencias a 5 recursos académicos suscritos por la UGR**. Traduce la pregunta a una búsqueda sobre el **Índice Central de Descubrimiento (CDI)** de Ex Libris. Es una **ayuda inicial**: hay que leer las fuentes originales, contrastar y citar. **Uso restringido a miembros de la comunidad universitaria** (identificarse como «Usuario UGR»).\n- **CatCBUA**: catálogo colectivo con los recursos de las bibliotecas del **Consorcio de Bibliotecas Universitarias de Andalucía**; también accesible desde Granatensis en el subcatálogo «Catálogo Colectivo CBUA»."}],"clave":["SIGB de la BUG: Alma (gestión) y Primo (descubrimiento), de Ex Libris; migración terminada en noviembre de 2018.","Granatensis = plataforma de acceso a todos los recursos de la Biblioteca (catálogo + bases de datos, repositorios, recursos web).","Subcatálogos: Catálogo BUG (por defecto), Catálogo Colectivo CBUA, Artículos y más (CDI), Bibliografía recomendada, Catálogo BUG + Artículos y más, Fondo antiguo (< 1900), Recursos online UGR, Digibug.","El Catálogo BUG no cubre: capítulos de libros, artículos de revistas, contenido de bases de datos, e-books gratuitos externos ni sitios web.","Booleanos: AND, OR, NOT. Comodines: ? un carácter, * varios. Comillas = frase exacta.","Renovación automática: hasta 6 veces el periodo inicial. Asistente de investigación: 5 recursos.","Z39.50: protocolo cliente-servidor (ANSI/NISO Z39.50, ISO 23950). Koha: primer SIGB de código abierto (1999)."],"podcast":[{"v":"A","t":"Hola. Tema seis del bloque específico: los sistemas integrados de gestión bibliotecaria y el catálogo de la Biblioteca de la UGR, Granatensis."},{"v":"B","t":"Un SIGB es un software destinado a la gestión y automatización de las actividades de una biblioteca: colecciones, usuarios, catalogación, circulación, adquisiciones, consultas y estadísticas. Se organiza en módulos: administración, adquisiciones, catalogación, préstamo, publicaciones periódicas y el catálogo en línea, el OPAC."},{"v":"A","t":"Desde dos mil once aparecen las plataformas de servicios bibliotecarios, y la primera fue Alma, de Ex Libris. Y las herramientas de descubrimiento, como Primo, sustituyen a los catálogos en línea tradicionales."},{"v":"B","t":"Y eso es justo lo que usa la Biblioteca de la UGR. En noviembre de dos mil dieciocho terminó la migración a Alma y Primo. Granatensis es el catálogo público, la plataforma de acceso a todos los recursos de información de la Biblioteca."},{"v":"A","t":"Software libre: Koha, el primero de código abierto, con licencia GNU GPL, creado en mil novecientos noventa y nueve en Nueva Zelanda; Evergreen, de las bibliotecas públicas de Georgia; y PMB, francés. Y el protocolo Z39.50: cliente-servidor para buscar en distintos sistemas desde una misma interfaz, estándar ISO veintitrés mil novecientos cincuenta."},{"v":"B","t":"Los subcatálogos de Granatensis, que se preguntan mucho. Catálogo BUG, el de por defecto: material impreso, e-books y revistas electrónicas contratadas, colección multimedia y Digibug. No cubre capítulos de libros, artículos de revistas, contenido de bases de datos, e-books gratuitos externos ni sitios web."},{"v":"A","t":"Catálogo Colectivo CBUA: informa de la disponibilidad en cualquier biblioteca del Consorcio andaluz y permite pedir el documento. Artículos y más: artículos y texto completo del Índice Central de Descubrimiento. Bibliografía recomendada: listas de lectura de las asignaturas. Fondo antiguo: todo lo anterior a mil novecientos. Y Recursos online UGR: libros y revistas electrónicas más Digibug."},{"v":"B","t":"Para servicios personalizados hay que identificarse: reservas, renovaciones, favoritos, alertas. Hay usuario UGR con su correo institucional, y usuario visitante autorizado, con un enlace que caduca a los diez minutos."},{"v":"A","t":"Búsqueda: la simple, con subcatálogo y términos, y se puede dictar por voz. La avanzada, con campos y tipos de coincidencia. Y por código de barras. Operadores AND, OR y NOT. Comodines: interrogación para un carácter, asterisco para varios, y comillas para frase exacta."},{"v":"B","t":"En los resultados, las facetas: disponibilidad, biblioteca, tipo de recurso, autor con los cincuenta primeros nombres, fecha, materia, idioma, registros nuevos y asignatura. Cuando haces una nueva búsqueda, los filtros se desactivan."},{"v":"A","t":"Las renovaciones son automáticas, hasta seis veces el periodo inicial, si no hay sanción ni reserva. Las reservas pueden ser locales o intercampus."},{"v":"B","t":"Y la novedad: el Asistente de investigación, inteligencia artificial generativa integrada en Granatensis. Haces una pregunta en lenguaje natural y devuelve un resumen con cinco recursos académicos suscritos por la UGR. Solo para la comunidad universitaria."},{"v":"A","t":"Haz el test. Hasta la próxima."}],"preguntas":[{"q":"Un Sistema Integrado de Gestión Bibliotecaria (SIGB) es:","o":["Un software destinado a la gestión informática y a la automatización de las actividades de una biblioteca","Un catálogo colectivo de varias universidades","Un protocolo de comunicación entre bibliotecas","Una norma de descripción bibliográfica"],"c":0,"e":"Definición general de SIGB (fuente no oficial).","r":"WIKI_SIGB art. doc"},{"q":"¿Cuál de los siguientes es un módulo tradicional de un SIGB?","o":["Adquisiciones","Maquetación editorial","Facturación comercial de libros","Gestión de nóminas"],"c":0,"e":"Módulos: administración, adquisiciones, catalogación, préstamo, publicaciones periódicas y catálogo en línea.","r":"WIKI_SIGB art. doc"},{"q":"¿Qué significan las siglas OPAC?","o":["Online Public Access Catalog (catálogo en línea de acceso público)","Open Public Archive Catalog","Online Professional Archive Cataloguing","Optical Public Access Card"],"c":0,"e":"El OPAC suele formar parte del SIGB.","r":"WIKI_SIGB art. doc"},{"q":"¿Cuál fue el primer ejemplo de Plataforma de Servicios Bibliotecarios (PSB), desarrolladas desde 2011?","o":["Alma (Ex Libris)","Koha","Evergreen","PMB"],"c":0,"e":"Las PSB (Library Services Platform) gestionan todos los flujos de trabajo y recursos de información.","r":"WIKI_SIGB art. doc"},{"q":"¿Qué herramientas de descubrimiento sustituyen a los catálogos en línea tradicionales, según la bibliografía profesional?","o":["Summon, Primo o EDS","Koha, Evergreen o PMB","MARC21, UNIMARC o ISBD","Dublin Core, MODS o METS"],"c":0,"e":"Primo es la herramienta de descubrimiento de Ex Libris que usa la BUG.","r":"WIKI_SIGB art. doc"},{"q":"¿Cuál es el primer sistema integrado de gestión bibliotecaria de código fuente abierto, liberado bajo la GNU General Public License?","o":["Koha","Evergreen","Alma","Aleph"],"c":0,"e":"Koha, creado en 1999 por Katipo Communications para la Horowhenua Library Trust (Nueva Zelanda).","r":"WIKI_SIGB art. doc"},{"q":"El nombre «Koha», en maorí, significa:","o":["Obsequio o donación","Libro","Conocimiento","Biblioteca"],"c":0,"e":"Koha fue creado en 1999 en Nueva Zelanda.","r":"WIKI_SIGB art. doc"},{"q":"El SIGB Evergreen fue desarrollado por:","o":["El Servicio de Bibliotecas Públicas de Georgia (EE. UU.)","La Universidad de Granada","Ex Libris","La Biblioteca Nacional de España"],"c":0,"e":"Es software libre y lo usa la red PINES de bibliotecas de Georgia.","r":"WIKI_SIGB art. doc"},{"q":"¿Cuál de los siguientes es un SIGB de código abierto?","o":["PhpMyBibli (PMB)","Alma","Aleph","Millennium"],"c":0,"e":"PMB nació en 2002 en Francia. Koha y Evergreen también son libres.","r":"WIKI_SIGB art. doc"},{"q":"¿Qué es el protocolo Z39.50 en el contexto de los SIGB?","o":["Un protocolo cliente-servidor para buscar y recuperar información en distintos sistemas a través de una misma interfaz","Un protocolo de copia de seguridad de bases de datos","Un formato de registro bibliográfico","Un sistema de identificación por radiofrecuencia"],"c":0,"e":"Estándar ANSI/NISO Z39.50 e ISO 23950.","r":"WIKI_SIGB art. doc"},{"q":"El estándar internacional que cubre el protocolo Z39.50 es:","o":["ISO 23950","ISO 2709","ISO 999","ISO 9001"],"c":0,"e":"También ANSI/NISO Z39.50.","r":"WIKI_SIGB art. doc"},{"q":"¿Cuándo finalizó la Biblioteca Universitaria de Granada la migración a su nuevo sistema de gestión ALMA/PRIMO?","o":["En noviembre de 2018","En 2011","En marzo de 2020","En 2024"],"c":0,"e":"Memoria 2017-2018 de la Biblioteca Universitaria.","r":"MEMORIA_BUG art. doc"},{"q":"¿Qué es Granatensis según la Guía de la Biblioteca de la UGR?","o":["La plataforma de acceso a todos los recursos de información de la Biblioteca Universitaria de Granada","El repositorio institucional de la UGR","El sistema de préstamo consorciado","Un buscador externo de revistas"],"c":0,"e":"Combina el catálogo de la Biblioteca con registros de bases de datos, repositorios y recursos web.","r":"GRANATENSIS art. doc"},{"q":"El área de usuario de Granatensis reúne, de forma clara:","o":["Los préstamos, reservas, favoritos y, según la configuración, el historial de búsqueda","Solo las reservas","Los datos bibliográficos de los documentos","Las estadísticas de la Biblioteca"],"c":0,"e":"Página principal de la Guía de Granatensis.","r":"GRANATENSIS art. doc"},{"q":"¿Qué subcatálogo de Granatensis incluye, entre otros, el material impreso, los e-books y revistas electrónicas contratadas, la colección multimedia y Digibug?","o":["Catálogo BUG","Artículos y más","Fondo antiguo","Bibliografía recomendada"],"c":0,"e":"El Catálogo BUG es el subcatálogo por defecto.","r":"GRANATENSIS art. doc"},{"q":"¿Cuál de los siguientes contenidos NO cubre el Catálogo BUG?","o":["Artículos de revistas","Libros impresos de la Biblioteca","Colección multimedia (CD, DVD)","E-books contratados por la BUG"],"c":0,"e":"Tampoco cubre capítulos de libros, contenido de bases de datos, e-books gratuitos externos ni sitios web.","r":"GRANATENSIS art. doc"},{"q":"El subcatálogo «Catálogo Colectivo CBUA» informa, además de los resultados del Catálogo BUG, sobre:","o":["La disponibilidad en cualquier biblioteca del Consorcio de Bibliotecas Universitarias de Andalucía","La disponibilidad en cualquier biblioteca de España","Solo las bibliotecas de la ciudad de Granada","Únicamente los fondos digitales"],"c":0,"e":"Si perteneces a la comunidad universitaria podrás solicitarlo para recibirlo en tu biblioteca.","r":"GRANATENSIS art. doc"},{"q":"El subcatálogo «Artículos y más» incluye contenidos procedentes del:","o":["Índice Central de Descubrimiento (CDI)","Catálogo Colectivo REBIUN","Archivo Universitario","Registro de Universidades, Centros y Títulos"],"c":0,"e":"Referencias y texto completo de artículos, capítulos, libros electrónicos y otros documentos académicos.","r":"GRANATENSIS art. doc"},{"q":"¿Qué recupera el subcatálogo «Fondo antiguo»?","o":["Todo el fondo bibliográfico de la BUG anterior a 1900","Todo el fondo anterior a 1950","Los incunables exclusivamente","Las obras del Hospital Real posteriores a 1800"],"c":0,"e":"Subcatálogo «Fondo antiguo» de Granatensis.","r":"GRANATENSIS art. doc"},{"q":"Si quieres localizar de forma conjunta los libros electrónicos y las revistas electrónicas contratadas por la BUG, ¿qué subcatálogo de Granatensis debes usar?","o":["Recursos online UGR","Catálogo Colectivo CBUA","Fondo antiguo","Bibliografía recomendada"],"c":0,"e":"Recursos online UGR incluye también el Repositorio Digibug.","r":"GRANATENSIS art. doc"},{"q":"El filtro «Bibliografía recomendada» de Granatensis permite filtrar materiales:","o":["Vinculados a listas de lectura de las asignaturas","Publicados en el último año","Digitalizados por la BUG","Disponibles en acceso abierto"],"c":0,"e":"Subcatálogo «Bibliografía recomendada» (Leganto).","r":"GRANATENSIS art. doc"},{"q":"¿Cuántas opciones de identificación ofrece Granatensis y cuáles son?","o":["Dos: Usuario UGR y Usuario visitante autorizado","Una: solo Usuario UGR","Tres: estudiante, PDI y PTGAS","Dos: carné de biblioteca y DNI"],"c":0,"e":"Guía de Granatensis, «¿Cómo identificarse?».","r":"GRANATENSIS art. doc"},{"q":"El enlace que recibe por correo un usuario visitante autorizado para iniciar sesión caduca a los:","o":["10 minutos del envío","24 horas del envío","1 hora del envío","7 días del envío"],"c":0,"e":"Guía de Granatensis, «¿Cómo identificarse?».","r":"GRANATENSIS art. doc"},{"q":"En la búsqueda simple de Granatensis, el subcatálogo seleccionado por defecto es:","o":["Catálogo BUG","Catálogo Colectivo CBUA","Artículos y más","Digibug"],"c":0,"e":"Por defecto «Catálogo BUG».","r":"GRANATENSIS art. doc"},{"q":"¿Qué operadores booleanos permite Granatensis?","o":["AND, OR y NOT","SUMA, RESTA y PRODUCTO","IF, THEN y ELSE","Solo AND"],"c":0,"e":"AND restringe, OR amplía y NOT excluye.","r":"GRANATENSIS art. doc"},{"q":"En Granatensis, el comodín «?» (signo de interrogación) sustituye:","o":["Un solo carácter","Varios caracteres","Una palabra completa","El final de la palabra únicamente"],"c":0,"e":"Ejemplo: operador?s recupera «operadores» y «operadoras». El asterisco (*) sustituye varios caracteres.","r":"GRANATENSIS art. doc"},{"q":"Para buscar una frase exacta en Granatensis se recomienda usar:","o":["Comillas","Paréntesis","El signo más (+)","Corchetes"],"c":0,"e":"Guía «¿Cómo buscar?».","r":"GRANATENSIS art. doc"},{"q":"En la faceta «Autor/Creador» de Granatensis, se muestra:","o":["Un listado alfabético de los 50 primeros nombres","Un listado de todos los autores","Los 10 autores más citados","Solo los autores de la UGR"],"c":0,"e":"Página de resultados y facetas.","r":"GRANATENSIS art. doc"},{"q":"Al realizar una nueva búsqueda en Granatensis, los filtros aplicados:","o":["Se desactivan","Se mantienen siempre","Se guardan en el historial","Se aplican solo a los libros"],"c":0,"e":"Consejos rápidos de uso de las facetas.","r":"GRANATENSIS art. doc"},{"q":"La opción «Revistas» del menú principal de Granatensis permite buscar publicaciones periódicas por:","o":["Título o ISSN","Autor o editor","Materia o CDU","ISBN o signatura"],"c":0,"e":"También permite consultar las revistas electrónicas por áreas temáticas.","r":"GRANATENSIS art. doc"},{"q":"¿Hasta cuántas veces el período inicial renueva automáticamente la Biblioteca un préstamo, según la Guía de Granatensis?","o":["6","3","2","10"],"c":0,"e":"Siempre que la política de préstamo lo permita, no esté vencido, no haya sanción ni reserva.","r":"GRANATENSIS art. doc"},{"q":"El «Asistente de investigación» de Granatensis ofrece un resumen claro con referencias a:","o":["5 recursos académicos suscritos por la Universidad de Granada","10 recursos de acceso abierto","3 libros del catálogo","Todos los recursos de la Biblioteca"],"c":0,"e":"Es una herramienta de inteligencia artificial generativa integrada en Granatensis, de uso restringido a la comunidad universitaria.","r":"GRANATENSIS art. doc"},{"q":"Según la configuración Z39.50 de la UGR, la base de datos del servidor es:","o":["34CBUA_UGR","UGR_PRIMO","BUG_ALMA_01","GRANATENSIS_2018"],"c":0,"e":"Servidor eu02.alma.exlibrisgroup.com, puerto 1921, sintaxis MARC21.","r":"GRANATENSIS art. doc"}],"mp3":true},"e7":{"id":"e7","bloque":"Específico","num":7,"titulo":"Cooperación bibliotecaria","alcance":"Cooperación bibliotecaria. Sistemas, redes y consorcios de bibliotecas universitarias. REBIUN y CBUA.","fuentes":["Estatutos del Consorcio de Bibliotecas Universitarias de Andalucía (CBUA), aprobados en la sesión ordinaria del Consejo de Gobierno de la UGR de 16 de junio de 2009","Sitio oficial de REBIUN (rebiun.org): qué es, organización, líneas estratégicas, catálogo colectivo, préstamo interbibliotecario","Memoria de actividades REBIUN 2025 (V Plan Estratégico 2024-2027)","Manual de procedimiento del catálogo colectivo de REBIUN (2016)"],"peso":"alto","notas":["En el examen de abril de 2025 hubo varias preguntas sobre REBIUN: su plan estratégico, la periodicidad de actualización de su catálogo colectivo y sus subcatálogos. Para el catálogo colectivo: se actualiza seis veces al año (cada dos meses aproximadamente) y sus subcatálogos son Todo, Revistas y Fondo antiguo (el manual es de 2016: confirma en rebiun.org si no ha cambiado).","Los Estatutos del CBUA que se estudian son los de 2009. Pueden haberse modificado después. Las cifras de los Estatutos (4 años de presidencia, dos tercios, 5 y 2 días hábiles) salen del texto de 2009.","REBIUN es la Red de Bibliotecas Universitarias y Científicas Españolas (la «C» de «Científicas» incluye al CSIC). Desde 2020 está asociada a la Sectorial CRUE I+D+i; antes, entre 1998 y 2019, fue Comisión Sectorial de CRUE.","El V Plan Estratégico de REBIUN es 2024-2027 y tiene 4 líneas. No confundas con la Estrategia 2024-2031 de la Biblioteca de la UGR (que tiene 6 ejes).","En el examen de 2025 también preguntaron por las Recomendaciones REBIUN de 2014 sobre digitalización y preservación: esas recomendaciones se estudian en el tema E10 (digitalización)."],"apuntes":[{"h":"Cooperación bibliotecaria: idea general","t":"- La **cooperación bibliotecaria** consiste en que varias bibliotecas trabajen juntas para **compartir recursos, servicios y conocimiento** y mejorar sus servicios (catálogos colectivos, préstamo entre bibliotecas, compras conjuntas, formación, proyectos comunes).\n- En el ámbito universitario español hay **dos niveles** que entran en el temario: **REBIUN** (red nacional) y el **CBUA** (consorcio andaluz). La UGR forma parte de ambos."},{"h":"REBIUN: qué es y cómo se organiza","t":"- **REBIUN** = **Red de Bibliotecas Universitarias y Científicas Españolas**. Es una **red asociada a la Sectorial CRUE I+D+i desde 2020**. Antes fue una red independiente (**1990-1998**) y una **Comisión Sectorial de CRUE (1998-2019)**. Nació **a iniciativa de un grupo de directoras y directores de bibliotecas en 1988**.\n- La forman las bibliotecas de las **76 universidades miembros de la CRUE** (**49 de ámbito público y 27 de ámbito privado**) y el **CSIC**.\n- **Misión**: fortalecer la **cooperación, coordinación y colaboración** entre sus bibliotecas; servir como **foro de confianza** para proyectos comunes; actuar como **interlocutora** ante CRUE, consorcios y ministerios; crear **guías y directrices**; y promover un modelo de biblioteca para la docencia, la investigación y la **ciencia abierta**, alineado con la **Agenda 2030**.\n- **Valores**: colaboración y cooperación, innovación, compromiso… En el V Plan se añaden cinco valores de futuro: **equidad, fiabilidad, transparencia, liderazgo e igualdad**.\n- **Órganos**: colegiados, el **Pleno** (Asamblea General) y la **Comisión Permanente**; unipersonales, el **Coordinador/a** y el **Secretario/a Ejecutivo/a**. La Asamblea puede crear **grupos de trabajo** temporales o permanentes a propuesta de la Comisión Permanente."},{"h":"V Plan Estratégico de REBIUN 2024-2027","t":"- Aprobado en la **Asamblea celebrada el 29 de noviembre en la Universitat Autònoma de Barcelona** y en vigor desde **enero de 2024**. Con él funcionan **4 líneas estratégicas y 8 grupos de trabajo**.\n- **Línea 1. La biblioteca en el contexto de la transformación digital.** Cuatro ámbitos: nuevos servicios de apoyo al **aprendizaje y la docencia** (incluye los **recursos educativos abiertos, REA**); nuevos servicios de apoyo a la **investigación**; nuevos servicios en colaboración con otras unidades (**transferencia y proyección social**); **transformación de espacios**.\n- **Línea 2. La biblioteca como agente estratégico para el impulso de la ciencia abierta.** (Incluye el proyecto **PLATICA**).\n- **Línea 3. Equipos y capacitación profesional.**\n- **Línea 4. Gobernanza, colaboración e internacionalización.** La conforma la **Comisión Permanente**. Ámbitos: impulso de la cooperación interinstitucional, de la internacionalización y mejora de la gobernanza y organización interna."},{"h":"Catálogo colectivo de REBIUN","t":"- **Agrupa los catálogos de 95 bibliotecas** (76 universitarias, públicas y privadas, miembros de CRUE, el CSIC y una veintena más de instituciones asociadas). Nació en **1992** con una edición en **CD-ROM** que reunía los fondos de **5 bibliotecas universitarias**.\n- **Actualización**: **seis veces al año (bimestral, cada dos meses aproximadamente)**. Antes de cada actualización, la empresa **Baratz** comunica a las bibliotecas la fecha límite para enviar sus datos.\n- **Subcatálogos**: **Todo, Revistas y Fondo antiguo** (este último, con más de un millón de registros de obras **anteriores a 1900**).\n- Desde 2016 se mantiene un **Registro Máster** para tener una URL persistente por registro y se detectan y eliminan duplicados.\n- El **grupo de trabajo de Catálogo Colectivo** mejora su funcionamiento: elimina duplicados, mejora la visibilidad de revistas, elabora manuales y atiende incidencias.\n- Otros grupos de trabajo: Repositorios, Patrimonio Bibliográfico, RDA, Estadísticas, Acceso al documento, Comunicación y Propiedad intelectual. Hay además un **Observatorio de Inteligencia Artificial**.\n- **Préstamo interbibliotecario REBIUN**: servicio fundamental para ampliar el acceso más allá de la colección propia y fomentar la colaboración entre bibliotecas."},{"h":"CBUA: qué es y objetivos (Estatutos, arts. 1 a 4)","t":"- **Art. 1**: las universidades de **Almería, Cádiz, Córdoba, Granada, Huelva, Internacional de Andalucía, Jaén, Málaga, Pablo de Olavide y Sevilla** (**diez**) constituyen el **Consorcio de Bibliotecas Universitarias de Andalucía (CBUA)** con el objetivo fundamental de **mejorar la calidad de los servicios bibliotecarios a través de la cooperación interbibliotecaria**.\n- **Misión**: apoyar a las bibliotecas de las instituciones participantes en la oferta y mejora de los servicios a sus usuarios y a la sociedad.\n- **Objetivos**: seleccionar y adquirir **recursos de información de calidad**; incorporar **tecnología innovadora** y gestionar herramientas de búsqueda; acciones de mejora de las **competencias del personal**; trabajar en la **excelencia de la gestión**.\n- **Valores**: cooperación, colaboración, actuación participativa y consensuada, comunicación entre sus miembros, igualdad, orientación al usuario, responsabilidad social y sostenibilidad.\n- **Funciones**: promover el conocimiento y la difusión de las colecciones; promover el **uso compartido de los recursos** y de la producción científica; **adquirir recursos bibliográficos**; fomentar nuevas tecnologías; formación; estudios de necesidades de los usuarios; colaborar con otras instituciones.\n- **Art. 2**: carácter **voluntario e indefinido**; **entidad de derecho público**. **Art. 3**: personalidad jurídica propia. **Art. 4**: la **sede** se establece, **con alternación**, en la universidad cuyo **Rector ejerza la Presidencia**."},{"h":"CBUA: miembros y órganos (arts. 5 a 18)","t":"- **Art. 5 Miembros**: de **pleno derecho** (las diez universidades), **asociados** (organismos científicos y de investigación) y **colaboradores o benefactores**.\n- **Art. 6 Órganos**: colegiados, el **Consejo de Gobierno** y la **Comisión Técnica**; unipersonales, el **Presidente**, el **Secretario** y la **Dirección Técnica**.\n- **Presidente (arts. 7-8)**: elegido por la **Asociación de Universidades Públicas de Andalucía (AUPA)** de entre los **Rectores** de las universidades de pleno derecho; mandato de **cuatro años**; ostenta la representación del CBUA, convoca y preside los órganos colegiados y es el **órgano de contratación** (art. 25.2).\n- **Secretario (arts. 9-10)**: elegido por el Presidente; es **fedatario** y responsable de archivos y registros; levanta actas del Consejo de Gobierno.\n- **Consejo de Gobierno (arts. 11-13)**: **órgano superior**. Lo forman el **Presidente**, el **Rector** (o su delegado) de cada otra universidad y el **Secretario**. El Director Técnico asiste **con voz y sin voto**. Aprueba el programa de actividades, el presupuesto y las cuentas, nombra y cesa al Director Técnico y admite nuevos miembros. Se requiere el voto favorable de **dos tercios** del número legal de miembros para nombrar al Director Técnico, admitir miembros, modificar Estatutos, aprobar reglamentos y contrataciones, disponer del patrimonio y disolver.\n- **Comisión Técnica (arts. 14-16)**: **órgano permanente de administración, propuesta y asesoramiento**. La integran el Presidente (que la preside), los **Directores de Biblioteca** de cada universidad y el **Director Técnico** (secretario). Para decidir deben estar presentes al menos la **mitad** de sus miembros.\n- **Dirección Técnica (arts. 17-18)**: ejecuta los acuerdos y gestiona y planifica las actividades; es nombrado por el Consejo de Gobierno **a propuesta de la Comisión Técnica, de entre los Directores de Bibliotecas** que la integran."},{"h":"CBUA: funcionamiento y régimen económico (arts. 19 a 26)","t":"- **Reuniones**: el Consejo de Gobierno, en sesión ordinaria **al menos una vez al año**; la Comisión Técnica, **al menos una vez al trimestre**. Las extraordinarias, a iniciativa del Presidente o a petición de **un tercio** de los miembros.\n- **Convocatorias**: antelación mínima de **cinco días hábiles** (ordinarias) y **dos días hábiles** (extraordinarias).\n- **Régimen económico**: el de las universidades públicas andaluzas; rinde cuentas a la **Cámara de Cuentas de Andalucía**. El presupuesto es **público, único, anual y equilibrado**; el Director Técnico lo elabora, la Comisión Técnica lo aprueba provisionalmente y el Consejo de Gobierno definitivamente. Si no hay presupuesto al comenzar el ejercicio, se **prorroga el del año anterior**.\n- **Recursos**: venta de productos y servicios, subvenciones, aportaciones de las entidades consorciadas y donaciones.\n- **Separación**: se notifica al presidente y es efectiva desde la siguiente reunión del Consejo, si el miembro está al corriente. **Disolución**: por acuerdo **unánime** o imposibilidad legal o material.\n- **Servicios que ya conoces**: el **préstamo CBUA** y el **Catálogo Colectivo CatCBUA**, accesibles desde Granatensis (tema E9 y E6)."}],"clave":["REBIUN: Red de Bibliotecas Universitarias y Científicas Españolas; 76 universidades (49 públicas y 27 privadas) y el CSIC; asociada a la Sectorial CRUE I+D+i desde 2020.","V Plan Estratégico REBIUN 2024-2027: 4 líneas y 8 grupos de trabajo; en vigor desde enero de 2024.","Catálogo colectivo REBIUN: 95 bibliotecas; se actualiza 6 veces al año; subcatálogos Todo, Revistas y Fondo antiguo (anterior a 1900).","CBUA: 10 universidades públicas andaluzas; voluntario e indefinido; entidad de derecho público.","CBUA: Presidente elegido por AUPA entre los Rectores, 4 años; Consejo de Gobierno = órgano superior; Comisión Técnica = Presidente + Directores de Biblioteca + Director Técnico.","CBUA: dos tercios para nombrar al Director Técnico, admitir miembros y modificar Estatutos; presupuesto público, único, anual y equilibrado."],"podcast":[{"v":"A","t":"Hola. Tema siete del bloque específico: cooperación bibliotecaria, con dos grandes protagonistas: REBIUN y el CBUA."},{"v":"B","t":"REBIUN es la Red de Bibliotecas Universitarias y Científicas Españolas. Desde dos mil veinte está aso
