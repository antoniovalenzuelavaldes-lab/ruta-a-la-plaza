ujeres y hombres; objetividad, profesionalidad e imparcialidad garantizadas con la **inamovilidad del funcionario de carrera**; transparencia; evaluación y responsabilidad; negociación colectiva y cooperación entre Administraciones.\n- **Art. 2.1**: se aplica al personal funcionario y, en lo que proceda, al laboral de: la Administración General del Estado; las **comunidades autónomas** y Ceuta y Melilla; las entidades locales; los organismos públicos y agencias; y **las Universidades Públicas** (letra e).\n- **Art. 4**: solo se aplica directamente cuando lo disponga su legislación específica a: personal de Cortes Generales, jueces, magistrados y fiscales, militares, Fuerzas y Cuerpos de Seguridad, CNI y Banco de España, entre otros.\n- **Art. 7**: el personal laboral se rige por la legislación laboral, los convenios y los preceptos del Estatuto que así lo dispongan."},{"h":"EBEP, Título II: clases de personal (arts. 8 a 13)","t":"- **Art. 8**: son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones al servicio de los intereses generales. Se clasifican en: **funcionarios de carrera, funcionarios interinos, personal laboral (fijo, indefinido o temporal) y personal eventual**.\n- **Art. 9.1 Funcionarios de carrera**: vinculados a una Administración por **nombramiento legal** y una **relación estatutaria regulada por el Derecho Administrativo**, para servicios profesionales retribuidos de carácter permanente.\n- **Art. 9.2**: las funciones que impliquen **participación directa o indirecta en el ejercicio de las potestades públicas** o en la salvaguardia de los intereses generales corresponden **exclusivamente a los funcionarios públicos**.\n- **Art. 10 Funcionarios interinos**: nombrados por razones de **necesidad y urgencia**, con carácter temporal, en estos casos: **a)** plazas vacantes sin posible cobertura por funcionario de carrera, **máximo tres años**; **b)** sustitución transitoria de titulares; **c)** **programas temporales** de duración no superior a **tres años**, ampliable hasta **doce meses** más; **d)** exceso o acumulación de tareas, **máximo nueve meses dentro de un periodo de dieciocho**. La selección es pública (igualdad, mérito, capacidad, publicidad y celeridad) y **nunca da la condición de funcionario de carrera**.\n- **Art. 11 Personal laboral**: contrato de trabajo **formalizado por escrito**; fijo, por tiempo indefinido o temporal. Selección pública por igualdad, mérito y capacidad.\n- **Art. 12 Personal eventual**: nombramiento **no permanente**, solo funciones de **confianza o asesoramiento especial**, retribuido con cargo a créditos presupuestarios para ese fin. **Nombramiento y cese libres.** Su condición **no puede ser mérito** para el acceso a la función pública ni la promoción interna.\n- **Art. 13 Personal directivo**: lo regulan el Gobierno y las CCAA; designación por **mérito y capacidad e idoneidad**, con procedimientos que garanticen **publicidad y concurrencia**; sujeto a evaluación por eficacia y eficiencia."},{"h":"Ley 5/2023 de Andalucía: objeto, ámbito y principios (arts. 1 a 6)","t":"- **Art. 1**: define y ordena la **función pública de la Administración de la Junta de Andalucía** y fija normas aplicables a todo el personal de las Administraciones públicas de Andalucía incluido en su ámbito.\n- **Art. 2**: se aplica al personal funcionario y laboral de la Administración General de la Junta, y de sus agencias y entes instrumentales. (El personal de las **universidades públicas andaluzas** se rige por su legislación específica y por el EBEP.)\n- **Art. 6.1 Principios del personal**: **profesionalidad, integridad, objetividad, neutralidad, imparcialidad, confidencialidad y dedicación al servicio público**, evitando conflictos de intereses."},{"h":"Ley 5/2023: personal al servicio de la Administración (arts. 12 a 18)","t":"- **Art. 12**: clasificación: **personal funcionario de carrera, personal funcionario interino, personal laboral (fijo, indefinido o temporal) y personal eventual**.\n- **Art. 13**: funcionario de carrera: **nombramiento legal**, **relación estatutaria regulada por el Derecho Administrativo**, servicios profesionales retribuidos de carácter **permanente**.\n- **Art. 14 Funcionario interino**: necesidad y urgencia; seleccionado conforme al **art. 115**; supuestos: vacantes (**máximo tres años**), sustitución transitoria, programas temporales y exceso o acumulación de tareas.\n- **Art. 15**: conforme al art. 9.2 EBEP, corresponden **exclusivamente al personal funcionario** las funciones que impliquen participación directa o indirecta en el ejercicio de potestades públicas o en la salvaguardia de los intereses generales.\n- **Art. 16 Personal laboral**: **contrato de trabajo formalizado por escrito**; fijo, por tiempo indefinido o temporal.\n- **Art. 17 Personal eventual**: nombramiento no permanente; solo funciones de **confianza o asesoramiento especial**; retribuido con cargo a créditos presupuestarios consignados para este fin."},{"h":"Ley 5/2023: acceso al empleo público (arts. 105 a 115)","t":"- **Art. 105**: el acceso se rige por los principios constitucionales de **igualdad, mérito y capacidad**, y además: **publicidad** de convocatorias y bases, **transparencia**, **imparcialidad y profesionalidad** de los órganos de selección, **independencia y discrecionalidad técnica** y confidencialidad.\n- **Art. 106.1 Requisitos generales**: **nacionalidad española** (sin perjuicio del art. 107); **capacidad funcional**; **tener cumplidos dieciséis años** y no exceder de la edad de jubilación forzosa (se puede exigir 18 años en cuerpos con ejercicio de autoridad o riesgo para la salud); no haber sido separado mediante procedimiento disciplinario ni estar inhabilitado; y la titulación exigida.\n- **Art. 107**: los nacionales de **otros Estados miembros de la UE** pueden acceder como personal funcionario en igualdad de condiciones, salvo en puestos que impliquen participación en el ejercicio de potestades públicas.\n- **Art. 111**: procesos **abiertos** con libre concurrencia. Sistemas: **oposición, concurso-oposición o concurso de valoración de méritos**.\n- **Art. 113**: se inician de oficio, de acuerdo con la **oferta de empleo público**, mediante convocatoria pública con las bases.\n- **Art. 114**: los órganos de selección **no pueden proponer más aprobados que plazas convocadas**, salvo que la convocatoria lo prevea.\n- **Art. 115**: selección del personal funcionario interino y laboral temporal: procedimientos ágiles con igualdad, mérito, capacidad, publicidad y **celeridad**."},{"h":"Ley 5/2023: adquisición y pérdida de la condición (arts. 116 a 122)","t":"- **Art. 116.1 Adquisición de la condición de funcionario de carrera** (requisitos sucesivos): **a)** superar el proceso selectivo (y prácticas, en su caso); **b)** acreditar los requisitos de la convocatoria antes del nombramiento; **c)** **nombramiento** por el órgano competente, publicado en el **BOJA** o boletín correspondiente; **d)** **acto de acatamiento** de la Constitución, el Estatuto de Autonomía para Andalucía y el resto del ordenamiento; **e)** **toma de posesión** dentro del plazo establecido.\n- **Art. 117 Pérdida de la condición**: **renuncia**; pérdida de la **nacionalidad** (salvo que no sea requisito); **jubilación total**; **sanción disciplinaria de separación del servicio** firme; **pena principal o accesoria de inhabilitación** absoluta o especial para cargo público firme.\n- **Art. 118**: la renuncia se manifiesta por escrito y debe ser aceptada expresamente; no puede aceptarse si hay procedimiento disciplinario o auto de procesamiento.\n- **Art. 120**: se puede solicitar la **prolongación en el servicio activo** hasta un máximo de **setenta años**, por **períodos de un año** renovables.\n- **Art. 122**: personal laboral fijo: superar el proceso selectivo, formalizar el contrato, acto de acatamiento e incorporación al puesto."},{"h":"Ley 5/2023: situaciones administrativas (arts. 144 a 164)","t":"- **Art. 144.1**: el personal funcionario de carrera está en una de estas situaciones: **servicio activo, servicios especiales, servicio en otras Administraciones públicas, excedencia voluntaria, excedencia forzosa, expectativa de destino y suspensión de funciones**.\n- **Art. 145**: **servicio activo**: quien presta servicios como funcionario de carrera y no le corresponde otra situación.\n- **Art. 148 Modalidades de excedencia voluntaria**: por **interés particular**, por **agrupación familiar**, por **cuidado de familiares**, por **violencia de género**, por **violencia terrorista**, por **prestación de servicios en el sector público andaluz**, por **incompatibilidad**, **con reserva de puesto** e **incentivada**.\n- **Art. 149 Interés particular**: haber prestado servicios efectivos en cualquier Administración durante un mínimo de **dos años** inmediatamente anteriores; permanecer al menos **un año**.\n- **Art. 150 Agrupación familiar**: sin requisito de servicios previos y con permanencia mínima de **un año**.\n- **Art. 151 Cuidado de familiares**: duración **no superior a tres años**, sin servicios previos.\n- **Art. 152**: víctimas de violencia de género: sin servicios previos ni plazo mínimo de permanencia.\n- **Art. 156 Con reserva de puesto**: si lo permiten las necesidades del servicio, tras **diez años** de servicios efectivos; duración mínima **seis meses** y máxima **un año**.\n- **Art. 159 Expectativa de destino**: funcionarios afectados por reasignación de efectivos sin destino.\n- **Art. 160 Suspensión de funciones**: provisional o firme. La **provisional** durante un disciplinario, por un máximo de **seis meses** (salvo excepciones).\n- **Art. 162**: reingreso al servicio activo sin puesto reservado: por concurso o libre designación, o por adjudicación provisional de un puesto vacante.\n- **Art. 163 Interinos**: pueden estar en servicio activo, excedencia por cuidado de familiares, por violencia de género, por violencia terrorista y suspensión de funciones."},{"h":"Ley 5/2023: régimen disciplinario (arts. 165 a 177)","t":"- **Art. 165**: el personal queda sujeto al régimen disciplinario de la normativa estatal básica y de este título.\n- **Art. 166 Principios**: **legalidad y tipicidad**, **irretroactividad** de las disposiciones no favorables y retroactividad de las favorables, entre otros.\n- **Art. 167**: las faltas se clasifican en **muy graves, graves y leves**.\n- **Art. 168**: faltas muy graves (las de la normativa estatal básica y otras, por ejemplo la agresión física a cualquier persona con la que se relacione en el ejercicio de sus funciones).\n- **Art. 169**: faltas **graves**, por ejemplo el **incumplimiento de las órdenes o instrucciones** de los superiores relativas al desempeño del puesto.\n- **Art. 170**: faltas **leves**, por ejemplo el **retraso, negligencia o descuido** en el cumplimiento de las funciones, o el **trato irrespetuoso** con la ciudadanía, superiores o compañeros.\n- **Art. 171 Sanciones por faltas muy graves**: la **suspensión firme de funciones** tiene una duración **mínima de un año y un día** y supone la pérdida del puesto; el **traslado forzoso** puede imponerse por un período **máximo de un año**.\n- **Art. 172**: proporcionalidad y necesidad de la sanción.\n- **Art. 173**: la prescripción se rige por la normativa estatal básica.\n- **Art. 174**: no puede imponerse sanción sino mediante el procedimiento previamente establecido.\n- **Art. 177**: la responsabilidad disciplinaria se extingue por **cumplimiento de la sanción, prescripción, pérdida de la condición de personal funcionario o laboral y fallecimiento**."}],"clave":["Clases de personal (EBEP art. 8): funcionarios de carrera, interinos, personal laboral y personal eventual.","Interinos (EBEP art. 10): vacantes máx. 3 años; programas 3 años + 12 meses; exceso de tareas 9 meses en 18.","Funciones exclusivas de funcionarios: potestades públicas (art. 9.2 EBEP; art. 15 Ley 5/2023).","Personal eventual: nombramiento y cese libres; no es mérito.","Requisitos de acceso (art. 106 Ley 5/2023): nacionalidad, capacidad, 16 años, no separación, titulación.","Adquisición condición funcionario: proceso selectivo, requisitos, nombramiento en BOJA, acatamiento, toma de posesión.","Situaciones (art. 144): activo, servicios especiales, otras AAPP, excedencia voluntaria, excedencia forzosa, expectativa de destino, suspensión.","Excedencia por interés particular: 2 años previos y 1 año mínimo de permanencia.","Faltas: muy graves, graves y leves. Suspensión firme: mínimo 1 año y 1 día."],"podcast":[{"v":"A","t":"Hola. Cuarta lección del bloque general. Hoy toca empleo público: el Estatuto Básico del Empleado Público y la Ley 5 de 2023 de la Función Pública de Andalucía."},{"v":"B","t":"Empezamos por el Estatuto Básico. Los títulos uno y dos. El título uno dice a quién se aplica: a la Administración General del Estado, a las comunidades autónomas y ciudades de Ceuta y Melilla, a las entidades locales, a organismos públicos y agencias, y a las Universidades Públicas. Esa última es la tuya."},{"v":"A","t":"El título dos clasifica a los empleados públicos en cuatro clases: funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual. Cuatro clases, apúntalo."},{"v":"B","t":"Funcionario de carrera: nombramiento legal y relación estatutaria regulada por el Derecho Administrativo, para servicios profesionales retribuidos de carácter permanente. Y las funciones que impliquen participar en potestades públicas corresponden exclusivamente a funcionarios."},{"v":"A","t":"Interinos. Son nombrados por necesidad y urgencia, con carácter temporal. Hay cuatro supuestos. Uno: plazas vacantes, máximo tres años. Dos: sustituir a un titular el tiempo estrictamente necesario. Tres: programas temporales, no más de tres años, ampliables doce meses. Cuatro: exceso o acumulación de tareas, máximo nueve meses dentro de un periodo de dieciocho."},{"v":"B","t":"Y un detalle que cae mucho: ser interino nunca da la condición de funcionario de carrera."},{"v":"A","t":"El personal laboral tiene un contrato por escrito, puede ser fijo, indefinido o temporal. El personal eventual solo hace funciones de confianza o asesoramiento especial. Su nombramiento y cese son libres, y su condición no cuenta como mérito para acceder a la función pública."},{"v":"B","t":"Ahora la Ley andaluza. En el artículo seis, los principios del personal: profesionalidad, integridad, objetividad, neutralidad, imparcialidad, confidencialidad y dedicación al servicio público."},{"v":"A","t":"El acceso al empleo público, título nueve. Se rige por igualdad, mérito y capacidad. Requisitos: nacionalidad española, capacidad funcional, tener cumplidos dieciséis años, no estar separado del servicio ni inhabilitado, y la titulación exigida."},{"v":"B","t":"Sistemas selectivos: oposición, concurso-oposición o concurso de valoración de méritos. Y los órganos de selección no pueden proponer más aprobados que plazas convocadas."},{"v":"A","t":"Para ser funcionario de carrera hay cinco pasos sucesivos: superar el proceso selectivo, acreditar los requisitos, nombramiento publicado en el BOJA, acto de acatamiento de la Constitución y del Estatuto de Autonomía, y toma de posesión."},{"v":"B","t":"Pierdes la condición por renuncia, pérdida de la nacionalidad, jubilación total, sanción firme de separación del servicio o inhabilitación firme. Se puede pedir prolongar el servicio activo hasta los setenta años, por periodos de un año."},{"v":"A","t":"Situaciones administrativas del artículo ciento cuarenta y cuatro: servicio activo, servicios especiales, servicio en otras Administraciones, excedencia voluntaria, excedencia forzosa, expectativa de destino y suspensión de funciones. Siete."},{"v":"B","t":"Dentro de las excedencias voluntarias, la de interés particular exige dos años de servicios efectivos previos y permanecer al menos un año. La de cuidado de familiares dura no más de tres años. La excedencia con reserva de puesto requiere diez años de servicios, y dura entre seis meses y un año."},{"v":"A","t":"Por último, el régimen disciplinario. Las faltas se clasifican en muy graves, graves y leves. La suspensión firme por falta muy grave dura como mínimo un año y un día, y el traslado forzoso, como máximo un año."},{"v":"B","t":"Haz el test y repasa los números: tres años, nueve meses de dieciocho, dieciséis años, setenta años, seis meses. Hasta la próxima."}],"preguntas":[{"q":"Según el artículo 2.1 del EBEP, el Estatuto se aplica al personal de las siguientes Administraciones. ¿Cuál de ellas incluye expresamente?","o":["Las Universidades Públicas","Solo la Administración General del Estado","Solo las entidades locales","Las universidades privadas"],"c":0,"e":"Art. 2.1.e EBEP.","r":"EBEP art. 2"},{"q":"Según el artículo 8.2 del EBEP, ¿cuál de las siguientes NO es una clase de empleado público?","o":["Personal honorario","Funcionarios interinos","Personal laboral","Personal eventual"],"c":0,"e":"Las clases son: funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual.","r":"EBEP art. 8"},{"q":"Según el artículo 9.1 del EBEP, los funcionarios de carrera están vinculados a una Administración Pública por:","o":["Una relación estatutaria regulada por el Derecho Administrativo","Un contrato de trabajo regulado por el Estatuto de los Trabajadores","Un contrato administrativo de servicios","Un nombramiento libre y revocable"],"c":0,"e":"Art. 9.1 EBEP.","r":"EBEP art. 9"},{"q":"Las funciones que impliquen participación directa o indirecta en el ejercicio de las potestades públicas corresponden, según el artículo 9.2 del EBEP:","o":["Exclusivamente a los funcionarios públicos","Indistintamente a funcionarios y personal laboral","Al personal eventual","A los contratistas de la Administración"],"c":0,"e":"Art. 9.2 EBEP.","r":"EBEP art. 9"},{"q":"Según el artículo 10.1.a) del EBEP, el nombramiento de funcionarios interinos por existencia de plazas vacantes, cuando no sea posible su cobertura por funcionarios de carrera, es por un máximo de:","o":["Un año","Dos años","Tres años","Cinco años"],"c":2,"e":"Art. 10.1.a EBEP.","r":"EBEP art. 10"},{"q":"En el supuesto de exceso o acumulación de tareas, el EBEP permite el nombramiento de funcionarios interinos por un plazo máximo de:","o":["Seis meses dentro de un periodo de doce","Nueve meses dentro de un periodo de dieciocho","Un año dentro de un periodo de dos","Tres meses dentro de un periodo de seis"],"c":1,"e":"Art. 10.1.d EBEP.","r":"EBEP art. 10"},{"q":"Los programas de carácter temporal que justifican el nombramiento de funcionarios interinos no podrán tener una duración superior a tres años, ampliable hasta:","o":["Doce meses más","Seis meses más","Dos años más","Tres años más"],"c":0,"e":"Art. 10.1.c EBEP.","r":"EBEP art. 10"},{"q":"El nombramiento derivado de los procedimientos de selección de funcionarios interinos:","o":["En ningún caso dará lugar al reconocimiento de la condición de funcionario de carrera","Da derecho a la condición de funcionario de carrera tras tres años","Da derecho a plaza fija tras superar el periodo de prueba","Equivale al nombramiento de funcionario de carrera"],"c":0,"e":"Art. 10.2 EBEP.","r":"EBEP art. 10"},{"q":"Según el artículo 11.1 del EBEP, el personal laboral presta servicios en virtud de:","o":["Un contrato de trabajo formalizado por escrito","Un nombramiento legal","Un acuerdo verbal con el órgano de contratación","Una orden de servicio"],"c":0,"e":"Art. 11.1 EBEP. Fijo, por tiempo indefinido o temporal según su duración.","r":"EBEP art. 11"},{"q":"El nombramiento y cese del personal eventual, según el artículo 12.3 del EBEP, son:","o":["Libres","Por concurso público","Por oposición","Con informe vinculante del Consejo de Estado"],"c":0,"e":"Art. 12.3 EBEP. Su condición no podrá constituir mérito para el acceso a la función pública (art. 12.4).","r":"EBEP art. 12"},{"q":"La condición de personal eventual, según el artíc ud","v":"Del 7 al 28 de octubre de 2026, por la sede electrónica de la UGR. Presentada el 27 de octubre."},{"k":"Tasa","v":"28 € con bonificación del 50 % para familia numerosa de categoría general: 14 €. Pagada el 27 de octubre."},{"k":"Titulación exigida","v":"Bachiller o Técnico, o equivalente. Lourdes aporta el título de Diplomada."},{"k":"Primer ejercicio","v":"No podrá empezar antes del 1 de marzo de 2027. La fecha y el lugar se publicarán con la lista provisional de admitidos en el BOJA."}],"ejercicios":[{"n":"Primer ejercicio","pts":"0 a 40 puntos · eliminatorio","d":"Cuestionario de 100 preguntas con 4 respuestas, solo una correcta, sobre todo el programa (bloque general y específico). 100 minutos. Pasan al segundo ejercicio como máximo 100 personas (90 del cupo general y 10 del de discapacidad), salvo empates."},{"n":"Segundo ejercicio","pts":"0 a 30 puntos · eliminatorio","d":"Prueba práctica en ordenador, con cuestionario de preguntas de respuesta alternativa sobre el bloque específico. Se puede usar cualquier recurso electrónico accesible desde los ordenadores de la UGR. 120 minutos."},{"n":"Fase de concurso","pts":"hasta 30 puntos","d":"Servicios prestados (hasta 25 puntos) y ejercicios obligatorios superados en convocatorias anteriores de la misma escala o equivalentes (0,50 por ejercicio, máximo 5 puntos). Solo se suma a quien supera la oposición."}],"puntuacion":["Preguntas puntuables: NPP = aciertos − (fallos ÷ 4). Con 4 respuestas alternativas, cada fallo resta un cuarto de acierto. Las preguntas en blanco no restan.","Nota de corte: NC = el mayor de (35 % de las preguntas válidas) y (50 % de la media aritmética de referencia, MAR). La MAR es la media de los NPP iguales o superiores al percentil 95 de todos los opositores. Es decir, cuanto mejor lo haga la gente de arriba, más sube el corte.","Calificación: CF = NPP × 40 ÷ PM, donde PM es el mayor NPP obtenido por cualquier opositor. La mejor nota del examen recibe los 40 puntos y el resto se reparte en proporción.","Consecuencia práctica: como cada fallo solo resta 0,25, conviene contestar cuando puedas descartar al menos una opción. Si no tienes ni idea, déjala en blanco."],"enlaces":[{"t":"Convocatoria en el BOE","u":"https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-20786"},{"t":"Página del proceso en el Servicio de PTGAS de la UGR","u":"https://serviciopas.ugr.es/acceso-empleo-publico/30-09-2026-e-aux-bibli"},{"t":"Sede electrónica de la UGR","u":"https://sede.ugr.es"},{"t":"Exámenes anteriores de la escala (Transparencia)","u":"https://serviciopas.ugr.es/informacion/transparencia-proteccion-datos/transparencia/auxiliares-bibliotecas"},{"t":"Proyecto de Estatutos de la UGR","u":"https://secretariageneral.ugr.es/informacion/presentacion/reforma-estatutos-ugr/proyecto-estatutos"}],"acciones":[{"id":"a1","t":"Solicitud de admisión presentada","d":"Registrada el 27/10/2026 a las 21:29.","hecha":true},{"id":"a2","t":"Tasa pagada: 14 €","d":"Transferencia del 27/10/2026, registrada a las 21:42.","hecha":true},{"id":"c1","t":"Guarda el justificante de la solicitud y el del pago","d":"Un PDF de cada uno en el móvil y otra copia en el correo."},{"id":"c2","t":"Localiza el título de familia numerosa en vigor","d":"La UGR lo comprueba por la plataforma de datos de las Administraciones. Si no puede verificarlo, pedirá el documento. Debe estar vigente."},{"id":"c3","t":"Comprueba que entras en la sede electrónica de la UGR","d":"Las notificaciones son electrónicas. Entra en sede.ugr.es con Cl@ve o certificado y revisa que funciona."},{"id":"c4","t":"Mira cada semana la web del proceso","d":"Ahí se publicará la lista provisional de admitidos y la fecha del primer ejercicio. Guarda el enlace en favoritos."},{"id":"c5","t":"Cuando salga la lista provisional, comprueba que figuras como admitida","d":"Tienes 10 días hábiles para subsanar. No basta con no estar en la lista de excluidos: tu nombre debe constar en la de admitidas."}]}};

const hoyStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* ---------- Dominio: progreso y plan ---------- */
const conContenido=id=>!!TEMAS[id];
function testsDe(id){return S.tests.filter(t=>t.t===id)}
function dominio(id){const ts=testsDe(id).slice(-3);if(!ts.length)return null;return ts.reduce((a,t)=>a+t.pct,0)/ts.length}
function progresoTema(id){if(!conContenido(id))return 0;const d=S.done[id]||{};const m=dominio(id);
  return .2*(d.apuntes?1:0)+.15*(d.audio?1:0)+.65*(m==null?0:Math.min(1,Math.max(0,m)/UMBRAL))}
function estadoTema(id){if(!conContenido(id))return['próximamente',''];const m=dominio(id);const d=S.done[id]||{};
  if(m!=null&&m>=UMBRAL&&testsDe(id).length>=2)return['dominado','ok'];
  if(m!=null&&m<60)return['refuerzo','bad'];
  if(d.apuntes||d.audio||m!=null)return['en curso','warn'];return['sin empezar','']}
function progresoTotal(bloque){const ts=TEMARIO.filter(t=>!bloque||t.bloque===bloque);const W=ts.reduce((a,t)=>a+t.dias,0);
  return ts.reduce((a,t)=>a+t.dias*progresoTema(t.id),0)/W}
function racha(){let n=0,d=new Date();if(!S.act[hoyStr(d)])d.setDate(d.getDate()-1);while(S.act[hoyStr(d)]){n++;d.setDate(d.getDate()-1)}return n}
function plan(){const ini=pf(FECHA_INICIO),ex=pf(S.examDate);const total=Math.max(30,dd(ini,ex));
  const fin=Math.min(14,Math.round(total*.11));const aprender=total-fin;const p1=Math.round(aprender*.7);
  const W=TEMARIO.reduce((a,t)=>a+t.dias,0);const out=[];
  const reparte=(desde,dias,fase,tarea)=>{let cum=0,prev=0;TEMARIO.forEach(t=>{cum+=t.dias;const hasta=Math.round(cum/W*dias);const n=hasta-prev;for(let k=1;k<=n;k++)out.push({i:desde+prev+k-1,fase,t,k,n,tarea:tarea(k,n)});prev=hasta})};
  reparte(0,p1,'Primera vuelta',(k,n)=>n===1?'Apuntes, podcast y test del tema':k===1?'Lee los apuntes y escucha el podcast':k===n?'Test del tema y repaso de fallos (objetivo 75 %)':'Segunda lectura y test parcial');
  reparte(p1,aprender-p1,'Segunda vuelta',(k,n)=>k===n?'Test final del tema':'Test del tema y repaso de fallos');
  for(let k=0;k<fin;k++)out.push({i:aprender+k,fase:'Simulacros y repaso final',t:null,tarea:k%3===2?'Repaso de fallos y descanso mental':'Simulacro completo con cronómetro'});
  return out.map(e=>({...e,fecha:new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+e.i)}))}
function entradaHoy(){const P=plan(),h=pf(hoyStr());return P.find(e=>hoyStr(e.fecha)===hoyStr(h))||(h<P[0].fecha?P[0]:P[P.length-1])}

/* ---------- Reconocimiento de voz (Chrome, Edge, Safari) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const sinTilde=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zñ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
let reco=null;
function escuchar(cb,fin){if(!SR){toast('Este navegador no reconoce voz. Usa los botones.');fin&&fin();return}
  try{reco&&reco.abort()}catch(e){}
  const r=new SR();reco=r;r.lang='es-ES';r.interimResults=false;r.maxAlternatives=4;let oyo=false;
  r.onresult=e=>{oyo=true;cb([...e.results[0]].map(a=>a.transcript))};
  r.onerror=ev=>{if(ev.error==='not-allowed')toast('Permite el micrófono en el navegador para hablar.')};
  r.onend=()=>{document.querySelectorAll('[data-mic],[data-micp]').forEach(b=>b.classList.remove('acc'));if(reco===r)reco=null;fin&&fin(oyo)};
  document.querySelectorAll('[data-mic],[data-micp]').forEach(b=>b.classList.add('acc'));
  try{r.start()}catch(e){fin&&fin(false)}}
function ordenAudio(alts){const t=alts.map(sinTilde).join(' | ');const a=audioEl;if(!a)return false;
  const cueIdx=()=>{let k=0;tiem.forEach((c,i)=>{if(a.currentTime>=c.ini-.05)k=i});return k};
  const ir=k=>{if(tiem.length)a.currentTime=tiem[Math.max(0,Math.min(tiem.length-1,k))].ini;else a.currentTime=Math.max(0,a.currentTime+(k>cueIdx()?12:-12));a.play()};
  if(/\b(mas lento|despacio)\b/.test(t)){a.playbackRate=Math.max(.7,+(a.playbackRate-.1).toFixed(1));toast('Velocidad '+a.playbackRate+'×');return true}
  if(/\b(mas rapido|mas deprisa|acelera)\b/.test(t)){a.playbackRate=Math.min(1.6,+(a.playbackRate+.1).toFixed(1));toast('Velocidad '+a.playbackRate+'×');return true}
  if(/\b(pausa|para|parar|detente|alto|silencio)\b/.test(t)){a.pause();return true}
  if(/\b(repite|repetir|otra vez|no he entendido|no entendi)\b/.test(t)){ir(cueIdx());return true}
  if(/\b(anterior|atras|vuelve|retrocede)\b/.test(t)){ir(cueIdx()-1);return true}
  if(/\b(siguiente|adelante|salta|avanza)\b/.test(t)){ir(cueIdx()+1);return true}
  if(/\b(sigue|continua|reanuda|seguir|play|empieza|reproduce)\b/.test(t)){a.play();return true}
  if(/\b(pregunta|preguntame|test|examen|quiz)\b/.test(t)){a.pause();iniciar({id:tema,modo:'voz'});return true}
  return false}
function interpretaRespuesta(alts,q){const L={a:0,b:1,c:2,d:3};
  for(const raw of alts){const t=sinTilde(raw);
    if(/\b(repite|repetir|otra vez)\b/.test(t))return{cmd:'repite'};
    if(/\b(siguiente|sigue|adelante|continua)\b/.test(t))return{cmd:'sigue'};
    if(/\b(no se|en blanco|paso|ni idea|no lo se)\b/.test(t))return{sel:null};
    let m=t.match(/\b(?:opcion|respuesta|la|es la|es)?\s*(a|b|c|d|be|ce|de|primera|segunda|tercera|cuarta|uno|dos|tres|cuatro)\b/);
    if(m){const w=m[1];const mp={be:'b',ce:'c',de:'d',primera:'a',uno:'a',segunda:'b',dos:'b',tercera:'c',tres:'c',cuarta:'d',cuatro:'d'};return{sel:L[mp[w]||w]}}
    const pal=s=>new Set(sinTilde(s).split(' ').filter(x=>x.length>3));const H=pal(raw);
    let mejor=-1,pm=0;q.opts.forEach((o,i)=>{const O=pal(o);if(!O.size)return;let c=0;O.forEach(w=>{if(H.has(w))c++});const p=c/O.size;if(p>pm){pm=p;mejor=i}});
    if(pm>=.5)return{sel:mejor}}
  return null}
function escucharRespuesta(){if(!T||T.modo!=='voz'||T.fb||T.fin)return;const i=T.i;
  escuchar(alts=>{if(!T||T.i!==i||T.fb)return;const r=interpretaRespuesta(alts,T.qs[i]);
    if(!r){hablar('No te he entendido. Di A, B, C o D.','A',()=>escucharRespuesta());return}
    if(r.cmd==='repite'){leePregunta();return}if(r.cmd==='sigue')return;responde(r.sel)})}
function escucharOrden(){if(!T||T.modo!=='voz'||!T.fb)return;const i=T.i;
  escuchar(alts=>{if(!T||T.i!==i)return;const t=alts.map(sinTilde).join(' ');if(/\b(repite|repetir|otra vez)\b/.test(t)){const q=T.qs[i];hablar(`${q.e}`,'A',()=>escucharOrden())}else if(/\b(siguiente|sigue|adelante|continua|vale|ok)\b/.test(t))sig()})}

    navigator.mediaSession.setActionHandler('seekbackward',()=>audioEl.currentTime-=15);navigator.mediaSession.setActionHandler('seekforward',()=>audioEl.currentTime+=15)}}
function mp3Eventos(e,d){if(!audioEl||!$('#aud'))return false;
  const sk=e.target.closest('[data-seek]');if(sk){audioEl.currentTime=Math.max(0,audioEl.currentTime+ +sk.dataset.seek);return true}
  const mp=e.target.closest('[data-micp]');if(mp){const eraPlay=!audioEl.paused;audioEl.pause();escuchar(alts=>{if(!ordenAudio(alts)){toast('No te he entendido. Prueba «sigue» o «repite».');if(eraPlay)audioEl.play()}},ok=>{if(!ok&&eraPlay)audioEl.play()});return true}
  const cu=e.target.closest('[data-cue]');if(cu&&tiem[+cu.dataset.cue]){audioEl.currentTime=tiem[+cu.dataset.cue].ini;audioEl.play();return true}
  return false}
document.addEventListener('change',e=>{if(e.target.matches('[data-vel]')&&audioEl)audioEl.playbackRate=+e.target.value});
function reproductor(d){if(modoAudio==='podcast'&&d.mp3)return reproductorMp3(d);cues=construirCues(d,modoAudio);ci=0;jugando=false;
  if(!TTS)return '<div class="card">Este navegador no incluye voz. Prueba con Chrome, Edge o Safari actualizados, o lee los apuntes.</div>';
  const op=k=>vocesEs.map(v=>`<option value="${esc(v.name)}" ${elegirVoz(k)&&elegirVoz(k).name===v.name?'selected':''}>${esc(v.name)}</option>`).join('');
  return `<div class="player"><div class="seg"><button aria-pressed="${modoAudio==='podcast'}" data-mod="podcast">Podcast con dos voces</button><button aria-pressed="${modoAudio==='libro'}" data-mod="libro">Audiolibro de los apuntes</button></div>
  <div class="card"><div class="row"><button class="btn acc" data-play id="bplay">▶ Escuchar</button><button class="btn ghost sm" data-prev aria-label="Anterior">⏮</button><button class="btn ghost sm" data-next aria-label="Siguiente">⏭</button>
  <label class="row muted">Velocidad <input type="range" min="0.8" max="1.4" step="0.1" value="${S.voz.rate||1}" data-rate> <span class="mono" id="rv">${S.voz.rate||1}×</span></label></div>
  <p class="muted" style="font-size:.85rem;margin-top:8px">Mantén la pantalla encendida: algunos móviles detienen la voz al bloquearse. Las voces dependen de tu dispositivo.</p>
  <details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Elegir voces</summary><div class="row" style="margin-top:8px"><label>Ana <select data-vsel="A">${op('A')}</select></label><label>Leo <select data-vsel="B">${op('B')}</select></label></div></details></div>
  <div class="cues" id="cues">${cues.map((c,i)=>`<div class="cue" id="cue${i}" data-cue="${i}">${c.q?`<b>${c.q}</b>`:''}${esc(c.t)}</div>`).join('')}</div></div>`}
function marcaCue(){document.querySelectorAll('.cue.on').forEach(x=>x.classList.remove('on'));const c=$('#cue'+ci);if(c){c.classList.add('on');c.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function reproduce(){if(!jugando)return;if(ci>=cues.length){jugando=false;const b=$('#bplay');if(b)b.textContent='▶ Escuchar otra vez';(S.done[tema]=S.done[tema]||{}).audio=Date.now();marcar();guardar();pantallaActiva(false);toast('Lección terminada. Haz el test para fijarla.');return}
  marcaCue();const c=cues[ci];hablar(c.t,c.v,()=>{if(!jugando)return;ci++;reproduce()})}
function reproductorEventos(e,d){if(mp3Eventos(e,d))return;if(e.target.closest('[data-mod]')){modoAudio=e.target.closest('[data-mod]').dataset.mod;callar();render();return}
  if(e.target.closest('[data-play]')){const b=$('#bplay');if(jugando){jugando=false;callar();b.textContent='▶ Seguir'}else{jugando=true;if(ci>=cues.length)ci=0;b.textContent='⏸ Pausa';pantallaActiva(true);reproduce()}return}
  const sk=e.target.closest('[data-next],[data-prev]');if(sk){const w=jugando;callar();ci=Math.max(0,Math.min(cues.length-1,ci+(sk.hasAttribute('data-next')?1:-1)));marcaCue();if(w){jugando=true;pantallaActiva(true);reproduce()}return}
  const cu=e.target.closest('[data-cue]');if(cu){const w=jugando;callar();ci=+cu.dataset.cue;marcaCue();if(w){jugando=true;reproduce()}}}
document.addEventListener('input',e=>{if(e.target.matches('[data-rate]')){S.voz.rate=+e.target.value;$('#rv').textContent=S.voz.rate+'×';guardar()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-vsel]')){S.voz[e.target.dataset.vsel]=e.target.value;guardar()}});

/* ---------- Test ---------- */
const mezcla=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function todasPreguntas(){const o=[];Object.values(TEMAS).forEach(t=>t.preguntas.forEach((p,i)=>o.push({...p,id:t.id+':'+i,tema:t.id})));return o}
function prepara(p){const orden=mezcla([0,1,2,3]);return {...p,opts:orden.map(i=>p.o[i]),corr:orden.indexOf(p.c)}}
function iniciar({id,modo}){let qs;const all=todasPreguntas();
  if(modo==='tema'||modo==='voz'){qs=all.filter(p=>p.tema===id);if(modo==='voz')qs=mezcla(qs).slice(0,10)}
  else if(modo==='sim'){qs=mezcla(all).slice(0,100)}
  else if(modo==='fallos'){qs=all.filter(p=>S.fallos[p.id])}
  else if(modo==='bloque'){qs=mezcla(all.filter(p=>TEMARIO.find(t=>t.id===p.tema).bloque===id)).slice(0,50)}
  if(!qs||!qs.length){toast('No hay preguntas para este modo todavía');return}
  T={modo,id:id||modo,qs:mezcla(qs).map(prepara),i:0,res:[],ini:Date.now(),fin:false,fb:false};render();if(modo==='voz')leePregunta();if(modo==='sim')cron()}
let crT=null;function cron(){clearInterval(crT);crT=setInterval(()=>{const e=$('#crono');if(!T||T.fin||!e){clearInterval(crT);return}const r=Math.max(0,6000-Math.floor((Date.now()-T.ini)/1000));e.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(!r)terminar()},1000)}
function leePregunta(){if(!TTS||T.modo!=='voz')return;callar();const q=T.qs[T.i];
  hablar(`Pregunta ${T.i+1}. ${q.q}`,'A',()=>{let k=0;const L='ABCD';const next=()=>{if(!T||T.modo!=='voz'||T.fb)return;if(k<4)hablar(`${L[k]}. ${q.opts[k]}`,'A',()=>{k++;next()});else escucharRespuesta()};next()})}
function vTest(app){if(T.fin)return vResultado(app);const q=T.qs[T.i],sim=T.modo==='sim',r=T.res[T.i];const L='ABCD';
  app.innerHTML=`<div class="q-head"><button class="btn ghost sm" data-salir>← Salir</button><span class="mono">${T.i+1} / ${T.qs.length}</span>${sim?'<span class="chip" id="crono">100:00</span>':''}${T.modo==='voz'?'<button class="btn ghost sm" data-repite>🔊 Repetir</button><button class="btn ghost sm" data-mic>🎤 Responder</button>':''}</div>${barra((T.i)/T.qs.length,'acc')}
  <div class="card"><p class="eyebrow">${esc(TEMARIO.find(t=>t.id===q.tema).titulo)}</p><p class="q">${esc(q.q)}</p>
  ${q.opts.map((o,i)=>{let c='';if(T.fb&&!sim){if(i===q.corr)c='right';else if(r&&r.sel===i)c='wrong'}else if(r&&r.sel===i)c='sel';return `<button class="opt ${c}" data-o="${i}" ${T.fb&&!sim?'disabled':''}><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`}).join('')}
  ${T.fb&&!sim?`<div class="fb ${r.sel===q.corr?'ok':'ko'}"><b>${r.sel===q.corr?'Correcto.':r.sel==null?'En blanco.':'Incorrecto.'}</b> La respuesta es ${L[q.corr]}. ${esc(q.e)} <span class="muted">(${esc(q.r)})</span></div>`:''}
  <div class="row" style="margin-top:8px">${!T.fb||sim?`<button class="btn ghost sm" data-blank>No lo sé (en blanco)</button>`:''}${T.fb&&!sim||sim&&r?`<button class="btn acc" data-sig>${T.i===T.qs.length-1?'Terminar':'Siguiente'}</button>`:''}${sim&&T.i>0?'<button class="btn ghost sm" data-ant>Anterior</button>':''}</div></div>`;
  if(sim)cron();
  app.onclick=e=>{if(e.target.closest('[data-salir]')){callar();clearInterval(crT);T=null;render();return}
    if(e.target.closest('[data-repite]')){leePregunta();return}
    if(e.target.closest('[data-mic]')){callar();escucharRespuesta();return}
    const o=e.target.closest('[data-o]');if(o){responde(+o.dataset.o);return}
    if(e.target.closest('[data-blank]')){responde(null);return}
    if(e.target.closest('[data-ant]')){T.i--;T.fb=false;render();return}
    if(e.target.closest('[data-sig]')){sig()}}}
function responde(sel){const q=T.qs[T.i],sim=T.modo==='sim';T.res[T.i]={sel};callar();
  if(sim){if(sel==null){T.res[T.i]={sel:null}}render();if(sel==null)sig();return}
  T.fb=true;const ok=sel===q.corr;
  if(ok){if(S.fallos[q.id]&&T.modo==='fallos')delete S.fallos[q.id]}else if(sel!=null)S.fallos[q.id]=1;
  render();if(T.modo==='voz'){hablar(ok?'Correcto.':sel==null?'En blanco.':'Incorrecto.','A',()=>{hablar(`La respuesta correcta es ${'ABCD'[q.corr]}: ${q.opts[q.corr]}. ${q.e} Di siguiente para continuar.`,'A',()=>escucharOrden())})}}
function sig(){if(T.i>=T.qs.length-1){terminar();return}T.i++;T.fb=false;render();if(T.modo==='voz')leePregunta()}
function terminar(){clearInterval(crT);callar();let ok=0,ko=0,bl=0;T.qs.forEach((q,i)=>{const r=T.res[i];if(!r||r.sel==null)bl++;else if(r.sel===q.corr){ok++;if(T.modo==='sim'&&S.fallos[q.id])delete S.fallos[q.id]}else{ko++;S.fallos[q.id]=1}});
  const npp=ok-ko/PEN,pct=npp/T.qs.length*100;T.r={ok,ko,bl,npp,pct};
  S.tests.push({t:T.id,ts:Date.now(),n:T.qs.length,ok,ko,bl,npp,pct});marcar();guardar();T.fin=true;render()}
function vResultado(app){const r=T.r,n=T.qs.length;const nota40=Math.max(0,r.npp)/n*40;
  const msg=r.pct>=85?'Nivel excelente. Mantén el ritmo.':r.pct>=UMBRAL?'Vas muy bien. Repasa los fallos y sigue.':r.pct>=50?'Buen punto de partida. Repasa los fallos y repite en un par de días.':'Normal al principio. Vuelve a los apuntes, escucha el podcast y repite el test.';
  app.innerHTML=`<div><p class="eyebrow">Resultado</p><h1>${r.ok} de ${n} aciertos</h1><p class="quote muted" style="margin-top:8px">${msg}</p></div>
  <section class="grid2"><div class="card"><dl class="kv"><dt>Aciertos</dt><dd class="mono">${r.ok}</dd><dt>Fallos</dt><dd class="mono">${r.ko}</dd><dt>En blanco</dt><dd class="mono">${r.bl}</dd><dt>Preguntas puntuables</dt><dd class="mono">${r.npp.toFixed(3)}</dd><dt>Porcentaje neto</dt><dd class="mono">${r.pct.toFixed(1)} %</dd></dl></div>
  <div class="card"><h3>¿Y en el examen real?</h3><p class="muted" style="margin-top:6px">Con este resultado, tus preguntas puntuables serían ${r.npp.toFixed(2)} sobre ${n}. Si lo escalas a 100 preguntas son ≈ ${(r.npp/n*100).toFixed(1)}. La nota de corte mínima es el 35 % de las preguntas válidas y sube si los mejores sacan mucho. Apunta a un 75 % neto o más.</p></div></section>
  <div class="row"><button class="btn acc" data-fallos>Repasar mis fallos</button><button class="btn ghost" data-again>Repetir</button><button class="btn ghost" data-fin>Volver</button></div>`;
  app.onclick=e=>{if(e.target.closest('[data-again]')){iniciar({id:T.id,modo:T.modo})}
    if(e.target.closest('[data-fallos]')){iniciar({modo:'fallos'})}
    if(e.target.closest('[data-fin]')){T=null;render()}}}
function vTestMenu(app){const n=Object.keys(S.fallos).length,tot=todasPreguntas().length;
  app.innerHTML=`<div><h1>Test</h1><p class="muted" style="margin-top:6px">${tot} preguntas disponibles. Se corrigen como en el examen: un fallo resta 0,25 y lo que dejas en blanco no resta.</p></div>
  <section class="grid2"><div class="card"><h3>Simulacro</h3><p class="muted" style="margin:6px 0 12px">Hasta 100 preguntas mezcladas de todos los temas, con cronómetro de 100 minutos y corrección al final. Cuando haya más material se parecerá más al examen real.</p><button class="btn acc" data-sim="1">Empezar simulacro</button></div>
  <div class="card"><h3>Repaso de fallos</h3><p class="muted" style="margin:6px 0 12px">${n?`Tienes ${n} preguntas falladas guardadas. Acertarlas las saca de la lista.`:'Aún no tienes fallos guardados.'}</p><button class="btn" data-fb ${n?'':'disabled'}>Repasar fallos</button></div>
  <div class="card"><h3>Bloque general</h3><p class="muted" style="margin:6px 0 12px">50 preguntas mezcladas de los temas generales.</p><button class="btn ghost" data-bl="General">Empezar</button></div>
  <div class="card"><h3>Modo voz</h3><p class="muted" style="margin:6px 0 12px">Te leo cada pregunta y sus opciones en voz alta; contestas tocando A, B, C o D y te explico la respuesta. Ideal para el coche o para andar. Elige un tema abajo.</p>
  <div class="row">${Object.values(TEMAS).map(t=>`<button class="btn ghost sm" data-vz="${t.id}">${t.bloque==='General'?'G':'E'}${t.num}</button>`).join('')}</div></div></section>`;
  app.onclick=e=>{if(e.target.closest('[data-fb]'))iniciar({modo:'fallos'});const b=e.target.closest('[data-bl]');if(b)iniciar({id:b.dataset.bl,modo:'bloque'});const v=e.target.closest('[data-vz]');if(v)iniciar({id:v.dataset.vz,modo:'voz'})}}

/* ---------- Plan ---------- */
function vPlan(app){const P=plan(),h=hoyStr();let html='',fase='',sem='';
  P.forEach(e=>{if(e.fase!==fase){fase=e.fase;const a=P.filter(x=>x.fase===fase);html+=`<div class="phase" style="margin-top:14px"><span>${fase}</span><span class="mono">${fmt(a[0].fecha,{day:'numeric',month:'short'})} – ${fmt(a[a.length-1].fecha,{day:'numeric',month:'short'})}</span></div>`}
    const es=hoyStr(e.fecha),dom=e.fecha.getDay()===0;const t=e.t;
    html+=`<div class="day ${es===h?'hoy':''} ${es<h?'pas':''}"><span class="dt">${fmt(e.fecha)}</span><span>${t?`<b>${t.bloque==='General'?'G':'E'}${t.num}</b> ${esc(t.titulo)}<br><span class="muted" style="font-size:.88rem">${dom?'Día ligero: escucha el podcast del tema.':esc(e.tarea)}</span>`:`<b>Simulacro y repaso</b><br><span class="muted" style="font-size:.88rem">${esc(e.tarea)}</span>`}</span>${t&&!conContenido(t.id)?'<span class="pill">en preparación</span>':t?`<span class="pill ${estadoTema(t.id)[1]}">${estadoTema(t.id)[0]}</span>`:''}</div>`});
  app.innerHTML=`<div><h1>Plan de estudio</h1><p class="muted" style="margin-top:6px">Se reparte entre hoy y la fecha del examen según el peso de cada tema. Primero el bloque general, después el específico, una segunda vuelta y, al final, simulacros.</p></div>
  <section class="card" id="cuenta" ${sb?'':'hidden'}><h3>Tu cuenta</h3><p class="muted" style="margin:6px 0 10px">${usuario?'Sesión iniciada. Tu progreso se guarda en la nube y se comparte entre tus dispositivos.':'Entra con tu correo para guardar el progreso y verlo en el móvil, el iPad y el ordenador. Te enviamos un enlace, sin contraseña.'}</p>
  ${usuario?'<button class="btn ghost sm" id="salir">Cerrar sesión</button>':'<div class="row"><input type="email" id="mail" placeholder="tu correo" autocomplete="email" style="flex:1;min-width:200px;font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)"><button class="btn acc sm" id="enviar">Enviarme el enlace</button></div>'}</section>
  <section class="card"><label class="row"><span><b>Fecha del primer ejercicio</b><br><span class="muted" style="font-size:.88rem">Por ahora usamos el primer día posible. Cámbiala cuando la UGR publique la real.</span></span>
  <input type="date" id="fex" value="${S.examDate}" min="${hoyStr()}"></label></section><section class="week">${html}</section>
  <section class="card flat"><button class="btn ghost sm" id="reset">Borrar mi progreso en este dispositivo</button></section>`;
  const f=$('#fex');f.onchange=()=>{if(f.value){S.examDate=f.value;guardar();toast('Calendario recalculado');render()}};
  const en=$('#enviar');if(en)en.onclick=async()=>{const m=$('#mail').value.trim();if(!m)return;const{error}=await sb.auth.signInWithOtp({email:m,options:{emailRedirectTo:location.origin+location.pathname}});toast(error?'No se pudo enviar el enlace':'Revisa tu correo y abre el enlace')};
  const so=$('#salir');if(so)so.onclick=async()=>{await sb.auth.signOut()};
  const rs=$('#reset');rs.onclick=()=>{if(rs.dataset.s){S={done:{},tests:[],fallos:{},checks:{},act:{},examDate:S.examDate,voz:S.voz,upd:0};guardar();toast('Progreso borrado');render()}else{rs.dataset.s=1;rs.textContent='Pulsa otra vez para confirmar'}}}

/* ---------- Proceso ---------- */
function vProceso(app){app.innerHTML=`<div><h1>El proceso, en claro</h1><p class="muted" style="margin-top:6px">Resumen de la convocatoria publicada en el BOE el 6 de octubre de 2026.</p></div>
  <section class="card"><dl class="kv">${PROC.resumen.map(r=>`<dt>${esc(r.k)}</dt><dd>${esc(r.v)}</dd>`).join('')}</dl></section>
  <section class="list"><h2>Los ejercicios</h2>${PROC.ejercicios.map(x=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(x.n)}</h3><span class="pill">${esc(x.pts)}</span></div><p style="margin-top:6px">${esc(x.d)}</p></div>`).join('')}</section>
  <section class="card"><h2>Cómo se puntúa el primer ejercicio</h2><div class="md">${PROC.puntuacion.map(p=>`<p>${esc(p)}</p>`).join('')}</div></section>
  <section class="card"><h2>Enlaces oficiales</h2><ul style="padding-left:1.1em;margin:8px 0 0;display:grid;gap:6px">${PROC.enlaces.map(l=>`<li><a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}</a></li>`).join('')}</ul></section>`}

render();window.addEventListener('load',initNube);if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
